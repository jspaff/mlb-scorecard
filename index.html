  }

  function savantVideoUrl(playId) {
    return playId ? `https://baseballsavant.mlb.com/sporty-videos?playId=${playId}` : null;
  }

  const gameStatsCache = {};

  async function fetchGameStats(gamePk, awayAbbr, homeAbbr, isFinal) {
    if (isFinal && gameStatsCache[gamePk] !== undefined) return gameStatsCache[gamePk];
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`);
      const data = await res.json();
      const allPlays = (data.liveData && data.liveData.plays && data.liveData.plays.allPlays) || [];
      const homeRuns = allPlays.filter(p => p.result && p.result.event === 'Home Run').map(p => {
        const isTop = p.about && p.about.isTopInning;
        let distance = null;
        const events = p.playEvents || [];
        for (let i = events.length - 1; i >= 0; i--) {
          const hd = events[i].hitData;
          if (hd && hd.totalDistance != null) { distance = hd.totalDistance; break; }
        }
        const lastEvent = events[events.length - 1];
        const playId = lastEvent && lastEvent.playId;
        return {
          batterName: (p.matchup && p.matchup.batter && p.matchup.batter.fullName) || '',
          pitcherName: (p.matchup && p.matchup.pitcher && p.matchup.pitcher.fullName) || '',
          battingAbbr: isTop ? awayAbbr : homeAbbr,
          pitchingAbbr: isTop ? homeAbbr : awayAbbr,
          isGrandSlam: p.result.rbi === 4,
          distance,
          videoUrl: savantVideoUrl(playId)
        };
      });
      const strikeoutTotals = {};
      allPlays.forEach(p => {
        if (!(p.result && p.result.event && p.result.event.startsWith('Strikeout'))) return;
        const pitcher = p.matchup && p.matchup.pitcher;
        if (!pitcher || pitcher.id == null) return;
        const isTop = p.about && p.about.isTopInning;
        const existing = strikeoutTotals[pitcher.id];
        if (existing) existing.count++;
        else strikeoutTotals[pitcher.id] = { id: pitcher.id, name: pitcher.fullName || '', teamAbbr: isTop ? homeAbbr : awayAbbr, count: 1 };
      });
      const result = { homeRuns, strikeouts: Object.values(strikeoutTotals) };
      if (isFinal) gameStatsCache[gamePk] = result;
      return result;
    } catch (e) {
      return { homeRuns: [], strikeouts: [] };
    }
  }

  function renderHomeRunRow(hr) {
    const grandSlamLabel = hr.isGrandSlam ? '<div class="hr-grand-slam-label">Grand Slam</div>' : '';
    const distanceHtml = hr.distance != null ? `<div class="hr-distance">${Math.round(hr.distance)} ft</div>` : '';
    const watchHtml = hr.videoUrl ? `<a class="hr-watch" href="${hr.videoUrl}" target="_blank" rel="noopener noreferrer">Watch &#9654;</a>` : '';
    return `
      <div class="hr-row${hr.isGrandSlam ? ' is-grand-slam' : ''}">
        <div class="hr-main">
          ${grandSlamLabel}
          <div class="hr-batter">${hr.batterName} <span class="hr-team">${hr.battingAbbr}</span></div>
          <div class="hr-pitcher">vs ${hr.pitcherName} <span class="hr-team">${hr.pitchingAbbr}</span></div>
          ${watchHtml}
        </div>
        ${distanceHtml}
      </div>`;
  }

  function renderStrikeoutRow(k) {
    return `
      <div class="hr-row">
        <div class="hr-main">
          <div class="hr-batter">${k.name} <span class="hr-team">${k.teamAbbr}</span></div>
        </div>
        <div class="hr-distance">${k.count} K</div>

  }

  let dailyView = 'games';
  let dailyStatsData = { tilesHtml: '', homeRuns: [], strikeoutLeaders: [] };

  function renderDailyView() {
    const section = document.getElementById('dailyViewSection');
    if (!section) return;
    if (dailyView === 'strikeouts') {
      const leaders = dailyStatsData.strikeoutLeaders;
      section.innerHTML = leaders.length
        ? `<div class="hr-list">${leaders.map(renderStrikeoutRow).join('')}</div>`
        : '<div class="roster-empty">No strikeouts on this date.</div>';

      section.innerHTML = homeRuns.length
        ? `<div class="hr-list">${homeRuns.map(renderHomeRunRow).join('')}</div>`
        : '<div class="roster-empty">No home runs on this date.</div>';
    } else {
      section.innerHTML = `<div class="daily-games-grid">${dailyStatsData.tilesHtml}</div>`;
    }

  let dailyRequestId = 0;
  let dailyGamesByPk = {};

  function scheduleGameToNeutral(g) {
    return {
      gamePk: g.gamePk,
      gameNumber: g.gameNumber,
      awayName: teamNickname(g.teams.away.team),
      homeName: teamNickname(g.teams.home.team),
      awayScore: g.teams.away.score,
      homeScore: g.teams.home.score,
      state: g.status.abstractGameState,
      detailedState: g.status.detailedState,
      gameDate: g.gameDate
    };
  }

  async function loadDailySummary(dateStr) {
    const requestId = ++dailyRequestId;
    dailyBody.innerHTML = '<div class="mlb-status-msg">Loading today&#8217;s games&#8230;</div>';
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${dateStr}&hydrate=linescore`);
      const data = await res.json();
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      if (!games.length) {
        dailyBody.innerHTML = '<div class="mlb-status-msg">No MLB games scheduled on this date.</div>';
        return;
      }
      dailyGamesByPk = {};
      games.forEach(g => { dailyGamesByPk[g.gamePk] = g; });
      const linescore = g => g.linescore || {};
      const tiles = games.map(g => renderDailyGameTile(dateStr, {
        gamePk: g.gamePk,
        awayName: teamNickname(g.teams.away.team),
        homeName: teamNickname(g.teams.home.team),
        awayScore: g.teams.away.score,
        homeScore: g.teams.home.score,
        state: g.status.abstractGameState,
        detailedState: g.status.detailedState,
        gameDate: g.gameDate,
        inningState: linescore(g).inningState,
        inningOrdinal: linescore(g).currentInningOrdinal
      })).join('');
      dailyStatsData = { tilesHtml: tiles, homeRuns: [], strikeoutLeaders: [] };
      dailyBody.innerHTML = '<div class="sheet"><div id="dailyViewSection"></div></div>';
      if (dailyView === 'games') {
        renderDailyView();
      } else {
        document.getElementById('dailyViewSection').innerHTML = '<div class="mlb-status-msg">Loading game stats&#8230;</div>';
      }

      const startedGames = games.filter(g => g.status.abstractGameState === 'Live' || g.status.abstractGameState === 'Final');
      const gameStats = await Promise.all(startedGames.map(g =>
        fetchGameStats(g.gamePk, teamAbbr(g.teams.away.team), teamAbbr(g.teams.home.team), g.status.abstractGameState === 'Final')
      ));
      if (requestId !== dailyRequestId) return;
      const homeRuns = gameStats.map(s => s.homeRuns).flat();
      const strikeoutTotals = {};
      gameStats.forEach(s => s.strikeouts.forEach(k => {
        const existing = strikeoutTotals[k.id];
        if (existing) existing.count += k.count;
        else strikeoutTotals[k.id] = { ...k };
      }));
      const strikeoutLeaders = Object.values(strikeoutTotals).sort((a, b) => b.count - a.count).slice(0, 10);
      dailyStatsData = { tilesHtml: tiles, homeRuns, strikeoutLeaders };
      renderDailyView();
    } catch (e) {
      dailyBody.innerHTML = '<div class="mlb-status-msg">Could not load today\'s games. The MLB API may be unreachable right now.</div>';
    }
  }

    dailyView = btn.dataset.view;

  const ROSTER_TAB_TEAM_KEY = 'mlb-roster-tab-team';
  const rosterTabTeamSelect = document.getElementById('rosterTabTeamPick');
  const rosterTabBody = document.getElementById('rosterTabBody');
  const rosterTabViewToggle = document.getElementById('rosterTabViewToggle');
  let rosterTabView = 'active';
  const teamRosterCache = {};
  const teamInjuryCache = {};

  function populateRosterTabTeamSelect() {
    const teams = Object.keys(TEAM_NICKNAMES)
      .map(id => ({ id, name: TEAM_NICKNAMES[id] }))
      .sort((a, b) => a.name.localeCompare(b.name));
    rosterTabTeamSelect.innerHTML = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    let saved = null;
    try { saved = localStorage.getItem(ROSTER_TAB_TEAM_KEY); } catch (e) {}
    rosterTabTeamSelect.value = (saved && TEAM_NICKNAMES[saved]) ? saved : teams[0].id;
  }

  async function fetchTeamRoster(teamId, rosterType) {
    const key = `${teamId}-${rosterType}`;
    if (teamRosterCache[key]) return teamRosterCache[key];
    const url = `https://statsapi.mlb.com/api/v1/teams/${teamId}/roster?rosterType=${rosterType}`;
    const res = await fetch(url);
    const data = await res.json();
    const roster = (data.roster || []).map(r => ({
      id: r.person && r.person.id,
      name: r.person && r.person.fullName,
      jersey: r.jerseyNumber || '',
      posAbbr: (r.position && r.position.abbreviation) || '',
      posType: (r.position && r.position.type) || 'Other',
      statusDesc: (r.status && r.status.description) || ''
    }));
    teamRosterCache[key] = roster;
    return roster;
  }

  async function fetchTeamInjuryDetails(teamId) {
    if (teamInjuryCache[teamId]) return teamInjuryCache[teamId];
    try {
      const end = todayStr();
      const start = addDays(end, -180);
      const url = `https://statsapi.mlb.com/api/v1/transactions?teamId=${teamId}&startDate=${start}&endDate=${end}`;
      const res = await fetch(url);
      const data = await res.json();
      const txns = data.transactions || [];
      const byPlayer = {};
      txns.forEach(t => {
        const pid = t.person && t.person.id;
        const desc = t.description || '';
        if (!pid || !/injured list/i.test(desc)) return;
        const prev = byPlayer[pid];
        if (!prev || t.date > prev.date) byPlayer[pid] = { date: t.date, description: desc };
      });
      teamInjuryCache[teamId] = byPlayer;
      return byPlayer;
    } catch (e) {
      teamInjuryCache[teamId] = {};
      return {};
    }
  }

  function extractInjuryDetail(description) {
    if (!description) return null;
    const sentences = description.split(/\.\s+/).map(s => s.trim()).filter(Boolean);
    return sentences.length > 1 ? sentences.slice(1).join('. ').replace(/\.$/, '') : null;
  }

  function rosterStatusRank(p) {
    const desc = p.statusDesc || '';
    if (!desc || /^active$/i.test(desc)) return 0;
    if (/injured/i.test(desc)) return 2;
    return 1;
  }

  function sortRosterList(list) {
    return list.slice().sort((a, b) => {
      const r = rosterStatusRank(a) - rosterStatusRank(b);
      return r !== 0 ? r : (a.name || '').localeCompare(b.name || '');
    });
  }

  function rosterStatusBadge(p) {
    const desc = p.statusDesc || '';
    if (!desc || /^active$/i.test(desc)) return '';
    if (/injured/i.test(desc)) return `<span class="roster-badge roster-badge-il">${desc}</span>`;
    return `<span class="roster-badge">${desc}</span>`;
  }

  function renderRosterRow(p, opts) {
    return `
      <div class="roster-row">
        <span class="roster-jersey">${p.jersey ? '#' + p.jersey : ''}</span>
        <span class="roster-name">${p.name}</span>
        ${opts.badges ? rosterStatusBadge(p) : ''}
        <span class="roster-pos">${p.posAbbr}</span>
      </div>`;
  }

  const POSITION_PLAYER_GROUP_ORDER = ['Catcher', 'Infielder', 'Outfielder', 'Hitter'];
  const POSITION_PLAYER_GROUP_LABEL = {
    Catcher: 'Catchers', Infielder: 'Infielders', Outfielder: 'Outfielders', Hitter: 'Designated Hitter'
  };

  function renderPositionPlayerColumn(list, opts) {
    if (!list.length) return '<div class="roster-empty">None</div>';
    const groups = {};
    list.forEach(p => { (groups[p.posType] = groups[p.posType] || []).push(p); });
    const keys = POSITION_PLAYER_GROUP_ORDER.filter(g => groups[g])
      .concat(Object.keys(groups).filter(g => !POSITION_PLAYER_GROUP_ORDER.includes(g)));
    return keys.map(g => {
      const rows = sortRosterList(groups[g]).map(p => renderRosterRow(p, opts)).join('');
      return `<div class="roster-subgroup-title">${POSITION_PLAYER_GROUP_LABEL[g] || g}</div>${rows}`;
    }).join('');
  }

  function renderRosterGroups(list, opts) {
    opts = opts || {};
    if (!list.length) return '<div class="roster-empty">No players found.</div>';
    const pitchers = sortRosterList(list.filter(p => p.posType === 'Pitcher'));
    const positionPlayers = list.filter(p => p.posType !== 'Pitcher');
    const pitcherRows = pitchers.length ? pitchers.map(p => renderRosterRow(p, opts)).join('') : '<div class="roster-empty">None</div>';
    const col = (title, inner) => `
      <div class="roster-column">
        <div class="roster-section-title">${title}</div>
        ${inner}
      </div>`;
    return `<div class="roster-columns">${col('Pitchers', pitcherRows)}${col('Position Players', renderPositionPlayerColumn(positionPlayers, opts))}</div>`;
  }

  function renderInjuredListRows(list, injuryMap) {
    return list.map(p => {
      const txn = injuryMap[p.id];
      return { p, detail: txn ? extractInjuryDetail(txn.description) : null, date: txn ? txn.date : null };
    }).sort((a, b) => {
      if (a.date && b.date) return b.date.localeCompare(a.date);
      if (a.date || b.date) return a.date ? -1 : 1;
      return (a.p.name || '').localeCompare(b.p.name || '');
    }).map(({ p, detail, date }) => {
      const dateLabel = date ? new Date(date + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '&#8212;';
      return `
        <tr>
          <td class="il-num">${p.jersey ? '#' + p.jersey : ''}</td>
          <td class="il-name">${p.name}</td>
          <td class="il-pos">${p.posAbbr}</td>
          <td class="il-injury">${detail || 'Details unavailable'}</td>
          <td class="il-date">${dateLabel}</td>
        </tr>`;
    }).join('');
  }

  function renderInjuredList(fortyMan, injuryMap) {
    const ilPlayers = fortyMan.filter(p => /injured/i.test(p.statusDesc || ''));
    if (!ilPlayers.length) return '<div class="roster-empty">No players currently on the injured list.</div>';
    const groups = {};
    ilPlayers.forEach(p => { (groups[p.statusDesc] = groups[p.statusDesc] || []).push(p); });
    return Object.keys(groups).sort().map(status => `
      <div class="roster-section-title">${status}</div>
      <div class="table-scroll"><table class="il-table">
        <colgroup><col class="il-col-num"><col class="il-col-name"><col class="il-col-pos"><col><col class="il-col-date"></colgroup>
        <thead><tr><th></th><th>Player</th><th>Pos</th><th>Injury</th><th>Since</th></tr></thead>
        <tbody>${renderInjuredListRows(groups[status], injuryMap)}</tbody>
      </table></div>`).join('');
  }

  async function loadRosterTab(teamId) {
    rosterTabBody.innerHTML = '<div class="mlb-status-msg">Loading roster&#8230;</div>';
    try {
      if (rosterTabView === 'active') {
        const active = await fetchTeamRoster(teamId, 'active');
        rosterTabBody.innerHTML = `<div class="sheet">${renderRosterGroups(active)}</div>`;
      } else if (rosterTabView === '40man') {
        const fortyMan = await fetchTeamRoster(teamId, '40Man');
        rosterTabBody.innerHTML = `<div class="sheet">${renderRosterGroups(fortyMan, { badges: true })}</div>`;
      } else {
        const [fortyMan, injuryMap] = await Promise.all([
          fetchTeamRoster(teamId, '40Man'),
          fetchTeamInjuryDetails(teamId)
        ]);
        rosterTabBody.innerHTML = `<div class="sheet">${renderInjuredList(fortyMan, injuryMap)}</div>`;
      }
    } catch (e) {

  function renderGameSummaryGame(dateStr, game, multi) {
    const hasScore = game.homeScore != null && game.awayScore != null && (game.state === 'Final' || game.state === 'Live');
    let statusHtml;
    if (hasScore) {
      const homeWon = game.state === 'Final' && game.homeScore > game.awayScore;
      const awayWon = game.state === 'Final' && game.awayScore > game.homeScore;
      const badgeClass = game.state === 'Final' ? 'badge-final' : 'badge-live';

      statusHtml = `
        <div class="badge ${badgeClass}">${badgeLabel}</div>

          <div class="gs-team-row${homeWon ? ' gs-winner' : ''}"><span class="gs-team-name">${game.homeName}</span><span class="gs-team-score">${game.homeScore}</span></div>
        </div>`;
    } else {
      const badgeLabel = game.detailedState && game.detailedState !== 'Scheduled' ? game.detailedState : 'Upcoming';
      statusHtml = `

        <div class="game-summary-time">First pitch: ${formatGameTime(game.gameDate)}</div>`;

      ? `<div class="pog-section" id="wpaLeaders-${game.gamePk}"><div class="potg-loading">Loading game highlights&#8230;</div></div>`
      : '';

    return `
      <div class="game-summary-game">

        <div class="${multi ? 'gs-game-matchup' : 'pitch-header'}">${game.awayName} @ ${game.homeName}</div>

  function findBoxscorePlayer(boxscore, personId) {
    if (!boxscore || !boxscore.teams) return null;
    const away = (boxscore.teams.away && boxscore.teams.away.players) || {};
    const home = (boxscore.teams.home && boxscore.teams.home.players) || {};
    return away['ID' + personId] || home['ID' + personId] || null;
  }

  function buildPitcherStatLineParts(stats) {
    if (!stats) return [];
    const ip = stats.inningsPitched ?? '0.0';
    const r = stats.runs ?? 0;
    const k = stats.strikeOuts ?? 0;
    return [`${ip} IP`, `${r} R`, `${k} K`];
  }

  function buildBatterStatLineParts(stats) {
    if (!stats) return [];
    const parts = [];
    if (stats.atBats) parts.push(`${stats.hits ?? 0}-${stats.atBats}`);
    if (stats.doubles) parts.push(`${stats.doubles} 2B`);
    if (stats.triples) parts.push(`${stats.triples} 3B`);
    if (stats.homeRuns) parts.push(`${stats.homeRuns} HR`);
    if (stats.rbi) parts.push(`${stats.rbi} RBI`);
    return parts;
  }

  function renderStatLineParts(parts) {
    return parts.map(p => `<span class="potg-stat">${p}</span>`).join(', ');
  }

  function ordinalSuffix(n) {
    const j = n % 10, k = n % 100;
    if (j === 1 && k !== 11) return n + 'st';
    if (j === 2 && k !== 12) return n + 'nd';
    if (j === 3 && k !== 13) return n + 'rd';
    return n + 'th';
  }

  async function fetchGameHighlights(gamePk) {
    try {
      const [feedRes, wpRes] = await Promise.all([
        fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`),
        fetch(`https://statsapi.mlb.com/api/v1/game/${gamePk}/winProbability`)
      ]);
      const feedData = await feedRes.json();
      const wpData = await wpRes.json();
      const allPlays = (feedData.liveData && feedData.liveData.plays && feedData.liveData.plays.allPlays) || [];
      const wp = Array.isArray(wpData) ? wpData : [];

      const totals = {};
      const credit = (person, role, amount) => {
        if (!person || person.id == null) return;
        const key = person.id + '-' + role;
        const t = totals[key] || (totals[key] = { id: person.id, name: person.fullName, role, wpa: 0 });
        t.wpa += amount;
      };
      let playOfGame = null;
      allPlays.forEach((play, i) => {
        const entry = wp[i];
        const homeAdded = entry && entry.homeTeamWinProbabilityAdded;
        if (homeAdded == null) return;
        const isTop = play.about && play.about.isTopInning;
        const battingWpa = isTop ? -homeAdded : homeAdded;
        credit(play.matchup && play.matchup.batter, 'batter', battingWpa);
        credit(play.matchup && play.matchup.pitcher, 'pitcher', -battingWpa);

        const description = (play.result && play.result.description) || '';
        const absWpa = Math.abs(homeAdded);
        if (description && (!playOfGame || absWpa > playOfGame.absWpa)) {
          const events = play.playEvents || [];
          const lastEvent = events[events.length - 1];
          const playId = lastEvent && lastEvent.playId;
          const inning = play.about && play.about.inning;
          playOfGame = {
            absWpa,
            description,
            inningLabel: inning ? `${isTop ? 'Top' : 'Bottom'} ${ordinalSuffix(inning)}` : '',
            videoUrl: savantVideoUrl(playId)
          };
        }
      });

      const boxscore = feedData.liveData && feedData.liveData.boxscore;
      const leaders = Object.values(totals).sort((a, b) => b.wpa - a.wpa).slice(0, 3).map(p => {
        const boxPlayer = findBoxscorePlayer(boxscore, p.id);
        const stats = boxPlayer && boxPlayer.stats;
        const statParts = p.role === 'pitcher'
          ? buildPitcherStatLineParts(stats && stats.pitching)
          : buildBatterStatLineParts(stats && stats.batting);
        return { id: p.id, name: p.name, statLine: renderStatLineParts(statParts) };
      });
      return { leaders, playOfGame };
    } catch (e) {
      return { leaders: [], playOfGame: null };
    }
  }

  function renderPlayOfGame(playOfGame) {
    if (!playOfGame) return '';
    const watchHtml = playOfGame.videoUrl
      ? `<a class="pog-watch" href="${playOfGame.videoUrl}" target="_blank" rel="noopener noreferrer">Watch &#9654;</a>`
      : '';
    return `
      <div class="pog-section">
        <div class="gs-game-label">Play of the Game</div>
        ${playOfGame.inningLabel ? `<div class="pog-inning">${playOfGame.inningLabel}</div>` : ''}
        <div class="pog-description">${playOfGame.description}</div>

  function renderPlayersOfTheGame(leaders) {
    if (!leaders.length) return '';
    const players = leaders.map(p => {

  }

  function renderGameHighlights(playOfGame, leaders) {

  async function loadSchedule(dateStr, preferredGamePk) {
    gameSelect.innerHTML = '<option>Loading games&#8230;</option>';
    body.innerHTML = '<div class="mlb-status-msg">Fetching schedule for ' + dateStr + '&#8230;</div>';
    clearInterval(pollTimer);
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${dateStr}`);
      const data = await res.json();
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      if (!games.length) {
        gameSelect.innerHTML = '<option>No games</option>';
        body.innerHTML = '<div class="mlb-status-msg">No MLB games scheduled on this date.</div>';
        return;
      }
      gameSelect.innerHTML = games.map(g => {
        const away = teamNickname(g.teams.away.team);
        const home = teamNickname(g.teams.home.team);
        const state = g.status.abstractGameState;
        let tag = '';
        if (state === 'Live') tag = ' &#8212; LIVE';
        else if (state === 'Final') tag = ' &#8212; Final';
        return `<option value="${g.gamePk}">${away} @ ${home}${tag}</option>`;
      }).join('');

      const preferred = preferredGamePk && games.find(g => String(g.gamePk) === String(preferredGamePk));
      const liveGame = games.find(g => g.status.abstractGameState === 'Live');
      const chosen = preferred ? preferred.gamePk : (liveGame ? liveGame.gamePk : games[0].gamePk);
      gameSelect.value = chosen;
      loadGame(chosen);
    } catch (e) {
      body.innerHTML = '<div class="mlb-status-msg">Could not load schedule. The MLB API may be unreachable right now.</div>';
    }
  }

  async function fetchAndRender(gamePk) {
    try {
      pitchStore = {};
      const res = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`);
      const data = await res.json();
      const gameData = data.gameData;
      const liveData = data.liveData;
      const linescore = liveData.linescore;
      const awayName = gameData.teams.away.name;
      const homeName = gameData.teams.home.name;
      const state = gameData.status.abstractGameState;
      const detailedState = gameData.status.detailedState;
      const allPlays = (liveData.plays && liveData.plays.allPlays) || [];
      const personIndex = gameData.players || {};

      const numInnings = Math.max((linescore.innings || []).length, 9);
      const away = buildTeamRows(liveData.boxscore.teams.away, 'top', allPlays, personIndex);
      const home = buildTeamRows(liveData.boxscore.teams.home, 'bottom', allPlays, personIndex);
      const awayRows = away.rows, homeRows = home.rows;

      // if the batting order turns over within an inning, some rows will
      // have two cells for that inning number -- give that inning an extra
      // column, applied to BOTH teams' tables so they stay aligned even
      // though only one side actually used the extra column
      const columnsPerInning = {};
      for (let i = 1; i <= numInnings; i++) {
        let max = 1;
        [...awayRows, ...homeRows].forEach(r => {
          const len = (r.cells[i] || []).length;
          if (len > max) max = len;
        });
        columnsPerInning[i] = max;
      }

      // if there's a batter up right now, find their row so we can show a
      // live placeholder diamond even before this at-bat's result exists.
      // Deliberately never expands columnsPerInning for this -- only shown
      // if it fits within columns already needed by completed at-bats --
      // otherwise a transient state (e.g. during a mound visit) could
      // briefly force a column open and then collapse it again.
      let liveBatterInfo = null;
      if (state === 'Live' && linescore.offense && linescore.offense.batter) {
        const battingTeam = linescore.inningHalf === 'Top' ? 'away' : 'home';
        const battingRows = battingTeam === 'away' ? awayRows : homeRows;
        const liveRow = battingRows.find(r => r.players.some(p => p.id === linescore.offense.batter.id));
        if (liveRow) {
          const inning = linescore.currentInning;
          const slotIndex = (liveRow.cells[inning] || []).length;
          if (slotIndex < (columnsPerInning[inning] || 1)) {
            const livePlay = allPlays.length ? allPlays[allPlays.length - 1] : null;
            const liveMatchesBatter = livePlay && livePlay.matchup && livePlay.matchup.batter
              && livePlay.matchup.batter.id === linescore.offense.batter.id;
            liveBatterInfo = {
              team: battingTeam, rowSlot: liveRow.slot, inning, slotIndex,
              pitches: liveMatchesBatter ? extractPitches(livePlay) : [],
              batterName: linescore.offense.batter.fullName || '',
              pitcherFullName: (linescore.defense && linescore.defense.pitcher && linescore.defense.pitcher.fullName) || ''
            };
          }
        }
      }

      // away.starterPitcherId is the pitcher who faced the away batters --
      // i.e. the HOME team's starter -- and belongs under the away
      // scorecard; home.starterPitcherId is the AWAY team's starter and
      // belongs under the home scorecard
      function pitcherCardFor(pitcherId, oppositeSideBoxscore) {
        if (!pitcherId) return '';
        const p = oppositeSideBoxscore.players && oppositeSideBoxscore.players['ID' + pitcherId];
        if (!p) return '';
        return renderPitcherCard(lastNameOf(p.person, personIndex), p.stats && p.stats.pitching);
      }
      const homePitcherCard = pitcherCardFor(away.starterPitcherId, liveData.boxscore.teams.home);
      const awayPitcherCard = pitcherCardFor(home.starterPitcherId, liveData.boxscore.teams.away);

      // bullpen: every pitcher who isn't today's starter, with pitch counts
      // from the prior two days for fatigue context
      const season = gameData.game.season;
      const officialDate = gameData.datetime.officialDate;
      const homeBullpen = await buildBullpenList(liveData.boxscore.teams.home, away.starterPitcherId, season, officialDate, allPlays, 'top');
      const awayBullpen = await buildBullpenList(liveData.boxscore.teams.away, home.starterPitcherId, season, officialDate, allPlays, 'bottom');

      function getBenchPlayers(sideBoxscore) {
        return Object.values(sideBoxscore.players || {})
          .filter(p => p.person && p.position && p.position.abbreviation !== 'P' && !p.battingOrder)
          .map(p => ({ name: p.person.fullName, pos: p.position.abbreviation }));
      }
      rosterStore[awayName] = renderRosterContent(awayName, awayBullpen, awayRows, getBenchPlayers(liveData.boxscore.teams.away));
      rosterStore[homeName] = renderRosterContent(homeName, homeBullpen, homeRows, getBenchPlayers(liveData.boxscore.teams.home));
      sprayStore[awayName] = renderSprayChart(away.battedBalls, awayName);
      sprayStore[homeName] = renderSprayChart(home.battedBalls, homeName);

      let badgeClass = 'badge-preview';
      if (state === 'Live') badgeClass = 'badge-live';
      else if (state === 'Final') badgeClass = 'badge-final';

      let stripHtml = '';
      let lastPlayHtml = '';
      if (state === 'Live') {
        const halfOver = (linescore.outs ?? 0) >= 3;
        const balls = halfOver ? 0 : (linescore.balls ?? 0);
        const strikes = halfOver ? 0 : (linescore.strikes ?? 0);
        const outs = halfOver ? 0 : (linescore.outs ?? 0);
        const offense = halfOver ? {} : (linescore.offense || {});
        const inningHalf = halfOver
          ? (linescore.inningHalf === 'Top' ? 'Mid' : 'End')
          : (linescore.inningHalf === 'Top' ? 'Top' : 'Bot');
        const inningNum = linescore.currentInning;
        const onFirst = !!offense.first, onSecond = !!offense.second, onThird = !!offense.third;
        const batter = offense.batter ? offense.batter.fullName : '';
        const pitcher = halfOver ? '' : ((linescore.defense && linescore.defense.pitcher) ? linescore.defense.pitcher.fullName : '');

        stripHtml = `
          <div class="badge ${badgeClass}">${inningHalf} ${inningNum}</div>
          ${countBoard(balls, strikes, outs)}
          <div class="diamond-mini">
            <span class="base-mini second ${onSecond ? 'on' : ''}"></span>
            <span class="base-mini third ${onThird ? 'on' : ''}"></span>
            <span class="base-mini first ${onFirst ? 'on' : ''}"></span>
          </div>
          <div>${batter ? 'At bat: ' + batter : ''}${pitcher ? ' &nbsp;&#183;&nbsp; Pitching: ' + pitcher : ''}</div>
        `;
        const currentHalf = (linescore.inningHalf || '').toLowerCase();
        const completedAtBats = allPlays.filter(p =>
          p.result && p.result.type === 'atBat' && p.result.description &&
          !/mound visit|pitching change|pitching substitution|defensive substitution|defensive switch|offensive substitution|ejection|challenge|replay review|batter timeout|timeout/i.test(p.result.event || '') &&
          p.about && p.about.inning === inningNum && (p.about.halfInning || '').toLowerCase() === currentHalf
        );
        const prevPlay = completedAtBats[completedAtBats.length - 1];
        if (prevPlay) {
          lastPlayHtml = `<div class="last-play"><span class="last-play-label">Previous Batter</span>${prevPlay.result.description}</div>`;
        }
      } else if (state === 'Final') {
        stripHtml = `<div class="badge ${badgeClass}">Final</div>`;
      } else {
        const startTime = gameData.datetime && gameData.datetime.dateTime ? new Date(gameData.datetime.dateTime) : null;
        stripHtml = `<div class="badge ${badgeClass}">${detailedState}</div>
          ${startTime ? '<div>First pitch: ' + startTime.toLocaleString(undefined, {hour:'numeric', minute:'2-digit', month:'short', day:'numeric'}) + '</div>' : ''}`;
      }

      // preserve horizontal scroll position of each team's innings grid --
      // the rebuild below replaces the whole subtree, which would otherwise
      // snap every table-scroll back to scrollLeft 0 on each poll
      const scrollLefts = Array.from(body.querySelectorAll('.table-scroll')).map(el => el.scrollLeft);

      body.innerHTML = `
        <div class="sheet">
          <div class="sticky-top">
            ${renderBoxScore(linescore, awayName, homeName)}
            <div class="live-strip">${stripHtml}</div>
            ${lastPlayHtml}
          </div>
          ${renderTeamTable(awayName, awayRows, numInnings, away.pitcherByInning, away.starterPitcherId, columnsPerInning, homePitcherCard, 'away', liveBatterInfo, season)}
          ${renderTeamTable(homeName, homeRows, numInnings, home.pitcherByInning, home.starterPitcherId, columnsPerInning, awayPitcherCard, 'home', liveBatterInfo, season)}
        </div>
        <div class="footnote">Source: MLB Stats API &#183; updated ${new Date().toLocaleTimeString()}</div>
      `;

      body.querySelectorAll('.table-scroll').forEach((el, i) => {
        if (scrollLefts[i]) el.scrollLeft = scrollLefts[i];
      });

      clearInterval(pollTimer);
      if (state === 'Live') pollTimer = setInterval(() => fetchAndRender(gamePk), 15000);

      // if the pitch modal is currently open, refresh it in place with the
      // freshly-rebuilt pitchStore rather than leaving it showing stale data.
      // The same pkey naturally carries through from a live at-bat to its
      // completed cell once the plate appearance resolves, since both are
      // keyed by team/slot/inning/sub-column rather than by play instance.
      if (currentOpenPkey && pitchOverlay.classList.contains('open')) {
        if (pitchStore[currentOpenPkey]) showPitchPopup(currentOpenPkey);
        else hidePitchPopup();
      }
    } catch (e) {
      body.innerHTML = '<div class="mlb-status-msg">Could not load game data. The MLB API may be unreachable right now.</div>';
    }
  }

    if (!btn || btn.dataset.view === standingsView) return;
    standingsView = btn.dataset.view;
    document.querySelectorAll('#standingsViewToggle .view-toggle-btn')
      .forEach(b => b.classList.toggle('active', b === btn));
    loadStandings(standingsDateInput.value);
  });

  const pitchOverlay = document.getElementById('pitchOverlay');
  let currentOpenPkey = null;
  const pitchModalBody = document.getElementById('pitchModalBody');
  const pitchClose = document.getElementById('pitchClose');

  const RESULT_CLASS = (result) => {
    if (/ball/i.test(result) && !/in play/i.test(result)) return 'pitch-result-ball';
    if (/strike|foul/i.test(result)) return 'pitch-result-strike';
    if (/in play/i.test(result)) return 'pitch-result-inplay';
    return '';
  };

  function showPitchPopup(pkey) {
    const c = pitchStore[pkey];
    if (!c) return;
    currentOpenPkey = pkey;
    const pitches = c.pitches || [];
    let rows = '';
    if (pitches.length) {
      rows = pitches.map(p => `
        <tr>
          <td class="pnum">${p.num || ''}</td>
          <td>${p.type}${p.speed ? ' &#183; ' + p.speed + ' mph' : ''}</td>
          <td class="${RESULT_CLASS(p.result)}">${p.result || ''}</td>
          <td class="pcount">${p.balls != null ? p.balls : ''}-${p.strikes != null ? p.strikes : ''}</td>
        </tr>
      `).join('');
      rows = `<table class="pitch-table">
        <thead><tr><th>#</th><th>Pitch</th><th>Result</th><th>Count</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    } else {
      rows = '<div class="pitch-empty">No pitch-by-pitch data available for this plate appearance.</div>';
    }

    pitchModalBody.innerHTML = `
      <div class="pitch-header">${c.batterName || 'Batter'}</div>
      <div class="pitch-subheader">vs ${c.pitcherFullName || 'pitcher'}</div>
      ${rows}
      ${c.playDesc ? `<div class="pitch-final-desc">${c.playDesc}</div>` : ''}
    `;
    pitchOverlay.classList.add('open');
  }

  function hidePitchPopup() {
    pitchOverlay.classList.remove('open');
    currentOpenPkey = null;
  }

  const rosterOverlay = document.getElementById('rosterOverlay');
  const rosterModalBody = document.getElementById('rosterModalBody');
  const rosterClose = document.getElementById('rosterClose');

  function showRosterModal(team) {
    const html = rosterStore[team];
    if (!html) return;
    rosterModalBody.innerHTML = html;
    rosterOverlay.classList.add('open');
  }
  function hideRosterModal() {
    rosterOverlay.classList.remove('open');
  }

  const sprayOverlay = document.getElementById('sprayOverlay');
  const sprayModalBody = document.getElementById('sprayModalBody');
  const sprayClose = document.getElementById('sprayClose');

  function showSprayModal(team) {
    const html = sprayStore[team] || '<div class="pitch-header">' + team + '</div><div class="pitch-empty">No batted balls recorded yet.</div>';
    sprayModalBody.innerHTML = html;
    sprayOverlay.classList.add('open');
  }
  function hideSprayModal() {
    sprayOverlay.classList.remove('open');
  }

  const teamChartOverlay = document.getElementById('teamChartOverlay');
  const teamChartModalBody = document.getElementById('teamChartModalBody');
  const teamChartClose = document.getElementById('teamChartClose');

  async function showTeamChartModal(teamId, teamName, season, throughDate) {
    teamChartModalBody.innerHTML = `<div class="pitch-header">${teamName}</div><div class="pitch-subheader">${season} Season</div><div class="pitch-empty">Loading&#8230;</div>`;
    teamChartOverlay.classList.add('open');
    try {
      const series = await getTeamWinLossSeries(teamId, season);
      if (!teamChartOverlay.classList.contains('open')) return;
      teamChartModalBody.innerHTML = renderTeamChartContent(teamId, teamName, season, series, throughDate);
    } catch (e) {
      teamChartModalBody.innerHTML = `<div class="pitch-header">${teamName}</div><div class="pitch-empty">Chart not available.</div>`;
    }
  }
  function hideTeamChartModal() {
    teamChartOverlay.classList.remove('open');
  }

  // Tab framework: register a tab with an optional lazy `init` (runs once,
  // on first visit) and `onShow` (runs every time the tab becomes active).
  // Adding a future tab is just a register() call plus a button + panel in
  // the HTML - no router dependency needed for a single-page app like this.
  const Tabs = (() => {
    const tabs = {};
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');
    const tabControls = document.querySelectorAll('[data-tab-controls]');
    let active = null;

    function register(id, { init, onShow } = {}) {
      tabs[id] = { init, onShow, initialized: false };
    }

    function switchTo(id) {
      if (!tabs[id] || id === active) return;
      tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      tabPanels.forEach(p => { p.hidden = p.dataset.tabPanel !== id; });
      tabControls.forEach(c => { c.hidden = c.dataset.tabControls !== id; });
      const tab = tabs[id];
      if (!tab.initialized) { if (tab.init) tab.init(); tab.initialized = true; }
      if (tab.onShow) tab.onShow();
      active = id;
      try { history.replaceState(null, '', '#' + id); } catch (e) {}
    }

    function init(defaultId) {
      tabBtns.forEach(btn => btn.addEventListener('click', () => switchTo(btn.dataset.tab)));
      const fromHash = location.hash.slice(1);
      switchTo(tabs[fromHash] ? fromHash : defaultId);
    }

    return { register, switchTo, init };
  })();

  // Keep the scorecard's sticky box score pinned just below the sticky tab
  // header instead of underneath it, whatever height the header happens to
  // render at (font loading, wrapping, which tab's controls are showing, etc).
  const tabHeaderEl = document.querySelector('.tab-header');
  function syncTabHeaderHeight() {
    document.documentElement.style.setProperty('--tabbar-h', tabHeaderEl.offsetHeight + 'px');
  }
  syncTabHeaderHeight();
  if (window.ResizeObserver) new ResizeObserver(syncTabHeaderHeight).observe(tabHeaderEl);
  else window.addEventListener('resize', syncTabHeaderHeight);

  Tabs.register('daily', { init: () => loadDailySummary(dailyDateInput.value) });
  Tabs.register('scorecard');
  Tabs.register('standings', { init: () => loadStandings(standingsDateInput.value) });
  Tabs.register('schedule', { init: () => { populateScheduleTeamSelect(); loadTeamSchedule(scheduleTeamSelect.value); } });
  Tabs.register('roster', { init: () => { populateRosterTabTeamSelect(); loadRosterTab(rosterTabTeamSelect.value); } });

  const playerOverlay = document.getElementById('playerOverlay');
  const playerModalBody = document.getElementById('playerModalBody');
  const playerClose = document.getElementById('playerClose');

  async function showPlayerModal(playerId) {
    const info = playerStore[playerId];
    if (!info) return;
    playerModalBody.innerHTML = renderPlayerModalContent(info, null) + '<div class="pitch-empty">Loading season stats&#8230;</div>';
    playerOverlay.classList.add('open');
    const seasonStat = await getPlayerSeasonStats(playerId, info.season);
    if (!playerOverlay.classList.contains('open')) return;
    playerModalBody.innerHTML = renderPlayerModalContent(info, seasonStat);
  }
  function hidePlayerModal() {
    playerOverlay.classList.remove('open');
  }

  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-pkey]');
    if (target) showPitchPopup(target.getAttribute('data-pkey'));
    const rosterBtn = e.target.closest('.roster-btn');
    if (rosterBtn) showRosterModal(rosterBtn.getAttribute('data-team'));
    const sprayBtn = e.target.closest('.spray-btn');
    if (sprayBtn) showSprayModal(sprayBtn.getAttribute('data-team'));
    const playerBtn = e.target.closest('.player-name-btn');
    if (playerBtn) showPlayerModal(playerBtn.getAttribute('data-player-id'));
    const teamChartBtn = e.target.closest('.standings-team-btn');
    if (teamChartBtn) {
      const teamId = teamChartBtn.getAttribute('data-team-id');
      const teamName = teamChartBtn.getAttribute('data-team-name');
      const teamSeason = standingsDateInput.value.slice(0, 4);
      showTeamChartModal(teamId, teamName, teamSeason, standingsDateInput.value);
    }
  });
  document.addEventListener('change', (e) => {
    const sel = e.target.closest('select.spray-filter');
    if (!sel) return;
    const team = sel.getAttribute('data-team');
    const val = sel.value;
    sprayFilterState[team] = val;
    const card = sel.closest('.spray-card');
    if (!card) return;
    card.querySelectorAll('g[data-batter]').forEach(g => {
      const match = val === 'all' || g.getAttribute('data-batter') === val;
      g.style.display = match ? '' : 'none';
    });
  });
  pitchClose.addEventListener('click', hidePitchPopup);
  pitchOverlay.addEventListener('click', (e) => {
    if (e.target === pitchOverlay) hidePitchPopup();
  });
  rosterClose.addEventListener('click', hideRosterModal);
  rosterOverlay.addEventListener('click', (e) => {
    if (e.target === rosterOverlay) hideRosterModal();
  });
  sprayClose.addEventListener('click', hideSprayModal);
  sprayOverlay.addEventListener('click', (e) => {
    if (e.target === sprayOverlay) hideSprayModal();
  });
  playerClose.addEventListener('click', hidePlayerModal);
  playerOverlay.addEventListener('click', (e) => {
    if (e.target === playerOverlay) hidePlayerModal();
  });
  teamChartClose.addEventListener('click', hideTeamChartModal);
  teamChartOverlay.addEventListener('click', (e) => {
    if (e.target === teamChartOverlay) hideTeamChartModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { hidePitchPopup(); hideRosterModal(); hideSprayModal(); hidePlayerModal(); hideGameSummaryModal(); hideTeamChartModal(); }
  });

  Tabs.init('scorecard');
  loadSchedule(dateInput.value);
})();
</script>
</body>
</html>
