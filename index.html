  .bar-ab-name { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 16px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); line-height: 1.2; }
  .bar-ab-vs { margin-bottom: 6px; font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-soft); }


  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .table-scroll::-webkit-scrollbar { height: 7px; }
  .table-scroll::-webkit-scrollbar-track { background: var(--paper-line); border-radius: 4px; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--ink-soft); border-radius: 4px; }

  /* No width: 100% -- table-layout: fixed sizes every column from its th's
     explicit width below, so letting the table's own width stay auto means
     it sizes to the sum of those columns instead of stretching (and
     proportionally inflating every column, the Player one worst of all)
     to fill whatever the viewport happens to be. */
  /* border-collapse: separate (not collapse) -- WebKit has a long-standing
     bug where position: sticky on a table cell miscalculates its own offset
     mid-scroll specifically when the table uses collapsed borders (this is
     the actual mechanism behind Pos sliding into Player while scrolling,
     which pinning width/min-width/max-width on the frozen cells didn't fully
     fix). border-spacing: 0 keeps cells visually flush the way collapse did,
     without the bug. */
  /* No min-width floor here -- table-layout: fixed distributes any width
     the table is forced to beyond the sum of its own column widths by
     inflating every column proportionally, including the frozen Player/Pos
     ones, regardless of their own pinned min-width/max-width (that
     redistribution operates at the table's column-tracking level, above
     individual cells). A short game's table just being a little narrower
     than some arbitrary floor is a smaller cost than that. */
  table.scorecard-table {
    border-collapse: separate;
    border-spacing: 0;
    min-width: 0;
    table-layout: fixed;
  }
  table.scorecard-table th {
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
    padding: 4px 3px 6px;
    border-bottom: 1px solid var(--paper-line);
    width: 52px;
  }
  table.scorecard-table th.ply { text-align: left; }
  table.scorecard-table th.pos { text-align: center; }
  /* width/min-width/max-width are all pinned to the same value (not just
     width) on every frozen cell below, and each also gets a transform hint
     to force its own GPU compositing layer -- both are standard mitigations
     for a well-documented class of WebKit bug where a sticky table cell's
     rendered width visibly wobbles/squishes mid-scroll (it recomputes
     against the scrollport instead of respecting the column's own defined
     width) rather than staying fixed like a sticky block element would. */
  table.scorecard-table th.ply {
    position: sticky;
    left: 0;
    background: var(--paper);
    z-index: 3;
    width: 96px;
    min-width: 96px;
    max-width: 96px;
    transform: translateZ(0);
  }
  /* Pos is frozen right alongside Player now (left offset = Player's own
     96px width) instead of scrolling off with the innings -- the box-shadow
     is what actually marks the freeze boundary, see td.pos below for why
     it's an inset shadow and not a border-right. */
  table.scorecard-table th.pos {
    width: 34px;
    min-width: 34px;
    max-width: 34px;
    position: sticky;
    left: 96px;
    background: var(--paper);
    z-index: 3;
    box-shadow: inset -1px 0 0 rgba(243, 236, 219, 0.18);
    transform: translateZ(0);
  }
  table.scorecard-table th.inning-cont { border-left: none; color: var(--gold); }

  table.scorecard-table td {
    text-align: center;
    padding: 3px 2px;
    border-bottom: 1px dashed var(--paper-line);
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
  }
  table.scorecard-table td.ply {
    text-align: left;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 3px 0;
    width: 96px;
    min-width: 96px;
    max-width: 96px;
    position: sticky;
    left: 0;
    background: var(--paper);
    z-index: 2;
    transform: translateZ(0);
  }
  /* A starter and any substitutes stack as flex items with an explicit gap,
     rather than being <br>-joined inline content -- a <button>'s
     line-height doesn't reliably inherit from an ancestor the way plain
     text's does (browser default stylesheets tend to pin form controls to
     line-height: normal), so Player's <button> entries and Pos's plain-text
     ones drifted out of sync with each other however carefully the <br>
     and line-heights were tuned to try to match them. flex + gap sidesteps
     that: the space between entries is explicit and independent of what's
     inside them. */
  .ply-stack, .pos-stack { display: flex; flex-direction: column; gap: 3px; }
  table.scorecard-table td.ply .player-name-btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: var(--paper-line);
    border-radius: 0;
    padding: 2px 4px;
  }
  /* Without this, the rule above (higher specificity than .player-name-btn:
     hover's own, since it stacks three classes against that rule's two)
     wins on background even while hovered, leaving only the hover rule's
     border-color/color to show through -- a gold outline on an otherwise
     unchanged plate instead of the solid gold fill every other nameplate
     in the app gets on hover. */
  table.scorecard-table td.ply .player-name-btn:hover,
  table.scorecard-table td.ply .player-name-btn:focus-visible {
    background: var(--gold);
  }
  /* Every entry in both stacks gets the same explicit height, centering its
     own content within it via line-height -- this (not the gap on
     .ply-stack/.pos-stack above) is what actually keeps Player and Pos in
     row-for-row sync when substitutions come in: a <button> and a bare line
     of text don't naturally render at the same height (a button's own
     padding/border/line-height don't reliably match a plain text line's),
     so without pinning both to one shared height here, Pos's plain-text
     entries and Player's button entries drift apart the more of them stack
     up. line-height, not display: flex, does the vertical centering here --
     .player-name-btn truncates long names with text-overflow: ellipsis,
     which stops working the moment the element becomes a flex container.
     A substitute's button is a plain
     .ply-stack child same as the starter's (see renderTeamTable) rather
     than wrapped in anything of its own, so this one rule already covers
     both -- no separate substitute-only sizing to keep in sync. */
  table.scorecard-table td.ply .ply-stack > .player-name-btn {
    height: 17px;
    line-height: 13px;
  }
  table.scorecard-table td.pos .pos-stack > span {
    height: 17px;
    line-height: 17px;
    display: block;
  }
  /* Frozen alongside Player (see th.pos) rather than scrolling off with the
     innings -- Pos is the last frozen column now, so the hairline that used
     to mark td.ply's right edge moves here, as an inset box-shadow rather
     than border-right so it can't get clipped and simply fail to render on
     mobile Safari (a non-inset shadow on a sticky table cell has that
     problem; inset keeps the whole shadow inside the cell's own box,
     sidestepping it). */
  table.scorecard-table td.pos {
    text-align: center;
    color: var(--ink-soft);
    font-size: 11px;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding-right: 0;
    width: 34px;
    min-width: 34px;
    max-width: 34px;
    position: sticky;
    left: 96px;
    background: var(--paper);
    z-index: 2;
    box-shadow: inset -1px 0 0 rgba(243, 236, 219, 0.18);
    transform: translateZ(0);
  }
  table.scorecard-table td.cell { width: 52px; height: 64px; padding: 3px 1px 7px; }
  /* A substitute's entry: a cream rule down the left of his first inning,
     with his position and name written up it (see renderTeamTable). */
  table.scorecard-table td.sub-divider { position: relative; border-left: 2px solid rgba(243, 236, 219, 0.7); }
  .sub-up { position: absolute; bottom: 4px; max-height: calc(100% - 8px); writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 8.5px; line-height: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); pointer-events: none; }
  .sub-up b { color: var(--ink-soft); font-weight: 800; }
  /* an inset shadow instead of border-top: back when this table used
     border-collapse: collapse (it now uses separate, see above), a real
     border on this cell could get miscollapsed onto the sticky .ply/.pos
     columns and stay pinned in view when the cell itself had scrolled out
     of frame -- box-shadow never participated in that. Left as box-shadow
     regardless since it works fine and there's no reason to touch it. */
  table.scorecard-table td.pitcher-change { box-shadow: inset 0 1.5px 0 var(--ink); padding-top: 5px; }
  table.scorecard-table th.starter-span,
  table.scorecard-table td.starter-span { background: rgba(243, 236, 219, 0.07); }
  .cell-wrap { position: relative; display: inline-block; }
  .live-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 2px rgba(179, 121, 26, 0.25);
    animation: live-pulse 1.3s ease-in-out infinite;
  }
  @keyframes live-pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.25); }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
  }
  /* Hangs off the diamond's right point, starting halfway down, so a stack
     of three clears the play code without growing the row or the column. */
  .adv-wrap {
    position: absolute;
    left: calc(100% - 12px);
    top: 50%;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 1px;
  }
  /* Small hung plates, like the nameplates: Board Rule for an advance,
     gold for a run, brick for an out. Cream doesn't clear contrast on gold
     or brick at 9px, so those carry dark ink (near-black on the brick, where
     even the board's own ink is only 2.9:1). One fixed width, sized for
     the widest move ("B -> H"), so a stack is a column of equal plates. */
  .adv-tag {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: 26px;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 9px;
    font-variant-numeric: tabular-nums;
    line-height: 11px;
    color: var(--ink);
    background: var(--paper-line);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    padding: 1px 0 0;
    white-space: nowrap;
  }
  .adv-tag.scored { color: var(--paper); background: var(--gold); }
  .adv-tag.out { color: var(--brick-ink); background: var(--brick); }
  /* Overpass's figures sit high in their line box (the 1px of top padding
     above balances them), so the arrow is nudged to the figures' middle
     rather than the box's. */
  .adv-arrow { width: 7px; height: 6px; margin: 0 1.5px; flex: none; position: relative; top: -0.5px; }
  /* Experimental: styled as a clickable plate, same as .player-name-btn
     (see below) -- the compound selector (rather than .pitch-tag alone)
     out-specificities .player-name-btn's own rules so these values win
     regardless of cascade order. Width matches the diamond SVG's own 52px
     (see diamondSVG), which is itself sized to the inning column, so this
     spans the same width without needing to know the column width directly. */
  .pitch-tag.player-name-btn {
    position: absolute;
    top: -3px;
    left: 0;
    width: 52px;
    box-sizing: border-box;
    font-size: 9px;
    letter-spacing: 0;
    text-align: center;
    /* 5px side padding just clears the corner-peg pseudo-elements (2px in,
       3px wide -- see .player-name-btn::before/after), leaving the 9px name
       as much of the 52px as it can get. */
    padding: 1px 5px;
    /* Matches the Player column's own name plates (table.scorecard-table
       td.ply .player-name-btn below), which override the base translucent
       rgba(243,236,219,0.08) background to this same flat var(--paper-line)
       -- not .player-name-btn's own default, which reads differently once
       opaque (see the last two attempts at this rule). */
    background: var(--paper-line);
  }
  .sub-note { font-size: 10px; color: var(--ink-soft); opacity: 0.85; font-style: italic; }

  /* On the sheet, not the wall: secondary text on the Monster green can't
     clear contrast (DESIGN.md, the Monster Stays Rule). */
  .footnote {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    margin-top: 16px;
    font-family: 'Inter', sans-serif;
  }

  .cell-wrap.clickable { cursor: pointer; }
  .cell-wrap.clickable:hover svg { filter: brightness(1.12); }

  .player-name-btn {
    position: relative;
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(243, 236, 219, 0.08);
    border: 1px solid var(--paper-line);
    border-radius: 0;
    padding: 2px 7px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 2px 3px rgba(0, 0, 0, 0.35);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .player-name-btn:hover,
  .player-name-btn:focus-visible {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--paper);
    outline: none;
    box-shadow: 0 3px 4px rgba(0, 0, 0, 0.45);
  }
  /* Corner pegs the plate hangs on -- just the two top corners, no middle
     peg, so it reads as a plate slotted onto a scoreboard peg rail. Flat
     fill (no gradient/bevel) in --paper -- a gradient highlight read as
     too literal a piece of hardware; the flat dot plus the drop shadow
     alone still registers as a small raised mark. */
  .player-name-btn::before,
  .player-name-btn::after,
  button.standings-team-btn::before,
  button.standings-team-btn::after {
    content: '';
    position: absolute;
    top: 1.5px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 0.5px 0.5px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  .player-name-btn::before,
  button.standings-team-btn::before { left: 2.5px; }
  .player-name-btn::after,
  button.standings-team-btn::after { right: 2.5px; }

  .player-stat-line {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 6px;
    border-bottom: 1px solid var(--paper-line);
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
  }
  .player-stat-line .psl-label {
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  /* Season stats in the player modal, as one row with stat names as
     column headers -- reuses table.pitch-table's look but centers every
     cell instead of that class's default left-align, and drops the
     per-row divider (see career-table) since there's only ever one row.
     table.pitch-table th carries letter-spacing for its normal left-
     aligned headers; centered, that trailing tracking space (added after
     the last character same as every other) reads as the text sitting
     off-center, so it's zeroed here to keep header and value stacked on
     the same centerline. Selectors match both classes on the one element
     (table.pitch-table.season-stat-table, not just .season-stat-table)
     so this beats table.pitch-table th on specificity rather than having
     to out-race it by appearing later in the file. */
  table.pitch-table.season-stat-table th,
  table.pitch-table.season-stat-table td { text-align: center; }
  table.pitch-table.season-stat-table th { letter-spacing: normal; }
  table.pitch-table.season-stat-table tbody tr:last-child td { border-bottom: none; }
  /* Last 10 Games table: same centering/letter-spacing fix as
     .season-stat-table, but the leading Date column stays left-aligned
     (like every other table's leading label column) since only the stat
     columns after it benefit from being centered. */
  table.pitch-table.recent-games-table th:not(:first-child),
  table.pitch-table.recent-games-table td:not(:first-child) { text-align: center; }
  table.pitch-table.recent-games-table th:not(:first-child) { letter-spacing: normal; }
  table.pitch-table.recent-games-table tr.hl td:first-child { color: var(--gold); }
  /* Batter rows: H-AB stays centered like every other stat column above,
     but the trailing Notes column is a variable-length comma list
     (see notableBattingEvents) -- centering that reads worse than just
     letting it run left like ordinary text. */
  table.pitch-table.recent-games-table.batter th:last-child,
  table.pitch-table.recent-games-table.batter td:last-child { text-align: left; }

  .pitch-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(11, 15, 12, 0.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .pitch-overlay.open { display: flex; }
  /* The pitch-detail popup can be triggered from inside another already-open
     modal (e.g. clicking a batted-ball dot in the spray chart), so it needs
     to render above every other .pitch-overlay regardless of DOM order. */
  #pitchOverlay { z-index: 200; }
  .pitch-modal {
    position: relative;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 0;
    max-width: 360px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  /* .scorecard-sidebar (see the wide breakpoint above) is one shared card
     for both the monster scoreboard (renderMonsterPanel's markup, written
     in here verbatim by fetchAndRender -- see sidebarMonsterPanel) and the
     live at-bat tracker below it, rather than two separately-boxed pieces.
     --paper (not a monster-green shade) matches every other card in the
     app -- .sheet, .pitch-modal, .sidebar-atbat below -- for consistency
     rather than a one-off green treatment just for this panel. overflow:
     hidden clips #sidebarMonsterPanel's flush top edge and
     .sidebar-atbat's flush bottom edge to the outer card's own square
     border; the internal scroll for content taller than the
     viewport (see max-height above) lives on .sidebar-atbat alone, not
     this outer card, precisely so the monster scoreboard at the top never
     scrolls out of view. */
  .scorecard-sidebar {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 0;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25) inset, 0 4px 14px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  /* .monster-panel itself is inline-flex and sized to its content -- center
     it in the card rather than letting it hug the left edge. */
  #sidebarMonsterPanel:not(:empty) { padding: 14px; text-align: center; }

  /* Reuses the same inner markup/classes as #pitchModalBody (.pitch-header,
     .pitch-table, .loc-section, ...) -- see renderPitchDetailHtml -- just
     laid out in an always-visible panel section instead of a dismissible
     overlay (no close button, no backdrop). Shares .scorecard-sidebar's own
     --paper background (no background of its own) with just a hairline
     divider, the same one .tab-bar uses against this same background, to
     mark where the scoreboard ends. Its own scrollbar (see
     .scorecard-sidebar above) is what lets the pitch table grow row by row
     without the panel's overall height pushing anything above it around. */
  .sidebar-atbat:not(:empty) {
    border-top: 1px solid rgba(243, 236, 219, 0.15);
    padding: 14px;
    overflow-y: auto;
    /* Takes whatever vertical space is left in the fixed-height card below
       the monster scoreboard (min-height: 0 is what lets a flex child
       actually shrink and scroll instead of overflowing its parent). */
    flex: 1 1 auto;
    min-height: 0;
  }
  .pitch-close {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    font-size: 14px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }
  .pitch-close:hover { color: var(--ink); background: rgba(243, 236, 219, 0.08); }
  .pitch-close:focus-visible { color: var(--ink); outline: 2px solid var(--gold); outline-offset: -2px; }
  .pitch-header {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink);
    margin-bottom: 2px;
    padding-right: 18px;
  }
  /* Standings tab headers (Division/Wild Card Standings)
     get extra letter-spacing beyond the shared .pitch-header default. */
  #standingsPanel .pitch-header {
    letter-spacing: 0.12em;
  }
  .pitch-subheader {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  /* The at-bat popup/trackers' batter/pitcher lines -- left-aligned (like
     every other .pitch-header/.pitch-subheader) and sized up a bit, since
     this popup/tracker is the one place a name is the headline rather than
     a secondary label next to a team/date. */
  #pitchModalBody .pitch-header,
  #sidebarAtBat .pitch-header {
    font-size: 19px;
    text-align: left;
  }
  #pitchModalBody .pitch-subheader,
  #sidebarAtBat .pitch-subheader {
    margin-bottom: 6px;
    font-size: 14px;
  }
  .player-modal-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .player-modal-head .pitch-header,
  .player-modal-head .pitch-subheader {
    margin-bottom: 0;
    text-align: left;
  }
  .player-headshot {
    width: 46px;
    height: 57.5px;
    border-radius: 0;
    object-fit: cover;
    background: var(--paper-line);
    border: 1px solid var(--paper-line);
    flex-shrink: 0;
  }
  .player-award-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .player-award {
    display: inline-flex;
    align-items: stretch;
    border: 1px solid var(--gold);
    white-space: nowrap;
    cursor: default;
  }
  .player-award-n {
    display: flex;
    align-items: center;
    padding: 1px 5px 0;
    background: var(--gold);
    color: var(--paper);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .player-award-label {
    padding: 4px 7px 3px;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 10px;
    line-height: 1.2;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .player-search-wrap { position: relative; }
  #playerSearchInput { width: 220px; max-width: 220px; }
  .player-search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 260px;
    max-height: 320px;
    overflow-y: auto;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 0;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    z-index: 30;
  }
  .player-search-results[hidden] { display: none; }
  .player-search-result {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 8px 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    border-bottom: 1px solid var(--paper-line);
  }
  .player-search-result:last-child { border-bottom: none; }
  .player-search-result:hover { background: rgba(217, 169, 26, 0.12); }
  .player-search-result .psr-meta {
    color: var(--ink-soft);
    font-size: 11px;
    white-space: nowrap;
  }
  .player-search-empty {
    padding: 10px;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'Overpass', sans-serif;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  /* ---- Player profile ----
     The photo is a print pinned to the page (cream border, drop shadow);
     .pp is the size container the header and board respond to, since the
     profile sits inside a sheet whose width isn't the viewport's. */
  .pp { container-type: inline-size; }
  .pp-back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 0 0 10px;
    padding: 6px 2px;
    background: none;
    border: 0;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
  }
  .pp-back svg { width: 7px; height: 11px; }
  .pp-back:hover { color: var(--gold); }
  .pp-back:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .pp-head { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: start; }
  @container (min-width: 700px) { .pp-head { grid-template-columns: 184px 1fr; gap: 26px; } }
  .pp-photo {
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: var(--paper-line);
    border: 3px solid var(--ink);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
  }
  .pp-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; display: block; }
  .pp-num { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; color: var(--gold); }
  .pp-name { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.05; margin: 2px 0 6px; color: var(--ink); text-wrap: balance; }
  /* Team and position as a plain line of type -- the nameplates are for
     things you click through to; here they're just who he is. On a narrow
     sheet each gets its own line so a position can't break mid-phrase. */
  .pp-ident { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 16px; line-height: 1.3; letter-spacing: 0.01em; color: var(--ink); margin-bottom: 12px; }
  .pp-pos { color: var(--ink-soft); }
  .pp-sep { color: var(--gold); padding: 0 7px; }
  @container (max-width: 699px) { .pp-sep { display: none; } .pp-pos { display: block; } }
  @container (min-width: 700px) {
    .pp-num { font-size: 44px; }
    .pp-name { font-size: 42px; margin: 4px 0 8px; }
    .pp-ident { font-size: 20px; margin-bottom: 16px; }
  }
  .pp-vitals { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 14px; }
  .pp-vitals > div { display: flex; flex-direction: column; gap: 1px; }
  .pp-vitals dt { font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .pp-vitals dd { margin: 0; font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 15px; line-height: 1.3; color: var(--ink); }
  /* Faint team mark behind the header's top-right corner. overflow: clip
     on the sheet (not hidden) trims it without making the sheet a scroll
     container, which would stop the Game Log's header from sticking. */
  .pp-sheet { position: relative; overflow: clip; }
  .pp-sheet > :not(.pp-watermark) { position: relative; }
  /* On a narrow sheet the name runs nearly the full width, so the mark
     stays small and in the corner beside the jersey number, clear of it. */
  .pp-watermark { position: absolute; top: 10px; right: 10px; width: 46px; height: 46px; object-fit: contain; opacity: 0.1; pointer-events: none; }
  @container (min-width: 700px) { .pp-watermark { top: 18px; right: 22px; width: 170px; height: 170px; opacity: 0.12; } }
  .pp-narrow .player-award-tags, .pp-wide .player-award-tags { margin-bottom: 0; }
  .pp-wide { display: none; }
  @container (min-width: 700px) { .pp-wide { display: block; } .pp-narrow { display: none; } }
  .pp-vitals-narrow { margin-top: 14px; }

  .pp-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--paper-line);
    margin: 18px 0 16px;
  }
  .pp-tabs::-webkit-scrollbar { display: none; }
  .pp-tab {
    flex: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 9px 10px 8px;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .pp-tab:hover { color: var(--ink); }
  .pp-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
  .pp-tab:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }

  /* Overview board: skill scores (percentiles), each a bold number over
     the stat behind it, four to a row. The two skill groups stack on a
     phone and sit side by side on a wide sheet; totals run beneath. */
  .pp-skills { padding: 2px 0 4px; }
  .pp-skg-pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px 40px; }
  @container (min-width: 760px) { .pp-skg-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .pp-skg-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    padding-top: 5px;
    border-top: 2px solid var(--title-rule);
    font-family: 'Overpass', sans-serif;
    font-weight: 800;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .pp-skg-head em { font-style: normal; font-weight: 700; font-size: 10.5px; letter-spacing: 0.02em; text-transform: none; color: var(--ink-soft); text-align: right; }
  .pp-skg-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .pp-sk, .pp-tot { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
  .pp-sk-name { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); opacity: 0.85; }
  .pp-sk-score { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 34px; line-height: 1.15; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pp-sk-score.is-top { color: var(--gold); }
  /* Short of the pool: placed among it, but quieter and never gold. */
  .pp-sk-score.is-soft { color: var(--ink-soft); }
  .pp-sk-score.is-none { color: var(--ink-soft); opacity: 0.6; }
  /* Waiting on Savant: an empty slot the score's size, so nothing shifts. */
  .pp-sk-score.is-wait { width: 1.2em; margin: 0 auto; background: rgba(243, 236, 219, 0.035); border-radius: 2px; }
  .pp-sk-stat { font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 10px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pp-totals { margin-top: 18px; }
  @container (min-width: 760px) { .pp-totals { max-width: calc(50% - 20px); } }
  .pp-tot-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pp-tot-v { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15; color: var(--ink); font-variant-numeric: tabular-nums; }
  @container (min-width: 700px) {
    .pp-sk-score { font-size: 42px; }
    .pp-tot-v { font-size: 32px; }
    .pp-sk-stat { font-size: 10.5px; }
  }

  /* Arsenal: velo and movement, then the mix and two-strike sections --
     stacked on a phone, side by side on a wide sheet. */
  .ars { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px 40px; padding: 2px 0 4px; }
  @container (min-width: 760px) { .ars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .ars-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .ars-plot { display: block; width: 100%; max-width: 320px; margin: 0 auto; }
  .ars-ring { fill: none; stroke: var(--paper-line); stroke-width: 1; }
  .ars-ax { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 8px; letter-spacing: 0.1em; fill: var(--ink-soft); }
  .ars-dot { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  .ars-code { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 10.5px; fill: var(--ink); }
  .ars-sc, .ars-ts-sc { font-family: 'Oswald', sans-serif; font-weight: 600; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ars-sc { font-size: 19px; text-align: center; }
  .ars-sc.is-top, .ars-ts-sc.is-top { color: var(--gold); }
  .ars-sc.is-none, .ars-ts-sc.is-none { color: var(--ink-soft); opacity: 0.6; }
  .ars-mx { display: grid; grid-template-columns: minmax(0, 1fr) 28px 76px 28px minmax(0, 1fr); align-items: center; gap: 5px; padding: 5px 0; border-bottom: 1px dashed var(--paper-line); }
  .ars-mx-h { padding: 0 0 4px; border-bottom: 1px solid var(--paper-line); font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .ars-mx-l, .ars-mx-r { display: flex; align-items: center; min-width: 0; }
  .ars-mx-h .ars-mx-r { justify-content: flex-end; }
  .ars-trk { flex: 1; display: flex; align-items: center; gap: 4px; min-width: 0; }
  .ars-mx-l .ars-trk { justify-content: flex-end; }
  .ars-mx i { display: block; flex: none; height: 11px; background: var(--ink); opacity: 0.75; }
  .ars-mx i.is-top { background: var(--gold); opacity: 1; }
  .ars-mx em { flex: none; font-style: normal; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 10.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ars-mx-n { text-align: center; font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.1; color: var(--ink); }
  .ars-tg { display: inline-flex; margin: 0 0 10px; border: 1px solid var(--paper-line); background: var(--paper); }
  .ars-tg button { background: none; border: 0; padding: 6px 12px 5px; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); cursor: pointer; }
  .ars-tg button + button { border-left: 1px solid var(--paper-line); }
  .ars-tg button[aria-pressed="true"] { color: var(--ink); background: rgba(217, 169, 26, 0.15); box-shadow: inset 0 -2px 0 var(--gold); }
  .ars-tg button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .ars-ts { display: grid; grid-template-columns: 34px 14px minmax(0, 1fr) 52px 56px; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px dashed var(--paper-line); }
  .ars-ts-h, .ars-fc-h { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .ars-ts-h { padding: 0 0 4px; border-bottom: 1px solid var(--paper-line); }
  .ars-ts-h span:nth-child(n+4) { text-align: right; }
  .ars-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 4px; border: 1px solid var(--ink-soft); font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink); }
  .ars-arrow { font-family: 'Overpass', sans-serif; color: var(--ink-soft); text-align: center; }
  .ars-ts-n { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 17px; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ars-ts-v, .ars-fc-v { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 21px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .ars-ts-sc { font-size: 21px; text-align: right; }
  .ars-fc-h { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-bottom: 4px; border-bottom: 1px solid var(--paper-line); }
  .ars-fc-cols { display: grid; grid-template-columns: 44px 14px 52px; gap: 6px; text-align: right; }
  .ars-fc { display: grid; grid-template-columns: minmax(0, 1fr) 44px 14px 52px; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--paper-line); }
  .ars-fc-pre { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 16px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
  .ars-fc-v.is-up { box-shadow: inset 0 -2px 0 var(--gold); }
  .ars-foot { margin-top: 6px; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 10px; color: var(--ink-soft); }
  .pp-painted {
    display: block;
    text-align: center;
    margin-bottom: 6px;
    font-family: 'Overpass', sans-serif;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.85;
  }
  .pp-slot {
    position: relative;
    display: block;
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.5;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 2px;
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.5), inset 0 -1px 1px rgba(255, 255, 255, 0.05);
  }
  @container (min-width: 700px) { .pp-slot { font-size: 46px; line-height: 1.45; } }
  .pp-rank {
    position: absolute;
    bottom: 4px;
    right: 5px;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 8px;
    line-height: 1;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  @container (min-width: 520px) { .pp-rank { font-size: 10px; bottom: 5px; right: 7px; letter-spacing: 0.02em; } }
  @container (min-width: 700px) { .pp-rank { font-size: 11px; bottom: 7px; right: 9px; } }
  .pp-stat.is-top .pp-slot, .pp-stat.is-top .pp-rank { color: var(--gold); }

  /* Defense tab: OAA and FRV in slots (up to an Overview
     slot's width) with the position toggle beside them; on a phone the
     toggle takes its own line above, so the two slots share the width.
     Then the catch board, held to a reading width so a row's count stays
     near its lamps on a wide sheet. */
  .pp-def { max-width: 720px; }
  /* A wide sheet sets the highlights beside the plays rather than under
     them: the board heads the left column, and the two lists start level
     below it. */
  @container (min-width: 1150px) {
    .pp-def { max-width: none; display: grid; grid-template-columns: minmax(0, 720px) minmax(0, 1fr); gap: 0 40px; align-items: start; }
    .pp-def-top { grid-column: 1; }
    .pp-def-main { grid-column: 1; grid-row: 2; }
    .pp-def-side { grid-column: 2; grid-row: 2; }
  }
  .pp-def-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: end; gap: 14px 12px; }
  .pp-def-pools { grid-column: 1 / -1; order: -1; justify-self: end; width: max-content; max-width: 100%; }
  @container (min-width: 520px) {
    .pp-def-top { display: flex; gap: 14px 18px; }
    .pp-def-top .pp-stat { flex: 0 1 220px; min-width: 0; }
    .pp-def-pools { order: 0; margin-left: auto; }
  }
  .pp-def-pools .view-toggle-btn { flex: none; }
  /* Catch board: one row per star rating, each chance a scoreboard lamp
     (the live panel's count lamps, see .monster-dot) -- lit for a catch,
     a dark socket for a miss. The stars and counts sit in fixed columns
     so every row's lamps start and end in line. */
  .pp-cb { margin-top: 26px; }
  .pp-cb > .mlb-status-msg, .pp-cb > .pitch-empty { margin-top: 0; }
  .pp-cb-title { text-align: left; margin-bottom: 8px; }
  .pp-cb-row {
    display: grid;
    grid-template-columns: 62px minmax(0, 1fr) 46px 10px;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 9px 0;
    background: none;
    border: 0;
    border-top: 1px solid var(--paper-line);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .pp-cb-row:disabled { cursor: default; }
  .pp-cb-row:not(:disabled):hover { background: rgba(243, 236, 219, 0.04); }
  .pp-cb-row:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .pp-cb-stars { font-size: 11px; letter-spacing: 1px; color: var(--ink-soft); white-space: nowrap; }
  .pp-cb-lamps { display: flex; flex-wrap: wrap; gap: 4px; min-height: 11px; }
  .pp-lamp {
    flex: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(0, 0, 0, 0.3);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  .pp-lamp.is-lit { background: var(--ink); border-color: var(--ink); box-shadow: none; }
  .pp-lamp.is-gold { background: var(--gold); border-color: var(--gold); box-shadow: none; }
  .pp-cb-count { text-align: right; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
  .pp-cb-chev { width: 10px; height: 6px; color: var(--ink-soft); transition: transform 0.15s; }
  .pp-cb-row:disabled .pp-cb-chev { visibility: hidden; }
  .pp-cb-row[aria-expanded="true"] .pp-cb-chev { transform: rotate(180deg); }
  .pp-cb-routine {
    padding: 9px 0 0;
    border-top: 1px solid var(--paper-line);
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .pp-cb-routine span { margin-left: 8px; font-size: 12px; letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
  /* A row's catches, hardest first: lamp, catch %, hang time, distance,
     wall/back tags, play mark -- the same columns for the painted head. */
  .pp-cb-list { padding: 0 0 10px; }
  .pp-cb-head, .pp-cb-catch {
    display: grid;
    grid-template-columns: 11px 56px 48px 56px minmax(0, 1fr) 24px;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
  }
  .pp-cb-head { padding-bottom: 4px; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .pp-cb-catch {
    width: 100%;
    min-height: 34px;
    background: rgba(0, 0, 0, 0.16);
    border: 0;
    border-top: 1px solid rgba(0, 0, 0, 0.25);
    color: var(--ink);
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    text-align: left;
    cursor: pointer;
  }
  .pp-cb-catch:hover { background: rgba(243, 236, 219, 0.08); }
  .pp-cb-catch:hover .pp-cb-play { border-color: var(--gold); }
  .pp-cb-catch:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .pp-cb-tags { display: flex; gap: 4px; justify-content: flex-end; }
  .pp-cb-tag { padding: 2px 4px 1px; border: 1px solid var(--paper-line); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  /* The same boxed gold play mark as a score box's recap button. */
  .pp-cb-play { box-sizing: border-box; width: 24px; height: 18px; padding: 3px 7px; background: rgba(0, 0, 0, 0.22); border: 1px solid var(--paper-line); color: var(--gold); }

  /* An infielder's highlights and double-play plays: date, opponent, what
     happened, play mark -- dates and opponents in fixed columns so the
     descriptions line up. The ledger rows reuse the catch board's row,
     with the play's notation in the scorekeeper's typewriter face. */
  .pp-pl-row {
    display: grid;
    grid-template-columns: 48px 58px minmax(0, 1fr) 24px;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 36px;
    padding: 6px 4px;
    background: rgba(0, 0, 0, 0.16);
    border: 0;
    border-top: 1px solid rgba(0, 0, 0, 0.25);
    color: var(--ink);
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    text-align: left;
    cursor: pointer;
  }
  .pp-pl-row:hover { background: rgba(243, 236, 219, 0.08); }
  .pp-pl-row:hover .pp-cb-play { border-color: var(--gold); }
  .pp-pl-row:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .pp-pl-opp { color: var(--ink-soft); white-space: nowrap; }
  .pp-pl-text { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12.5px; line-height: 1.35; }
  .pp-pl-list { border-bottom: 1px solid var(--paper-line); }
  .pp-pl-more {
    display: block;
    margin: 10px 0 0 auto;
    padding: 6px 0;
    background: none;
    border: 0;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
  }
  .pp-pl-more:hover { color: var(--gold); }
  .pp-pl-more:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .pp-dp-row { grid-template-columns: 80px minmax(0, 1fr) 46px 10px; }
  .pp-cb-label { font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
  .pp-pl-row:disabled { cursor: default; }
  .pp-pl-row:disabled .pp-cb-play { visibility: hidden; }
  .pp-dp-code, .cv-code { font-family: 'Special Elite', monospace; font-size: 16px; color: var(--ink); }
  .pp-dp-role { font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .pp-dp-roles { border-top: 0; padding: 0 0 9px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .pp-dp-roles span { margin-left: 6px; }
  .pp-dp-total { margin-left: 6px; color: var(--ink); }

  /* Clip popup: wider than the other popups, for the video, and above
     them all, since the at-bat popup opens it. */
  #clipOverlay { z-index: 300; }
  #clipOverlay .pitch-modal { max-width: 640px; }
  .cv-head { display: flex; align-items: baseline; gap: 10px; padding-right: 36px; margin-bottom: 12px; }
  .cv-stars { font-size: 14px; letter-spacing: 2px; color: var(--ink); }
  .cv-result { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  .cv-video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .cv-video-wait { display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.3); }
  .cv-desc { margin: 12px 0 4px; font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 15px; line-height: 1.3; color: var(--ink); }
  .cv-meta { margin-bottom: 4px; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 12px; }
  .cv-facts { margin: 12px 0 0; }

  .pp-table td, .pp-table th { white-space: nowrap; }
  .pp-table td.pp-soft { color: var(--ink-soft); }
  .pp-game-link {
    padding: 0;
    background: none;
    border: 0;
    font: inherit;
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--paper-line);
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .pp-game-link:hover { text-decoration-color: var(--gold); }
  .pp-game-link:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }


  /* Game Log: the last five games as cards (a row across on a wide sheet,
     stacked on a narrow one), then the season by month at a compact,
     fixed column width rather than stretched across the sheet. */
  .pp-recent { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 22px; }
  @container (min-width: 900px) { .pp-recent { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  /* Widest sheets: the five cards stack in a column beside the log and
     stay in view (just under the sticky tab header, see --tab-header-h)
     while the season scrolls past. Below this width a side column would
     squeeze the log, so the five-across row above takes over. */
  /* The column is sized to a five-PA card (five 44px diamonds), the
     usual game, rather than six: a sixth PA shrinks the diamonds a
     little, and most cards no longer trail empty room. */
  @container (min-width: 1150px) {
    .pp-gl { display: grid; grid-template-columns: 262px minmax(0, 1fr); gap: 22px; align-items: start; }
    .pp-gl .pp-recent { grid-template-columns: 1fr; gap: 8px; margin-bottom: 0; position: sticky; top: calc(var(--tab-header-h, 0px) + 12px); }
    .pp-gl .pp-rc { padding: 8px 10px; }
    .pp-gl .pp-rc-pas { margin-top: 6px; }
    .pp-gl .pp-rc-pa { flex-basis: 44px; }
  }
  /* A flex column, not a plain block: a <button> centers its content
     vertically by default, and cards in a row are stretched to the
     tallest one, so shorter cards would otherwise float down. */
  .pp-rc {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: rgba(0, 0, 0, 0.16);
    border: 1px solid var(--paper-line);
    padding: 10px 12px 10px;
    cursor: pointer;
  }
  .pp-rc:hover { border-color: var(--ink-soft); }
  .pp-rc:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .pp-rc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 12px; }
  .pp-rc-date { color: var(--ink); }
  .pp-rc-opp { color: var(--ink-soft); }
  .pp-rc-line { margin-left: auto; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pp-wl { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 11px; }
  .pp-wl.is-w { color: var(--ink); }
  .pp-wl.is-l { color: var(--ink-soft); }
  /* Diamonds share the card's width (up to 46px each), so a six-PA game
     still fits on one line in a narrow five-across card. */
  .pp-rc-pas { display: flex; gap: 2px; margin-top: 8px; }
  .pp-rc-pa { position: relative; display: flex; flex-direction: column; align-items: center; flex: 0 1 46px; min-width: 0; }
  .pp-rc-pa svg { width: 100%; height: auto; max-width: 46px; }
  .pp-rc-inn { font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 9px; color: var(--ink-soft); margin-top: -3px; }
  /* RBI dots, scorebook style: one per run driven in, tucked into the
     diamond's upper-left corner. */
  .pp-rc-rbi { position: absolute; top: 3px; left: 2px; display: flex; gap: 2px; }
  .pp-rc-rbi i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
  .pp-rc-nums { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
  .pp-rc-num { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .pp-rc-k { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 0.1em; color: var(--ink-soft); }
  .pp-rc-v {
    align-self: stretch;
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.45;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 2px;
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.5);
  }
  /* Below five-across, the cards become a swipeable row, one card per
     step with the next one peeking in, so the season log starts one
     card's height down instead of five. Each card is a fixed slot sized
     to its content: 266px is a five-PA hitter's card at its natural width
     (five 46px diamonds, with room for the header line), so a wide phone
     or a Fold shows more cards rather than wider ones. A sixth PA shrinks
     the diamonds a little; a pitcher's six slots spread to fill. */
  @container (max-width: 899px) {
    .pp-recent { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; padding-bottom: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .pp-recent::-webkit-scrollbar { display: none; }
    .pp-recent .pp-rc { flex: 0 0 min(86%, 266px); scroll-snap-align: start; }
  }

  .pp-log td:nth-child(n+4), .pp-log th:nth-child(n+4) { text-align: center; }
  /* Column heads stay put under the sticky tab header while the season
     scrolls (see --tab-header-h). */
  table.pitch-table.pp-log thead th { position: sticky; top: var(--tab-header-h, 0px); z-index: 2; background: var(--paper); }
  /* Date, opponent and result shrink to their content (width: 1% is the
     table idiom for "as narrow as fits"); on a wide sheet the Result
     column then takes the slack instead (see below). */
  .pp-log td:nth-child(-n+3), .pp-log th:nth-child(-n+3) { width: 1%; padding-right: 16px; }
  /* Wide sheets: the stat columns take a fixed, compact width and the
     Result column absorbs the slack, so the stats sit together as one
     block instead of each spreading to fill the sheet. */
  @container (min-width: 700px) {
    table.pitch-table.pp-log td:nth-child(3), table.pitch-table.pp-log th:nth-child(3) { width: auto; }
    table.pitch-table.pp-log td:nth-child(n+4), table.pitch-table.pp-log th:nth-child(n+4) { width: 58px; padding-left: 4px; padding-right: 4px; }
  }
  .pp-log td:nth-child(3) { font-variant-numeric: tabular-nums; }
  .pp-log .pp-opp-short { display: none; }
  /* Qualified as table.pitch-table.pp-log so these outrank the shared
     table.pitch-table cell padding and font size, which come later in
     the stylesheet at equal specificity otherwise. */
  @container (max-width: 519px) {
    .pp-log .pp-opp-long { display: none; }
    .pp-log .pp-opp-short { display: inline; }
    table.pitch-table.pp-log td, table.pitch-table.pp-log th { padding-left: 4px; padding-right: 4px; }
    table.pitch-table.pp-log td:nth-child(-n+3), table.pitch-table.pp-log th:nth-child(-n+3) { padding-right: 8px; }
  }
  /* Small phones: one type size down and tighter cells, so the log fits
     down to a 320px screen without its own sideways scroll. */
  @container (max-width: 339px) {
    table.pitch-table.pp-log { font-size: 11px; }
    table.pitch-table.pp-log td, table.pitch-table.pp-log th { padding-left: 2px; padding-right: 2px; }
    table.pitch-table.pp-log td:nth-child(-n+3), table.pitch-table.pp-log th:nth-child(-n+3) { padding-right: 5px; }
  }
  .pp-log .pp-xbh { display: none; }
  @container (min-width: 700px) { .pp-log .pp-xbh { display: table-cell; } }
  /* white-space: normal -- the month's totals line may wrap on a phone;
     left on the table's nowrap, it set the whole log's minimum width. */
  .pp-log tr.pp-month td { padding: 14px 6px 4px; border-bottom: 1px solid var(--paper-line); white-space: normal; }
  .pp-month-total { display: inline-block; }
  .pp-month-name { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
  .pp-month-total { margin-left: 12px; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }


  /* Splits tab: OPS bars on one scale, with a dashed tick at the season
     OPS (see renderProfileSplits). Hitters get the spray chart beside the
     bars on a wide sheet, above them on a narrow one. */
  .pp-spl { display: grid; grid-template-columns: 1fr; gap: 22px; }
  @container (min-width: 820px) { .pp-spl { grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 32px; align-items: start; } }
  .pp-spl .player-spray-section { margin-top: 0; }
  .pp-splits { max-width: 640px; }
  .pp-splits-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); }
  .pp-splits-key { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; letter-spacing: 0.04em; text-transform: none; font-size: 11px; color: var(--ink-soft); }
  .pp-splits-key i { width: 0; height: 12px; border-left: 1.5px dashed var(--ink); }
  .pp-sgroup { margin-top: 12px; }
  .pp-sgroup-name { font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); padding-top: 5px; border-top: 2px solid var(--title-rule); margin-bottom: 6px; }
  .pp-saxis { padding-top: 2px; }
  .pp-saxis-ends { display: flex; justify-content: space-between; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 10px; color: var(--ink-soft); }
  .pp-srow { display: grid; grid-template-columns: 68px minmax(0, 1fr) 44px 52px; align-items: center; gap: 10px; padding: 5px 0; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
  .pp-slabel { color: var(--ink); white-space: nowrap; }
  .pp-sbar { position: relative; height: 12px; background: rgba(0, 0, 0, 0.22); border-radius: 2px; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4); }
  .pp-sbar > i:first-child { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink-soft); border-radius: 0 3px 3px 0; }
  .pp-sb-season { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--ink); }
  .pp-sops { text-align: right; color: var(--ink); }
  .pp-ssample { text-align: right; color: var(--ink-soft); font-size: 10.5px; white-space: nowrap; }

  .pp-chart { position: relative; }
  .pp-chart.is-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .pp-chart svg { display: block; width: 100%; height: auto; }
  .pp-chart-hit { cursor: crosshair; touch-action: pan-x; }
  .pp-chart-tip {
    position: absolute;
    top: 4px;
    transform: translateX(-50%);
    pointer-events: none;
    white-space: nowrap;
    padding: 5px 8px;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 11px;
    line-height: 1.35;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .pp-chart-tip.is-on { opacity: 1; }

  /* The spray chart on a hitter's profile Splits tab -- reuses the same
     .spray-card/.spray-header/.spray-legend look as the Scorecard tab's
     per-game chart, but capped to a max-width and centered so it doesn't
     blow up to the full width of the sheet on a wide screen. */
  .player-spray-section { margin-top: 4px; }
  .player-spray-section .spray-card { max-width: 420px; margin: 0 auto; }
  .player-spray-section .spray-card > svg { max-width: 320px; }
  table.pitch-table { width: 100%; border-collapse: collapse; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 12px; }
  table.pitch-table th {
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: left;
    padding: 3px 6px;
    border-bottom: 1px solid var(--ink);
  }
  table.pitch-table td {
    padding: 4px 6px;
    border-bottom: 1px solid var(--paper-line);
    color: var(--ink);
  }
  table.pitch-table td.pnum { color: var(--ink-soft); width: 20px; }
  table.pitch-table td.pcount { color: var(--ink-soft); white-space: nowrap; }
  table.pitch-table td.pspeed { color: var(--ink-soft); white-space: nowrap; }
  .pitch-result-ball { color: #7fae8f; font-weight: 600; }
  .pitch-result-strike { color: var(--brick-text); font-weight: 600; }
  /* A hit is earned gold; a foul is just a foul (the Two Golds Rule). */
  .pitch-result-hit { color: var(--gold); font-weight: 600; }
  .pitch-result-foul { color: var(--ink); font-weight: 600; }
  .pitch-result-out { color: #a39d90; font-weight: 700; }
  .pitch-result-hbp { color: #7fae8f; font-weight: 700; font-style: italic; }
  table.pitch-table tr.hl td { background: rgba(217, 169, 26, 0.14); }
  table.pitch-table tr.challenged td { border-bottom-style: dashed; }
  .abs-tag {
    display: inline-block;
    font-family: 'Overpass', sans-serif;
    font-weight: 700;
    font-size: 8.5px;
    letter-spacing: 0.04em;
    color: var(--paper);
    background: var(--ink);
    border-radius: 3px;
    padding: 1px 4px;
    vertical-align: middle;
    margin-left: 4px;
  }
  .pitch-event-tag.challenge-tag { border-style: dashed; }
  .pitch-event-tag.challenge-tag .abs-tag { margin-left: 0; margin-right: 5px; }
  .loc-section { margin-top: 0; }
  .loc-plot-wrap { display: flex; justify-content: center; }
  .loc-plot-wrap svg { display: block; }
  .loc-dot {
    cursor: pointer;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.1s ease;
  }
  /* Scaling the whole marker (rather than recoloring its stroke) highlights
     it on hover without disturbing a hollow marker's hue, which lives in
     the stroke itself. */
  .loc-dot.hl { transform: scale(1.25); }
  .loc-dot-glow {
    transform-box: fill-box;
    transform-origin: center;
    pointer-events: none;
    animation: locDotGlow 0.8s ease-out forwards;
  }
  @keyframes locDotGlow {
    0% { transform: scale(1); opacity: 0.9; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .loc-dot-glow { animation: none; opacity: 0; }
  }
  .pitch-final-desc {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1.5px solid var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.5;
  }
  .pitch-empty { font-family: 'Overpass', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.01em; color: var(--ink-soft); padding: 6px 0; }
  .pitch-events { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .pitch-event-tag {
    font-family: 'Overpass', sans-serif;
    font-weight: 600;
    font-size: 10.5px;
    font-style: italic;
    color: var(--ink-soft);
    background: rgba(243, 236, 219, 0.08);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 2px 7px;
  }

  @media (max-width: 520px) {
    .sheet { padding: 14px; }
    .score-bottom-bar { padding-left: 14px; padding-right: 14px; }
    /* Reclaims width for the Green Monster box score in the Game Summary
       modal (and every other .pitch-modal) -- on a narrow phone the default
       20px overlay inset + 18px modal padding left just barely too little
       room for a full 9-inning .monster-panel, tripping its own
       overflow-x: auto for a sliver of scrollbar. */
    .pitch-overlay { padding: 10px; }
    .pitch-modal { padding: 12px; }
    .standings-grid { grid-template-columns: minmax(0, 1fr); }
    .pb-leagues { grid-template-columns: minmax(0, 1fr); }
    .roster-columns { flex-direction: column; gap: 14px 0; }
    .calendar-day { min-height: 42px; padding: 2px 1px; }
    .cal-game-opp { font-size: 16px; margin-top: 2px; }
    .cal-daynum { font-size: 7px; }
    .calendar-day.is-dh .cal-game-opp { font-size: 12px; margin-top: 1px; }
  }
  /* A phone held sideways: too short for a sticky header and a fixed
     board both, so they scroll with the page and the card gets the height.
     The board lands after the card. */
  @media (max-height: 500px) and (max-width: 1099px) {
    .tab-header { position: static; box-shadow: none; }
    .score-bottom-bar { position: static; margin: 18px -18px -18px; box-shadow: none; }
    #mlbBody { padding-bottom: 0; }
  }
</style>
</head>
<body>
<div id="mlb-root">
  <div class="tab-header">
    <div class="tab-bar-row">
    <div class="tab-bar">
      <button type="button" class="tab-btn active" data-tab="scorecard">Scorecard</button>
      <button type="button" class="tab-btn" data-tab="daily">Highlights</button>
      <button type="button" class="tab-btn" data-tab="standings">Standings</button>
      <button type="button" class="tab-btn" data-tab="team">Team</button>
      <button type="button" class="tab-btn" data-tab="players">Players</button>
    </div>
    <label class="my-team" title="Your team">
      <span class="my-team-mark" id="myTeamMark"></span>
      <select id="myTeamPick" aria-label="Your team"></select>
    </label>
    </div>
    <div class="mlb-controls" data-tab-controls="scorecard">
      <div class="date-nav date-nav-stacked">
        <div class="date-display">
          <input type="date" class="date-display-input" id="datePick" />
          <span class="date-display-text date-display-text-cal" id="datePickText"></span>
        </div>
        <div class="date-nav-arrows">
          <button type="button" class="date-nav-btn" id="datePrev" aria-label="Previous day">&#8249;</button>
          <button type="button" class="date-nav-btn" id="dateNext" aria-label="Next day">&#8250;</button>
        </div>
      </div>
      <div class="game-strip-wrap">
        <div class="game-strip" id="gameStrip"></div>
      </div>
    </div>
    <div class="mlb-controls" data-tab-controls="daily" hidden>
      <div class="date-nav">
        <button type="button" class="date-nav-btn" id="dailyDatePrev" aria-label="Previous day">&#8249;</button>
        <div class="date-display">
          <input type="date" class="date-display-input" id="dailyDatePick" />
          <span class="date-display-text" id="dailyDatePickText"></span>
        </div>
        <button type="button" class="date-nav-btn" id="dailyDateNext" aria-label="Next day">&#8250;</button>
      </div>
    </div>
    <div class="mlb-controls" data-tab-controls="standings" hidden>
      <select id="standingsYearPick" aria-label="Season"></select>
      <div class="view-toggle" id="standingsViewToggle">
        <button type="button" class="view-toggle-btn active" data-view="division">Division</button>
        <button type="button" class="view-toggle-btn" data-view="wildcard">Wild Card</button>
        <button type="button" class="view-toggle-btn" data-view="postseason">Playoffs</button>
      </div>
    </div>
    <div class="mlb-controls" data-tab-controls="team" hidden>
      <select id="teamTabPick" aria-label="Team"></select>
      <select id="teamYearPick" aria-label="Season"></select>
      <div class="view-toggle" id="teamViewToggle">
        <button type="button" class="view-toggle-btn active" data-view="overview">Overview</button>
        <button type="button" class="view-toggle-btn" data-view="schedule">Schedule</button>
        <button type="button" class="view-toggle-btn" data-view="roster">Roster</button>
        <button type="button" class="view-toggle-btn" data-view="stats">Stats</button>
      </div>
    </div>
    <div class="mlb-controls" data-tab-controls="players" hidden>
      <div class="player-search-wrap">
        <input type="text" id="playerSearchInput" placeholder="Search players&#8230;" autocomplete="off">
        <div id="playerSearchResults" class="player-search-results" hidden></div>
      </div>
      <div class="view-toggle" id="playerListViewToggle">
        <button type="button" class="view-toggle-btn active" data-view="batting">Batters</button>
        <button type="button" class="view-toggle-btn" data-view="pitching">Pitchers</button>
      </div>
    </div>
  </div>
  <div class="tab-panel" data-tab-panel="scorecard" id="scorecardPanel">
    <div class="scorecard-layout">
      <div id="scLive" class="sr-only" aria-live="polite"></div>
      <div id="mlbBody" class="scorecard-main">
        <div class="mlb-status-msg">Loading today's schedule&#8230;</div>
      </div>
      <!-- Wide-screen-only companion column -- see .scorecard-sidebar. Empty
           and inert (display: none) below the width breakpoint, so it costs
           nothing on mobile. -->
      <div class="scorecard-sidebar" id="scorecardSidebar">
        <div id="sidebarMonsterPanel"></div>
        <div id="sidebarAtBat" class="sidebar-atbat"></div>
      </div>
    </div>
  </div>
  <div class="tab-panel" data-tab-panel="daily" id="dailyPanel" hidden>
    <div id="dailyBody">
      <div class="mlb-status-msg">Loading today's highlights&#8230;</div>
    </div>
  </div>
  <div class="tab-panel" data-tab-panel="standings" id="standingsPanel" hidden>
    <div id="standingsBody">
      <div class="mlb-status-msg">Loading standings&#8230;</div>
    </div>
  </div>
  <div class="tab-panel" data-tab-panel="team" id="teamPanel" hidden>
    <div id="teamBody">
      <div class="mlb-status-msg">Loading team&#8230;</div>
    </div>
  </div>
  <div class="tab-panel" data-tab-panel="players" id="playersPanel" hidden>
    <div id="playersBody">
      <div class="mlb-status-msg">Search for a player above to see their profile.</div>
    </div>

  <div class="score-bottom-bar" id="scoreBottomBar" data-tab-controls="scorecard" hidden></div>
  <div id="pitchOverlay" class="pitch-overlay">
    <div class="pitch-modal">
      <button id="pitchClose" class="pitch-close" aria-label="Close">&#10005;</button>

  <div id="rosterOverlay" class="pitch-overlay">
    <div class="pitch-modal">
      <button id="rosterClose" class="pitch-close" aria-label="Close">&#10005;</button>
      <div id="rosterModalBody"></div>
    </div>
  </div>
  <div id="playerOverlay" class="pitch-overlay">
    <div class="pitch-modal">
      <button id="playerClose" class="pitch-close" aria-label="Close">&#10005;</button>
      <div id="playerModalBody"></div>
    </div>
  </div>
  <div id="gameSummaryOverlay" class="pitch-overlay">
    <div class="pitch-modal">
      <button id="gameSummaryClose" class="pitch-close" aria-label="Close">&#10005;</button>
      <div id="gameSummaryModalBody"></div>
    </div>
  </div>
  <div id="teamChartOverlay" class="pitch-overlay">
    <div class="pitch-modal">
      <button id="teamChartClose" class="pitch-close" aria-label="Close">&#10005;</button>
      <div id="teamChartModalBody"></div>
    </div>
  </div>
  <div id="gameStripOverlay" class="pitch-overlay">
    <div class="pitch-modal">
      <button id="gameStripOverlayClose" class="pitch-close" aria-label="Close">&#10005;</button>
      <div id="gameStripOverlayBody"></div>
    </div>
  </div>
  <div id="clipOverlay" class="pitch-overlay">
    <div class="pitch-modal">
      <button id="clipClose" class="pitch-close" aria-label="Close">&#10005;</button>
      <div id="clipModalBody"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const dateInput = document.getElementById('datePick');
  const dateInputText = document.getElementById('datePickText');
  const gameStrip = document.getElementById('gameStrip');
  // The non-scrolling wrapper the edge fade (see .game-strip-wrap in the
  // CSS) is pinned against -- kept as its own reference rather than
  // gameStrip.parentElement so a later markup change can't silently break it.
  const gameStripWrap = gameStrip.parentElement;
  const gameStripOverlay = document.getElementById('gameStripOverlay');
  const gameStripOverlayBody = document.getElementById('gameStripOverlayBody');
  const gameStripOverlayClose = document.getElementById('gameStripOverlayClose');
  let currentGamePk = null;
  let scheduleGames = [];
  const body = document.getElementById('mlbBody');
  const scoreBottomBar = document.getElementById('scoreBottomBar');
  const sidebarMonsterPanel = document.getElementById('sidebarMonsterPanel');
  const sidebarAtBatEl = document.getElementById('sidebarAtBat');
  const standingsBody = document.getElementById('standingsBody');
  const standingsYearSelect = document.getElementById('standingsYearPick');
  const dailyBody = document.getElementById('dailyBody');
  const dailyDateInput = document.getElementById('dailyDatePick');
  const dailyDateInputText = document.getElementById('dailyDatePickText');
  // input[type=date]'s own displayed text follows the browser/OS locale
  // (MM/DD/YYYY, DD/MM/YYYY, ...) with no way to restyle it -- see
  // .date-display's comment. Every one of the three date pickers pairs its
  // real (invisible) input with a .date-display-text span kept in sync via
  // this, rather than each tab reimplementing the same "Aug 23" formatting.
  // The invisible input stretched over .date-display is mostly its
  // month/day/year segments, and on desktop Chromium a click there only
  // focuses a segment -- the picker opens solely from the calendar icon at
  // the input's far right edge, so most clicks on the date did nothing.
  // showPicker() opens it wherever the click lands. It throws without user
  // activation or inside a cross-origin iframe, and older browsers lack it;
  // either way the native click behavior is still there to fall back on.
  [dateInput, dailyDateInput].forEach(input => {
    input.addEventListener('click', () => {
      if (typeof input.showPicker !== 'function') return;
      try { input.showPicker(); } catch (e) {}
    });
  });
  function formatShortDate(dateStr) {
    return new Date(dateStr + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }
  // The Scorecard tab's .datePickText carries .date-display-text-cal (see
  // its CSS) and renders as a small month over a big day number instead of
  // the other tabs' plain one-line pill.
  function renderDateText(textEl, dateStr) {
    if (!textEl.classList.contains('date-display-text-cal')) {
      textEl.textContent = formatShortDate(dateStr);
      return;
    }
    const d = new Date(dateStr + 'T00:00:00Z');
    const month = d.toLocaleDateString(undefined, { month: 'short', timeZone: 'UTC' });
    const day = d.toLocaleDateString(undefined, { day: 'numeric', timeZone: 'UTC' });
    textEl.innerHTML = `<span class="cal-month">${month}</span><span class="cal-day">${day}</span>`;
  }
  function setDateInputValue(input, textEl, value) {
    input.value = value;
    renderDateText(textEl, value);
  }
  // The live game's poll, re-armed by fetchAndRender once each fetch has
  // settled (scheduleLivePoll) rather than on a fixed setInterval: with a
  // fixed interval, a fetch slower than the interval (a late-game feed on
  // stadium signal) was superseded by the next tick's requestId before it
  // could render, so on a slow enough connection nothing ever rendered.
  let pollTimer = null;
  const LIVE_POLL_MS = 7000;
  // A tick that comes due while the Scorecard isn't on screen (another tab,
  // or the app in the background) stops here instead of fetching ~150 KB to
  // redraw a hidden grid; resumeScorecardPolls picks it back up.
  let scorecardPollPaused = false;
  let gameStripPollPaused = false;
  // `${gamePk}|${metaData.timeStamp}` of the feed on screen -- a poll whose
  // feed carries the same stamp has nothing new and skips the parse and
  // redraw. Cleared whenever the grid is replaced by anything else.
  let renderedFeedKey = null;
  let renderedFeedLive = false;
  let lastFeedOkAt = null;
  // Self-rescheduling (not setInterval) so a fresh call -- whether from the
  // user changing dates or the poll tick itself -- can always cancel
  // whatever's pending with one clearTimeout at the top, with no risk of a
  // stale date's cycle silently surviving a race with a newer one.
  let dailyPollTimer = null;

      let m;
      re.lastIndex = 0;
      while ((m = re.exec(desc)) !== null) found.push({ idx: m.index, num });
    });
    found.sort((a, b) => a.idx - b.idx);
    const seq = [];
    found.forEach(f => { if (seq[seq.length - 1] !== f.num) seq.push(f.num); });
    return seq;
  }

  function baseLabel(code) {
    if (code === '1B') return '1';
    if (code === '2B') return '2';
    if (code === '3B') return '3';
    return null;
  }

  function reachedBase(event) {
    if (event === 'Single') return 1;
    if (event === 'Double') return 2;
    if (event === 'Triple') return 3;
    if (event === 'Home Run') return 4;
    if (['Walk','Intent Walk','Hit By Pitch','Fielders Choice','Field Error','Catcher Interference'].includes(event)) return 1;
    return 0;
  }

  function getPlayCode(play) {
    const event = (play.result && play.result.event) || '';
    const seq = getFielderSequence(play);
    const seqStr = seq.join('·');

    const simple = {
      'Single':'1B','Double':'2B','Triple':'3B','Home Run':'HR',
      'Walk':'BB','Intent Walk':'IBB','Hit By Pitch':'HBP',
      'Strikeout':'K','Strikeout Double Play':'K',
      'Field Error': seqStr ? 'E' + seqStr : 'E',
      'Catcher Interference':'CI'
    };
    if (simple[event]) return simple[event];

    let prefix = '';
    if (/Fly/.test(event)) prefix = 'F';
    else if (/Line/.test(event)) prefix = 'L';
    else if (/Pop/.test(event)) prefix = 'P';
    else if (/Ground/.test(event)) prefix = 'G';
    else if (/Forceout/.test(event)) prefix = 'FO';
    else if (/Sac Fly/.test(event)) prefix = 'SF';
    else if (/Sac Bunt/.test(event)) prefix = 'SH';
    else if (/Fielders Choice/.test(event)) prefix = 'FC';
    else if (/Grounded Into DP|Double Play/.test(event)) prefix = 'DP';
    else if (/Triple Play/.test(event)) prefix = 'TP';

    if (prefix) return seq.length > 1 ? seqStr : prefix + seqStr;
    if (!event) return '';
    return event.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 3);
  }

  // Even dominant-baseline="central" doesn't land Overpass 800's cap-height
  // dead center by default -- CSS/SVG baseline keywords approximate a
  // font's metrics, they don't guarantee a specific glyph's ink is
  // symmetric around them. y="10.75" (not the geometric y="10.5", which is
  // the circle's own cy) is an empirically measured value, not a formula:
  // it's specific to this exact font+weight+size (remeasured each time this
  // has resized -- 20px/font-size 11, then 23px/font-size 13, now 21px/
  // font-size 12 -- and the offset has never scaled proportionally between
  // sizes, confirming step 3 below can't be skipped by just scaling the old
  // offset).
  //
  // If you resize this ring/font, remeasure rather than eyeballing it or
  // guessing a new offset:
  //   1. Render just the <text> (no circle) at the new size, at some
  //      candidate y, on its own small page.
  //   2. Screenshot it and scan pixel rows for the glyph's ink color to
  //      find its actual top/bottom -- i.e. its true rendered bounding box,
  //      not the box CSS/SVG claims it occupies.
  //   3. delta = target_center_y - ((ink_top + ink_bottom) / 2); the
  //      relationship is linear in y, so one measurement gives you the
  //      exact new y (candidate_y + delta) -- no need to iterate.
  //   4. Re-render at that y to confirm the ink center lands on the
  //      circle's cy before shipping it.
  // This is what caught the original bug: both plain CSS line-height
  // centering and SVG's dominant-baseline="central" looked plausible but
  // were both measurably off -- only checking actual rendered pixels
  // caught it.
  function hitRingSVG() {
    const { ink } = PALETTE;
    return `<svg width="21" height="21" viewBox="0 0 21 21" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="8.95" fill="none" stroke="${ink}" stroke-width="1.6"/>
      <text x="10.5" y="10.75" text-anchor="middle" dominant-baseline="central"
        font-family="Overpass, sans-serif" font-weight="800" font-size="12" fill="${ink}">H</text>
    </svg>`;
  }

  function diamondSVG(reached, scored, code, isOut, outEdge, specialEdges, ghostStart, calledLooking) {
    const dim = 'rgba(243,236,219,0.22)';
    const { ink, gold, brick } = PALETTE;
    const paper = '#3b4336';
    const isHR = code === 'HR';
    const isK = code === 'K';
