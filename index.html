      const stats = league.stats.filter(r => Number(r.player_id) === personId);
      const moves = league.movement.filter(r => Number(r.pitcher_id) === personId);
      const usage = {};
      stats.forEach(r => { usage[r.pitch_type] = csvNumber(r.pitch_usage) || 0; });
      out.fastballs = moves
        .filter(r => ARSENAL_FASTBALLS.includes(r.pitch_type) && (usage[r.pitch_type] || 0) >= 10 && csvNumber(r.avg_speed) != null)
        .sort((a, b) => usage[b.pitch_type] - usage[a.pitch_type])
        .map(r => {
          const mph = csvNumber(r.avg_speed);
          const pool = pools[r.pitch_type];
          return { code: r.pitch_type, mph, pct: pool ? poolPercentile(mph, pool.velo, { inPool: false }) : null };
        });
      // Savant gives horizontal break as a size; its direction is the pitch
      // type's league-average direction (negative = arm side).
      out.movement = moves
        .filter(r => (usage[r.pitch_type] || 0) >= 2 && csvNumber(r.pitcher_break_z_induced) != null && csvNumber(r.pitcher_break_x) != null)
        .map(r => ({ code: r.pitch_type, usage: usage[r.pitch_type], ivb: csvNumber(r.pitcher_break_z_induced), hb: csvNumber(r.pitcher_break_x), arm: csvNumber(r.league_break_x) < 0 }))
        .sort((a, b) => b.usage - a.usage);
      if (log) {
        const total = { L: 0, R: 0 };
        const per = {};
        log.forEach(p => {
          if (p.side !== 'L' && p.side !== 'R') return;
          total[p.side]++;
          const x = per[p.t] || (per[p.t] = { n: 0, L: { n: 0, rv: 0 }, R: { n: 0, rv: 0 } });
          x.n++; x[p.side].n++; x[p.side].rv += p.rv;
        });
        out.pitches = Object.keys(per).sort((a, b) => per[b].n - per[a].n).map(t => {
          const sides = {};
          ['L', 'R'].forEach(h => {
            const s = per[t][h];
            const pool = pools[t];
            sides[h] = {
              use: total[h] ? (100 * s.n) / total[h] : 0,
              pct: pool && s.n >= ARSENAL_SIDE_MIN ? poolPercentile((100 * s.rv) / s.n, pool.rv, { inPool: false }) : null
            };
          });
          return { code: t, sides };
        }).filter(x => Math.max(x.sides.L.use, x.sides.R.use) >= 1);
        out.twoStrikes = { L: buildTwoStrikes(log, 'L', pools), R: buildTwoStrikes(log, 'R', pools) };
        out.faced = total;
      }
    }
    return out;
  }

  function arsenalScore(pct, cls) {
    if (pct == null) return `<span class="${cls} is-none">&#8212;</span>`;
    return `<span class="${cls}${pct >= SKILL_GOLD_PERCENTILE ? ' is-top' : ''}">${pct}</span>`;
  }
  const pitchChip = t => `<span class="ars-chip">${pitchShort(t)}</span>`;

  // Catcher's view, true to the pitcher's hand: a righty's arm-side pitches
  // break toward third base (left), a lefty's toward first. Rings every 6
  // inches of break.
  function renderArsenalMovement(points, hand) {
    const size = 300, c = size / 2, R = 24, k = (size / 2 - 30) / R;
    const righty = hand !== 'L';
    const rings = [6, 12, 18, 24].map(r => `<circle cx="${c}" cy="${c}" r="${r * k}" class="ars-ring"/>`).join('');
    const axes = `<line x1="${c}" y1="22" x2="${c}" y2="${size - 22}" class="ars-ring"/><line x1="22" y1="${c}" x2="${size - 22}" y2="${c}" class="ars-ring"/>`;
    const labels = `<text x="4" y="${size - 6}" class="ars-ax">3B SIDE</text><text x="${size - 4}" y="${size - 6}" text-anchor="end" class="ars-ax">1B SIDE</text>
      <text x="4" y="12" class="ars-ax">RISE &#8593;</text><text x="${size - 4}" y="12" text-anchor="end" class="ars-ax">CATCHER&#8217;S VIEW</text>`;
    const clamp = v => Math.max(-R - 2, Math.min(R + 2, v));
    const dots = points.map(p => {
      const towardThird = p.arm === righty;
      const x = c + clamp(towardThird ? -p.hb : p.hb) * k;
      const y = c - clamp(p.ivb) * k;
      const r = 10 + Math.sqrt(p.usage) * 1.5;
      return `<g><title>${pitchName(p.code)}: ${p.ivb.toFixed(1)} in rise, ${p.hb.toFixed(1)} in break</title><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" class="ars-dot"/><text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" class="ars-code">${pitchShort(p.code)}</text></g>`;
    }).join('');
    return `<svg viewBox="0 0 ${size} ${size}" class="ars-plot" role="img" aria-label="Pitch movement">${rings}${axes}${labels}${dots}</svg>`;
  }

  // Usage bars run outward from the pitch name, lefties to the left and
  // righties to the right, each side's run-value score beside the name; a
  // bar turns gold where its score does.
  function renderArsenalMix(pitches) {
    const top = Math.max(...pitches.map(x => Math.max(x.sides.L.use, x.sides.R.use)));
    const bar = (s, left) => {
      if (Math.round(s.use) === 0) return `<span class="ars-mx-${left ? 'l' : 'r'}"></span>`;
      const gold = s.pct != null && s.pct >= SKILL_GOLD_PERCENTILE ? ' is-top' : '';
      const i = `<i class="${gold.trim()}" style="width:calc((100% - 32px) * ${(s.use / top).toFixed(3)})"></i>`;
      const em = `<em>${Math.round(s.use)}%</em>`;
      return `<span class="ars-mx-${left ? 'l' : 'r'}"><span class="ars-trk">${left ? em + i : i + em}</span></span>`;
    };
    const rows = pitches.map(x => `<div class="ars-mx">${bar(x.sides.L, true)}${arsenalScore(x.sides.L.pct, 'ars-sc')}<span class="ars-mx-n">${pitchName(x.code)}</span>${arsenalScore(x.sides.R.pct, 'ars-sc')}${bar(x.sides.R, false)}</div>`).join('');
    return `<div class="ars-mx ars-mx-h"><span class="ars-mx-l">vs LHB</span><span></span><span></span><span></span><span class="ars-mx-r">vs RHB</span></div>${rows}`;
  }

  function renderArsenalTwoStrikes(ts, side) {
    const toggle = `<div class="ars-tg" role="group" aria-label="Batter side">${[['L', 'vs LHB'], ['R', 'vs RHB']].map(([h, label]) =>
      `<button type="button" data-ars-side="${h}" aria-pressed="${h === side}">${label}</button>`).join('')}</div>`;
    if (!ts.n) return `${toggle}<div class="pitch-empty">No two-strike pitches ${side === 'L' ? 'to lefties' : 'to righties'}.</div>`;
    const rows = ts.pays.map(p => `<div class="ars-ts">${p.setup ? pitchChip(p.setup) : '<span></span>'}<span class="ars-arrow">&#8594;</span><span class="ars-ts-n">${pitchName(p.code)}</span><span class="ars-ts-v">${Math.round(p.share)}%</span>${arsenalScore(p.score, 'ars-ts-sc')}</div>`).join('');
    const full = ts.full ? `<div class="ars-fc-h"><span>Full count</span><span class="ars-fc-cols"><span>Before</span><span></span><span>Full</span></span></div>
      ${ts.full.rows.map(r => `<div class="ars-fc"><span class="ars-ts-n">${pitchName(r.code)}</span><span class="ars-fc-pre">${Math.round(r.before)}%</span><span class="ars-arrow">&#8594;</span><span class="ars-fc-v${r.up ? ' is-up' : ''}">${Math.round(r.full)}%</span></div>`).join('')}
      <div class="ars-foot">${ts.full.n} full-count pitches</div>` : '';
    return `${toggle}<div class="ars-ts ars-ts-h"><span>Setup</span><span></span><span>Pitch</span><span>Thrown</span><span>Put away</span></div>${rows}${full}`;
  }

  function renderProfileArsenal() {
    if (Number(lastProfileSeason) < ARSENAL_FIRST_SEASON) return `<div class="pitch-empty">Pitch-by-pitch data starts in ${ARSENAL_FIRST_SEASON}.</div>`;
    const a = lastProfileArsenal;
    if (!a || a.league === undefined) return '<div class="mlb-status-msg">Loading pitches&#8230;</div>';
    if (a.league === null) return apiErrorMsg('pitch data');
    if (!a.movement.length) return `<div class="pitch-empty">No ${lastProfileSeason} pitch data.</div>`;
    const head = (title, note) => `<div class="pp-skg-head"><span>${title}</span>${note ? `<em>${note}</em>` : ''}</div>`;
    const velo = a.fastballs.length ? `<section class="pp-skg ars-velo">${head('Fastball velo', 'vs pitches of the same type')}
      <div class="pp-skg-row" style="grid-template-columns:repeat(${Math.max(3, a.fastballs.length)},minmax(0,1fr))">${a.fastballs.map(f =>
        `<div class="pp-sk"><span class="pp-sk-name">${pitchName(f.code)}</span>${f.pct == null ? '<span class="pp-sk-score is-none">&#8212;</span>' : `<span class="pp-sk-score${f.pct >= SKILL_GOLD_PERCENTILE ? ' is-top' : ''}">${f.pct}</span>`}<span class="pp-sk-stat">${f.mph.toFixed(1)} mph</span></div>`).join('')}</div></section>` : '';
    const movement = `<section class="pp-skg">${head('Movement', 'inches of break')}${renderArsenalMovement(a.movement, a.hand)}</section>`;
    let right;
    if (a.log === undefined) right = '<div class="mlb-status-msg">Loading his pitches&#8230;</div>';
    else if (a.log === null) right = apiErrorMsg('pitch-by-pitch data');
    else {
      const side = profileArsenalSide || (a.faced.L > a.faced.R ? 'L' : 'R');
      const ts = a.twoStrikes[side];
      right = `<section class="pp-skg">${head('Pitches', 'score: run value vs same type')}${renderArsenalMix(a.pitches)}</section>
        <section class="pp-skg">${head('With two strikes', ts.n ? `${ts.n} pitches &#183; ${ts.k} K` : '')}${renderArsenalTwoStrikes(ts, side)}</section>`;
    }
    return `<div class="ars"><div class="ars-col">${velo}${movement}</div><div class="ars-col">${right}</div></div>`;
  }

  // ---- Game Log ----
  // The tab leads with the last five games in scorecard terms, then the
  // full season grouped by month. Zeros are left blank throughout, so the
  // games where something happened (a homer, a walk, an earned run) are
  // the ones that carry ink.

  // Play-by-play for one game, fetched only for the five games the Game
  // Log leads with, and only once that tab is opened. A finished game
  // never changes, so it's cached; a game still in progress isn't.
  const gamePlayByPlayCache = {};
  async function getGamePlayByPlay(gamePk, isFinal) {
    if (gamePlayByPlayCache[gamePk]) return gamePlayByPlayCache[gamePk];
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/game/${gamePk}/playByPlay`);
      if (!res.ok) return null;
      const data = await res.json();
      const plays = data.allPlays || [];
      if (isFinal) gamePlayByPlayCache[gamePk] = plays;
      return plays;
    } catch (e) {
      return null;
    }
  }

  // One batter's plate appearances in a game, each as the same cell the
  // scorecard grid draws (see buildTeamRows): his result code, his RBIs,
  // and his own trip around the bases afterward -- how far he got, whether
  // he scored, and any steal/caught-stealing/pickoff along the way, read
  // from every later play in that half-inning that moved him. Other
  // runners' movement on his plate appearance isn't drawn; his RBI dots
  // already say what it produced.
  function buildBatterGameCells(allPlays, playerId) {
    const cells = [];
    allPlays.forEach(play => {
      const about = play.about || {};
      const event = (play.result && play.result.event) || '';
      const isAtBat = play.result && play.result.type === 'atBat';
      const batterId = play.matchup && play.matchup.batter && play.matchup.batter.id;
      if (isAtBat && batterId === playerId && event && !NON_RESULT_EVENT_RE.test(event)) {
        const rb = reachedBase(event);
        cells.push({
          inning: about.inning, half: about.halfInning, code: getPlayCode(play), reached: rb, scored: rb === 4,
          isOut: rb === 0, outEdge: null, specialEdges: [], calledLooking: isCalledStrikeout(play),
          rbi: (play.result && play.result.rbi) || 0
        });
      }
      const cell = cells[cells.length - 1];
      if (!cell || cell.inning !== about.inning || cell.half !== about.halfInning || cell.outEdge) return;
      (play.runners || []).forEach(rm => {
        const rid = rm.details && rm.details.runner && rm.details.runner.id;
        if (rid !== playerId || cell.outEdge) return;
        const end = rm.movement && rm.movement.end;
        const rmEvent = (rm.details && (rm.details.event || rm.details.eventType)) || '';
        const edge = { 1: 'first-second', 2: 'second-third', 3: 'third-home' }[cell.reached];
        if (rm.movement && rm.movement.isOut) {
          if (edge) {
            cell.outEdge = edge;
            const label = /caught stealing/i.test(rmEvent) ? 'CS' : /pickoff/i.test(rmEvent) ? 'PO' : null;
            if (label) cell.specialEdges.push({ edge, label });
          }
          return;
        }
        const advanceLabel =
          /stolen[\s_]?base/i.test(rmEvent) ? 'S' :
          /wild[\s_]?pitch/i.test(rmEvent) ? 'WP' :
          /passed[\s_]?ball/i.test(rmEvent) ? 'PB' :
          /balk/i.test(rmEvent) ? 'BK' : null;
        if (advanceLabel && edge) cell.specialEdges.push({ edge, label: advanceLabel });
        const base = { '1B': 1, '2B': 2, '3B': 3 }[end];
        if (end === 'score') { cell.reached = Math.max(cell.reached, 3); cell.scored = true; }
        else if (base) cell.reached = Math.max(cell.reached, base);
      });
    });
    return cells;
  }

  // Final scores for every game in the log, keyed by gamePk -- read off
  // the team's season schedule (fetchTeamSchedule, shared with and cached
  // for the Schedule tab), one request per team he played for that season
  // rather than one per game.
  async function loadGameLogScores(gameLog, season) {
    const teamIds = Array.from(new Set(gameLog.map(g => g.team && g.team.id).filter(Boolean)));
    const schedules = await Promise.all(teamIds.map(id => fetchTeamSchedule(id, season)));
    const scores = {};
    schedules.forEach(sched => Object.values(sched.gamesByDate || {}).forEach(games => games.forEach(game => {
      if (game.homeScore != null && game.awayScore != null) scores[game.gamePk] = { home: game.homeScore, away: game.awayScore };
    })));
    return scores;
  }

  // The scores, plus (for hitters) each of the last five games'
  // play-by-play for the diamonds -- pitchers' cards are box-score numbers
  // the game log already has.
  async function loadProfileRecent(personId, pitcher, gameLog, season, requestId) {
    const games = gameLog.slice(0, 5);
    const today = todayStr();
    const [scores, plays] = await Promise.all([
      loadGameLogScores(gameLog, season),
      pitcher ? Promise.resolve([]) : Promise.all(games.map(g => (g.game && g.game.gamePk ? getGamePlayByPlay(g.game.gamePk, g.date < today) : Promise.resolve(null))))
    ]);
    if (requestId !== playerProfileRequestId) return;
    lastProfileScores = scores;
    lastProfileRecent = games.map((g, i) => ({ log: g, cells: !pitcher && plays[i] ? buildBatterGameCells(plays[i], personId) : null }));
    rerenderPlayerProfile();
  }

  const blank = v => (v ? v : '');
  // "W 7-3", his team's score first.
  const teamResult = (g, score) => {
    if (g.isWin == null) return '';
    const runs = score ? (g.isHome ? `${score.home}-${score.away}` : `${score.away}-${score.home}`) : '';
    return `<span class="pp-wl ${g.isWin ? 'is-w' : 'is-l'}">${g.isWin ? 'W' : 'L'}${runs ? ` ${runs}` : ''}</span>`;
  };

  // Each card leads with its stat line in the header row (date, opponent,
  // team result, line), then the game itself: a hitter's plate
  // appearances as diamonds with an RBI dot per run driven in, or a
  // pitcher's line as big numbers in scoreboard slots.
  function renderRecentCard(entry, pitcher) {
    const g = entry.log, s = g.stat || {};
    const count = (n, label) => (n ? `${n > 1 ? n + ' ' : ''}${label}` : '');
    const line = pitcher ? '' : [`${s.hits ?? 0}-${s.atBats ?? 0}`, count(s.homeRuns, 'HR'), s.rbi ? `${s.rbi} RBI` : '', count(s.baseOnBalls, 'BB')].filter(Boolean).join(' &#183; ');
    const head = `<div class="pp-rc-head"><span class="pp-rc-date">${formatShortDate(g.date)}</span><span class="pp-rc-opp">${g.isHome ? 'vs' : '@'} ${teamNickname(g.opponent)}</span>${teamResult(g, lastProfileScores[g.game && g.game.gamePk])}${line ? `<span class="pp-rc-line">${line}</span>` : ''}</div>`;
    let body;
    if (!pitcher) {
      body = entry.cells && entry.cells.length
        ? `<div class="pp-rc-pas">${entry.cells.map(c => {
            const dots = c.rbi ? `<span class="pp-rc-rbi" aria-label="${c.rbi} RBI">${'<i></i>'.repeat(c.rbi)}</span>` : '';
            return `<span class="pp-rc-pa">${dots}${diamondSVG(c.reached, c.scored, c.code, c.isOut, c.outEdge, c.specialEdges, false, c.calledLooking)}<span class="pp-rc-inn">${c.inning}</span></span>`;
          }).join('')}</div>`
        : '';
    } else {
      const slots = [['IP', s.inningsPitched ?? '0.0'], ['H', s.hits ?? 0], ['ER', s.earnedRuns ?? 0], ['BB', s.baseOnBalls ?? 0], ['K', s.strikeOuts ?? 0], ['P', s.numberOfPitches ?? '&#8212;']];
      body = `<div class="pp-rc-nums">${slots.map(([k, v]) => `<span class="pp-rc-num"><span class="pp-rc-k">${k}</span><span class="pp-rc-v">${v}</span></span>`).join('')}</div>`;
    }
    const pk = g.game && g.game.gamePk;
    return pk
      ? `<button type="button" class="pp-rc pp-game-link-card" data-date="${g.date}" data-game-pk="${pk}">${head}${body}</button>`
      : `<div class="pp-rc">${head}${body}</div>`;
  }

  // Month groups for the full log, newest first -- March folds into
  // April, as on Splits. The group's header row carries its totals.
  function gameLogMonths(gameLog) {
    const groups = [];
    gameLog.forEach(g => {
      const m = g.date.slice(5, 7) === '03' ? '04' : g.date.slice(5, 7);
      let grp = groups[groups.length - 1];
      if (!grp || grp.m !== m) { grp = { m, games: [] }; groups.push(grp); }
      grp.games.push(g);
    });
    const hasMarch = gameLog.some(g => g.date.slice(5, 7) === '03');
    groups.forEach(grp => { grp.label = grp.m === '04' && hasMarch ? 'Mar/Apr' : MONTH_NAMES[Number(grp.m) - 1]; });
    return groups;
  }

  function renderProfileGameLog(gameLog, pitcher) {
    if (!gameLog.length) return '<div class="pitch-empty">No games this season.</div>';
    const recent = lastProfileRecent === undefined
      ? '<div class="mlb-status-msg">Loading recent games&#8230;</div>'
      : `<div class="pp-recent">${(lastProfileRecent || []).map(e => renderRecentCard(e, pitcher)).join('')}</div>`;
    const dateCell = g => g.game && g.game.gamePk
      ? `<button type="button" class="pp-game-link" data-date="${g.date}" data-game-pk="${g.game.gamePk}">${formatShortDate(g.date)}</button>`
      : formatShortDate(g.date);
    // Nickname on a wide sheet, abbreviation on a narrow one (see
    // .pp-opp-short) -- "@ Diamondbacks" plus a score won't fit a phone.
    const opp = g => `${g.isHome ? 'vs' : '@'} <span class="pp-opp-long">${teamNickname(g.opponent)}</span><span class="pp-opp-short">${teamAbbr(g.opponent)}</span>`;
    const wl = g => teamResult(g, lastProfileScores[g.game && g.game.gamePk]);
    const groups = gameLogMonths(gameLog);
    let head, row, total;
    if (!pitcher) {
      // 1B/2B/3B only on a wide sheet (see .pp-xbh) -- room the phone
      // doesn't have, and the hit breakdown the wide log otherwise lacked.
      const xbh = (label, v) => `<${label ? 'th' : 'td'} class="pp-xbh">${label || blank(v)}</${label ? 'th' : 'td'}>`;
      // SB as made/attempted (formatStolenBases), blank with no attempts.
      const sb = st => ((st.stolenBases || 0) + (st.caughtStealing || 0) ? formatStolenBases(st.stolenBases || 0, st.caughtStealing) : '');
      head = `<th>Date</th><th>Opp</th><th>Result</th><th>H-AB</th>${xbh('1B')}${xbh('2B')}${xbh('3B')}<th>HR</th><th>RBI</th><th>BB</th><th>K</th>${xbh('SB')}`;
      row = g => { const s = g.stat || {}; return `<tr><td>${dateCell(g)}</td><td class="pp-soft">${opp(g)}</td><td>${wl(g)}</td><td>${s.hits ?? 0}-${s.atBats ?? 0}</td>${xbh(null, (s.hits || 0) - (s.doubles || 0) - (s.triples || 0) - (s.homeRuns || 0))}${xbh(null, s.doubles)}${xbh(null, s.triples)}<td>${blank(s.homeRuns)}</td><td>${blank(s.rbi)}</td><td>${blank(s.baseOnBalls)}</td><td>${blank(s.strikeOuts)}</td><td class="pp-xbh">${sb(s)}</td></tr>`; };
      total = grp => { const t = sumStatLines(grp.games.map(g => g.stat || {})); const r = slashFromCounts(t); return `${grp.games.length} G &#183; ${r.avg} / ${r.obp} / ${r.slg}${t.homeRuns ? ` &#183; ${t.homeRuns} HR` : ''}`; };
    } else {
      head = '<th>Date</th><th>Opp</th><th>Result</th><th>IP</th><th>H</th><th>ER</th><th>BB</th><th>K</th><th>Pit</th>';
      row = g => { const s = g.stat || {}; return `<tr><td>${dateCell(g)}</td><td class="pp-soft">${opp(g)}</td><td>${wl(g)}</td><td>${s.inningsPitched ?? '0.0'}</td><td>${blank(s.hits)}</td><td>${blank(s.earnedRuns)}</td><td>${blank(s.baseOnBalls)}</td><td>${blank(s.strikeOuts)}</td><td class="pp-soft">${s.numberOfPitches ?? ''}</td></tr>`; };
      total = grp => { const t = sumStatLines(grp.games.map(g => g.stat || {})); return `${grp.games.length} G &#183; ${t.inningsPitched} IP &#183; ${formatERA(t.earnedRuns, ipToOuts(t.inningsPitched))} ERA &#183; ${t.strikeOuts} K`; };
    }
    const cols = pitcher ? 9 : 12;
    const body = groups.map(grp => `<tr class="pp-month"><td colspan="${cols}"><span class="pp-month-name">${grp.label}</span><span class="pp-month-total">${total(grp)}</span></td></tr>${grp.games.map(row).join('')}`).join('');
    return `<div class="pp-gl">${recent}
      <div class="pp-gl-log"><table class="pitch-table pp-table pp-log${pitcher ? ' is-pitcher' : ''}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
  }

  // ---- Splits ----
  // OPS only (opponents' OPS for a pitcher): one bar per split on a shared
  // scale, with a dashed mark at his full-season OPS so each split reads
  // as above or below his norm. PA (batters faced) stays as a small soft
  // count so a thin sample is visible. March is only the season's first
  // few days, so it folds into April as one Mar/Apr row (summed from
  // counting stats, see sumStatLines).
  //
  // The scale doesn't start at zero -- almost no split sits below .500,
  // so a zero-based bar spent half its length on nothing. A hitter's
  // starts at .500 (lower only if a split dips under it); a pitcher's,
  // whose opponents' OPS runs far lower, is fit to his own range. Both
  // ends are labelled under the bars, since a truncated bar's length is
  // only meaningful against them. A pitcher's scale runs high to low, so
  // for both a longer bar is the better split.
  const SPLIT_MONTHS = ['May', 'June', 'July', 'August', 'September'];
  function renderProfileSplits(splits, pitcher, seasonStat) {
    const marApr = [splits.March, splits.April].filter(Boolean);
    const groups = [
      ['Platoon', [[pitcher ? 'vs LHB' : 'vs LHP', splits['vs Left']], [pitcher ? 'vs RHB' : 'vs RHP', splits['vs Right']]]],
      ['By month', [['Mar/Apr', marApr.length ? sumStatLines(marApr) : null], ...SPLIT_MONTHS.map(m => [m, splits[m]])]]
    ].map(([name, rows]) => [name, rows.filter(([, st]) => st).map(([label, st]) => {
      const ops = slashFromCounts(st).ops;
      return { label, st, ops, value: Number(ops) || 0, sample: pitcher ? st.battersFaced : st.plateAppearances };
    })]).filter(([, rows]) => rows.length);
    if (!groups.length) return '<div class="pitch-empty">No splits this season.</div>';
    const seasonOps = seasonStat ? slashFromCounts(seasonStat).ops : null;
    const seasonValue = Number(seasonOps) || 0;
    const values = [...groups.flatMap(([, rows]) => rows.map(r => r.value)), ...(seasonValue ? [seasonValue] : [])];
    const fitLo = Math.max(0, Math.floor((Math.min(...values) - 0.05) * 10) / 10);
    const lo = pitcher ? fitLo : Math.min(0.5, fitLo);
    const hi = Math.max(lo + 0.3, Math.ceil((Math.max(...values) + 0.05) * 10) / 10);
    const pct = v => `${Math.max(0, Math.min(100, ((pitcher ? hi - v : v - lo) / (hi - lo)) * 100)).toFixed(1)}%`;
    const tick = v => formatRate(v, 1);
    const mark = seasonValue ? `<i class="pp-sb-season" style="left:${pct(seasonValue)}"></i>` : '';
    const sampleLabel = pitcher ? 'BF' : 'PA';
    return `<div class="pp-splits">
      <div class="pp-splits-head"><span>${pitcher ? 'Opponent OPS' : 'OPS'}</span>${seasonOps ? `<span class="pp-splits-key"><i></i>Season ${seasonOps}</span>` : ''}</div>
      ${groups.map(([name, rows]) => `<div class="pp-sgroup">
        <div class="pp-sgroup-name">${name}</div>
        ${rows.map(r => `<div class="pp-srow">
          <span class="pp-slabel">${r.label}</span>
          <span class="pp-sbar"><i style="width:${pct(r.value)}"></i>${mark}</span>
          <span class="pp-sops">${r.ops}</span>
          <span class="pp-ssample">${r.sample ?? 0} ${sampleLabel}</span>
        </div>`).join('')}
      </div>`).join('')}
      <div class="pp-srow pp-saxis" aria-hidden="true"><span></span><span class="pp-saxis-ends"><span>${tick(pitcher ? hi : lo)}</span><span>${tick(pitcher ? lo : hi)}</span></span><span></span><span></span></div>
    </div>`;
  }

  // ---- Starts chart ----
  // One column per start, oldest first: bar height is innings pitched
  // against a 6-inning guide, gold for a quality start (6+ IP, 3 or fewer
  // ER). Drawn at the sheet's real width (not a fixed viewBox scaled up),
  // so text and bars keep their size on a wide screen; on a narrow one
  // columns keep a readable minimum width and the chart scrolls sideways.
  function profileStarts(gameLog) {
    return gameLog.filter(g => g.stat && g.stat.gamesStarted).slice().reverse().map(g => {
      const outs = ipToOuts(g.stat.inningsPitched);
      const er = g.stat.earnedRuns || 0;
      return { date: g.date, opp: g.opponent, isHome: g.isHome, ip: g.stat.inningsPitched, outs, er, k: g.stat.strikeOuts || 0, qs: outs >= 18 && er <= 3 };
    });
  }
  function renderStartsChart(starts) {
    if (!starts.length) return '<div class="pitch-empty">No starts this season.</div>';
    const L = 40, R = 4, T = 10, PH = 190, AX = 18, MIN_COL = 20;
    // playersBody minus the sheet's own padding and border
    const avail = Math.max(240, playersBody.clientWidth - 40);
    const narrow = (avail - L - R) / starts.length < MIN_COL;
    const colW = narrow ? MIN_COL : Math.min(48, (avail - L - R) / starts.length);
    const W = L + R + colW * starts.length;
    const base = T + PH, H = base + AX;
    const maxIP = Math.max(9, Math.ceil(Math.max(...starts.map(s => s.outs)) / 3));
    const y = v => T + (1 - v / maxIP) * PH;
    const text = (x, yy, t, anchor, fill, weight) => `<text x="${x}" y="${yy}" text-anchor="${anchor}" fill="${fill}" font-size="10" font-family="Overpass" font-weight="${weight}">${t}</text>`;
    const ticks = [0, 3, 6, 9].filter(v => v <= maxIP);
    const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${PALETTE.paperLine}" stroke-width="1"/>${text(L - 6, y(v) + 3.5, v, 'end', PALETTE.inkSoft, 700)}`).join('');
    const bars = starts.map((s, i) => {
      const x0 = L + i * colW + 1.5, w = colW - 3, top = y(s.outs / 3);
      const r = Math.min(3, w / 2, base - top);
      return `<path d="M${x0},${base} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x0 + w - r} Q${x0 + w},${top} ${x0 + w},${top + r} V${base} Z" fill="${s.qs ? PALETTE.gold : PALETTE.startMuted}"/>`;
    }).join('');
    let lastMonth = '', lastX = -99;
    const months = starts.map((s, i) => {
      const m = s.date.slice(5, 7) === '03' ? '04' : s.date.slice(5, 7);
      if (m === lastMonth) return '';
      lastMonth = m;
      const x = L + i * colW;
      if (x - lastX < 30) return '';
      lastX = x;
      const name = i === 0 && starts[0].date.slice(5, 7) === '03' ? 'Mar/Apr' : MONTH_NAMES[Number(m) - 1].slice(0, 3);
      return text(x + 1.5, H - 3, name, 'start', PALETTE.inkSoft, 700);
    }).join('');
    const six = `<line x1="${L}" x2="${W - R}" y1="${y(6)}" y2="${y(6)}" stroke="${PALETTE.ink}" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>`;
    const ipY = T + PH / 2;
    const ipTitle = `<text x="10" y="${ipY}" transform="rotate(-90 10 ${ipY})" text-anchor="middle" fill="${PALETTE.ink}" font-size="10" font-family="Overpass" font-weight="800" letter-spacing="1.2">IP</text>`;
    const qsCount = starts.filter(s => s.qs).length;
    return `<div class="pp-chart${narrow ? ' is-scroll' : ''}">
      <svg viewBox="0 0 ${W} ${H}"${narrow ? ` style="width:${W}px"` : ''} role="img" aria-label="Innings pitched in each of ${starts.length} starts; ${qsCount} quality starts">
        ${ipTitle}${grid}${six}${bars}${months}
        <rect class="pp-chart-col" x="0" y="0" width="${colW}" height="${base}" fill="${PALETTE.ink}" opacity="0" pointer-events="none"/>
        <rect class="pp-chart-hit" x="${L}" y="0" width="${W - L - R}" height="${base}" fill="transparent" data-col-w="${colW}"/>
      </svg>
      <div class="pp-chart-tip" aria-hidden="true"></div>
    </div>`;
  }

  // ---- Defense (fielders, from Baseball Savant and the game feeds) ----
  // Savant serves its leaderboards and player pages with
  // Access-Control-Allow-Origin: *, so they're fetched straight from the
  // browser like the Stats API. Its numbers update overnight, never
  // mid-game, so a success is kept for the session; a failure isn't.
  const SAVANT = 'https://baseballsavant.mlb.com';
  // Which Defense tab a player gets, by his primary position's type: the
  // positions to compare at (Savant's own position codes, then the whole
  // group last), its board (OAA and FRV, or a catcher's FRV and its
  // parts -- catchers have no OAA), and what's below it: the outfield
  // catch board (catch stars are outfield only), or a season sweep of
  // his plays (getSeasonFieldingPlays) of that kind.
  const DEFENSE_GROUPS = {
    Outfielder: {
      noun: 'outfield',
      pools: [['7', 'LF', 'left fielders'], ['8', 'CF', 'center fielders'], ['9', 'RF', 'right fielders'], ['of', 'All OF', 'outfielders']],
      board: 'oaa',
      plays: 'catches'
    },
    Infielder: {
      noun: 'infield',
      pools: [['3', '1B', 'first basemen'], ['4', '2B', 'second basemen'], ['5', '3B', 'third basemen'], ['6', 'SS', 'shortstops'], ['if', 'All IF', 'infielders']],
      board: 'oaa',
      plays: 'infield'
    },
    Catcher: {
      noun: 'catching',
      pools: [['2', 'C', 'catchers']],
      board: 'catcher',
      plays: 'catcher'
    }
  };
  const SWEEP_POSITIONS = { outfield: ['7', '8', '9'], infield: ['3', '4', '5', '6'], catcher: ['2'] };
  function defenseGroupFor(person) {
    const type = person && person.primaryPosition && person.primaryPosition.type;
    return DEFENSE_GROUPS[type] || null;
  }
  const STATCAST_FIRST_SEASON = 2016;

  // Savant's CSVs quote every text field, and names carry a comma
  // ("Crow-Armstrong, Pete"), so a plain split(',') won't do.
  function parseCsv(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    const src = text.replace(/^﻿/, '');
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (quoted) {
        if (c !== '"') field += c;
        else if (src[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && src[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [head, ...body] = rows;
    if (!head) return [];
    return body.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
  }

  // One OAA leaderboard: a position ('7'/'8'/'9', or 'of' for all three
  // combined) and either Savant's qualified pool ('q') or everyone ('0').
  // A position's rows hold OAA at that position alone.
  const savantOaaCache = {};
  async function getSavantOaa(season, pos, min) {
    const key = `${season}-${pos}-${min}`;
    if (savantOaaCache[key]) return savantOaaCache[key];
    try {
      const res = await fetch(`${SAVANT}/leaderboard/outs_above_average?type=Fielder&startYear=${season}&endYear=${season}&split=no&team=&range=year&min=${min}&pos=${pos}&roles=&viz=hide&csv=true`);
      if (!res.ok) return null;
      const rows = parseCsv(await res.text())
        .map(r => ({ id: Number(r.player_id), oaa: Number(r.outs_above_average) }))
        .filter(r => r.id && Number.isFinite(r.oaa));
      savantOaaCache[key] = rows;
      return rows;
    } catch (e) {
      return null;
    }
  }

  // Fielding Run Value at one position ('2'..'9'), as an id -> { total,
  // framing, throwing, blocking } map (the three parts are a catcher's;
  // null where Savant leaves them blank -- framing starts in 2018).
  // Savant's position filter splits a player's runs by position, so a
  // whole group -- infield or outfield -- is the sum of these; see
  // buildProfileDefense. At catcher the list is only qualified catchers
  // unless everyone (minInnings=0) is asked for.
  const savantFrvCache = {};
  async function getSavantFrv(season, pos, everyone = false) {
    const key = `${season}-${pos}-${everyone}`;
    if (savantFrvCache[key]) return savantFrvCache[key];
    try {
      const res = await fetch(`${SAVANT}/leaderboard/fielding-run-value?gameType=Regular&seasonStart=${season}&seasonEnd=${season}&type=fielder&position=${pos}${everyone ? '&minInnings=0' : ''}&csv=true`);
      if (!res.ok) return null;
      const byId = {};
      const num = v => (v === '' || v == null ? null : Number(v));
      parseCsv(await res.text()).forEach(r => {
        if (r.total_runs !== '') byId[Number(r.id)] = { total: Number(r.total_runs), framing: num(r.framing_runs), throwing: num(r.throwing_runs), blocking: num(r.blocking_runs) };
      });
      savantFrvCache[key] = byId;
      return byId;
    } catch (e) {
      return null;
    }
  }

  // Every outfield catch opportunity of the player's most recent season,
  // each with Statcast's star rating (5 = a catch made 0-25% of the time).
  // Savant has no API for these; its player page embeds them as one
  // `rangeLine: [...]` line of JSON, read out here. That page always
  // shows the latest season (a season parameter is ignored), so the
  // result says which season it is.
  const savantCatchCache = {};
  async function getSavantCatches(personId) {
    if (savantCatchCache[personId]) return savantCatchCache[personId];
    try {
      const res = await fetch(`${SAVANT}/savant-player/${personId}`);
      if (!res.ok) return null;
      const html = await res.text();
      const season = (html.match(/mostRecentSeason:\s*'(\d{4})'/) || [])[1];
      const start = html.indexOf('rangeLine: ');
      if (!season || start < 0) return null;
      const line = html.slice(start + 'rangeLine: '.length, html.indexOf('\n', start)).trim().replace(/,$/, '');
      const plays = JSON.parse(line)
        .filter(p => Number(p.player_id) === personId && ['7', '8', '9'].includes(String(p.pos)))
        .map(p => ({
          playId: p.play_id,
          pos: String(p.pos),
          stars: Number(p.stars),
          made: Number(p.out) === 1,
          catchRate: Number(p.catch_rate),
          hang: Number(p.opportunity_time),
          distance: Number(p.distance),
          wall: Number(p.wall) === 1,
          back: Number(p.back) === 1
        }));
      const result = { season: Number(season), plays };
      savantCatchCache[personId] = result;
      return result;
    } catch (e) {
      return null;
    }
  }

  // A play's broadcast clip, from Savant's video page for it: the mp4,
  // the play's description (the page title), and which game it was.
  const savantClipCache = {};
  async function getSavantClip(playId) {
    if (savantClipCache[playId]) return savantClipCache[playId];
    try {
      const res = await fetch(`${SAVANT}/sporty-videos?playId=${encodeURIComponent(playId)}`);
      if (!res.ok) return null;
      const html = await res.text();
      const mp4 = (html.match(/https:\/\/sporty-clips\.mlb\.com\/[^"'\s<>]+\.mp4/) || [])[0];
      if (!mp4) return null;
      const clip = {
        mp4,
        title: ((html.match(/<title>([^<|]*)/) || [])[1] || '').trim(),
        gamePk: Number((html.match(/gamefeed\?gamePk=(\d+)/) || [])[1]) || null,
        date: (html.match(/scoreboard\?date=(\d{4}-\d{2}-\d{2})/) || [])[1] || null,
        matchup: (html.match(/>\s*([A-Z]{2,3} @ [A-Z]{2,3})\s*</) || [])[1] || ''
      };
      savantClipCache[playId] = clip;
      return clip;
    } catch (e) {
      return null;
    }
  }

  // OAA at each position of the group the player covered, plus the group
  // as a whole, each ranked against Savant's qualified pool for that
  // position (unranked if he isn't in it). Positions he never played are
  // left out. Fielding Run Value ranks against that same OAA-qualified
  // pool (those of them with an FRV there), so both slots share one
  // denominator; a failed FRV fetch only blanks that slot.
  async function buildProfileDefense(personId, season, group) {
    if (group.board === 'catcher') return buildCatcherDefense(personId, season);
    const positions = group.pools.map(([pos]) => pos);
    const single = positions.slice(0, -1);
    const [lists, frvs] = await Promise.all([
      Promise.all(positions.flatMap(pos => [getSavantOaa(season, pos, '0'), getSavantOaa(season, pos, 'q')])),
      Promise.all(single.map(pos => getSavantFrv(season, pos)))
    ]);
    if (lists.some(l => l === null)) return null;
    const frvOf = (id, pos) => {
      if (frvs.some(f => f === null)) return null;
      const parts = (single.includes(pos) ? [frvs[single.indexOf(pos)]] : frvs).map(f => f[id] && f[id].total).filter(v => v != null);
      return parts.length ? Math.round(parts.reduce((a, b) => a + b, 0)) : null;
    };
    const pools = {};
    group.pools.forEach(([pos], i) => {
      const all = lists[2 * i], qualified = lists[2 * i + 1];
      const row = all.find(r => r.id === personId);
      if (!row) return;
      const inPool = qualified.some(r => r.id === personId);
      const pool = qualified.map(r => ({ stat: r }));
      const rank = inPool ? rankInPool({ get: s => s.oaa }, { stat: row }, pool, {}) : null;
      const frv = frvOf(personId, pos);
      const frvPool = qualified.filter(r => frvOf(r.id, pos) != null).map(r => ({ stat: { frv: frvOf(r.id, pos) } }));
      const frvRank = inPool && frv != null ? rankInPool({ get: s => s.frv }, { stat: { frv } }, frvPool, {}) : null;
      pools[pos] = { row, rank, frv, frvRank };
    });
    return pools;
  }

  // A catcher's FRV and its framing, throwing and blocking parts, each
  // ranked against Savant's qualified catchers (his own line comes from
  // the everyone list, so a backup catcher still gets his numbers).
  const CATCHER_PARTS = [['total', 'FRV'], ['framing', 'Framing'], ['throwing', 'Throwing'], ['blocking', 'Blocking']];
  async function buildCatcherDefense(personId, season) {
    const [qualified, everyone] = await Promise.all([getSavantFrv(season, '2'), getSavantFrv(season, '2', true)]);
    if (!qualified || !everyone) return null;
    const row = everyone[personId];
    if (!row) return {};
    const inPool = !!qualified[personId];
    const ranks = {};
    CATCHER_PARTS.forEach(([part]) => {
      const value = row[part] == null ? null : Math.round(row[part]);
      const pool = Object.values(qualified).filter(r => r[part] != null).map(r => ({ stat: { v: Math.round(r[part]) } }));
      ranks[part] = inPool && value != null ? rankInPool({ get: s => s.v }, { stat: { v: value } }, pool, {}) : null;
    });
    return { '2': { catcher: row, ranks } };
  }

  function formatSigned(n) {
    if (n > 0) return `+${n}`;
    if (n < 0) return `&#8722;${-n}`;
    return '0';
  }

  const STAR_GLYPHS = n => '&#9733;'.repeat(n);

  function renderProfileDefense() {
    if (Number(lastProfileSeason) < STATCAST_FIRST_SEASON) return `<div class="pitch-empty">Statcast fielding starts in ${STATCAST_FIRST_SEASON}.</div>`;
    const def = lastProfileDefense;
    const group = defenseGroupFor(lastProfilePerson);
    if (def === undefined) return '<div class="mlb-status-msg">Loading defense&#8230;</div>';
    if (def === null) return apiErrorMsg('defense stats');
    const pools = group.pools.filter(([pos]) => def[pos]);
    if (!pools.length) return `<div class="pitch-empty">No ${lastProfileSeason} ${group.noun} defense.</div>`;
    if (!def[profileDefensePool]) {
      const primary = lastProfilePerson.primaryPosition && lastProfilePerson.primaryPosition.code;
      profileDefensePool = def[primary] ? primary : pools[0][0];
    }
    const [, , poolNoun] = group.pools.find(([pos]) => pos === profileDefensePool);
    const current = def[profileDefensePool];
    const toggle = `<div class="view-toggle pp-def-pools" role="group" aria-label="Compare against">${pools.map(([pos, label]) =>
      `<button type="button" class="view-toggle-btn${pos === profileDefensePool ? ' active' : ''}" data-def-pool="${pos}" aria-pressed="${pos === profileDefensePool}">${label}</button>`).join('')}</div>`;
    const slot = (label, value, r) => {
      const top = r && r.rank / r.of <= PROFILE_GOLD_SHARE;
      const badge = r ? `<span class="pp-rank" title="Rank among ${r.of} qualified ${poolNoun}">${r.tied ? 'T' : ''}${r.rank}/${r.of}</span>` : '';
      return `<div class="pp-stat${top ? ' is-top' : ''}"><span class="pp-painted">${label}</span><span class="pp-slot">${value}${badge}</span></div>`;
    };
    const slots = group.board === 'catcher'
      ? CATCHER_PARTS.map(([part, label]) => slot(label, current.catcher[part] != null ? formatSigned(Math.round(current.catcher[part])) : '&#8212;', current.ranks[part])).join('')
      : slot('OAA', formatSigned(current.row.oaa), current.rank)
        + slot('FRV', current.frv != null ? formatSigned(current.frv) : '&#8212;', current.frvRank);
    const below = group.plays === 'catches' ? renderCatchBoard() : group.plays === 'infield' ? renderInfieldPlays() : renderCatcherPlays();
    return `<div class="pp-def">
      <div class="pp-def-top${pools.length > 1 ? '' : ' is-solo'}">${slots}${pools.length > 1 ? toggle : ''}</div>
      <div class="pp-def-main">${below}</div>
      <div class="pp-def-side">${renderDefenseHighlights(group)}</div>
    </div>`;
  }

  // Each catch chance is a lamp in its star row: lit for a catch, a dark
  // socket for a miss. Made 5-star catches light gold -- the catch
  // counterpart of a top-10% stat. A row opens to its catches (made ones
  // first, hardest first, then the misses), each opening its clip.
  function renderCatchBoard() {
    const catches = lastProfileCatches;
    if (catches === undefined) return '<div class="pp-cb"><div class="mlb-status-msg">Loading catches&#8230;</div></div>';
    if (catches === null) return `<div class="pp-cb">${apiErrorMsg('catches')}</div>`;
    if (catches.season !== Number(lastProfileSeason)) return `<div class="pp-cb"><div class="pitch-empty">Catch by catch is only available for ${catches.season}.</div></div>`;
    const plays = catches.plays.filter(p => profileDefensePool === 'of' || p.pos === profileDefensePool);
    const tierRow = stars => {
      const tier = plays.filter(p => p.stars === stars);
      const made = tier.filter(p => p.made).length;
      const open = profileCatchTier === stars && tier.length > 0;
      const lamp = p => `<span class="pp-lamp${p.made ? (stars === 5 ? ' is-gold' : ' is-lit') : ''}"></span>`;
      const lamps = [...tier.filter(p => p.made), ...tier.filter(p => !p.made)].map(lamp).join('');
      const row = `<button type="button" class="pp-cb-row" data-cb-tier="${stars}" aria-expanded="${open}"${tier.length ? '' : ' disabled'}>
        <span class="pp-cb-stars" aria-label="${stars} star">${STAR_GLYPHS(stars)}</span>
        <span class="pp-cb-lamps">${lamps}</span>
        <span class="pp-cb-count">${tier.length ? `${made}/${tier.length}` : ''}</span>
        <svg class="pp-cb-chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>`;
      if (!open) return row;
      const list = tier.slice().sort((a, b) => b.made - a.made || a.catchRate - b.catchRate || a.hang - b.hang).map(p => {
        const tags = [p.wall ? 'Wall' : '', p.back ? 'Back' : ''].filter(Boolean).map(t => `<span class="pp-cb-tag">${t}</span>`).join('');
        return `<button type="button" class="pp-cb-catch" data-play-id="${p.playId}">
          ${lamp(p)}
          <span>${Math.round(p.catchRate * 100)}%</span>
          <span>${p.hang.toFixed(1)}s</span>
          <span>${p.distance} ft</span>
          <span class="pp-cb-tags">${tags}</span>
          <svg class="pp-cb-play" viewBox="0 0 8 10" aria-hidden="true"><path d="M1 1l6 4-6 4z" fill="currentColor"/></svg>
        </button>`;
      }).join('');
      return `${row}<div class="pp-cb-list"><div class="pp-cb-head"><span></span><span>Catch %</span><span>Hang</span><span>Dist</span></div>${list}</div>`;
    };
    const routine = plays.filter(p => p.stars === 0);
    const routineMade = routine.filter(p => p.made).length;
    return `<div class="pp-cb">
      <span class="pp-painted pp-cb-title">Catches</span>
      ${[5, 4, 3, 2, 1].map(tierRow).join('')}
      ${routine.length ? `<div class="pp-cb-routine">Routine <span>${routineMade}/${routine.length}</span></div>` : ''}
    </div>`;
  }

  // ---- A fielder's season of plays: double plays, steals, challenges,
  // and MLB highlight clips ----
  const HIGHLIGHTS_SHOWN = 6;
  // MLB's ABS challenge system began with the 2026 season.
  const ABS_FIRST_SEASON = 2026;

  // MLB's own highlight clips of one game that are tagged as defense and
  // with this player -- their video team's pick of his best plays, since
  // nothing publishes a difficulty rating for infield plays.
  async function getGameDefenseHighlights(gamePk, personId) {
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/game/${gamePk}/content`);
      if (!res.ok) return [];
      const data = await res.json();
      const items = (data.highlights && data.highlights.highlights && data.highlights.highlights.items) || [];
      return items.filter(item => {
        const kw = item.keywordsAll || [];
        return kw.some(k => k.value === 'defense') && kw.some(k => k.type === 'player_id' && Number(k.value) === personId);
      }).map(item => {
        const pb = (item.playbacks || []).find(b => b.name === 'mp4Avc') || (item.playbacks || []).find(b => /\.mp4$/.test(b.url || ''));
        return pb ? { headline: item.headline || '', mp4: pb.url, playId: item.guid || null } : null;
      }).filter(Boolean);
    } catch (e) {
      return [];
    }
  }

  // A double play in scorebook order. The feed lists each runner's credits
  // (assists, then the putout) but not which out came first: a caught ball
  // (a putout with no assist) is always the first out, a batter thrown out
  // at first the last, so the batter goes first or last accordingly.
  function buildDoublePlay(play, personId) {
    const event = (play.result && play.result.event) || '';
    if (!/Double Play|Grounded Into DP|Triple Play/.test(event)) return null;
    const outs = (play.runners || []).filter(r => (r.credits || []).some(c => /putout/.test(c.credit)));
    const isBatter = r => !r.movement || r.movement.originBase == null;
    const caught = r => !(r.credits || []).some(c => /assist/.test(c.credit));
    const batter = outs.filter(isBatter);
    const others = outs.filter(r => !isBatter(r));
    const ordered = batter.length && caught(batter[0]) ? [...batter, ...others] : [...others, ...batter];
    const seq = [];
    ordered.forEach(r => {
      const credits = (r.credits || []).filter(c => /assist|putout/.test(c.credit));
      [...credits.filter(c => /assist/.test(c.credit)), ...credits.filter(c => /putout/.test(c.credit))].forEach(c => {
        const code = c.position && c.position.code;
        if (code && seq[seq.length - 1] !== code) seq.push(code);
      });
    });
    const mine = (play.runners || []).flatMap(r => r.credits || []).find(c => c.player && c.player.id === personId && c.position);
    if (!mine || !seq.length) return null;
    const pos = mine.position.code;
    const at = seq.indexOf(pos);
    const role = seq.length === 1 ? 'Unassisted' : at === 0 ? 'Started' : at === seq.length - 1 ? 'Finished' : 'Turned';
    return { code: seq.length === 1 ? `${seq[0]}U` : seq.join('-'), role, pos, triple: /Triple Play/.test(event) };
  }

  // A catcher's steals against him and ABS challenges in one game. A
  // stolen base credits no fielder, so who's catching is tracked through
  // the game: whoever started there (from his game log), then each
  // defensive substitution or switch to catcher, confirmed by any play
  // that credits a catcher (every strikeout does). Caught stealing counts
  // only when his throw is in it -- a pitcher's pickoff isn't his.
  const STEAL_EVENT = /^(Stolen Base|Caught Stealing) (2B|3B|Home)$/;
  function buildCatcherGamePlays(plays, personId, split, game) {
    let catching = !!(split.stat && split.stat.gamesStarted);
    const steals = [], challenges = [];
    (plays || []).forEach(play => {
      const fielding = split.isHome === !!(play.about && play.about.isTopInning);
      if (!fielding) return;
      const events = play.playEvents || [];
      const batter = (play.matchup && play.matchup.batter && play.matchup.batter.fullName) || '';
      let count = { balls: 0, strikes: 0 };
      let challengedHere = false;
      events.forEach(ev => {
        if (ev.type === 'action' && ev.position && ev.player) {
          if (ev.position.code === '2') catching = ev.player.id === personId;
          else if (ev.player.id === personId) catching = false;
        }
        const review = ev.reviewDetails;
        if (ev.isPitch && review && review.reviewType === 'MJ' && review.player && review.player.id === personId) {
          challengedHere = true;
          challenges.push({
            ...game, batter, playId: ev.playId || null,
            overturned: !!review.isOverturned,
            count: `${count.balls}-${count.strikes}`,
            twoStrikes: count.strikes === 2,
            call: (ev.details && ev.details.call && ev.details.call.description) || ''
          });
        }
        if (ev.isPitch && ev.count) count = ev.count;
      });
      // A challenge that ends the plate appearance (a called third strike
      // won, ball four upheld) is often recorded on the play rather than
      // its pitch. A catcher challenges a ball, so the pitch is the last
      // called strike if he won, else the last ball.
      const review = play.reviewDetails;
      if (!challengedHere && review && review.reviewType === 'MJ' && review.player && review.player.id === personId) {
        const pitches = events.filter(ev => ev.isPitch);
        const call = review.isOverturned ? 'Called Strike' : 'Ball';
        let at = -1;
        pitches.forEach((ev, i) => { if (ev.details && ev.details.call && ev.details.call.description === call) at = i; });
        const pitch = at >= 0 ? pitches[at] : pitches[pitches.length - 1];
        const before = at > 0 ? pitches[at - 1].count : at === 0 ? { balls: 0, strikes: 0 } : null;
        challenges.push({
          ...game, batter, playId: (pitch && pitch.playId) || null,
          overturned: !!review.isOverturned,
          count: before ? `${before.balls}-${before.strikes}` : '',
          twoStrikes: !!before && before.strikes === 2,
          call: at >= 0 ? call : ''
        });
      }
      const credits = (play.runners || []).flatMap(r => r.credits || []);
      const catcherCredit = credits.find(c => c.position && c.position.code === '2' && c.player);
      if (catcherCredit) catching = catcherCredit.player.id === personId;
      // The feed occasionally lists one runner's steal twice in a play.
      const counted = new Set();
      (play.runners || []).forEach(r => {
        const m = STEAL_EVENT.exec((r.details && r.details.event) || '');
        if (!m) return;
        const once = `${r.details.runner && r.details.runner.id}-${m[0]}`;
        if (counted.has(once)) return;
        counted.add(once);
        const thrownOut = m[1] === 'Caught Stealing';
        if (thrownOut ? !(r.credits || []).some(c => c.player && c.player.id === personId) : !catching) return;
        const at = r.details.playIndex;
        const clip = (events[at] && events[at].playId) || ([...events.slice(0, at)].reverse().find(ev => ev.playId) || {}).playId || null;
        steals.push({ ...game, base: m[2], thrownOut, runner: (r.details.runner && r.details.runner.fullName) || '', playId: clip });
      });
    });
    return { steals, challenges };
  }

  // One season of a fielder's plays -- an infielder's double plays, or a
  // catcher's steals against him and ABS challenges -- and MLB's defensive
  // clips of him, swept from each game he played there: its play-by-play
  // and its highlights. That's ~14 MB for a full season, so it only runs
  // once the Defense tab opens, and only the plays kept here (not the
  // games) are held for the session. A game that fails is skipped; a
  // failed game log isn't cached, so reopening retries.
  const fieldingPlaysCache = {};
  async function getSeasonFieldingPlays(personId, season, kind, onProgress) {
    const key = `${personId}-${season}-${kind}`;
    if (fieldingPlaysCache[key]) return fieldingPlaysCache[key];
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/people/${personId}/stats?stats=gameLog&group=fielding&season=${season}`);
      if (!res.ok) return null;
      const data = await res.json();
      const games = new Map();
      ((data.stats && data.stats[0] && data.stats[0].splits) || []).forEach(s => {
        const pos = s.stat && s.stat.position && s.stat.position.code;
        if (SWEEP_POSITIONS[kind].includes(pos) && s.game && s.game.gamePk) games.set(s.game.gamePk, s);
      });
      const list = [...games.values()];
      const doublePlays = [], steals = [], challenges = [], highlights = [];
      let next = 0, done = 0;
      async function worker() {
        while (next < list.length) {
          const s = list[next++];
          const [plays, clips] = await Promise.all([getGamePlayByPlay(s.game.gamePk, false), getGameDefenseHighlights(s.game.gamePk, personId)]);
          const opp = teamAbbr(s.opponent);
          const game = {
            date: s.date,
            gamePk: s.game.gamePk,
            opp: `${s.isHome ? 'vs' : '@'} ${opp}`,
            matchup: s.isHome ? `${opp} @ ${teamAbbr(s.team)}` : `${teamAbbr(s.team)} @ ${opp}`
          };
          const posByPlay = {};
          if (kind === 'catcher') {
            const mine = buildCatcherGamePlays(plays, personId, s, game);
            steals.push(...mine.steals);
            challenges.push(...mine.challenges);
          }
          (plays || []).forEach(play => {
            const credit = (play.runners || []).flatMap(r => r.credits || []).find(c => c.player && c.player.id === personId && c.position);
            if (!credit) return;
            const playId = extractPlayId(play);
            if (playId) posByPlay[playId] = credit.position.code;
            const dp = kind === 'infield' && buildDoublePlay(play, personId);
            if (dp) doublePlays.push({ ...dp, ...game, playId, batter: (play.matchup && play.matchup.batter && play.matchup.batter.fullName) || '' });
          });
          clips.forEach(c => highlights.push({ ...c, ...game, pos: (c.playId && posByPlay[c.playId]) || null }));
          onProgress(++done, list.length);
        }
      }
      await Promise.all(Array.from({ length: Math.min(SPRAY_FETCH_CONCURRENCY, list.length) }, worker));
      const byNewest = (a, b) => (b.date || '').localeCompare(a.date || '');
      const result = {
        doublePlays: doublePlays.sort(byNewest),
        steals: steals.sort(byNewest),
        challenges: challenges.sort(byNewest),
        highlights: highlights.sort(byNewest)
      };
      fieldingPlaysCache[key] = result;
      return result;
    } catch (e) {
      return null;
    }
  }

  // The parts shared by an infielder's and a catcher's plays: one play's
  // row (date, opponent, what happened, play mark -- data-play-clip and
  // its head say what the clip popup shows), the status line while the
  // sweep runs, and MLB's highlight clips, newest first (the latest few
  // until asked for all -- a season can run past 30).
  const PLAY_MARK = '<svg class="pp-cb-play" viewBox="0 0 8 10" aria-hidden="true"><path d="M1 1l6 4-6 4z" fill="currentColor"/></svg>';
  const CHEVRON = '<svg class="pp-cb-chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function renderPlayRow(play, text, clipHead) {
    const attrs = play.playId ? ` data-play-clip="${play.playId}" data-clip-head="${clipHead}"` : ' disabled';
    return `<button type="button" class="pp-pl-row"${attrs}>
        <span>${formatShortDate(play.date)}</span>
        <span class="pp-pl-opp">${play.opp}</span>
        <span class="pp-pl-text">${text}</span>
        ${PLAY_MARK}
      </button>`;
  }
  function renderPlaysStatus(data) {
    if (data === undefined) {
      const p = lastProfilePlaysProgress;
      return `<div class="pp-cb"><div class="mlb-status-msg pp-plays-progress">Loading plays&#8230;${p ? ` ${p.done}/${p.total} games` : ''}</div></div>`;
    }
    return `<div class="pp-cb">${apiErrorMsg('plays')}</div>`;
  }
  function renderHighlightsSection(data, inPool) {
    const highlights = data.highlights.filter(h => !h.pos || inPool(h.pos));
    const shown = profileHighlightsAll ? highlights : highlights.slice(0, HIGHLIGHTS_SHOWN);
    const more = highlights.length > shown.length
      ? `<button type="button" class="pp-pl-more" data-hl-all>All ${highlights.length} highlights</button>`
      : '';
    const rows = shown.map(h => `<button type="button" class="pp-pl-row" data-hl-index="${data.highlights.indexOf(h)}">
        <span>${formatShortDate(h.date)}</span>
        <span class="pp-pl-opp">${h.opp}</span>
        <span class="pp-pl-text">${h.headline}</span>
        ${PLAY_MARK}
      </button>`).join('');
    const body = highlights.length
      ? `<div class="pp-pl-list">${rows}</div>${more}`
      : `<div class="pitch-empty">No ${lastProfileSeason} highlights.</div>`;
    return `<div class="pp-cb"><span class="pp-painted pp-cb-title">Highlights <span class="pp-dp-total">${highlights.length || ''}</span></span>${body}</div>`;
  }

  // Below an infielder's board: his double plays as a scorebook ledger,
  // then MLB's highlight clips of him. The ledger has one row per
  // notation (6-4-3, 4-6-3...) and his part in it, since the same
  // notation can be one he started at one position and finished at
  // another (a utility man's 5-4-3 at third, and at first). Both
  // follow the position toggle; a clip MLB didn't tie to a play shows
  // under every position.
  function renderInfieldPlays() {
    const data = lastProfilePlays;
    if (!data) return renderPlaysStatus(data);
    const inPool = pos => profileDefensePool === 'if' || pos === profileDefensePool;
    const dps = data.doublePlays.filter(d => inPool(d.pos));
    const byCode = new Map();
    dps.forEach(d => {
      const key = `${d.code} ${d.role}`;
      if (!byCode.has(key)) byCode.set(key, []);
      byCode.get(key).push(d);
    });
    const roles = ['Started', 'Turned', 'Finished', 'Unassisted'].map(r => [r, dps.filter(d => d.role === r).length]).filter(([, n]) => n);
    const rows = [...byCode.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0])).map(([key, plays]) => {
      const open = profileOpenRow === key;
      const row = `<button type="button" class="pp-cb-row pp-dp-row" data-open-row="${key}" aria-expanded="${open}">
        <span class="pp-dp-code">${plays[0].code}</span>
        <span class="pp-dp-role">${plays[0].role}${plays.some(p => p.triple) ? ' &#183; TP' : ''}</span>
        <span class="pp-cb-count">${plays.length}</span>
        ${CHEVRON}
      </button>`;
      if (!open) return row;
      const head = p => `<span class=&quot;cv-code&quot;>${p.code}</span><span class=&quot;cv-result&quot;>${p.triple ? 'Triple' : 'Double'} Play &#183; ${p.role}</span>`;
      return `${row}<div class="pp-cb-list">${plays.map(p => renderPlayRow(p, p.batter, head(p))).join('')}</div>`;
    }).join('');
    const dpHtml = dps.length
      ? `<div class="pp-cb-routine pp-dp-roles">${roles.map(([r, n]) => `${r} <span>${n}</span>`).join('')}</div>${rows}`
      : `<div class="pitch-empty">No ${lastProfileSeason} double plays.</div>`;
    return `<div class="pp-cb"><span class="pp-painted pp-cb-title">Double Plays <span class="pp-dp-total">${dps.length || ''}</span></span>${dpHtml}</div>`;
  }

  // MLB's highlight clips of him, beside his plays on a wide sheet and
  // under them on a narrower one. They follow the position toggle (the
  // group's own "All" pool takes every clip). An infielder's or a
  // catcher's plays already show the sweep's progress, so only an
  // outfielder's column shows it here.
  function renderDefenseHighlights(group) {
    const data = lastProfilePlays;
    if (!data) return group.plays === 'catches' ? renderPlaysStatus(data) : '';
    const inPool = pos => profileDefensePool === 'of' || profileDefensePool === 'if' || pos === profileDefensePool;
    return renderHighlightsSection(data, group.plays === 'catcher' ? () => true : inPool);
  }

  // A lamp board like the outfield catch board, for a catcher's plays:
  // one row per group, each play a lamp -- lit for his success, a dark
  // socket for the other side's -- successes first; a row opens to its
  // plays, successes first, newest first, each opening its clip.
  function renderLampRows(rows, describe, clipHead) {
    return rows.map(([key, label, plays, won]) => {
      const lit = plays.filter(won), dark = plays.filter(p => !won(p));
      const open = profileOpenRow === key && plays.length > 0;
      const lamps = [...lit, ...dark].map(p => `<span class="pp-lamp${won(p) ? ' is-lit' : ''}"></span>`).join('');
      const row = `<button type="button" class="pp-cb-row" data-open-row="${key}" aria-expanded="${open}"${plays.length ? '' : ' disabled'}>
        <span class="pp-cb-label">${label}</span>
        <span class="pp-cb-lamps">${lamps}</span>
        <span class="pp-cb-count">${plays.length ? `${lit.length}/${plays.length}` : ''}</span>
        ${CHEVRON}
      </button>`;
      if (!open) return row;
      return `${row}<div class="pp-cb-list">${[...lit, ...dark].map(p => renderPlayRow(p, describe(p), clipHead(p))).join('')}</div>`;
    }).join('');
  }

  // Below a catcher's board: steals against him by base (a lamp lit for a
  // runner he threw out), his ABS challenges -- those with two strikes,
  // where winning one is strike three, apart from the rest -- and MLB's
  // highlight clips of him. Challenges only exist from 2026, when the
  // challenge system began; before then that section is left out.
  function renderCatcherPlays() {
    const data = lastProfilePlays;
    if (!data) return renderPlaysStatus(data);
    const steals = data.steals;
    const thrownOut = steals.filter(p => p.thrownOut).length;
    const stealRows = ['2B', '3B', 'Home'].map(base => [`steal-${base}`, base, steals.filter(p => p.base === base), p => p.thrownOut])
      .filter(([, , plays]) => plays.length);
    const stealsHtml = steals.length
      ? renderLampRows(stealRows,
        p => `${p.runner} &#183; ${p.thrownOut ? 'Thrown out' : 'Stole'}`,
        p => `<span class=&quot;cv-result&quot;>${p.thrownOut ? 'Caught Stealing' : 'Stolen Base'} ${p.base}</span>`)
      : `<div class="pitch-empty">No ${lastProfileSeason} stolen base attempts.</div>`;
    const sections = [`<div class="pp-cb"><span class="pp-painted pp-cb-title">Caught Stealing <span class="pp-dp-total">${steals.length ? `${thrownOut}/${steals.length}` : ''}</span></span>${stealsHtml}</div>`];
    const challenges = data.challenges;
    if (challenges.length || Number(lastProfileSeason) >= ABS_FIRST_SEASON) {
      const won = challenges.filter(p => p.overturned).length;
      const chalRows = [['abs-2', '2 strikes', challenges.filter(p => p.twoStrikes), p => p.overturned], ['abs-0', 'Earlier', challenges.filter(p => !p.twoStrikes), p => p.overturned]]
        .filter(([, , plays]) => plays.length);
      const chalHtml = challenges.length
        ? renderLampRows(chalRows,
          p => `${p.batter}${p.count ? ` &#183; ${p.count}` : ''} &#183; ${p.overturned ? (p.twoStrikes ? 'Strike three' : 'Overturned') : 'Confirmed'}`,
          p => `<span class=&quot;cv-result&quot;>ABS Challenge &#183; ${p.overturned ? 'Overturned' : 'Confirmed'}${p.count ? ` &#183; ${p.count}` : ''}</span>`)
        : `<div class="pitch-empty">No ${lastProfileSeason} challenges.</div>`;
      sections.push(`<div class="pp-cb"><span class="pp-painted pp-cb-title">ABS Challenges <span class="pp-dp-total">${challenges.length ? `${won}/${challenges.length}` : ''}</span></span>${chalHtml}</div>`);
    }
    return sections.join('');
  }

  // ---- Assembly ----
  function profileTabsFor(pitcher, detail, person) {
    const hasStarts = pitcher && detail && detail.gameLog.some(g => g.stat && g.stat.gamesStarted);
    const fielder = !pitcher && defenseGroupFor(person);
    return pitcher
      ? [['ov', 'Overview'], ...(hasStarts ? [['starts', 'Starts']] : []), ...(Number(lastProfileSeason) >= ARSENAL_FIRST_SEASON ? [['ars', 'Arsenal']] : []), ['log', 'Game Log'], ['spl', 'Splits'], ['car', 'Career']]
      : [['ov', 'Overview'], ['log', 'Game Log'], ['spl', 'Splits'], ...(fielder ? [['def', 'Defense']] : []), ['car', 'Career']];
  }

  function renderProfileTabBody(tab, pitcher) {
    const detail = lastProfileDetail;
    if (tab === 'car') {
      const careerSplits = lastProfileCareerSplits;
      const yearSplits = careerSplits === null ? null : (pitcher ? careerSplits.pitching : careerSplits.hitting);
      if (yearSplits === null) return '<div class="mlb-status-msg">Loading career stats&#8230;</div>';
      if (!yearSplits.length) return '<div class="pitch-empty">Career stats not available.</div>';
      return pitcher ? renderPitchingCareerTable(yearSplits) : renderCareerTable(yearSplits, lastProfileLeagueWoba || {});
    }
    if (tab === 'def') return renderProfileDefense();
    if (tab === 'ars') return renderProfileArsenal();
    if (detail === undefined) return '<div class="mlb-status-msg">Loading season stats&#8230;</div>';
    if (detail === null) return apiErrorMsg('season stats');
    if (tab === 'ov') {
      if (!detail.seasonStat) return `<div class="pitch-empty">No ${lastProfileSeason} stats.</div>`;
      return lastProfileBoard ? renderProfileBoard(lastProfileBoard) : '<div class="mlb-status-msg">Loading season stats&#8230;</div>';
    }
    if (tab === 'starts') return renderStartsChart(profileStarts(detail.gameLog));
    if (tab === 'log') return renderProfileGameLog(detail.gameLog, pitcher);
    // A hitter's Splits tab carries his spray chart beside the splits --
    // where he hits the ball, next to how he hits by situation.
    const splitsHtml = renderProfileSplits(detail.splits, pitcher, detail.seasonStat);
    if (pitcher) return splitsHtml;
    const spray = playerSprayState.personId === Number(lastProfilePerson.id) ? renderPlayerSprayWidget(playerSprayState) : '';
    return `<div class="pp-spl">${spray ? `<div class="pp-spl-spray">${spray}</div>` : ''}<div class="pp-spl-splits">${splitsHtml}</div></div>`;
  }

  function renderPlayerProfile(person) {
    const pitcher = isPitcher(person);
    const tabs = profileTabsFor(pitcher, lastProfileDetail, person);
    // Which tabs exist depends on his position and season, which a first
    // draw may not know yet -- so a tab asked for by history (Defense,
    // Arsenal, Starts) waits for them, showing Overview meanwhile, and is
    // only dropped once it's certain he doesn't have it.
    const hasTab = tabs.some(([id]) => id === profileTab);
    if (!hasTab && lastProfileDetail !== undefined && person.primaryPosition) profileTab = 'ov';
    const shownTab = hasTab ? profileTab : 'ov';
    const team = person.currentTeam && person.currentTeam.name;
    const pos = person.primaryPosition && person.primaryPosition.name;
    const ident = [team, pos].filter(Boolean).map((t, i) => (i ? `<span class="pp-sep">&#183;</span><span class="pp-pos">${t}</span>` : t)).join('');
    const born = [person.birthCity, person.birthStateProvince || person.birthCountry].filter(Boolean).join(', ');
    // Label-over-value pairs, spelled out, wrapping onto as many lines as
    // the sheet needs -- one run-on line of abbreviations blurred together.
    const bioPairs = [
      ['Age', person.currentAge],
      ['Height', person.height],
      ['Weight', person.weight ? `${person.weight} lb` : null],
      ['Bats', person.batSide && person.batSide.description],
      ['Throws', person.pitchHand && person.pitchHand.description],
      ['Born', born],
      ['Debut', person.mlbDebutDate ? `${formatShortDate(person.mlbDebutDate)}, ${person.mlbDebutDate.slice(0, 4)}` : null]
    ].filter(([, v]) => v != null && v !== '');
    const bio = bioPairs.length
      ? `<dl class="pp-vitals">${bioPairs.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`
      : '';
    const teamId = person.currentTeam && person.currentTeam.id;
    const watermark = teamId ? `<img class="pp-watermark" src="${capLogoUrl(teamId)}" alt="" aria-hidden="true" onerror="this.remove()">` : '';
    const awardsHtml = renderAwardTags(lastProfileAwardTags);
    const listName = playerListState.type === 'pitching' ? 'Pitchers' : 'Batters';
    return `<div class="pp">
      <button type="button" class="pp-back"><svg viewBox="0 0 7 11" aria-hidden="true"><path d="M6 1L1.5 5.5 6 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>${lastProfileSeason || ''} ${listName}</button>
      <div class="sheet pp-sheet">
        ${watermark}
        <div class="pp-head">
          <div class="pp-photo"><img src="${headshotUrl(person.id, 360)}" alt="" onerror="this.style.display='none'"></div>
          <div class="pp-id">
            ${person.primaryNumber ? `<div class="pp-num">#${person.primaryNumber}</div>` : ''}
            <div class="pp-name">${person.fullName || ''}</div>
            ${ident ? `<div class="pp-ident">${ident}</div>` : ''}
            ${bio ? `<div class="pp-wide">${bio}</div>` : ''}
            <div class="pp-wide">${awardsHtml}</div>
          </div>
        </div>
        ${bio ? `<div class="pp-narrow pp-vitals-narrow">${bio}</div>` : ''}
        <div class="pp-narrow">${awardsHtml}</div>
        <div class="pp-tabs" role="tablist">${tabs.map(([id, label]) => `<button type="button" class="pp-tab" role="tab" data-pp-tab="${id}" aria-selected="${id === shownTab}">${label}</button>`).join('')}</div>
        <div class="pp-panel" role="tabpanel">${renderProfileTabBody(shownTab, pitcher)}</div>
      </div>
    </div>`;
  }

  // Re-renders the profile from the last-fetched data without re-fetching
  // -- used as each piece (person, career, season detail, board, spray)
  // resolves, and on tab switches. A no-op once the user has gone back to
  // the list, so a slow profile fetch can't overwrite it.
  function rerenderPlayerProfile() {
    if (playersView !== 'profile' || !lastProfilePerson) return;
    playersBody.innerHTML = renderPlayerProfile(lastProfilePerson);
  }

  async function loadPlayerSpray(personId, season) {
    const token = ++playerSprayToken;
    const balls = await getPlayerSeasonBattedBalls(personId, season);
    // stale if superseded by a newer season/player switch, or if the user
    // has since navigated off this player's profile entirely
    if (token !== playerSprayToken || playerSprayState.personId !== personId) return;
    playerSprayState.season = season;
    playerSprayState.balls = balls;
    playerSprayState.loading = false;
    rerenderPlayerProfile();
  }

  // Fires once career stats are in hand (showPlayerProfile knows the
  // hitting seasons only then) -- one getLeagueWOBA call per distinct
  // season, shared/cached across every profile via that function's own
  // cache. Guarded by playerProfileRequestId rather than a token of its
  // own since it's already downstream of the same fetch showPlayerProfile
  // guards with that id.
  async function loadCareerLeagueWoba(hittingSplits, requestId) {
    const seasons = Array.from(new Set((hittingSplits || []).map(s => s.season)));
    if (!seasons.length) return;
    const values = await Promise.all(seasons.map(getLeagueWOBA));
    if (requestId !== playerProfileRequestId) return;
    const bySeason = {};
    seasons.forEach((season, i) => { bySeason[season] = values[i]; });
    lastProfileLeagueWoba = bySeason;
    rerenderPlayerProfile();
  }

  function ensureProfileDefense() {
    if (profileDefenseRequested || profileTab !== 'def' || !lastProfileSeason) return;
    profileDefenseRequested = true;
    loadProfileDefense(Number(lastProfilePerson.id), lastProfileSeason, playerProfileRequestId);
  }

  // Board and catches arrive separately: the catch list comes from a far
  // bigger page than the leaderboards, so the board doesn't wait on it.
  async function loadProfileDefense(personId, season, requestId) {
    const group = defenseGroupFor(lastProfilePerson);
    if (!group) return;
    if (group.plays === 'catches') {
      getSavantCatches(personId).then(catches => {
        if (requestId !== playerProfileRequestId) return;
        lastProfileCatches = catches;
        rerenderPlayerProfile();
      });
    }
    // Every group sweeps his games for MLB's highlight clips of him; an
    // infielder's and a catcher's plays come out of the same sweep. An
    // outfielder's catches come from Savant above instead.
    // Progress is written straight into the status line rather than by
    // re-rendering the whole profile once per game.
    const onProgress = (done, total) => {
      if (requestId !== playerProfileRequestId) return;
      lastProfilePlaysProgress = { done, total };
      const el = playersBody.querySelector('.pp-plays-progress');
      if (el) el.textContent = `Loading plays\u2026 ${done}/${total} games`;
    };
    getSeasonFieldingPlays(personId, season, group.plays === 'catches' ? 'outfield' : group.plays, onProgress).then(plays => {
      if (requestId !== playerProfileRequestId) return;
      lastProfilePlays = plays;
      rerenderPlayerProfile();
    });
    const def = Number(season) < STATCAST_FIRST_SEASON ? {} : await buildProfileDefense(personId, season, group);
    if (requestId !== playerProfileRequestId) return;
    lastProfileDefense = def;
    rerenderPlayerProfile();
  }

  // The spray chart lives on the Splits tab, so it's fetched only once that
  // tab opens.
  let profileSprayRequested = false;
  function ensureProfileSpray() {
    if (profileSprayRequested || profileTab !== 'spl' || !playerSprayState.season || isPitcher(lastProfilePerson)) return;
    profileSprayRequested = true;
    loadPlayerSpray(Number(lastProfilePerson.id), playerSprayState.season);
  }

  function ensureProfileArsenal() {
    if (profileArsenalRequested || profileTab !== 'ars' || !lastProfileSeason || !isPitcher(lastProfilePerson)) return;
    profileArsenalRequested = true;
    loadProfileArsenal(Number(lastProfilePerson.id), lastProfileSeason, playerProfileRequestId);
  }

  // The leaderboards are small and draw the velo and movement first; his
  // own pitch log (1-2 MB) fills in the mix and two-strike sections.
  async function loadProfileArsenal(personId, season, requestId) {
    const hand = (lastProfilePerson.pitchHand && lastProfilePerson.pitchHand.code) || 'R';
    const leaguePromise = getSavantArsenalLeague(season);
    const logPromise = getPitcherPitchLog(personId, season);
    const league = await leaguePromise;
    if (requestId !== playerProfileRequestId) return;
    lastProfileArsenal = buildProfileArsenal(personId, hand, season, league, undefined);
    rerenderPlayerProfile();
    if (!league) return;
    const log = await logPromise;
    if (requestId !== playerProfileRequestId) return;
    lastProfileArsenal = buildProfileArsenal(personId, hand, season, league, log);
    rerenderPlayerProfile();
  }

  function showProfileTab(id) {
    profileTab = id;
    rerenderPlayerProfile();
    ensureProfileRecent();
    ensureProfileDefense();
    ensureProfileSpray();
    ensureProfileArsenal();
  }

  function ensureProfileRecent() {
    if (profileRecentRequested || profileTab !== 'log' || !lastProfileDetail) return;
    profileRecentRequested = true;
    loadProfileRecent(Number(lastProfilePerson.id), isPitcher(lastProfilePerson), lastProfileDetail.gameLog, lastProfileSeason, playerProfileRequestId);
  }

  // The Overview's Savant CSVs (the slowest of its requests) start along
  // with the season stats rather than after them, and the board is drawn
  // as soon as the results group can be, then again once Savant is in.
  async function loadProfileSeason(personId, season, pitcher, requestId) {
    const person = lastProfilePerson;
    const type = person.primaryPosition && person.primaryPosition.type;
    const fielder = type === 'Outfielder' || type === 'Infielder' || type === 'Catcher';
    const savantPromise = getSavantSkillData(season, pitcher, type === 'Catcher', fielder);
    const detail = await getPlayerSeasonDetail(personId, season, pitcher ? 'pitching' : 'hitting');
    await profileAwardsReady;
    if (requestId !== playerProfileRequestId) return;
    lastProfileDetail = detail;
    rerenderPlayerProfile();
    ensureProfileRecent();
    if (!detail || !detail.seasonStat) return;
    const poolInfo = await getProfileBoardPool(person, season, pitcher, detail.seasonStat);
    if (requestId !== playerProfileRequestId) return;
    lastProfileBoard = buildProfileBoard(person, pitcher, detail.seasonStat, poolInfo, undefined);
    rerenderPlayerProfile();
    const savantData = await savantPromise;
    if (requestId !== playerProfileRequestId) return;
    lastProfileBoard = buildProfileBoard(person, pitcher, detail.seasonStat, poolInfo, savantData);
    rerenderPlayerProfile();
    // With the Overview done, the Splits tab's spray chart (one ~400 KB
    // CSV) loads in the background so that tab opens ready.
    if (!pitcher && Number(season) >= SAVANT_SPRAY_FIRST_SEASON) {
      const idle = window.requestIdleCallback || (fn => setTimeout(fn, 300));
      idle(() => getPlayerSeasonBattedBalls(personId, season));
    }
    // A pitcher's Arsenal leaderboards (~300 KB) likewise, so that tab
    // can draw its velo and movement at once.
    if (pitcher && Number(season) >= ARSENAL_FIRST_SEASON) {
      const idle = window.requestIdleCallback || (fn => setTimeout(fn, 300));
      idle(() => getSavantArsenalLeague(season));
    }
  }

  // Whether a profile is a pitcher's is only certain once the full person
  // record is in, but a search result already carries his position and a
  // name elsewhere in the app its scorecard position, so the season stats
  // and Savant CSVs can usually start right away instead of after it.
  // Everything here is shared with the real load (once()), never fetched
  // twice.
  function profileGroupHint(person) {
    if (person.primaryPosition) return isPitcher(person);
    if (person.posHint) return person.posHint === 'P';
    return null;
  }
  function prefetchProfile(person, season) {
    getPlayerDetails(Number(person.id));
    const pitcher = profileGroupHint(person);
    if (pitcher == null || !season) return;
    getPlayerSeasonDetail(Number(person.id), season, pitcher ? 'pitching' : 'hitting');
    const type = person.primaryPosition && person.primaryPosition.type;
