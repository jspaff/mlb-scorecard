    if (!c) {
      atBatTrackerPkey = null;
      atBatTrackerLastRenderedPitchNum = 0;
      html = atBatTrackerPlaceholderHtml();
    } else {
      const isRefresh = pkey === atBatTrackerPkey;
      atBatTrackerPkey = pkey;
      const pitches = c.pitches || [];
      newPitchNums = new Set();
      if (isRefresh) {
        pitches.forEach(p => { if ((p.num || 0) > atBatTrackerLastRenderedPitchNum) newPitchNums.add(p.num); });
      }
      atBatTrackerLastRenderedPitchNum = pitches.reduce((max, p) => Math.max(max, p.num || 0), 0);
      html = renderPitchDetailHtml(c, newPitchNums);
    }
    sidebarAtBatEl.innerHTML = html;
    wirePitchLocationSync(sidebarAtBatEl);
    // The wide-mobile bar's card is rebuilt with the bar on every render, so
    // it's looked up fresh rather than held.
    const bar = document.getElementById('barAtBat');
    if (bar) {
      bar.innerHTML = c ? renderBarAtBatHtml(c, newPitchNums) : '';
      wirePitchLocationSync(bar);
      bar.parentNode.classList.toggle('has-atbat', !!c);
    }
  }

  const rosterOverlay = document.getElementById('rosterOverlay');
  const rosterModalBody = document.getElementById('rosterModalBody');
  const rosterClose = document.getElementById('rosterClose');

  function showRosterModal(team) {
    const html = rosterStore[team];
    if (!html) return;
    rosterModalBody.innerHTML = html;
    openOverlay(rosterOverlay);
  }
  function hideRosterModal() {
    closeOverlay(rosterOverlay);
  }

  const teamChartOverlay = document.getElementById('teamChartOverlay');
  const teamChartModalBody = document.getElementById('teamChartModalBody');
  const teamChartClose = document.getElementById('teamChartClose');

  async function showTeamChartModal(teamId, teamName, season, throughDate) {
    teamChartModalBody.innerHTML = `<div class="pitch-header">${teamName}</div><div class="pitch-subheader">${season} Season</div><div class="pitch-empty">Loading&#8230;</div>`;
    openOverlay(teamChartOverlay);
    try {
      const series = await getTeamWinLossSeries(teamId, season);
      if (!teamChartOverlay.classList.contains('open')) return;
      teamChartModalBody.innerHTML = renderTeamChartContent(teamId, teamName, season, series, throughDate);
    } catch (e) {
      teamChartModalBody.innerHTML = `<div class="pitch-header">${teamName}</div><div class="pitch-empty">Chart not available.</div>`;
    }
  }
  function hideTeamChartModal() {
    closeOverlay(teamChartOverlay);
  }

  // Tab framework: register a tab with an optional lazy `init` (runs once,
  // on first visit) and `onShow` (runs every time the tab becomes active).
  // Adding a future tab is just a register() call plus a button + panel in
  // the HTML - no router dependency needed for a single-page app like this.
  const Tabs = (() => {
    const tabs = {};
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');
    const tabControls = document.querySelectorAll('[data-tab-controls]');
    let active = null;

    function register(id, { init, onShow } = {}) {
      tabs[id] = { init, onShow, initialized: false };
    }

    // history: false when restoring a tab from Back (popstate), where the
    // browser has already set the URL. A tab-bar switch replaces the
    // current entry rather than pushing one (see navPush) -- except over a
    // drill-in (a profile, a game opened from elsewhere), which it would
    // erase: that one is kept and the switch pushes above it, noting the
    // tab it left (`over`). Tapping that tab again steps back to it rather
    // than stacking a second entry for the same screen.
    function switchTo(id, { history: touchHistory = true } = {}) {
      const here = (touchHistory && history.state) || {};
      if (touchHistory && here.over === id && id !== active) {
        try { history.back(); return; } catch (e) {}
      }
      if (!tabs[id] || id === active) return;
      // Before the panels change, so the entry left keeps its own scroll.
      if (touchHistory) {
        if (here.profile || here.game) navPush({ tab: id, over: here.tab });
        else try { history.replaceState({ tab: id, ...(here.over ? { over: here.over } : {}) }, '', '#' + id); } catch (e) {}
      }
      tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      tabPanels.forEach(p => { p.hidden = p.dataset.tabPanel !== id; });
      tabControls.forEach(c => { c.hidden = c.dataset.tabControls !== id; });
      const tab = tabs[id];
      if (!tab.initialized) { if (tab.init) tab.init(); tab.initialized = true; }
      if (tab.onShow) tab.onShow();
      active = id;
    }

    function init(defaultId) {
      tabBtns.forEach(btn => btn.addEventListener('click', () => switchTo(btn.dataset.tab)));
      // Schedule and Roster were their own tabs before Team took both in.
      const fromHash = { schedule: 'team', roster: 'team' }[location.hash.slice(1)] || location.hash.slice(1);
      switchTo(tabs[fromHash] ? fromHash : defaultId);
    }

    return { register, switchTo, init, current: () => active };
  })();

  // ---- History ----
  // Drill-ins -- opening a player, opening a game from elsewhere -- push an
  // entry describing the screen: { tab, profile, from, depth } for a
  // player, { tab, game: { date, pk } } for a game. Back lands on the
  // previous entry and popstate (below) puts that screen back: the tab,
  // the Players tab's list or profile, the game, and the scroll position
  // recorded on the entry when the reader left it. Tab-bar switches
  // replace the current entry instead, so Back doesn't walk through every
  // tab that was tapped.
  function navPush(state) {
    try {
      const here = history.state || { tab: Tabs.current() };
      const listKey = here.tab === 'players' && !here.profile ? playerListCacheKey() : undefined;
      history.replaceState({ ...here, scrollY: window.scrollY, listKey }, '', location.hash);
      history.pushState(state, '', '#' + state.tab);
    } catch (e) {}
  }
  function navReplace(state) {
    try { history.replaceState(state, '', '#' + state.tab); } catch (e) {}
  }
  window.addEventListener('popstate', (e) => {
    const st = e.state || { tab: location.hash.slice(1) };
    // A popup closing (by Back, or closeOverlay's own step back) leaves the
    // screen beneath as it was -- nothing else to restore.
    const closedModals = modalStack.some(id => !((st.modals || []).includes(id)));
    if (syncModalsToHistory(st) || closedModals) return;
    if (!st.tab) return;
    Tabs.switchTo(st.tab, { history: false });
    if (st.tab === 'players') {
      if (st.profile) {
        if (playersView !== 'profile' || Number(lastProfilePerson && lastProfilePerson.id) !== st.profile) {
          showPlayerProfile({ id: st.profile, fullName: '' }, { history: false, tab: st.profileTab || 'ov' });
        } else if ((st.profileTab || 'ov') !== profileTab) {
          showProfileTab(st.profileTab || 'ov');
        }
      } else if (playersView === 'profile') {
        showPlayerList();
      }
    } else if (st.tab === 'scorecard' && st.game && st.game.pk !== Number(currentGamePk)) {
      setDateInputValue(dateInput, dateInputText, st.game.date);
      loadSchedule(st.game.date, st.game.pk);
    }
    // A list entry's scroll belongs to that list -- if the Batters/Pitchers
    // toggle has since switched which list shows, start it at the top.
    const scrollY = st.listKey && st.listKey !== playerListCacheKey() ? 0 : st.scrollY;
    if (scrollY != null) requestAnimationFrame(() => window.scrollTo(0, scrollY));
  });

  const playerSearchInput = document.getElementById('playerSearchInput');
  const playerSearchResults = document.getElementById('playerSearchResults');
  const playersBody = document.getElementById('playersBody');
  let playerSearchDebounce = null;
  let playerSearchRequestId = 0;
  let playerProfileRequestId = 0;
  // Holds the last search response so selecting a result can reuse the
  // fields already returned (name, position, team) instead of a second
  // fetch to /people/{id} for the same data.
  let currentPlayerSearchResults = [];

  async function searchPlayers(query) {
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/people/search?names=${encodeURIComponent(query)}&hydrate=currentTeam`);
      const data = await res.json();
      return data.people || [];
    } catch (e) {
      return [];
    }
  }

  function playerMetaLine(person) {
    return [
      person.currentTeam && person.currentTeam.name,
      person.primaryPosition && person.primaryPosition.abbreviation
    ].filter(Boolean).join(' &#183; ');
  }
  function renderPlayerSearchResults(people) {
    if (!people.length) {
      playerSearchResults.innerHTML = '<div class="player-search-empty">No players found.</div>';
      return;
    }
    playerSearchResults.innerHTML = people.map(p => {
      const meta = playerMetaLine(p);
      return `<div class="player-search-result" data-player-id="${p.id}">
        <span>${p.fullName}</span>
        ${meta ? `<span class="psr-meta">${meta}</span>` : ''}
      </div>`;
    }).join('');
  }

  playerSearchInput.addEventListener('input', () => {
    const query = playerSearchInput.value.trim();
    clearTimeout(playerSearchDebounce);
    if (query.length < 2) {
      playerSearchResults.hidden = true;
      return;
    }
    playerSearchDebounce = setTimeout(async () => {
      const requestId = ++playerSearchRequestId;
      const people = await searchPlayers(query);
      if (requestId !== playerSearchRequestId) return;

      playerSearchResults.hidden = false;
    }, 300);
  });

  playerSearchResults.addEventListener('pointerdown', (e) => {
    const item = e.target.closest('.player-search-result');
    const person = item && currentPlayerSearchResults.find(p => String(p.id) === item.getAttribute('data-player-id'));
    if (person) prefetchProfile(person, playerListState.season || defaultListSeason);
  });
  playerSearchResults.addEventListener('click', (e) => {
    const item = e.target.closest('.player-search-result');
    if (!item) return;
    const person = currentPlayerSearchResults.find(p => String(p.id) === item.getAttribute('data-player-id'));
    playerSearchResults.hidden = true;
    if (!person) return;
    playerSearchInput.value = person.fullName;
    showPlayerProfile(person);
  });

  // Switching Batters/Pitchers always re-shows the list (even re-clicking
  // the already-active one) -- since the toggle lives in the persistent
  // controls row rather than inside playersBody, this doubles as the "back
  // to the list" affordance from a profile opened off a list row or a
  // search result.
  const playerListViewToggle = document.getElementById('playerListViewToggle');
  // On the list, the toggle shows which list it is. On a profile neither
  // half is lit -- a pitcher opened from search while browsing Batters
  // isn't a batter -- though either half still jumps to that list.
  function syncPlayerToggle() {
    playerListViewToggle.querySelectorAll('.view-toggle-btn').forEach(b => {
      const on = playersView === 'list' && b.dataset.view === playerListState.type;

    });
  }
  // Leaving a profile for the list. Opened from the list (however many

  // Opened from another tab, there's no list entry behind it, so show the
  // list in place of the profile entry.
  function leaveProfileForList() {
    const st = history.state || {};

      navReplace({ tab: 'players' });

    }
  }
  playerListViewToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('.view-toggle-btn');
    if (!btn) return;

    playerListState.type = btn.dataset.view;

  });

  // Delegated for the list's own re-renders (sorting redraws the whole
  // table) -- a header click re-sorts in place. Row navigation goes through
  // each row's own nameplate button (renderPlayerNameplate) and the shared

  // listener here.
  playersBody.addEventListener('click', (e) => {
    const th = e.target.closest('.player-list-table th[data-sort-key]');
    if (!th) return;
    const key = th.getAttribute('data-sort-key');
    const current = playerListSort[playerListState.type];
    const columns = playerListState.type === 'pitching' ? PITCHER_LIST_COLUMNS : BATTER_LIST_COLUMNS;
    const column = columns.find(c => c.key === key);
    current.dir = current.key === key ? (current.dir === 'asc' ? 'desc' : 'asc') : column.dir;
    current.key = key;

  });

  // Profile controls: the back link, the profile's own tab row, and Game
  // Log dates (each opens that game's scorecard).
  playersBody.addEventListener('click', (e) => {
    if (e.target.closest('.pp-back')) { leaveProfileForList(); return; }
    const tab = e.target.closest('.pp-tab');
    if (tab) {
      // A switch within the profile, so it replaces the entry rather than
      // pushing one -- but the entry keeps it, so Back to this player
      // lands on the same tab.
      try {
        if (history.state && history.state.profile) history.replaceState({ ...history.state, profileTab: tab.dataset.ppTab }, '', location.hash);
      } catch (err) {}

      return;
    }
    const arsSide = e.target.closest('[data-ars-side]');
    if (arsSide) {
      profileArsenalSide = arsSide.dataset.arsSide;
      rerenderPlayerProfile();
      return;
    }
    const pool = e.target.closest('[data-def-pool]');
    if (pool) {
      profileDefensePool = pool.dataset.defPool;
      profileCatchTier = null;
      profileOpenRow = null;
      rerenderPlayerProfile();
      return;
    }
    const tier = e.target.closest('.pp-cb-row[data-cb-tier]');
    if (tier) {
      const stars = Number(tier.dataset.cbTier);

      if (again) again.focus({ preventScroll: true });

    }
    const openRow = e.target.closest('[data-open-row]');
    if (openRow) {
      const key = openRow.dataset.openRow;
      profileOpenRow = profileOpenRow === key ? null : key;
      rerenderPlayerProfile();
      const again = playersBody.querySelector(`[data-open-row="${key}"]`);
      if (again) again.focus({ preventScroll: true });
      return;
    }
    const playClip = e.target.closest('[data-play-clip]');
    if (playClip) {
      showClipModal(playClip.dataset.playClip, { head: `<div class="cv-head">${playClip.dataset.clipHead || ''}</div>` });
      return;
    }
    if (e.target.closest('[data-hl-all]')) {
      profileHighlightsAll = true;
      rerenderPlayerProfile();
      return;
    }
    const hl = e.target.closest('[data-hl-index]');
    if (hl) {
      const h = lastProfilePlays && lastProfilePlays.highlights[Number(hl.dataset.hlIndex)];
      if (h) showClipModal(h.playId, { head: '<div class="cv-head"><span class="cv-result">Highlight</span></div>', clip: { mp4: h.mp4, title: h.headline, date: h.date, gamePk: h.gamePk, matchup: h.matchup } });
      return;
    }
    const catchBtn = e.target.closest('.pp-cb-catch');
    if (catchBtn) {
      const play = lastProfileCatches && lastProfileCatches.plays.find(p => p.playId === catchBtn.dataset.playId);
      if (play) showCatchModal(play);
      return;
    }
    const gameLink = e.target.closest('.pp-game-link, .pp-game-link-card');
    if (gameLink) jumpToScorecardGame(gameLink.dataset.date, Number(gameLink.dataset.gamePk));
  });

  // Starts chart readout -- pointer events cover mouse hover and a tap on
  // touch screens alike. The column under the pointer is looked up from
  // the same profileStarts() list the chart was drawn from.
  function updateStartsTip(e) {
    const hit = e.target.closest && e.target.closest('.pp-chart-hit');
    if (!hit || !lastProfileDetail) return;
    const chart = hit.closest('.pp-chart');
    const svg = hit.ownerSVGElement;
    const starts = profileStarts(lastProfileDetail.gameLog);
    const vb = svg.viewBox.baseVal;
    const rect = svg.getBoundingClientRect();
    const colW = Number(hit.dataset.colW);
    const left = Number(hit.getAttribute('x'));
    const svgX = (e.clientX - rect.left) / rect.width * vb.width;
    const i = Math.max(0, Math.min(starts.length - 1, Math.floor((svgX - left) / colW)));
    const s = starts[i];
    const col = svg.querySelector('.pp-chart-col');
    col.setAttribute('x', left + i * colW);
    col.setAttribute('opacity', '0.1');
    const tip = chart.querySelector('.pp-chart-tip');
    tip.innerHTML = `${formatShortDate(s.date)} ${s.isHome ? 'vs' : '@'} ${teamNickname(s.opp)}<br>${s.ip} IP &#183; ${s.er} ER &#183; ${s.k} K${s.qs ? ' &#183; QS' : ''}`;
    const chartRect = chart.getBoundingClientRect();
    tip.style.left = (rect.left - chartRect.left + chart.scrollLeft + (left + (i + 0.5) * colW) / vb.width * rect.width) + 'px';
    tip.classList.add('is-on');
  }
  // The Starts chart is sized from the sheet's width at render time, so a
  // resize or rotation redraws it rather than leaving it at the old width.
  let startsResizeTimer = null;
  window.addEventListener('resize', () => {
    if (playersView !== 'profile' || profileTab !== 'starts') return;
    clearTimeout(startsResizeTimer);
    startsResizeTimer = setTimeout(rerenderPlayerProfile, 150);
  });
  playersBody.addEventListener('pointermove', updateStartsTip);
  playersBody.addEventListener('pointerdown', updateStartsTip);
  playersBody.addEventListener('pointerout', (e) => {
    const hit = e.target.closest && e.target.closest('.pp-chart-hit');
    if (!hit) return;
    const chart = hit.closest('.pp-chart');
    chart.querySelector('.pp-chart-tip').classList.remove('is-on');
    hit.ownerSVGElement.querySelector('.pp-chart-col').setAttribute('opacity', '0');
  });

  // A league switch drops a team pick from the other league (it would
  // otherwise leave an always-empty list); a season or pool switch drops
  // it too, since that team may not exist in the newly fetched rows.
  playersBody.addEventListener('change', (e) => {
    const sel = e.target.closest('.player-filters select[data-filter]');
    if (!sel) return;
    const filter = sel.getAttribute('data-filter');
    const value = sel.value;
    if (filter === 'season') {
      playerListState.season = Number(value);
      playerListState.team = 'all';
    } else if (filter === 'pool') {
      playerListState.pool = value;
    } else if (filter === 'league') {
      playerListState.league = value;
      playerListState.team = 'all';
    } else {
      playerListState[filter] = value;
    }
    showPlayerList();
  });

  // A traded player's season comes back as one split per team stint --
  // this sums the underlying counting stats per season and recomputes the
  // rate stats from them, rather than averaging the already-rounded
  // per-stint rates (which would drift from the real combined average).
  function collapseCareerByYear(splits) {
    const bySeason = new Map();
    splits.forEach(s => {
      const stat = s.stat || {};
      let agg = bySeason.get(s.season);
      if (!agg) {
        agg = { season: s.season, teams: [], gamesPlayed: 0, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, baseOnBalls: 0, hitByPitch: 0, sacFlies: 0, totalBases: 0, stolenBases: 0, caughtStealing: 0, plateAppearances: 0 };
        bySeason.set(s.season, agg);
      }
      const teamName = s.team && teamNickname(s.team);
      if (teamName && !agg.teams.includes(teamName)) agg.teams.push(teamName);
      agg.gamesPlayed += stat.gamesPlayed || 0;
      agg.atBats += stat.atBats || 0;
      agg.hits += stat.hits || 0;
      agg.doubles += stat.doubles || 0;
      agg.triples += stat.triples || 0;
      agg.homeRuns += stat.homeRuns || 0;
      agg.baseOnBalls += stat.baseOnBalls || 0;
      agg.hitByPitch += stat.hitByPitch || 0;
      agg.sacFlies += stat.sacFlies || 0;
      agg.totalBases += stat.totalBases || 0;
      agg.stolenBases += stat.stolenBases || 0;
      agg.caughtStealing += stat.caughtStealing || 0;
      agg.plateAppearances += stat.plateAppearances || 0;
    });
    return Array.from(bySeason.values()).sort((a, b) => Number(a.season) - Number(b.season));
  }

  // Matches the API's own rate-stat formatting (".287", no leading zero).
  function formatRate(numerator, denominator) {
    if (!denominator) return '&#8212;';
    const value = numerator / denominator;
    const fixed = value.toFixed(3);
    return value < 1 ? fixed.slice(1) : fixed;
  }

  // Basic wOBA, per FanGraphs' own recommended simplified formula:
  // (.7*(BB+HBP) + .9*1B + 1.25*2B + 1.6*3B + 2*HR) / PA -- fixed generic
  // weights, not the year-specific, park-adjusted constants FanGraphs uses
  // for its own site figures, and BB here includes IBB since intentional
  // walks aren't broken out in the stats this pulls. Works on both the
  // collapsed per-season aggregate and a raw API stat object -- both use
  // these same field names.
  const WOBA_WEIGHTS = { bbHbp: 0.7, single: 0.9, double: 1.25, triple: 1.6, hr: 2 };
  // Numeric wOBA, or null if PA is 0 -- kept separate from computeWOBAPlus
  // so getLeagueWOBA can reuse it on a season's summed totals too.
  function rawWOBA(stat) {
    const plateAppearances = stat.plateAppearances || 0;
    if (!plateAppearances) return null;
    const baseOnBalls = stat.baseOnBalls || 0;
    const hitByPitch = stat.hitByPitch || 0;
    const doubles = stat.doubles || 0;
    const triples = stat.triples || 0;
    const homeRuns = stat.homeRuns || 0;
    const singles = (stat.hits || 0) - doubles - triples - homeRuns;
    const numerator = WOBA_WEIGHTS.bbHbp * (baseOnBalls + hitByPitch) + WOBA_WEIGHTS.single * singles +
      WOBA_WEIGHTS.double * doubles + WOBA_WEIGHTS.triple * triples + WOBA_WEIGHTS.hr * homeRuns;
    return numerator / plateAppearances;
  }
  // wOBA+ = this stat line's wOBA over the league-wide wOBA for that same
  // season, times 100 -- same "100 = league average" scale as OPS+/ERA+.
  // leagueWoba is the season total this stat line's season maps to (see
  // getLeagueWOBA); missing it (fetch still in flight, or failed) reads as
  // "not yet known" rather than a false 0/misleading number. Split into a
  // numeric version too so the Players tab's sortable list can sort by the
  // real value instead of parsing computeWOBAPlus's rounded string back
  // apart.
  function wobaPlusValue(stat, leagueWoba) {
    if (!leagueWoba) return null;
    const value = rawWOBA(stat);
    return value == null ? null : (value / leagueWoba) * 100;
  }
  function computeWOBAPlus(stat, leagueWoba) {
    const value = wobaPlusValue(stat, leagueWoba);
    if (value == null) return '&#8212;';
    return String(Math.round(value));
  }
  // League-wide wOBA for a season (wOBA+'s denominator), plus how many
  // games each team has played so far -- the latter is what the Players
  // tab's list view uses to prorate the standard batting-title/ERA-title
  // qualifier (3.1 PA / 1 IP per team game) for an in-progress season. The
  // API has no single "league totals" stat endpoint, so this sums every
  // team's season hitting totals instead -- fetched once per season and
  // shared across every profile opened (rawWOBA works the same on these
  // summed totals as on a single stat line, since it's a plain ratio of the
  // same fields), with teamGamesPlayed read off the same response (every
  // team's played the same game count give or take a rainout, so the max
  // across all 30 is a fine stand-in for "the season's" game count).
  // Mirrors fetchGameStats' isFinal split: a past season's totals never
  // change once the season is over, so those are cached indefinitely, but
  // the current season's keep shifting game to game, so a transient
  // failure there isn't cached -- the next call just retries.
  const leagueSeasonInfoCache = {};
  // The current season's is also kept, but only for a few minutes, so a
  // run of profile opens doesn't refetch it each time.
  const LEAGUE_INFO_FRESH_MS = 5 * 60 * 1000;
  const currentLeagueInfo = {};
  async function getLeagueSeasonInfo(season) {
    const isPastSeason = Number(season) < new Date().getFullYear();
    if (isPastSeason && leagueSeasonInfoCache[season] !== undefined) return leagueSeasonInfoCache[season];
    const recent = currentLeagueInfo[season];
    if (!isPastSeason && recent && Date.now() - recent.at < LEAGUE_INFO_FRESH_MS) return recent.info;
    return once(`league-${season}`, () => getLeagueSeasonInfoNow(season, isPastSeason));
  }
  async function getLeagueSeasonInfoNow(season, isPastSeason) {
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/teams/stats?stats=season&group=hitting&season=${season}&sportId=1`);
      const data = await res.json();
      const splits = (data.stats && data.stats[0] && data.stats[0].splits) || [];
      const totals = { plateAppearances: 0, baseOnBalls: 0, hitByPitch: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0 };
      let teamGamesPlayed = 0;
      splits.forEach(s => {
        const stat = s.stat || {};
        totals.plateAppearances += stat.plateAppearances || 0;
        totals.baseOnBalls += stat.baseOnBalls || 0;
        totals.hitByPitch += stat.hitByPitch || 0;
        totals.hits += stat.hits || 0;
        totals.doubles += stat.doubles || 0;
        totals.triples += stat.triples || 0;
        totals.homeRuns += stat.homeRuns || 0;
        teamGamesPlayed = Math.max(teamGamesPlayed, stat.gamesPlayed || 0);
      });
      const info = { woba: rawWOBA(totals), teamGamesPlayed };
      if (isPastSeason) leagueSeasonInfoCache[season] = info;
      else currentLeagueInfo[season] = { info, at: Date.now() };
      return info;
    } catch (e) {
      const info = { woba: null, teamGamesPlayed: 0 };
      if (isPastSeason) leagueSeasonInfoCache[season] = info;
      return info;
    }
  }
  async function getLeagueWOBA(season) {
    const info = await getLeagueSeasonInfo(season);
    return info.woba;
  }

  // Stolen bases as "made/attempted" (e.g. "20/24") instead of separate
  // SB/CS columns -- reads the attempt rate at a glance the way a broadcast
  // graphic would. null/undefined sb means the stat wasn't in the payload at
  // all (as opposed to a real 0), so that's the only case that falls back to
  // the table's usual em dash.
  function formatStolenBases(sb, cs) {
    if (sb == null) return '&#8212;';
    return `${sb}/${sb + (cs || 0)}`;
  }

  // leagueWobaBySeason: season -> league wOBA for wOBA+ (see getLeagueWOBA);
  // {} while that second round of fetches is still in flight, in which case
  // wOBA+ just reads as "&#8212;" until loadCareerLeagueWoba re-renders.
  function renderCareerTable(splits, leagueWobaBySeason) {
    const stintsBySeason = new Map();
    splits.forEach(s => {
      if (!stintsBySeason.has(s.season)) stintsBySeason.set(s.season, []);
      stintsBySeason.get(s.season).push(s);
    });
    const years = collapseCareerByYear(splits);
    const rows = years.map(y => {
      const team = y.teams.length > 1 ? 'Multiple' : (y.teams[0] || '&#8212;');
      const avg = formatRate(y.hits, y.atBats);
      const obp = formatRate(y.hits + y.baseOnBalls + y.hitByPitch, y.atBats + y.baseOnBalls + y.hitByPitch + y.sacFlies);
      const slg = formatRate(y.totalBases, y.atBats);
      // OPS as the API reports it: the rounded OBP plus the rounded SLG.
      const obpDen = y.atBats + y.baseOnBalls + y.hitByPitch + y.sacFlies;
      const ops = y.atBats && obpDen
        ? formatRate(Number(((y.hits + y.baseOnBalls + y.hitByPitch) / obpDen).toFixed(3)) + Number((y.totalBases / y.atBats).toFixed(3)), 1)
        : '&#8212;';
      const leagueWoba = leagueWobaBySeason[y.season];
      const wobaPlus = computeWOBAPlus(y, leagueWoba);
      const sb = formatStolenBases(y.stolenBases, y.caughtStealing);
      const yearRow = `<tr class="career-year-row"><td>${y.season}</td><td>${team}</td><td>${y.gamesPlayed}</td><td>${avg}</td><td>${obp}</td><td>${slg}</td><td>${ops}</td><td>${wobaPlus}</td><td>${y.doubles}</td><td>${y.triples}</td><td>${y.homeRuns}</td><td>${sb}</td></tr>`;
      const stints = stintsBySeason.get(y.season) || [];
      const subRows = stints.length > 1
        ? stints.map(s => {
            const stat = s.stat || {};
            const teamName = (s.team && teamNickname(s.team)) || '&#8212;';
            return `<tr class="career-team-subrow"><td></td><td>${teamName}</td><td>${stat.gamesPlayed ?? '&#8212;'}</td><td>${stat.avg ?? '&#8212;'}</td><td>${stat.obp ?? '&#8212;'}</td><td>${stat.slg ?? '&#8212;'}</td><td>${stat.ops ?? '&#8212;'}</td><td>${computeWOBAPlus(stat, leagueWoba)}</td><td>${stat.doubles ?? '&#8212;'}</td><td>${stat.triples ?? '&#8212;'}</td><td>${stat.homeRuns ?? '&#8212;'}</td><td>${formatStolenBases(stat.stolenBases, stat.caughtStealing)}</td></tr>`;
          }).join('')
        : '';
      return yearRow + subRows;
    });
    return `<div class="table-scroll"><table class="pitch-table career-table">
        <thead><tr><th>Year</th><th>Team</th><th>G</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>wOBA+</th><th>2B</th><th>3B</th><th>HR</th><th>SB</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table></div>`;
  }

  function isPitcher(person) {
    const pos = person && person.primaryPosition;
    return !!(pos && (pos.type === 'Pitcher' || pos.abbreviation === 'P'));
  }

  // "13.2" (13 innings, 2 outs) <-> 41 outs -- the API's inningsPitched
  // string uses the two out-digits as a base-3 fraction, not decimal
  // tenths, so it has to be converted to a plain out count before summing
  // across stints or seasons.
  function ipToOuts(ip) {
    if (ip == null) return 0;
    const [whole, frac] = String(ip).split('.');
    return (parseInt(whole, 10) || 0) * 3 + (parseInt(frac, 10) || 0);
  }
  function formatIP(outs) {
    return `${Math.floor(outs / 3)}.${outs % 3}`;
  }
  function formatERA(earnedRuns, outs) {
    if (!outs) return '&#8212;';
    return (earnedRuns * 27 / outs).toFixed(2);
  }
  function formatWHIP(baseOnBalls, hits, outs) {
    if (!outs) return '&#8212;';
    return ((baseOnBalls + hits) * 3 / outs).toFixed(2);
  }
  // Numeric K%-BB%, or null if no batters faced -- split out so the
  // Players tab's sortable list can sort by the real value instead of
  // parsing formatKBB's "12.3%" string back apart.
  function rawKBB(strikeOuts, baseOnBalls, battersFaced) {
    if (!battersFaced) return null;
    return ((strikeOuts - baseOnBalls) / battersFaced) * 100;
  }
  function formatKBB(strikeOuts, baseOnBalls, battersFaced) {
    const value = rawKBB(strikeOuts, baseOnBalls, battersFaced);
    return value == null ? '&#8212;' : `${value.toFixed(1)}%`;
  }

  // Mirrors collapseCareerByYear, but for pitching: sums innings as outs
  // (see ipToOuts) and battersFaced so ERA/WHIP/K%-BB% can be recomputed
  // for the combined season rather than averaging already-rounded rates.
  function collapsePitchingCareerByYear(splits) {
    const bySeason = new Map();
    splits.forEach(s => {
      const stat = s.stat || {};
      let agg = bySeason.get(s.season);
      if (!agg) {
        agg = { season: s.season, teams: [], gamesPitched: 0, outs: 0, earnedRuns: 0, hits: 0, baseOnBalls: 0, strikeOuts: 0, battersFaced: 0 };
        bySeason.set(s.season, agg);
      }
      const teamName = s.team && teamNickname(s.team);
      if (teamName && !agg.teams.includes(teamName)) agg.teams.push(teamName);
      agg.gamesPitched += stat.gamesPitched ?? stat.gamesPlayed ?? 0;
      agg.outs += ipToOuts(stat.inningsPitched);
      agg.earnedRuns += stat.earnedRuns || 0;
      agg.hits += stat.hits || 0;
      agg.baseOnBalls += stat.baseOnBalls || 0;
      agg.strikeOuts += stat.strikeOuts || 0;
      agg.battersFaced += stat.battersFaced || 0;
    });
    return Array.from(bySeason.values()).sort((a, b) => Number(a.season) - Number(b.season));
  }

  function renderPitchingCareerTable(splits) {
    const stintsBySeason = new Map();
    splits.forEach(s => {
      if (!stintsBySeason.has(s.season)) stintsBySeason.set(s.season, []);
      stintsBySeason.get(s.season).push(s);
    });
    const rows = collapsePitchingCareerByYear(splits).map(y => {
      const team = y.teams.length > 1 ? 'Multiple' : (y.teams[0] || '&#8212;');
      const era = formatERA(y.earnedRuns, y.outs);
      const whip = formatWHIP(y.baseOnBalls, y.hits, y.outs);
      const kbb = formatKBB(y.strikeOuts, y.baseOnBalls, y.battersFaced);
      const yearRow = `<tr class="career-year-row"><td>${y.season}</td><td>${team}</td><td>${y.gamesPitched}</td><td>${formatIP(y.outs)}</td><td>${era}</td><td>${whip}</td><td>${kbb}</td><td>${y.strikeOuts}</td><td>${y.baseOnBalls}</td></tr>`;
      const stints = stintsBySeason.get(y.season) || [];
      const subRows = stints.length > 1
        ? stints.map(s => {
            const stat = s.stat || {};
            const teamName = (s.team && teamNickname(s.team)) || '&#8212;';
            const kbbSub = formatKBB(stat.strikeOuts, stat.baseOnBalls, stat.battersFaced);
            return `<tr class="career-team-subrow"><td></td><td>${teamName}</td><td>${stat.gamesPitched ?? stat.gamesPlayed ?? '&#8212;'}</td><td>${stat.inningsPitched ?? '&#8212;'}</td><td>${stat.era ?? '&#8212;'}</td><td>${stat.whip ?? '&#8212;'}</td><td>${kbbSub}</td><td>${stat.strikeOuts ?? '&#8212;'}</td><td>${stat.baseOnBalls ?? '&#8212;'}</td></tr>`;
          }).join('')
        : '';
      return yearRow + subRows;
    });
    return `<div class="table-scroll"><table class="pitch-table career-table">
        <thead><tr><th>Year</th><th>Team</th><th>G</th><th>IP</th><th>ERA</th><th>WHIP</th><th>K%-BB%</th><th>SO</th><th>BB</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table></div>`;
  }

  // Players tab's browsable list -- every player with a current-season stat
  // line in this group, unfiltered (the API has no server-side batting-
  // title/ERA-title qualifier param as far as this file uses it). Filtered
  // down to qualified players client-side by renderPlayerListPanel using
  // getLeagueSeasonInfo's teamGamesPlayed. Cached like standingsCache
  // (both success and failure) rather than fetchGameStats'
  // isFinal split -- this is a browse list the user can just re-open the
  // tab to refresh, not a value baked into a stat the rest of the session
  // depends on staying fresh.
  //
  // Returns null on failure (never cached, so reopening the tab retries)
  // rather than [] -- an empty list is a real answer ("nobody qualified"),
  // a failed request isn't, and the list renders the two differently.
  //
  // pool 'qualified' is the API's own batting/ERA-title qualifier; 'all'
  // is everyone who appeared. A traded player comes back as one combined
  // row whose team/league is his latest club, with numTeams counting the
  // others. Pitchers' hitting lines and position players' mop-up innings
  // are dropped so each list only holds its own kind of player.
  const seasonPlayerStatsCache = {};
  async function getSeasonPlayerStats(group, season, pool = 'qualified') {
    const key = `${season}-${group}-${pool}`;
    if (seasonPlayerStatsCache[key] !== undefined) return seasonPlayerStatsCache[key];
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/stats?stats=season&group=${group}&sportId=1&season=${season}&limit=3000&playerPool=${pool === 'all' ? 'ALL' : 'QUALIFIED'}`);
      if (!res.ok) return null;
      const data = await res.json();
      const splits = (data.stats && data.stats[0] && data.stats[0].splits) || [];
      const rows = splits
        .filter(s => s.player && s.player.id != null)
        .map(s => ({
          id: s.player.id,
          name: s.player.fullName || '',
          team: (s.team && teamNickname(s.team)) || '&#8212;',
          teamId: s.team ? s.team.id : null,
          leagueId: s.league ? s.league.id : null,
          numTeams: s.numTeams || 1,
          pos: (s.position && s.position.abbreviation) || '',
          season,
          stat: s.stat || {}
        }))
        .filter(r => group === 'pitching' ? (r.pos === 'P' || r.pos === 'TWP') : r.pos !== 'P');
      seasonPlayerStatsCache[key] = rows;
      return rows;
    } catch (e) {
      return null;
    }
  }

  // The list opens on the most recent season that has started -- from
  // New Year's until Opening Day the calendar year has no stats yet, and
  // the list would come up empty. A failed lookup falls back to the
  // calendar year (the old behavior) and isn't cached, so it retries.
  let defaultListSeason = null;
  async function getDefaultListSeason() {
    if (defaultListSeason) return defaultListSeason;
    const year = new Date().getFullYear();
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/seasons/${year}?sportId=1`);
      const data = await res.json();
      const start = data.seasons && data.seasons[0] && data.seasons[0].regularSeasonStartDate;
      if (!start) return year;
      defaultListSeason = todayStr() < start ? year - 1 : year;
      return defaultListSeason;
    } catch (e) {
      return year;
    }
  }
  const PLAYER_LIST_FIRST_SEASON = 2000;

  const AL_LEAGUE_ID = 103;
  const NL_LEAGUE_ID = 104;
  // Scorebook abbreviations for single positions, words for the groups --
  // each sized to fit its fixed-width slot (see .player-filters).
  const BATTER_POSITION_FILTERS = [
    ['all', 'All'], ['C', 'C'], ['IF', 'Infield'], ['1B', '1B'], ['2B', '2B'], ['3B', '3B'], ['SS', 'SS'],
    ['OF', 'Outfield'], ['LF', 'LF'], ['CF', 'CF'], ['RF', 'RF'], ['DH', 'DH']
  ];
  const PITCHER_POSITION_FILTERS = [['all', 'All'], ['SP', 'Starters'], ['RP', 'Relievers']];

  // The API lists every pitcher as plain "P", so starter/reliever is read
  // off his usage instead: a starter is anyone who started at least half
  // the games he pitched in.
  function isStartingPitcher(stat) {
    const gp = stat.gamesPitched || stat.gamesPlayed || 0;
    return gp > 0 && (stat.gamesStarted || 0) * 2 >= gp;
  }
  function matchesPositionFilter(row, type, pos) {
    if (pos === 'all') return true;
    if (type === 'pitching') return (pos === 'SP') === isStartingPitcher(row.stat);
    if (pos === 'IF') return row.pos === '1B' || row.pos === '2B' || row.pos === '3B' || row.pos === 'SS';
    if (pos === 'OF') return row.pos === 'LF' || row.pos === 'CF' || row.pos === 'RF';
    return row.pos === pos;
  }
  function applyPlayerListFilters(rows) {
    const { type, league, team, pos } = playerListState;
    return rows.filter(r =>
      (league === 'all' || r.leagueId === Number(league)) &&
      (team === 'all' || r.teamId === Number(team)) &&
      matchesPositionFilter(r, type, pos));
  }

  // Column definitions for the Players tab's sortable list -- get() returns
  // the raw sort value (a number, or a string for name/team; null/undefined
  // sorts to the bottom regardless of direction) and render() the display
  // string, so both a click-to-sort and the table body share one source of
  // truth per column. ctx carries the one piece of per-render context a
  // column's own row data can't supply: the season's league wOBA.
  // Same nameplate button used everywhere else a player name is clickable
  // (roster rows, HR leaders, box scores) -- potg-player-name routes the
  // shared document-level .player-name-btn handler straight to the full
  // profile (jumpToPlayerProfile) instead of the quick-look modal, which
  // makes sense once we're already on the Players tab. jumpToPlayerProfile
  // reads the name back out of playerStore, so a row has to populate that
  // the same way the HR leaderboard does before it can be clicked.
  function renderPlayerNameplate(row) {
    playerStore[row.id] = { id: row.id, name: row.name, pos: '', team: row.team, season: row.season, todayStats: {} };
    return `<button type="button" class="player-name-btn potg-player-name" data-player-id="${row.id}">${row.name}</button>`;
  }

  // Same plate as the Standings tab's team names, and the same click
  // target (the team's win/loss chart) -- data-season tells the shared
  // handler which season to chart, since there's no Standings date to
  // read it from here. A traded player's "+1" notes that the combined line
  // also covers stints elsewhere, not just the club on the plate.
  function renderTeamNameplate(row) {
    if (!row.teamId) return row.team;
    const plate = `<button type="button" class="standings-team-btn" data-team-id="${row.teamId}" data-team-name="${row.team}" data-season="${row.season}">${row.team}</button>`;
    if (row.numTeams <= 1) return plate;
    const others = row.numTeams - 1;
    const note = `Stats also include ${others} other team${others === 1 ? '' : 's'} this season`;
    return `${plate}<span class="list-team-count" title="${note}" aria-label="${note}">+${others}</span>`;
  }

  const BATTER_LIST_COLUMNS = [
    { key: 'name', label: 'Player', dir: 'asc', get: r => r.name, render: renderPlayerNameplate },
    { key: 'team', label: 'Team', dir: 'asc', get: r => r.team, render: renderTeamNameplate },
    { key: 'g', label: 'G', dir: 'desc', get: r => r.stat.gamesPlayed ?? null, render: r => r.stat.gamesPlayed ?? '&#8212;' },
    { key: 'avg', label: 'AVG', dir: 'desc', get: r => r.stat.avg != null ? Number(r.stat.avg) : null, render: r => r.stat.avg ?? '&#8212;' },
    { key: 'obp', label: 'OBP', dir: 'desc', get: r => r.stat.obp != null ? Number(r.stat.obp) : null, render: r => r.stat.obp ?? '&#8212;' },
    { key: 'slg', label: 'SLG', dir: 'desc', get: r => r.stat.slg != null ? Number(r.stat.slg) : null, render: r => r.stat.slg ?? '&#8212;' },
    { key: 'wobaPlus', label: 'wOBA+', dir: 'desc',
      get: (r, ctx) => (ctx.leagueWoba ? wobaPlusValue(r.stat, ctx.leagueWoba) : null),
      render: (r, ctx) => computeWOBAPlus(r.stat, ctx.leagueWoba) },
    { key: 'hr', label: 'HR', dir: 'desc', get: r => r.stat.homeRuns ?? null, render: r => r.stat.homeRuns ?? '&#8212;' },
    { key: 'rbi', label: 'RBI', dir: 'desc', get: r => r.stat.rbi ?? null, render: r => r.stat.rbi ?? '&#8212;' },
    { key: 'sb', label: 'SB', dir: 'desc', get: r => r.stat.stolenBases ?? null, render: r => formatStolenBases(r.stat.stolenBases, r.stat.caughtStealing) }
  ];
  const PITCHER_LIST_COLUMNS = [
    { key: 'name', label: 'Player', dir: 'asc', get: r => r.name, render: renderPlayerNameplate },
    { key: 'team', label: 'Team', dir: 'asc', get: r => r.team, render: renderTeamNameplate },
    { key: 'g', label: 'G', dir: 'desc', get: r => r.stat.gamesPitched ?? r.stat.gamesPlayed ?? null, render: r => r.stat.gamesPitched ?? r.stat.gamesPlayed ?? '&#8212;' },
    { key: 'ip', label: 'IP', dir: 'desc', get: r => ipToOuts(r.stat.inningsPitched), render: r => r.stat.inningsPitched ?? '&#8212;' },
    { key: 'era', label: 'ERA', dir: 'asc', get: r => r.stat.era != null ? Number(r.stat.era) : null, render: r => r.stat.era ?? '&#8212;' },
    { key: 'whip', label: 'WHIP', dir: 'asc', get: r => r.stat.whip != null ? Number(r.stat.whip) : null, render: r => r.stat.whip ?? '&#8212;' },
    { key: 'kbb', label: 'K%-BB%', dir: 'desc',
      get: r => rawKBB(r.stat.strikeOuts, r.stat.baseOnBalls, r.stat.battersFaced),
      render: r => formatKBB(r.stat.strikeOuts, r.stat.baseOnBalls, r.stat.battersFaced) },
    { key: 'so', label: 'SO', dir: 'desc', get: r => r.stat.strikeOuts ?? null, render: r => r.stat.strikeOuts ?? '&#8212;' },
    { key: 'bb', label: 'BB', dir: 'asc', get: r => r.stat.baseOnBalls ?? null, render: r => r.stat.baseOnBalls ?? '&#8212;' }
  ];

  function compareListRows(a, b, column, dir, ctx) {
    const av = column.get(a, ctx);
    const bv = column.get(b, ctx);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return dir === 'asc' ? av - bv : bv - av;
  }

  function renderPlayerListTable(type, rows, sortKey, sortDir, ctx) {
    const columns = type === 'pitching' ? PITCHER_LIST_COLUMNS : BATTER_LIST_COLUMNS;
    const sortColumn = columns.find(c => c.key === sortKey) || columns[0];
    const sorted = rows.slice().sort((a, b) => compareListRows(a, b, sortColumn, sortDir, ctx));
    const headHtml = columns.map(c => {
      const active = c.key === sortColumn.key;
      const arrow = active ? (sortDir === 'asc' ? ' &#9650;' : ' &#9660;') : '';
      return `<th data-sort-key="${c.key}"${active ? ' class="sorted"' : ''}>${c.label}${arrow}</th>`;
    }).join('');
    const bodyHtml = sorted.map(row => {
      const cells = columns.map(c => `<td>${c.render(row, ctx)}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    // Fixed layout with set Player/Team widths -- auto layout sized every
    // column to whichever names happened to be showing, so each filter
    // change shifted the whole table sideways. --stat-cols feeds the CSS
    // min-width (see table.player-list-table) that keeps the stat columns
    // from squashing on a phone, where .table-scroll scrolls instead.
    const statCols = columns.length - 2;
    const colsHtml = '<col class="plc-player"><col class="plc-team">' + '<col>'.repeat(statCols);
    return `<div class="table-scroll"><table class="pitch-table player-list-table" style="--stat-cols: ${statCols}">
        <colgroup>${colsHtml}</colgroup>
        <thead><tr>${headHtml}</tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table></div>`;
  }

  // defaultValue is what the filter starts at -- a select still showing it
  // gets .is-default and recedes (see .player-filter select). Season has
  // none, since some season is always being narrowed to.
  function renderFilterSelect(id, label, options, value, defaultValue) {
    const opts = options.map(([v, text]) => `<option value="${v}"${String(v) === String(value) ? ' selected' : ''}>${text}</option>`).join('');
    const filter = id.replace('playerFilter', '').toLowerCase();
    const isDefault = defaultValue !== undefined && String(value) === String(defaultValue);
    return `<label class="player-filter player-filter-${filter}"><span class="player-filter-label">${label}</span><select id="${id}" data-filter="${filter}"${isDefault ? ' class="is-default"' : ''}>${opts}</select></label>`;
  }

  // Team choices come from the loaded rows themselves rather than the
  // fixed 30-team list, so a past season offers the clubs (and leagues)
  // as they actually were that year -- the Astros in the NL before 2013,
  // say. Before rows arrive there's nothing to offer but "All teams".
  function renderPlayerListFilters(rows) {
    const { type, season, pool, league, team, pos } = playerListState;
    const current = defaultListSeason || new Date().getFullYear();
    const seasons = [];
    for (let y = current; y >= PLAYER_LIST_FIRST_SEASON; y--) seasons.push([y, y]);
    const teamsById = new Map();
    (rows || []).forEach(r => {
      if (r.teamId && (league === 'all' || r.leagueId === Number(league))) teamsById.set(r.teamId, r.team);
    });
    const teamOptions = [['all', 'All'], ...Array.from(teamsById, ([id, name]) => [id, name]).sort((a, b) => a[1].localeCompare(b[1]))];
    const posOptions = type === 'pitching' ? PITCHER_POSITION_FILTERS : BATTER_POSITION_FILTERS;
    return `<div class="player-filters">
      ${renderFilterSelect('playerFilterSeason', 'Season', seasons, season)}
      ${renderFilterSelect('playerFilterLeague', 'League', [['all', 'Both'], [AL_LEAGUE_ID, 'American'], [NL_LEAGUE_ID, 'National']], league, 'all')}
      ${renderFilterSelect('playerFilterTeam', 'Team', teamOptions, team, 'all')}
      ${renderFilterSelect('playerFilterPos', 'Position', posOptions, pos, 'all')}
      ${renderFilterSelect('playerFilterPool', 'Players', [['qualified', 'Qualified'], ['all', 'All']], pool, 'qualified')}
    </div>`;
  }

  // rows === undefined means still loading, null means the fetch failed,
  // [] means loaded but nothing qualified. leagueWoba is only meaningful
  // (and only fetched) for the batting list.
  function renderPlayerListPanel(type, rows, sortKey, sortDir, leagueWoba) {
    let bodyHtml;
    if (rows === undefined) {
      bodyHtml = '<div class="mlb-status-msg">Loading season stats&#8230;</div>';
    } else if (rows === null) {
      bodyHtml = apiErrorMsg('season stats');
    } else {
      const filtered = applyPlayerListFilters(rows);
      const who = type === 'pitching' ? 'pitchers' : 'batters';
      const qualifier = playerListState.pool === 'qualified' ? 'qualified ' : '';
      // The ERA title needs an inning per team game, which relievers almost
      // never reach -- so Relievers + Qualified is nearly always empty.
      const relieverHint = playerListState.pos === 'RP' && playerListState.pool === 'qualified'
        ? ' Relievers rarely pitch enough innings to qualify &#8212; set Players to All to see them.' : '';
      bodyHtml = filtered.length
        ? `<div class="player-list-count">${filtered.length} ${qualifier}${who}</div>${renderPlayerListTable(type, filtered, sortKey, sortDir, { leagueWoba })}`
        : `<div class="pitch-empty">${rows.length ? `No ${qualifier}${who} match these filters.` : `No ${qualifier}${who} found for ${playerListState.season}.`}${relieverHint}</div>`;
    }
    return `<div class="sheet">${renderPlayerListFilters(rows)}${bodyHtml}</div>`;
  }

  // Rebuilds the whole panel, filters included -- so the select that
  // triggered the change gets its focus back afterward, or keyboard users
  // would be dropped back at the top of the page after every pick.
  function renderPlayerListInto(rows, leagueWoba) {
    const { type } = playerListState;
    const { key, dir } = playerListSort[type];
    const focusedId = document.activeElement && playersBody.contains(document.activeElement) ? document.activeElement.id : null;
    playersBody.innerHTML = renderPlayerListPanel(type, rows, key, dir, leagueWoba);
    if (focusedId) {
      const el = document.getElementById(focusedId);
      if (el) el.focus();
    }
  }

  // Standard batting-title/ERA-title qualification (3.1 PA / 1 IP per team
  // game, prorated by how many games the team's actually played so far)
  // rather than every player who's had a single plate appearance -- see
  // getLeagueSeasonInfo for where teamGamesPlayed comes from. Approximates
  // the real rule (which also lets a player who's short qualify if padding
  // their PA with hitless at-bats would still lead the league) by skipping
  // that edge case entirely.
  function filterQualifiedPlayers(type, rows, teamGamesPlayed) {
    if (!teamGamesPlayed) return rows;
    if (type === 'pitching') {
      const outsQualifier = teamGamesPlayed * 3;
      return rows.filter(r => ipToOuts(r.stat.inningsPitched) >= outsQualifier);
    }
    const paQualifier = teamGamesPlayed * 3.1;
    return rows.filter(r => (r.stat.plateAppearances || 0) >= paQualifier);
  }

  // Idle time on the list warms what a profile's Overview needs for its
  // group -- the season's Savant CSVs (slow to answer the first time) and
  // the full player pool -- so the first profile opened doesn't wait.
  // Each is fetched once a session.
  function warmProfileSavant(season, pitcher) {
    const idle = window.requestIdleCallback || (fn => setTimeout(fn, 300));
    idle(() => {
      getSavantSkillData(season, pitcher, true, true);
      getSeasonPlayerStats(pitcher ? 'pitching' : 'hitting', season, 'all');
    });
  }

  async function showPlayerList() {
    playersView = 'list';
    playerProfileRequestId++;
    playerSprayToken++;
    syncPlayerToggle();
    const requestId = ++playerListRequestId;
    if (playerListState.season == null) {
      renderPlayerListInto(undefined, null);
      const season = await getDefaultListSeason();
      if (requestId !== playerListRequestId) return;
      if (playerListState.season == null) playerListState.season = season;
    }
    const { type, season, pool } = playerListState;
    warmProfileSavant(season, type === 'pitching');
    const cached = playerListCache[playerListCacheKey()];
    if (cached) {
      renderPlayerListInto(cached.rows, cached.leagueWoba);
      return;
    }
    renderPlayerListInto(undefined, null);
    const group = type === 'pitching' ? 'pitching' : 'hitting';
    const [allRows, leagueInfo] = await Promise.all([
      getSeasonPlayerStats(group, season, pool),
      getLeagueSeasonInfo(season)
    ]);
    if (requestId !== playerListRequestId) return;
    if (allRows === null) {
      renderPlayerListInto(null, null);
      return;
    }
    const rows = pool === 'qualified' ? filterQualifiedPlayers(type, allRows, leagueInfo.teamGamesPlayed) : allRows;
    const leagueWoba = type === 'pitching' ? null : leagueInfo.woba;
    playerListCache[playerListCacheKey()] = { rows, leagueWoba };
    renderPlayerListInto(rows, leagueWoba);
  }

  // ---- Player profile ----------------------------------------------------
  // Header (photo, number, name, team/position, bio, awards) over a row of
  // tabs. The season tabs (Overview, Starts, Game Log, Splits) all read one
  // season: the Players list's season filter, so a profile opened off a
  // 2012 leaderboard shows 2012 and its ranks match that list's.

  // Everything the season tabs need in one request. A traded player's
  // season and each of his splits come back as one line per team plus a
  // teamless combined line -- pickCombinedStat takes the combined one.
  // Past seasons are final, so they're cached; the current one isn't (a
  // game may finish mid-session), and a failure is never cached, so
  // reopening the profile retries.
  const playerSeasonDetailCache = {};
  function pickCombinedStat(splits) {
    if (!splits.length) return null;
    const combined = splits.find(s => !s.team);
    if (combined) return combined.stat || null;
    return splits.length === 1 ? (splits[0].stat || null) : sumStatLines(splits.map(s => s.stat || {}));
  }
  const playerSeasonDetailRecent = {};
  async function getPlayerSeasonDetail(personId, season, group) {
    const key = `${personId}-${season}-${group}`;
    if (playerSeasonDetailCache[key]) return playerSeasonDetailCache[key];
    // A season in progress isn't kept, except for a minute -- long enough
    // for a prefetch that lands before the profile asks to still count.
    const recent = playerSeasonDetailRecent[key];
    if (recent && Date.now() - recent.at < 60 * 1000) return recent.detail;
    return once(`detail-${key}`, () => getPlayerSeasonDetailNow(personId, season, group, key));
  }
  async function getPlayerSeasonDetailNow(personId, season, group, key) {
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/people/${personId}/stats?stats=season,statSplits,gameLog&group=${group}&season=${season}&sitCodes=vl,vr,3,4,5,6,7,8,9`);
      if (!res.ok) return null;
      const data = await res.json();
      const byType = t => {
        const entry = (data.stats || []).find(s => s.type && s.type.displayName === t);
        return (entry && entry.splits) || [];
      };
      const splitsByDesc = {};
      byType('statSplits').forEach(s => {
        const desc = s.split && s.split.description;
        if (!desc) return;
        (splitsByDesc[desc] = splitsByDesc[desc] || []).push(s);
      });
      const splits = {};
      Object.keys(splitsByDesc).forEach(desc => { splits[desc] = pickCombinedStat(splitsByDesc[desc]); });
      const gameLog = byType('gameLog').slice().sort((a, b) =>
        (b.date || '').localeCompare(a.date || '') || ((b.game && b.game.gameNumber) || 1) - ((a.game && a.game.gameNumber) || 1));
      const detail = { seasonStat: pickCombinedStat(byType('season')), splits, gameLog };
      if (Number(season) < new Date().getFullYear()) playerSeasonDetailCache[key] = detail;
      else playerSeasonDetailRecent[key] = { detail, at: Date.now() };
      return detail;
    } catch (e) {
      return null;
    }
  }

  // Counting stats summed across several stat lines (a merged Mar/Apr
  // split, or per-team lines with no combined total) -- rates are always
  // recomputed from these rather than averaged.
  function sumStatLines(stats) {
    const keys = ['atBats', 'hits', 'doubles', 'triples', 'homeRuns', 'baseOnBalls', 'hitByPitch', 'sacFlies', 'totalBases',
      'plateAppearances', 'battersFaced', 'strikeOuts', 'earnedRuns', 'gamesPlayed', 'gamesStarted', 'gamesPitched', 'rbi', 'runs'];
    const out = {};
    keys.forEach(k => { out[k] = stats.reduce((sum, s) => sum + (s[k] || 0), 0); });
    out.inningsPitched = formatIP(stats.reduce((sum, s) => sum + ipToOuts(s.inningsPitched), 0));
    return out;
  }
  // OPS as the API reports it: the already-rounded OBP plus the
  // already-rounded SLG, so a recomputed row agrees with the API's own.
  function slashFromCounts(s) {
    const ab = s.atBats || 0, h = s.hits || 0, bb = s.baseOnBalls || 0, hbp = s.hitByPitch || 0, sf = s.sacFlies || 0;
    const obpDen = ab + bb + hbp + sf;
    if (!ab || !obpDen) return { avg: '&#8212;', obp: '&#8212;', slg: '&#8212;', ops: '&#8212;' };
    const obp = Number(((h + bb + hbp) / obpDen).toFixed(3));
    const slg = Number(((s.totalBases || 0) / ab).toFixed(3));
    return { avg: formatRate(h, ab), obp: formatRate(h + bb + hbp, obpDen), slg: formatRate(s.totalBases || 0, ab), ops: formatRate(obp + slg, 1) };
  }

  // ---- Overview board ----
  // A player's season as skill scores: each is his percentile in one stat
  // (Power is ISO, Range is OAA, Reach is extension...), the stat itself
  // written small beneath. Results stats rank against Savant's bar for its
  // percentiles -- 2.1 PA per team game for a hitter, 1.25 batters faced
  // for a pitcher -- so a regular who falls short of a batting or ERA title
  // still ranks, and his scores agree with the Statcast ones beside them.
  // Pitchers rank by role: starters among starters, relievers among
  // relievers. Someone short of his pool still gets a score, placed among it,
  // but in softer type and never gold. Statcast tools rank in Savant's own
  // percentile pools (or, where Savant publishes no percentile, the same
  // pool as above), and a player Savant doesn't rank there gets a dash.
  // Gold is the 90th percentile and up.
  const SKILL_GOLD_PERCENTILE = 90;
  const SKILL_POOL_PA_PER_GAME = 2.1;
  const SKILL_POOL_BF_PER_GAME = 1.25;

  // Share of the pool he's better than, 1-100. In the pool, the best is 100
  // and the worst 1; short of it, he's placed among them (his own line
  // isn't one of the values).
  function poolPercentile(value, values, { low = false, inPool = true } = {}) {
    if (value == null || !Number.isFinite(value)) return null;
    const vals = values.filter(v => v != null && Number.isFinite(v));
    if (!vals.length) return null;
    const worse = vals.filter(v => (low ? v > value : v < value)).length;
    const span = inPool ? vals.length - 1 : vals.length;
    const pct = span > 0 ? Math.round((100 * worse) / span) : 100;
    return Math.min(100, Math.max(1, pct));
  }

  // Any Savant CSV, as rows keyed by the header. Kept for the session like
  // the other Savant fetches; a failure is null and isn't kept.
  const savantCsvCache = {};
  async function getSavantCsv(path) {
    if (savantCsvCache[path]) return savantCsvCache[path];
    return once(`savant-${path}`, () => getSavantCsvNow(path));
  }
  async function getSavantCsvNow(path) {
    try {
      const res = await fetch(`${SAVANT}${path}`);
      if (!res.ok) return null;
      const rows = parseCsv(await res.text());
      savantCsvCache[path] = rows;
      return rows;
    } catch (e) {
      return null;
    }
  }
  function csvById(rows, idKey = 'player_id') {
    const byId = {};
    (rows || []).forEach(r => { byId[Number(r[idKey])] = r; });
    return byId;
  }
  function csvNumber(v) {
    if (v == null || v === '') return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  // The hitters' wOBA (same weights as rawWOBA) of everyone a pitcher faced.
  function pitchingWOBA(stat) {
    const bf = stat.battersFaced || 0;
    if (!bf) return null;
    const singles = (stat.hits || 0) - (stat.doubles || 0) - (stat.triples || 0) - (stat.homeRuns || 0);
    return (WOBA_WEIGHTS.bbHbp * ((stat.baseOnBalls || 0) + (stat.hitByPitch || 0)) + WOBA_WEIGHTS.single * singles +
      WOBA_WEIGHTS.double * (stat.doubles || 0) + WOBA_WEIGHTS.triple * (stat.triples || 0) + WOBA_WEIGHTS.hr * (stat.homeRuns || 0)) / bf;
  }
  const perPA = (n, s) => (s.plateAppearances ? (n || 0) / s.plateAppearances * 100 : null);
  const perBF = (n, s) => (s.battersFaced ? (n || 0) / s.battersFaced * 100 : null);
  const rate3 = v => v.toFixed(3).replace(/^0/, '');
  const wholePct = v => `${Math.round(v)}%`;
  const statNum = v => (v == null || v === '' || v === '-.--' || v === '.---' ? null : Number(v));

  // One stat ranked against a pool of stat lines: get(stat) is the value,
  // low marks lower-is-better, show(value) how it's written.
  function poolSkill(name, statLabel, get, show, low, me, pool, inPool) {
    const value = get(me);
    if (value == null || !Number.isFinite(value)) return { name, pct: null };
    return {
      name,
      pct: poolPercentile(value, pool.map(r => get(r.stat)), { low, inPool }),
      soft: !inPool,
      stat: `${statLabel} ${show(value)}`
    };
  }
  // One stat with a Savant percentile: the percentile from Savant, the
  // value from wherever Savant lists it, dashed out if he isn't ranked.
  function savantSkill(name, pct, statLabel, value) {
    const p = csvNumber(pct);
    if (p == null) return { name, pct: null };
    return { name, pct: Math.min(100, Math.max(1, p)), stat: value == null ? statLabel : `${statLabel} ${value}` };
  }

  function hitterSkillFields(person, seasonStat, pool, inPool, savant) {
    const me = seasonStat;
    const iso = s => (s.atBats ? ((s.totalBases || 0) - (s.hits || 0)) / s.atBats : null);
    const hitting = [
      poolSkill('Bat', 'wOBA', s => rawWOBA(s), rate3, false, me, pool, inPool),
      poolSkill('Power', 'ISO', iso, rate3, false, me, pool, inPool),
      poolSkill('Contact', 'K%', s => perPA(s.strikeOuts, s), wholePct, true, me, pool, inPool),
      poolSkill('Eye', 'BB%', s => perPA(s.baseOnBalls, s), wholePct, false, me, pool, inPool)
    ];
    const id = person.id;
    const pct = savant.pct[id] || {};
    const sprint = csvNumber((savant.sprint[id] || {}).sprint_speed);
    const speed = savantSkill('Speed', pct.sprint_speed, 'Sprint', sprint != null ? `${sprint.toFixed(1)} ft/s` : null);
    const type = person.primaryPosition && person.primaryPosition.type;
    if (type !== 'Outfielder' && type !== 'Infielder' && type !== 'Catcher') return { hitting, tools: [speed] };
    const catcher = type === 'Catcher';
    const oaa = csvNumber((savant.oaa[id] || {}).outs_above_average);
    const range = catcher || oaa == null ? { name: 'Range', pct: null } : savantSkill('Range', pct.oaa, 'OAA', formatSigned(oaa));
    // Fielding Run Value is already relative to the position (a catcher's
    // counts his framing), so it's one pool: the fielders qualified for
    // OAA, plus Savant's qualified catchers (who have no OAA). Savant's
    // all-position list itself takes in part-timers too.
    const gloveIds = new Set([...Object.keys(savant.oaa), ...Object.keys(savant.catchers)].map(Number));
    const frvOf = pid => (gloveIds.has(pid) && savant.frv[pid] ? csvNumber(savant.frv[pid].total_runs) : null);
    const frv = frvOf(id);
    const glove = frv == null
      ? { name: 'Glove', pct: null }
      : { name: 'Glove', pct: poolPercentile(frv, [...gloveIds].map(frvOf)), stat: `FRV ${formatSigned(Math.round(frv))}` };
    let arm;
    if (catcher) {
      // A catcher's arm is his throws to second and third (pop time
      // board), ranked among catchers.
      const armOf = r => csvNumber(r.maxeff_arm_2b_3b_sba);
      const mine = savant.pop[id] ? armOf(savant.pop[id]) : null;
      arm = mine == null
        ? { name: 'Arm', pct: null }
        : { name: 'Arm', pct: poolPercentile(mine, Object.values(savant.pop).map(armOf)), stat: `Arm ${mine.toFixed(1)} mph` };
    } else {
      const mph = csvNumber((savant.arm[id] || {}).arm_overall);
      arm = savantSkill('Arm', pct.arm_strength, 'Arm', mph != null ? `${mph.toFixed(1)} mph` : null);
    }
    return { hitting, tools: [speed, range, glove, arm] };
  }

  function pitcherSkillFields(personId, seasonStat, pool, inPool, savant) {
    const me = seasonStat;
    const pitching = [
      poolSkill('Runs', 'ERA', s => statNum(s.era), v => v.toFixed(2), true, me, pool, inPool),
      poolSkill('Damage', 'wOBA', pitchingWOBA, rate3, true, me, pool, inPool),
      poolSkill('Traffic', 'WHIP', s => statNum(s.whip), v => v.toFixed(2), true, me, pool, inPool),
      poolSkill('Command', 'K-BB%', s => (s.battersFaced ? perBF((s.strikeOuts || 0) - (s.baseOnBalls || 0), s) : null), wholePct, false, me, pool, inPool)
    ];
    const pct = savant.pct[personId] || {};
    const custom = savant.custom[personId] || {};
    const fb = csvNumber(custom.ff_avg_speed) ?? csvNumber(custom.si_avg_speed);
    const whiff = csvNumber(custom.whiff_percent);
    // Savant publishes no percentile for extension or ground-ball rate, so
    // those rank in the same pool as the results above.
    const ext = s => csvNumber((savant.ext[s.__id] || {}).release_extension);
    const gb = s => csvNumber((savant.custom[s.__id] || {}).groundballs_percent);
    const tag = (stat, id) => ({ ...stat, __id: id });
    const mine = tag(me, personId);
    const tagged = pool.map(r => ({ stat: tag(r.stat, r.id) }));
    const stuff = [
      savantSkill('Velo', pct.fb_velocity, 'FB', fb != null ? `${fb.toFixed(1)} mph` : null),
      poolSkill('Reach', 'Ext', ext, v => `${v.toFixed(1)} ft`, false, mine, tagged, inPool),
      savantSkill('Whiff', pct.whiff_percent, 'Whiff', whiff != null ? wholePct(whiff) : null),
      poolSkill('Grounders', 'GB%', gb, wholePct, false, mine, tagged, inPool)
    ];
    return { pitching, stuff };
  }

  // fielder: a hitter with a fielding position (not a DH or two-way
  // player), who needs the fielding boards as well as sprint speed.
  async function getSavantSkillData(season, pitcher, catcher, fielder) {
    if (Number(season) < STATCAST_FIRST_SEASON) return null;
    const y = season;
    if (pitcher) {
      const [pct, custom, ext] = await Promise.all([
        getSavantCsv(`/leaderboard/percentile-rankings?type=pitcher&year=${y}&csv=true`),
        getSavantCsv(`/leaderboard/custom?year=${y}&type=pitcher&min=1&selections=ff_avg_speed,si_avg_speed,whiff_percent,groundballs_percent&csv=true`),
        // Statcast Search grouped by pitcher is the one place extension
        // comes as a season average (pitchers with 500+ pitches).
        getSavantCsv(`/statcast_search/csv?all=true&hfGT=R%7C&hfSea=${y}%7C&player_type=pitcher&group_by=name&min_pitches=500&min_results=0&min_pas=0&sort_col=pitches&player_event_sort=api_p_release_speed&sort_order=desc`)
      ]);
      return { pct: csvById(pct), custom: csvById(custom), ext: csvById(ext) };
    }
    const none = Promise.resolve([]);
    const [pct, sprint, oaa, frv, arm, pop, catchers] = await Promise.all([
      getSavantCsv(`/leaderboard/percentile-rankings?type=batter&year=${y}&csv=true`),
      getSavantCsv(`/leaderboard/custom?year=${y}&type=batter&min=1&selections=sprint_speed&csv=true`),
      !fielder ? none : getSavantCsv(`/leaderboard/outs_above_average?type=Fielder&startYear=${y}&endYear=${y}&split=no&team=&range=year&min=q&pos=&roles=&viz=hide&csv=true`),
      !fielder ? none : getSavantCsv(`/leaderboard/fielding-run-value?gameType=Regular&seasonStart=${y}&seasonEnd=${y}&type=fielder&position=&csv=true`),
      !fielder || catcher ? none : getSavantCsv(`/leaderboard/arm-strength?type=player&year=${y}&minThrows=50&pos=&team=&csv=true`),
      catcher ? getSavantCsv(`/leaderboard/poptime?year=${y}&team=&min2b=5&min3b=0&csv=true`) : none,
      !fielder ? Promise.resolve({}) : getSavantFrv(y, '2')
    ]);
    return { pct: csvById(pct), sprint: csvById(sprint), oaa: csvById(oaa), frv: csvById(frv, 'id'), arm: csvById(arm), pop: csvById(pop, 'entity_id'), catchers: catchers || {} };
  }
  const NO_SAVANT = { pct: {}, sprint: {}, oaa: {}, frv: {}, arm: {}, pop: {}, catchers: {}, custom: {}, ext: {} };

  // Who a player is ranked against for his results stats: the pool, the
  // heading's note, and whether he's in it.
  async function getProfileBoardPool(person, season, pitcher, seasonStat) {
    const reliever = pitcher && !isStartingPitcher(seasonStat);
    const [rows, leagueInfo] = await Promise.all([
      getSeasonPlayerStats(pitcher ? 'pitching' : 'hitting', season, 'all'),
      getLeagueSeasonInfo(season)
    ]);
    const games = leagueInfo.teamGamesPlayed;
    const sample = s => (pitcher ? s.battersFaced : s.plateAppearances) || 0;
    const need = games * (pitcher ? SKILL_POOL_BF_PER_GAME : SKILL_POOL_PA_PER_GAME);
    const pool = (rows || []).filter(r => sample(r.stat) >= need && (!pitcher || isStartingPitcher(r.stat) !== reliever));
    const inPool = pool.some(r => r.id === person.id);
    const who = !pitcher ? 'hitters' : reliever ? 'relievers' : 'starters';
    const short = Math.ceil(need - sample(seasonStat));
    const note = inPool ? `vs ${pool.length} ${who}` : (games ? `${short} ${pitcher ? 'batters faced' : 'PA'} short of the pool` : 'Not ranked');
    return { pool, note, reliever, inPool };
  }

  // savantData undefined means Savant is still on its way: the Statcast
  // group's tiles are drawn waiting rather than dashed, so the results
  // group (Stats API only) can show first.
  function buildProfileBoard(person, pitcher, seasonStat, poolInfo, savantData) {
    const pending = savantData === undefined;
    const savant = { ...NO_SAVANT, ...(savantData || {}) };
    const { pool, note, reliever, inPool } = poolInfo;
    const s = seasonStat;
    const wait = skills => (pending ? skills.map(k => ({ name: k.name, pending: true })) : skills);
    if (!pitcher) {
      const { hitting, tools } = hitterSkillFields(person, s, pool, inPool, savant);
      return {
        groups: [{ title: 'Hitting', note, skills: hitting }, { title: 'Tools', skills: wait(tools) }],
        totals: [['G', s.gamesPlayed ?? 0], ['HR', s.homeRuns ?? 0], ['SB', s.stolenBases ?? 0]]
      };
    }
    const { pitching, stuff } = pitcherSkillFields(person.id, s, pool, inPool, savant);
    return {
      groups: [{ title: 'Pitching', note, skills: pitching }, { title: 'Stuff', skills: wait(stuff) }],
      totals: reliever
        ? [['G', s.gamesPitched ?? 0], ['IP', s.inningsPitched ?? '0.0'], ['SV', s.saves ?? 0]]
        : [['GS', s.gamesStarted ?? 0], ['IP', s.inningsPitched ?? '0.0'], ['K', s.strikeOuts ?? 0]]
    };
  }

  function renderProfileBoard(board) {
    const skill = k => {
      if (k.pending) return `<div class="pp-sk"><span class="pp-sk-name">${k.name}</span><span class="pp-sk-score is-wait">&#160;</span><span class="pp-sk-stat">&#160;</span></div>`;
      if (k.pct == null) return `<div class="pp-sk"><span class="pp-sk-name">${k.name}</span><span class="pp-sk-score is-none">&#8212;</span><span class="pp-sk-stat">&#160;</span></div>`;
      const cls = k.soft ? ' is-soft' : (k.pct >= SKILL_GOLD_PERCENTILE ? ' is-top' : '');
      return `<div class="pp-sk"><span class="pp-sk-name">${k.name}</span><span class="pp-sk-score${cls}">${k.pct}</span><span class="pp-sk-stat">${k.stat}</span></div>`;
    };
    const group = g => `<section class="pp-skg">
      <div class="pp-skg-head"><span>${g.title}</span>${g.note ? `<em>${g.note}</em>` : ''}</div>
      <div class="pp-skg-row">${g.skills.map(skill).join('')}</div>
    </section>`;
    return `<div class="pp-skills">
      <div class="pp-skg-pair">${board.groups.map(group).join('')}</div>
      <section class="pp-skg pp-totals">
        <div class="pp-skg-head"><span>Totals</span></div>
        <div class="pp-tot-row">${board.totals.map(([k, v]) => `<div class="pp-tot"><span class="pp-sk-name">${k}</span><span class="pp-tot-v">${v}</span></div>`).join('')}</div>
      </section>
    </div>`;
  }

  // The Defense tab's slots: gold marks the top 10% of the qualified pool.
  const PROFILE_GOLD_SHARE = 0.10;

  // Standard competition ranking (1, 2, 2, 4) against the qualified pool;
  // only computed when the player is in that pool -- someone who doesn't
  // qualify gets no ranks and no gold rather than a rank against players
  // whose samples he doesn't share.
  function rankInPool(column, me, pool, ctx) {
    const mine = column.get(me.stat, ctx);
    if (mine == null) return null;
    const values = pool.map(r => column.get(r.stat, ctx)).filter(v => v != null);
    const better = values.filter(v => column.low ? v < mine : v > mine).length;
    const tied = values.filter(v => v === mine).length > 1;
    return { rank: better + 1, tied, of: pool.length };
  }

  // ---- Arsenal ----
  // A pitcher's pitches: fastball velo, how each pitch moves, how often he
  // throws each to lefties and righties and how well it plays there, and
  // what he goes to with two strikes. Scores are percentiles against every
  // pitch of the same type thrown ARSENAL_POOL_PITCHES+ times that season.
  const ARSENAL_FIRST_SEASON = 2017;
  const ARSENAL_POOL_PITCHES = 100;
  // Fewer pitches than this to one side and its run value isn't ranked.
  const ARSENAL_SIDE_MIN = 50;
  // Fewer two-strike pitches than this and a put-away rate isn't ranked.
  const ARSENAL_PUTAWAY_MIN = 25;
  const ARSENAL_FULL_COUNT_MIN = 10;
  // A pitch whose full-count share is up this many points is called out.
  const ARSENAL_FULL_RISE = 8;
  const ARSENAL_FASTBALLS = ['FF', 'SI', 'FC'];
  const PITCH_NAMES = {
    FF: '4-Seam', SI: 'Sinker', FC: 'Cutter', SL: 'Slider', ST: 'Sweeper', CU: 'Curveball', KC: 'Knuckle Curve',
    CH: 'Changeup', FS: 'Splitter', SV: 'Slurve', KN: 'Knuckleball', FO: 'Forkball', SC: 'Screwball', CS: 'Slow Curve', EP: 'Eephus', FA: 'Fastball'
  };
  const PITCH_SHORT = { FF: '4S', SI: 'SI', FC: 'CT', SL: 'SL', ST: 'SW', CU: 'CB', KC: 'KC', CH: 'CH', FS: 'SPL', SV: 'SV', KN: 'KN', FO: 'FO', SC: 'SC', CS: 'CS', EP: 'EP', FA: 'FB' };
  const pitchName = t => PITCH_NAMES[t] || t;
  const pitchShort = t => PITCH_SHORT[t] || t;
  const KEY_STRIKEOUT_EVENTS = ['strikeout', 'strikeout_double_play'];

  // The league's pitch-by-pitch-type leaderboards: results (usage, run
  // value, put-away rate) and movement (velo, break). Both are the whole
  // league, ~300 KB together, and also the pools every score ranks in.
  async function getSavantArsenalLeague(season) {
    const [stats, movement] = await Promise.all([
      getSavantCsv(`/leaderboard/pitch-arsenal-stats?type=pitcher&pitchType=&year=${season}&team=&min=1&csv=true`),
      getSavantCsv(`/leaderboard/pitch-movement?year=${season}&team=&min=1&pitch_type=ALL&hand=&x=pitcher_break_x_hidden&z=pitcher_break_z_hidden&csv=true`)
    ]);
    if (!stats || !movement) return null;
    return { stats, movement };
  }

  // Every pitch he threw in the regular season (Statcast Search, ~1-2 MB,
  // the one place a pitch's batter side, count and run value come
  // together), kept as only the fields the tab reads. Savant's data lands
  // overnight. A failure isn't cached, so it retries.
  const pitcherPitchLogCache = {};
  async function getPitcherPitchLog(personId, season) {
    const key = `${personId}-${season}`;
    if (pitcherPitchLogCache[key]) return pitcherPitchLogCache[key];
    return once(`pitchlog-${key}`, async () => {
      try {
        const res = await fetch(`${SAVANT}/statcast_search/csv?all=true&hfGT=R%7C&hfSea=${season}%7C&player_type=pitcher&pitchers_lookup%5B%5D=${personId}&type=details`);
        if (!res.ok) return null;
        const pitches = parseCsv(await res.text())
          .filter(r => r.pitch_type && r.pitch_type !== 'PO' && r.pitch_type !== 'IN')
          .map(r => ({
            t: r.pitch_type, side: r.stand, balls: Number(r.balls), strikes: Number(r.strikes),
            pa: `${r.game_pk}-${r.at_bat_number}`, n: Number(r.pitch_number),
            k: KEY_STRIKEOUT_EVENTS.includes(r.events), rv: csvNumber(r.delta_pitcher_run_exp) || 0
          }));
        pitcherPitchLogCache[key] = pitches;
        return pitches;
      } catch (e) {
        return null;
      }
    });
  }

  // Per season, the league's values by pitch type -- run value per 100,
  // put-away rate and velo -- for every pitch thrown enough to rank.
  const arsenalPoolCache = {};
  function arsenalPools(season, league) {
    if (arsenalPoolCache[season]) return arsenalPoolCache[season];
    const velo = {};
    league.movement.forEach(r => { velo[`${r.pitcher_id}-${r.pitch_type}`] = csvNumber(r.avg_speed); });
    const pools = {};
    league.stats.forEach(r => {
      if (Number(r.pitches) < ARSENAL_POOL_PITCHES) return;
      const p = pools[r.pitch_type] || (pools[r.pitch_type] = { rv: [], putAway: [], velo: [] });
      p.rv.push(csvNumber(r.run_value_per_100));
      p.putAway.push(csvNumber(r.put_away));
      p.velo.push(velo[`${r.player_id}-${r.pitch_type}`]);
    });
    arsenalPoolCache[season] = pools;
    return pools;
  }

  function mostCommon(items) {
    const counts = {};
    items.forEach(x => { counts[x] = (counts[x] || 0) + 1; });
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  }

  // With two strikes, to one side: each pitch's share of his two-strike
  // pitches, its put-away rate (two-strike pitches that end in a
  // strikeout, as Savant counts it) ranked against its type, and the pitch
  // before his first two-strike pitch of the at-bat as its setup -- the
  // first only, so a foul ball's repeat doesn't count as one. Then the
  // full count against every two-strike count before it.
  function buildTwoStrikes(log, side, pools) {
    const byPa = {};
    log.forEach(p => { if (p.side === side) (byPa[p.pa] || (byPa[p.pa] = [])).push(p); });
    const two = [];
    Object.values(byPa).forEach(pa => {
      pa.sort((a, b) => a.n - b.n);
      let first = true;
      pa.forEach((p, i) => {
        if (p.strikes !== 2) return;
        two.push({ t: p.t, full: p.balls === 3, k: p.k, setup: first && i ? pa[i - 1].t : null });
        first = false;
      });
    });
    const n = two.length;
    const pays = mostCommon(two.map(p => p.t)).slice(0, 4).map(t => {
      const mine = two.filter(p => p.t === t);
      const putAway = (100 * mine.filter(p => p.k).length) / mine.length;
      const pool = pools[t];
      return {
        code: t, share: (100 * mine.length) / n,
        score: pool && mine.length >= ARSENAL_PUTAWAY_MIN ? poolPercentile(putAway, pool.putAway, { inPool: false }) : null,
        putAway, setup: mostCommon(mine.map(p => p.setup).filter(Boolean))[0] || null
      };
    }).filter(p => p.share >= 5);
    const before = two.filter(p => !p.full), fullCount = two.filter(p => p.full);
    const shares = list => {
      const out = {};
      list.forEach(p => { out[p.t] = (out[p.t] || 0) + 100 / list.length; });
      return out;
    };
    let full = null;
    if (fullCount.length >= ARSENAL_FULL_COUNT_MIN) {
      const a = shares(before), b = shares(fullCount);
      const top = Object.keys(b).sort((x, y) => b[y] - b[x])[0];
      const riser = Object.keys(b).filter(t => t !== top).map(t => [t, b[t] - (a[t] || 0)]).sort((x, y) => y[1] - x[1])[0];
      full = { n: fullCount.length, rows: [{ code: top, before: a[top] || 0, full: b[top], up: false }] };
      if (riser && riser[1] >= ARSENAL_FULL_RISE) full.rows.push({ code: riser[0], before: a[riser[0]] || 0, full: b[riser[0]], up: true });
    }
    return { n, k: two.filter(p => p.k).length, pays, full };
  }

  // league undefined/log undefined: still loading; null: failed.
  function buildProfileArsenal(personId, hand, season, league, log) {
    const out = { hand, league, log };
    if (league) {
      const pools = arsenalPools(season, league);
