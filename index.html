    return true;
  }
  function hideGameSummaryModal() {
    closeOverlay(gameSummaryOverlay);
  }

  function findBoxscorePlayer(boxscore, personId) {
    if (!boxscore || !boxscore.teams) return null;
    const away = (boxscore.teams.away && boxscore.teams.away.players) || {};
    const home = (boxscore.teams.home && boxscore.teams.home.players) || {};
    return away['ID' + personId] || home['ID' + personId] || null;
  }

  function buildPitcherStatLineParts(stats) {
    if (!stats) return [];
    const ip = stats.inningsPitched ?? '0.0';
    const r = stats.runs ?? 0;
    const k = stats.strikeOuts ?? 0;
    return [`${ip} IP`, `${r} R`, `${k} K`];
  }

  function buildBatterStatLineParts(stats) {
    if (!stats) return [];
    const parts = [];
    if (stats.atBats) parts.push(`${stats.hits ?? 0}-${stats.atBats}`);
    if (stats.doubles) parts.push(`${stats.doubles} 2B`);
    if (stats.triples) parts.push(`${stats.triples} 3B`);
    if (stats.homeRuns) parts.push(`${stats.homeRuns} HR`);
    if (stats.rbi) parts.push(`${stats.rbi} RBI`);
    return parts;
  }

  function renderStatLineParts(parts) {
    return parts.map(p => `<span class="potg-stat">${p}</span>`).join(', ');
  }

  function ordinalSuffix(n) {
    const j = n % 10, k = n % 100;
    if (j === 1 && k !== 11) return n + 'st';
    if (j === 2 && k !== 12) return n + 'nd';
    if (j === 3 && k !== 13) return n + 'rd';
    return n + 'th';
  }

  // The play of the game (biggest win-probability swing) and the three
  // players with the most win probability added, from a game's own feed and
  // getGameWpaSigned. Shared by the game summary popup and the Scorecard's
  // Final summary.
  function buildGameHighlights(allPlays, wpa, gameData, boxscore) {
    const personIndex = gameData && gameData.players;
    const totals = {};
    const credit = (person, role, amount) => {
      if (!person || person.id == null) return;
      const key = person.id + '-' + role;
      const t = totals[key] || (totals[key] = { id: person.id, name: person.fullName, lastName: lastNameOf(person, personIndex), role, wpa: 0 });
      t.wpa += amount;
    };
    let playOfGame = null;
    allPlays.forEach(play => {
      const homeAdded = wpa[play.about && play.about.atBatIndex];
      if (homeAdded == null) return;
      const isTop = play.about && play.about.isTopInning;
      const battingWpa = isTop ? -homeAdded : homeAdded;
      credit(play.matchup && play.matchup.batter, 'batter', battingWpa);
      credit(play.matchup && play.matchup.pitcher, 'pitcher', -battingWpa);

      const description = (play.result && play.result.description) || '';
      const absWpa = Math.abs(homeAdded);
      if (description && (!playOfGame || absWpa > playOfGame.absWpa)) {
        const events = play.playEvents || [];
        const lastEvent = events[events.length - 1];
        const playId = lastEvent && lastEvent.playId;
        const inning = play.about && play.about.inning;
        playOfGame = {
          absWpa,
          description,
          inningLabel: inning ? `${isTop ? 'Top' : 'Bottom'} ${ordinalSuffix(inning)}` : '',
          videoUrl: savantVideoUrl(playId)
        };
      }
    });

    const officialDate = (gameData && gameData.datetime && gameData.datetime.officialDate) || '';
    const season = officialDate.slice(0, 4);
    const leaders = Object.values(totals).sort((a, b) => b.wpa - a.wpa).slice(0, 3).map(p => {
      const boxPlayer = findBoxscorePlayer(boxscore, p.id);
      const stats = boxPlayer && boxPlayer.stats;
      const statParts = p.role === 'pitcher'
        ? buildPitcherStatLineParts(stats && stats.pitching)
        : buildBatterStatLineParts(stats && stats.batting);
      // Populate playerStore so the clickable name button works even if the
      // Scorecard tab (the usual source of these entries, see renderTeamTable)
      // was never opened for this game.
      const isAway = boxscore && boxscore.teams.away.players && boxscore.teams.away.players['ID' + p.id];
      const team = gameData && gameData.teams && gameData.teams[isAway ? 'away' : 'home'];
      const teamAbbrev = team ? teamAbbr(team) : '';
      playerStore[p.id] = {
        id: p.id,
        name: p.name,
        pos: (boxPlayer && boxPlayer.position && boxPlayer.position.abbreviation) || '',
        team: teamNickname(team),
        season,
        gameDate: officialDate,
        todayStats: (stats && (stats.batting || stats.pitching)) || {}
      };
      return { id: p.id, name: p.name, lastName: p.lastName, teamAbbr: teamAbbrev, statLine: renderStatLineParts(statParts) };
    });
    return { leaders, playOfGame };
  }

  // includeHighlights skips the winProbability fetch and WPA leaderboard
  // math entirely for Live games -- their box score is still worth fetching
  // eagerly (see openGameSummaryModal), but WPA swings mid-game aren't a
  // "top play/players" verdict yet, so there's no point paying for that call.
  // Only cached when includeHighlights is true, i.e. the game is Final (see
  // loadGameSummaryExtrasInto) -- mirrors gameStatsCache/fetchGameStats: a
  // Final game's result never changes, so it's safe to skip refetching on a
  // repeat modal open, but a Live game's is deliberately fetched fresh every
  // time.
  const gameHighlightsCache = {};
  async function fetchGameHighlights(gamePk, includeHighlights) {
    if (includeHighlights && gameHighlightsCache[gamePk] !== undefined) return gameHighlightsCache[gamePk];
    try {
      const feedRes = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`);
      const feedData = await feedRes.json();
      const linescore = feedData.liveData && feedData.liveData.linescore;
      const weather = feedData.gameData && feedData.gameData.weather;
      // Fed to renderMonsterPanel by loadGameSummaryExtrasInto so a Live
      // game's box score there shows the same live count/baserunner band
      // the Scorecard tab's own bottom bar does, not just the box score.
      const allPlays = (feedData.liveData && feedData.liveData.plays && feedData.liveData.plays.allPlays) || [];
      if (!includeHighlights) return { leaders: [], playOfGame: null, linescore, weather, allPlays };

      const wpa = await getGameWpaSigned(gamePk, true);
      const { leaders, playOfGame } = buildGameHighlights(allPlays, wpa, feedData.gameData, feedData.liveData && feedData.liveData.boxscore);
      const result = { leaders, playOfGame, linescore, weather, allPlays };
      if (Object.keys(wpa).length) gameHighlightsCache[gamePk] = result;
      return result;
    } catch (e) {
      return { leaders: [], playOfGame: null, linescore: null, weather: null, allPlays: [] };
    }
  }

  // getVenueInfo is cached by venue id, so this is cheap on repeat opens of
  // the same park -- swaps the name-only placeholder for the full name+city
  // once the detailed /v1/venues record resolves.
  async function loadVenueInto(game, requestId) {
    const venue = await getVenueInfo(game.venueId);
    if (requestId !== gameSummaryRequestId) return;
    const el = document.getElementById(`venue-${game.gamePk}`);
    if (el) el.outerHTML = renderVenueHeader(game.venueName, venue, game.gamePk, renderStateBadge(game));
  }

  async function loadGameSummaryExtrasInto(game, requestId) {
    const includeHighlights = game.state === 'Final';
    const { leaders, playOfGame, linescore, weather, allPlays } = await fetchGameHighlights(game.gamePk, includeHighlights);
    if (requestId !== gameSummaryRequestId) return;
    if (includeHighlights) {
      const wpaEl = document.getElementById(`wpaLeaders-${game.gamePk}`);
      if (wpaEl) wpaEl.innerHTML = renderGameStory({ playOfGame, leaders }, { fullProfile: true });
    }
    if (!game.linescore) {
      const boxEl = document.getElementById(`boxScore-${game.gamePk}`);
      // innerHTML, not outerHTML -- boxEl itself carries the .gs-box-score
      // class that centers .monster-panel; replacing the whole element would
      // drop that wrapper along with the loading placeholder inside it.
      if (boxEl) {
        boxEl.innerHTML = linescore
          ? renderMonsterPanel(linescore, game.awayAbbr, game.homeAbbr, allPlays, game.state === 'Live' && hasGameStarted(allPlays))
          : '';
      }
    }
    if (!game.weather) {
      const weatherEl = document.getElementById(`weather-${game.gamePk}`);
      if (weatherEl) weatherEl.outerHTML = renderWeatherLine(weather);
    }
  }

  gameSummaryModalBody.addEventListener('click', (e) => {
    const btn = e.target.closest('.modal-cta');
    if (btn) jumpToScorecardGame(btn.dataset.date, btn.dataset.gamePk);
  });
  gameSummaryClose.addEventListener('click', hideGameSummaryModal);
  gameSummaryOverlay.addEventListener('click', (e) => {
    if (e.target === gameSummaryOverlay) hideGameSummaryModal();
  });

  // Shared by the strip and the all-games modal below -- both build the
  // same renderDailyGameTile input from a raw schedule-API game object.
  function scheduleGameToTileGame(g) {
    return {
      gamePk: g.gamePk,
      awayName: teamNickname(g.teams.away.team),
      homeName: teamNickname(g.teams.home.team),
      awayId: g.teams.away.team && g.teams.away.team.id,
      homeId: g.teams.home.team && g.teams.home.team.id,
      awayScore: g.teams.away.score,
      homeScore: g.teams.home.score,
      state: g.status.abstractGameState,
      detailedState: g.status.detailedState,
      gameDate: g.gameDate,
      inningState: (g.linescore || {}).inningState,
      inningOrdinal: (g.linescore || {}).currentInningOrdinal
    };
  }

  // Mirrors the Daily tab's tiles (same renderDailyGameTile) so a game's
  // state/score reads the same way in both places, just laid out as a
  // horizontal strip next to the date picker instead of a grid -- and, below
  // 699px (see .game-strip's CSS), showing only the .is-current tile since
  // there's no room for the full row.
  function renderGameStrip(dateStr, games) {
    gameStrip.innerHTML = games.map(g => renderDailyGameTile(dateStr, scheduleGameToTileGame(g),
      String(g.gamePk) === String(currentGamePk) ? 'is-current' : '')).join('');
    updateGameStripFade();
  }

  // Refetches the schedule and re-renders the strip in place -- separate
  // from loadSchedule, which also resets the selected game and loads its
  // full feed; a strip refresh must never touch either of those. pollTimer
  // (see fetchAndRender) only ever re-fetches whichever single game is
  // currently selected, so without this every *other* tile in the strip --
  // and the selected game's own tile, since that's schedule data too, not
  // the live feed -- stays frozen at whatever it was when the date was
  // first loaded.
  async function pollGameStrip(dateStr) {
    const requestId = ++gameStripRequestId;
    clearTimeout(gameStripPollTimer);
    gameStripPollTimer = null;
    gameStripPollPaused = false;
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${dateStr}&hydrate=linescore`, { cache: 'no-cache' });
      const data = await res.json();
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      // Stale if a newer poll tick or a real navigation (date change,
      // prev/next, a fresh loadSchedule) has started since this went out.
      if (requestId !== gameStripRequestId || dateStr !== dateInput.value) return;
      if (games.length) {
        scheduleGames = games;
        // renderGameStrip rebuilds the strip's innerHTML from scratch, which
        // would otherwise silently snap a manually-scrolled strip back to
        // its start on every poll tick.
        const scrollLeft = gameStrip.scrollLeft;
        renderGameStrip(dateStr, games);
        gameStrip.scrollLeft = scrollLeft;
      }
      scheduleGameStripPoll(dateStr, games);
    } catch (e) {
      // A transient failure must not silently kill the poll chain -- like
      // dailyPollTimer, this only keeps going if something here re-arms
      // gameStripPollTimer (see catchUpAfterResume). Retry once on the live
      // cadence; the next success re-derives the real interval below.
      if (requestId === gameStripRequestId && dateStr === dateInput.value) armGameStripPoll(dateStr, 15000);
    }
  }

  // Same "keep checking until nothing on this date can still change" logic
  // as loadDailySummary's own poll (see the comment there for why Preview
  // games still get a gentle check-in). Restricted to today's date: a past
  // date's strip is done changing and a future one hasn't started, so
  // today is the only case where sitting on the tab should ever show it
  // drift stale.
  function scheduleGameStripPoll(dateStr, games) {
    if (dateStr !== todayStr()) return;
    const stillLive = games.some(g => g.status.abstractGameState === 'Live');
    const stillUpcoming = games.some(g => g.status.abstractGameState === 'Preview');
    if (stillLive || stillUpcoming) armGameStripPoll(dateStr, stillLive ? 15000 : 60000);
  }
  function armGameStripPoll(dateStr, ms) {
    clearTimeout(gameStripPollTimer);
    gameStripPollTimer = setTimeout(() => {
      gameStripPollTimer = null;
      if (!scorecardOnScreen()) { gameStripPollPaused = true; return; }
      pollGameStrip(dateStr);
    }, ms);
  }

  function scorecardOnScreen() {
    return Tabs.current() === 'scorecard' && document.visibilityState === 'visible';
  }
  // Ticks start LIVE_POLL_MS apart while fetches are quick, but never
  // overlap: a slow fetch is followed by a short breather, not a pile-up.
  function scheduleLivePoll(gamePk, startedAt) {
    clearTimeout(pollTimer);
    const wait = Math.max(1500, LIVE_POLL_MS - (Date.now() - startedAt));
    pollTimer = setTimeout(() => {
      pollTimer = null;
      if (!scorecardOnScreen()) { scorecardPollPaused = true; return; }
      fetchAndRender(gamePk);
    }, wait);
  }
  // Catches up on whatever came due (or, with `pending`, is still waiting)
  // while the Scorecard was out of view -- from the tab's onShow, and from
  // catchUpAfterResume, where a suspended timer may never fire on its own.
  function resumeScorecardPolls(pending) {
    if (!scorecardOnScreen()) return;
    if (currentGamePk && (scorecardPollPaused || (pending && pollTimer))) {
      clearTimeout(pollTimer);
      pollTimer = null;
      scorecardPollPaused = false;
      fetchAndRender(currentGamePk);
    }
    if (gameStripPollPaused || (pending && gameStripPollTimer)) {
      clearTimeout(gameStripPollTimer);
      gameStripPollTimer = null;
      gameStripPollPaused = false;
      pollGameStrip(dateInput.value);
    }
  }

  // The board dims and says how old it is when a poll fails, rather than
  // the grid giving way to an error plate mid-game (see fetchAndRender).
  function setFeedStale(stale) {
    [scoreBottomBar, sidebarMonsterPanel].forEach(el => {
      el.classList.toggle('is-stale', stale);
      let line = el.querySelector('.feed-stale');
      if (!stale) { if (line) line.remove(); return; }
      if (!el.firstElementChild) return;
      if (!line) {
        line = document.createElement('div');
        line.className = 'feed-stale';
        line.setAttribute('role', 'status');
        el.appendChild(line);
      }
      line.textContent = lastFeedOkAt
        ? `Last update ${lastFeedOkAt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })} \u00b7 Reconnecting`
        : 'Reconnecting';
    });
  }
  function markFeedFresh() {
    lastFeedOkAt = new Date();
    setFeedStale(false);
    const stamp = body.querySelector('.feed-updated');
    if (stamp) stamp.textContent = `updated ${lastFeedOkAt.toLocaleTimeString()}`;
  }

  // Toggles the edge fade (see .game-strip::before/::after) on and off
  // depending on whether there's actually more strip to reveal in that
  // direction -- a fade implying scrollable content that isn't there (a
  // short list, or the mobile single-tile layout with no overflow at all)
  // would be more confusing than the hard edge it's meant to soften.
  function updateGameStripFade() {
    const maxScroll = gameStrip.scrollWidth - gameStrip.clientWidth;
    gameStripWrap.classList.toggle('has-scroll-left', gameStrip.scrollLeft > 1);
    gameStripWrap.classList.toggle('has-scroll-right', gameStrip.scrollLeft < maxScroll - 1);
  }

  function showGameStripModal(dateStr, games) {
    gameStripOverlayBody.dataset.mode = 'date';
    gameStripOverlayBody.innerHTML = `<div class="pitch-header">${formatShortDate(dateStr)} Games</div>
      <div class="daily-games-grid">${games.map(g => renderDailyGameTile(dateStr, scheduleGameToTileGame(g))).join('')}</div>`;
    openOverlay(gameStripOverlay);
  }
  function hideGameStripModal() {
    closeOverlay(gameStripOverlay);
  }

  async function loadSchedule(dateStr, preferredGamePk) {
    gameStrip.innerHTML = '';
    body.innerHTML = `<div class="mlb-status-msg">Loading ${formatShortDate(dateStr)} games&#8230;</div>`;
    scoreBottomBar.innerHTML = '';
    sidebarMonsterPanel.innerHTML = '';
    updateAtBatTrackers(null);
    clearTimeout(pollTimer);
    pollTimer = null;
    scorecardPollPaused = false;
    renderedFeedKey = null;
    gameStripRequestId++;
    clearTimeout(gameStripPollTimer);
    gameStripPollTimer = null;
    gameStripPollPaused = false;
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${dateStr}&hydrate=linescore`);
      const data = await res.json();
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      if (!games.length) {
        body.innerHTML = '<div class="mlb-status-msg">No MLB games scheduled on this date.</div>';
        return;
      }
      scheduleGames = games;

      const preferred = preferredGamePk && games.find(g => String(g.gamePk) === String(preferredGamePk));
      const mine = myTeamId();
      const myGames = mine ? games.filter(g => g.teams.away.team.id === mine || g.teams.home.team.id === mine) : [];
      // Of a doubleheader, the game that's on, else the one still to come, else the nightcap.
      const myGame = myGames.find(g => g.status.abstractGameState === 'Live')
        || myGames.find(g => g.status.abstractGameState === 'Preview')
        || myGames[myGames.length - 1];
      const liveGame = games.find(g => g.status.abstractGameState === 'Live');
      const chosen = preferred ? preferred.gamePk : (myGame || liveGame || games[0]).gamePk;
      currentGamePk = chosen;
      renderGameStrip(dateStr, games);
      scheduleGameStripPoll(dateStr, games);
      loadGame(chosen);
    } catch (e) {
      body.innerHTML = apiErrorMsg('schedule', 'schedule');
    }
  }

  async function loadGame(gamePk) {
    await fetchAndRender(gamePk);
  }

  // A season's regular-season dates, for the Standings tab: a season still
  // being played shows today's table, a finished one its final day's (the
  // standings endpoint answers nothing for a date outside the regular
  // season). A failed lookup isn't cached.
  const regularSeasonCache = {};
  async function getRegularSeason(year) {
    if (regularSeasonCache[year]) return regularSeasonCache[year];
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/seasons/${year}?sportId=1`);
      const data = await res.json();
      const s = data.seasons && data.seasons[0];
      if (!s || !s.regularSeasonStartDate || !s.regularSeasonEndDate) return null;
      regularSeasonCache[year] = { start: s.regularSeasonStartDate, end: s.regularSeasonEndDate };
      return regularSeasonCache[year];
    } catch (e) {
      return null;
    }
  }
  async function standingsSeasonStatus(season) {
    const info = await getRegularSeason(season);
    if (!info) return { asOf: null, final: Number(season) < new Date().getFullYear() };
    const final = todayStr() > info.end;
    return { asOf: final ? info.end : todayStr(), final };
  }

  // All three views (Division, Wild Card, Postseason) read the one season
  // picker, back to the Players list's first season.
  let standingsSeason = null;
  let standingsAsOf = null;
  function setStandingsSeason(season) {
    standingsSeason = String(season);
    standingsYearSelect.value = standingsSeason;
  }

  let standingsRequestId = 0;
  async function loadStandings() {
    const requestId = ++standingsRequestId;
    const season = standingsSeason;
    standingsBody.innerHTML = '<div class="mlb-status-msg">Loading standings&#8230;</div>';
    try {
      if (standingsView === 'postseason') {
        const raw = await getPostseasonSeries(season);
        if (requestId !== standingsRequestId) return;
        if (raw === null) { standingsBody.innerHTML = apiErrorMsg('the postseason'); return; }
        lastBracket = buildPostseasonBracket(raw, season);
        standingsBody.innerHTML = `<div class="sheet">${renderPostseasonBracket(lastBracket, season)}</div>`;
        return;
      }
      const { asOf, final } = await standingsSeasonStatus(season);
      if (requestId !== standingsRequestId) return;
      standingsAsOf = asOf;
      const records = await getStandings(season, asOf);
      if (requestId !== standingsRequestId) return;
      const content = standingsView === 'wildcard'
        ? renderWildcardContent(records, final && season, Number(season))
        : renderStandingsContent(records, final && season);
      standingsBody.innerHTML = `<div class="sheet">${content}</div>`;
    } catch (e) {
      if (requestId === standingsRequestId) standingsBody.innerHTML = apiErrorMsg('standings');
    }
  }

  // Bumped on every call so a stale call (an older poll tick, or a poll for
  // a game the user has since switched away from -- clearInterval only ever
  // stops *future* ticks, not one already in flight) can tell it's no longer
  // the latest before it commits anything. Checked once, right before the
  // point where results start getting written to shared state / the DOM --
  // see the guard below, mirroring the requestId pattern already used by
  // loadDailySummary / openGameSummaryModal / player search & profile.
  // What the Scorecard shows of the game in scorecardModel (the last feed,
  // as fetchAndRender left it): which team's card the toggle has up and, on
  // a phone, which half-inning ('final' is the Final summary). While
  // `follow` is on, both track the half-inning being played on every poll;
  // toggling or stepping away turns it off, stepping back onto it turns it
  // on. Neither control touches history -- they switch views within a tab.
  let scorecardModel = null;
  const scorecardView = { gamePk: null, side: 'away', half: null, follow: true };
  const sameHalf = (a, b) => !!a && !!b && a !== 'final' && b !== 'final' && a.inning === b.inning && a.top === b.top;

  function syncScorecardView() {
    const m = scorecardModel, v = scorecardView;
    if (v.gamePk !== m.gamePk) { v.gamePk = m.gamePk; v.follow = true; v.half = null; }
    const valid = v.half === 'final' ? m.state === 'Final' : m.halves.some(h => sameHalf(h, v.half));
    if (v.follow || !valid) {
      v.half = m.state === 'Final' ? 'final' : (m.liveHalf || m.halves[m.halves.length - 1]);
      v.side = v.half === 'final' || v.half.top ? 'away' : 'home';
      v.follow = true;
    }
  }

  function setScorecardSide(side) {
    const m = scorecardModel, v = scorecardView;
    if (!m) return;
    const wantTop = side === 'away';
    const cur = v.half === 'final' ? null : v.half;
    // The batting team during a live game always means the half being
    // played, so checking the other dugout and coming back returns to live
    // rather than to the same inning number (which would be the last one).
    const target = (m.liveHalf && m.liveHalf.top === wantTop && m.liveHalf)
      || (cur && m.halves.find(h => h.inning === cur.inning && h.top === wantTop))
      || m.halves.slice().reverse().find(h => h.top === wantTop);
    if (target) v.half = target;
    v.side = side;
    v.follow = sameHalf(v.half, m.liveHalf) && wantTop === m.liveHalf.top;
    renderScorecardSheet();
  }

  function jumpToLiveHalf() {
    const m = scorecardModel, v = scorecardView;
    if (!m || !m.liveHalf) return;
    v.half = m.liveHalf;
    v.side = m.liveHalf.top ? 'away' : 'home';
    v.follow = true;
    renderScorecardSheet();
  }

  function stepScorecardHalf(dir) {
    const m = scorecardModel, v = scorecardView;
    if (!m) return;
    const pages = m.state === 'Final' ? m.halves.concat(['final']) : m.halves;
    const idx = v.half === 'final' ? m.halves.length : m.halves.findIndex(h => sameHalf(h, v.half));
    const next = pages[idx + dir];
    if (next === undefined) return;
    v.half = next;
    if (next !== 'final') v.side = next.top ? 'away' : 'home';
    v.follow = next === 'final' || sameHalf(next, m.liveHalf);
    renderScorecardSheet();
  }

  // Both teams' grids are always drawn (the toggle hides one), and so is the
  // phone's half-inning view -- CSS shows the grid or the half-inning by
  // width, so turning a phone sideways needs no re-render.
  function renderScorecardSheet() {
    const m = scorecardModel, v = scorecardView;
    if (!m) return;
    // preserve horizontal scroll position of each team's innings grid --
    // the rebuild below replaces the whole subtree, which would otherwise
    // snap every table-scroll back to scrollLeft 0 on each poll
    const scrollLefts = Array.from(body.querySelectorAll('.table-scroll')).map(el => el.scrollLeft);
    // The rebuild also drops keyboard focus to <body>; put it back on the
    // same control in the new sheet.
    const focusSelector = focusedControlSelector(body);
    const grid = ['away', 'home'].map(side => {
      const t = m[side], other = m[side === 'away' ? 'home' : 'away'];
      return renderTeamTable(t.name, t.rows.length ? t.rows : placeholderLineupRows(), m.numInnings, t.pitcherByInning, t.starterPitcherId,
        m.columnsPerInning, other.pitchingBox, side, m.liveBatterInfo, m.season, m.officialDate,
        renderTeamToggle(m, v.side) + `<button class="roster-btn" data-team="${t.name}">Roster</button>`, side !== v.side);
    }).join('');
    body.innerHTML = `
      <div class="sheet sc-sheet">${m.state === 'Final' ? `<div class="sc-final-story">${renderGameStory(m.highlights)}</div>` : ''}<div class="sc-grid">${grid}</div><div class="sc-half">${renderHalfView(m, v)}</div>
        <div class="footnote">Source: MLB Stats API${m.state === 'Final' ? '' : ` &#183; <span class="feed-updated">${lastFeedOkAt ? `updated ${lastFeedOkAt.toLocaleTimeString()}` : ''}</span>`}</div></div>
    `;
    body.querySelectorAll('.table-scroll').forEach((el, i) => {
      if (scrollLefts[i]) el.scrollLeft = scrollLefts[i];
    });
    if (focusSelector) {
      let el = Array.from(body.querySelectorAll(focusSelector)).find(x => x.offsetParent !== null);
      // Stepping onto the last half disables the button just pressed; keep
      // focus on the stepper rather than letting it fall to <body>.
      if (el && el.disabled) el = el.parentNode.querySelector('[data-hv-step]:not([disabled])');
      // "Back to live" goes away once pressed; the stepper takes its focus.
      if (!el && /data-hv-live/.test(focusSelector)) el = body.querySelector('.sc-half [data-hv-step]:not([disabled])');
      if (el) el.focus({ preventScroll: true });
    }
  }

  // Tells a screen reader each play as it completes -- only within one game,
  // so opening a game (or switching to one) doesn't read out its last play.
  const scLiveEl = document.getElementById('scLive');
  let announcedPlays = { gamePk: null, count: 0 };
  function announceNewPlay(gamePk, allPlays) {
    const done = allPlays.filter(p => p.about && p.about.isComplete && p.result && p.result.description);
    if (announcedPlays.gamePk === gamePk && done.length > announcedPlays.count) {
      scLiveEl.textContent = done[done.length - 1].result.description;
    }
    announcedPlays = { gamePk, count: done.length };
  }

  body.addEventListener('click', (e) => {
    const sideBtn = e.target.closest('[data-sc-side]');
    if (sideBtn) { setScorecardSide(sideBtn.dataset.scSide); return; }
    if (e.target.closest('[data-hv-live]')) { jumpToLiveHalf(); return; }
    const retry = e.target.closest('[data-sc-retry]');
    if (retry) {
      if (retry.dataset.scRetry === 'schedule') loadSchedule(dateInput.value);
      else if (currentGamePk) { body.innerHTML = '<div class="mlb-status-msg">Loading the game&#8230;</div>'; loadGame(currentGamePk); }
      return;
    }
    const stepBtn = e.target.closest('[data-hv-step]');
    if (stepBtn && !stepBtn.disabled) stepScorecardHalf(Number(stepBtn.dataset.hvStep));
  });

  let fetchAndRenderRequestId = 0;
  async function fetchAndRender(gamePk) {
    const requestId = ++fetchAndRenderRequestId;
    const startedAt = Date.now();
    clearTimeout(pollTimer);
    pollTimer = null;
    scorecardPollPaused = false;
    try {
      // no-cache: the feed is sent with max-age=10 and stale-while-revalidate,
      // so a plain fetch could be answered from the browser's own cache with
      // the previous poll's copy while the fresh one only revalidates in the
      // background, leaving the board a tick behind. no-cache still goes no
      // further than MLB's CDN.
      const res = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`, { cache: 'no-cache' });
      if (!res.ok) throw new Error(`feed ${res.status}`);
      const text = await res.text();
      // metaData.timeStamp moves whenever anything in the feed does, and it
      // sits in the first few hundred characters -- read it before parsing
      // ~800 KB of JSON that may be identical to what's on screen.
      const stampMatch = /"timeStamp"\s*:\s*"([^"]+)"/.exec(text.slice(0, 1000));
      const feedKey = `${gamePk}|${stampMatch ? stampMatch[1] : `?${startedAt}`}`;
      if (requestId !== fetchAndRenderRequestId) return;
      if (feedKey === renderedFeedKey) {
        markFeedFresh();
        if (renderedFeedLive) scheduleLivePoll(gamePk, startedAt);
        return;
      }
      const data = JSON.parse(text);
      const gameData = data.gameData;
      const liveData = data.liveData;
      const linescore = liveData.linescore;
      const awayName = gameData.teams.away.name;
      const homeName = gameData.teams.home.name;
      const state = gameData.status.abstractGameState;
      const detailedState = gameData.status.detailedState;
      const allPlays = (liveData.plays && liveData.plays.allPlays) || [];
      const personIndex = gameData.players || {};

      const numInnings = Math.max((linescore.innings || []).length, 9);
      const away = buildTeamRows(liveData.boxscore.teams.away, 'top', allPlays, personIndex);
      const home = buildTeamRows(liveData.boxscore.teams.home, 'bottom', allPlays, personIndex);
      const awayRows = away.rows, homeRows = home.rows;

      // if the batting order turns over within an inning, some rows will
      // have two cells for that inning number -- give that inning an extra
      // column, applied to BOTH teams' tables so they stay aligned even
      // though only one side actually used the extra column
      const columnsPerInning = {};
      const allRows = [...awayRows, ...homeRows];
      for (let i = 1; i <= numInnings; i++) {
        let max = 1;
        allRows.forEach(r => {
          const len = (r.cells[i] || []).length;
          if (len > max) max = len;
        });
        columnsPerInning[i] = max;
      }

      // find whoever's up next so we can show a live placeholder diamond
      // even before this at-bat's result exists. Position (team/inning/
      // slot) is derived structurally from each team's own last completed
      // plate appearance rather than from linescore.offense.batter --
      // that field goes stale/empty right at a half-inning handoff (the
      // live-strip badge above works around the same gap by blanking
      // "offense" once outs >= 3), which is exactly the moment we most
      // want the next half's leadoff hitter to already show as on deck.
      // linescore.offense is still consulted, when it's actually in sync,
      // to know whether the at-bat has real pitch data yet (for the dot).
      // Before any pitch exists, this is just a structural guess at who's
      // on deck -- stays gated to columns already needed by completed
      // at-bats, so a transient state (e.g. during a mound visit) can't
      // briefly force a column open and then collapse it again. Once a real
      // pitch has actually been thrown, though, it's no longer a guess, and
      // columnsPerInning IS expanded for it below -- otherwise a lineup
      // turning over mid-inning would hide the live dot for anyone's second
      // at-bat until the inning's earlier at-bats happened to complete and
      // establish that column first.
      // MLB flips abstractGameState to 'Live' (and sets linescore.currentInning)
      // once pre-game warmup starts, well before first pitch -- state === 'Live'
      // alone isn't "the game has started." Require at least one real pitch
      // to exist anywhere in the game first, or the on-deck diamond shows up
      // for the leadoff batter during warmup with nothing behind it yet.
      const gameHasStarted = hasGameStarted(allPlays);
      let liveBatterInfo = null;
      let liveHalf = null;
      if (gameHasStarted && state === 'Live' && linescore.currentInning) {
        // linescore.currentInning/inningHalf are a separately-updated summary
        // field that can lag behind allPlays right at a half-inning handoff
        // (the same staleness the comment below already calls out for
        // linescore.offense.batter) -- if it lags long enough, this whole
        // block computes for the half-inning that just ended and never
        // finds the batter who's actually live, so no placeholder (or pitch
        // dot) shows for that at-bat at all until it completes and the
        // normal completed-play path in buildTeamRows picks it up by reading
        // about.inning/about.halfInning straight off the play itself.
        // allPlays doesn't have that lag -- the new half's leadoff play
        // object appears there the instant it exists -- so prefer deriving
        // effInning/effHalf from allPlays' own last entry, and only fall
        // back to linescore's outs>=3 flip for the brief window between the
        // 3rd out and that new play object existing.
        const lastPlay = allPlays[allPlays.length - 1];
        let effInning = linescore.currentInning;
        let effHalf = (linescore.inningHalf || 'Top').toLowerCase();
        if (lastPlay && lastPlay.about && typeof lastPlay.about.inning === 'number') {
          effInning = lastPlay.about.inning;
          effHalf = lastPlay.about.isTopInning ? 'top' : 'bottom';
        }
        if (!lastPlay || (lastPlay.about && lastPlay.about.isComplete)) {
          if ((linescore.outs ?? 0) >= 3) {
            if (effHalf === 'top') effHalf = 'bottom';
            else { effHalf = 'top'; effInning += 1; }
          }
        }
        liveHalf = { inning: effInning, top: effHalf === 'top' };
        const battingTeam = effHalf === 'top' ? 'away' : 'home';
        const battingRows = battingTeam === 'away' ? awayRows : homeRows;

        let lastRow = null, lastOrder = -1;
        battingRows.forEach(row => {
          Object.values(row.cells).forEach(cellArr => (cellArr || []).forEach(c => {
            if (c.order > lastOrder) { lastOrder = c.order; lastRow = row; }
          }));
        });
        const nextSlot = lastRow ? (lastRow.slot % battingRows.length) + 1 : 1;
        const nextRow = battingRows.find(r => r.slot === nextSlot) || battingRows[0];

        if (nextRow) {
          const slotIndex = (nextRow.cells[effInning] || []).length;
          const nextRowPlayerIds = new Set(nextRow.players.map(p => p.id));
          // the batter's own in-progress plate appearance, found by
          // identity rather than by trusting it's the last item in
          // allPlays -- an interruption (mound visit, batter timeout,
          // defensive substitution, etc.) can land its own entry after
          // it, sharing the same matchup.batter and sometimes even
          // isComplete: false, and that must not make the live dot
          // disappear mid-at-bat. Picked out structurally -- the most
          // recent same-batter candidate that actually has pitch data --
          // rather than by recognizing the interruption's description
          // text (NON_RESULT_EVENT_RE/GENUINE_PAUSE_RE): a pause type MLB
          // logs with wording those lists don't happen to cover would
          // otherwise get treated as the live play itself and wipe out
          // the real at-bat's pitch history, which is the actual bug this
          // guards against.
          const liveCandidates = allPlays.filter(p =>
            p.about && p.about.isComplete === false &&
            p.matchup && p.matchup.batter && nextRowPlayerIds.has(p.matchup.batter.id)
          );
          let livePlay = null;
          for (let idx = liveCandidates.length - 1; idx >= 0; idx--) {
            if (extractPitches(liveCandidates[idx]).length) { livePlay = liveCandidates[idx]; break; }
          }
          // No candidate has thrown a pitch yet -- either truly on-deck,
          // or paused before its first pitch. Fall back to the most
          // recent candidate so a pause starting before ball one still
          // has something to report.
          if (!livePlay) livePlay = liveCandidates[liveCandidates.length - 1] || null;
          // Any same-batter candidate riding along after livePlay is a
          // pause logged as its own trailing entry -- name it if its text
          // matches a known pause term, otherwise fall back to a generic
          // label so the pause still shows rather than silently doing
          // nothing (the pitches staying put is what actually matters).
          const trailingPause = livePlay && liveCandidates[liveCandidates.length - 1] !== livePlay
            ? liveCandidates[liveCandidates.length - 1] : null;
          const trailingPauseText = trailingPause
            ? ((trailingPause.result && trailingPause.result.event && GENUINE_PAUSE_RE.test(trailingPause.result.event) && trailingPause.result.event)
              || 'Play paused')
            : null;
          const livePitches = livePlay ? extractPitches(livePlay) : [];
          if (livePitches.length && slotIndex >= (columnsPerInning[effInning] || 1)) {
            columnsPerInning[effInning] = slotIndex + 1;
          }
          if (slotIndex < (columnsPerInning[effInning] || 1)) {
            const feedBatter = linescore.offense && linescore.offense.batter;
            const isFeedMatch = feedBatter && nextRowPlayerIds.has(feedBatter.id);
            liveBatterInfo = {
              team: battingTeam, rowSlot: nextRow.slot, inning: effInning, slotIndex,
              pitches: livePitches,
              events: livePlay ? extractEvents(livePlay) : [],
              ...(livePlay ? extractHandedness(livePlay) : { batSide: null, pitchHand: null }),
              currentInterruption: livePlay
                ? (currentInterruption(livePlay) || trailingPauseText)
                : null,
              batterName: (isFeedMatch && feedBatter.fullName) || nextRow.players[nextRow.players.length - 1].name,
              pitcherFullName: (linescore.defense && linescore.defense.pitcher && linescore.defense.pitcher.fullName) || ''
            };
          }
        }
      }
      // Matches the pkey format renderTeamTable/buildTeamRows' cell loop
      // stamps onto pitchStore for this exact liveBatterInfo cell (see
      // isLiveCell there) -- computed independently here, from the same
      // liveBatterInfo fields, rather than threaded back out of that render
      // call, so the wide-screen sidebar (see updateAtBatTrackers below) can
      // look the live at-bat up in pitchStore right after body.innerHTML
      // populates it.
      const livePkey = liveBatterInfo
        ? `${liveBatterInfo.team === 'away' ? awayName : homeName}-${liveBatterInfo.rowSlot}-${liveBatterInfo.inning}-${liveBatterInfo.slotIndex}`
        : null;

      // away.starterPitcherId is the pitcher who faced the away batters --
      // i.e. the HOME team's starter -- and belongs under the away
      // scorecard; home.starterPitcherId is the AWAY team's starter and
      // belongs under the home scorecard
      const awayStaff = buildStaff(liveData.boxscore.teams.away, personIndex);
      const homeStaff = buildStaff(liveData.boxscore.teams.home, personIndex);

      // bullpen: every pitcher who isn't today's starter, with pitch counts
      // from the prior two days for fatigue context. The two sides don't
      // depend on each other, so fetch them together rather than back to
      // back -- this also shortens the window in which a newer poll/game
      // switch can race past this call (see the requestId guard below).
      const season = gameData.game.season;
      const officialDate = gameData.datetime.officialDate;
      // away/home.starterPitcherId come from the play-by-play (see
      // buildTeamRows) and stay null until that side's starter has actually
      // thrown a completed at-bat -- which for a preview game, or the very
      // first batter of a game in progress, hasn't happened yet. Falling
      // back to the scheduled probable pitcher keeps the bullpen list's "P"
      // marker (see bullpenRowsHtml) from silently disappearing during that
      // window instead of just being missing until the game gets going.
      const probable = gameData.probablePitchers || {};
      const homeStarterId = away.starterPitcherId || (probable.home && probable.home.id);
      const awayStarterId = home.starterPitcherId || (probable.away && probable.away.id);
      const [homeBullpen, awayBullpen, wpa] = await Promise.all([
        buildBullpenList(liveData.boxscore.teams.home, homeStarterId, season, officialDate, allPlays, 'top'),
        buildBullpenList(liveData.boxscore.teams.away, awayStarterId, season, officialDate, allPlays, 'bottom'),
        state === 'Final' ? getGameWpaSigned(gamePk, true) : null
      ]);

      // Everything above this point is local computation from this call's
      // own fetch; nothing has touched shared state or the DOM yet. Bail
      // here if a newer call (a later poll tick, or the user switching
      // games/dates) has since started -- otherwise a slow, now-stale
      // response could still overwrite what the newer call already
      // rendered. See fetchAndRenderRequestId.
      if (requestId !== fetchAndRenderRequestId) return;

      pitchStore = {};
      // Team names for the challenge-outcome text in the pitch popup, keyed
      // by team id (play.reviewDetails.challengeTeamId) -- see extractPitches.
      absChallengeInfo = {
        [gameData.teams.away.id]: gameData.teams.away.locationName || teamNickname(gameData.teams.away),
        [gameData.teams.home.id]: gameData.teams.home.locationName || teamNickname(gameData.teams.home)
      };

      // A starter's battingOrder is a clean multiple of 100 (100, 200, ...);
      // a substitute who enters for that slot gets that slot's number plus
      // 1, 2, etc. (101, 102, ...), so an entered bench player still reads
      // as "not a starter" while gaining a battingOrder -- kept in the
      // Bench section (rather than only showing up as a substitute line
      // under the original starter in the scorecard grid) and flagged with
      // `entered` so the roster modal can tag them instead of dropping them.
      function getBenchPlayers(sideBoxscore, teamName) {
        return Object.values(sideBoxscore.players || {})
          .filter(p => p.person && p.position && p.position.abbreviation !== 'P'
            && (!p.battingOrder || parseInt(p.battingOrder) % 100 !== 0))
          .map(p => {
            // Bench players who never entered the game have no batting row
            // in renderTeamTable to populate playerStore for them, so the
            // roster modal's name button would silently do nothing without
            // this -- see showPlayerModal's playerStore lookup.
            playerStore[p.person.id] = { id: p.person.id, name: p.person.fullName, pos: p.position.abbreviation, team: teamName, season, gameDate: officialDate, todayStats: (p.stats && p.stats.batting) || {} };
            return { id: p.person.id, name: p.person.fullName, pos: p.position.abbreviation, entered: !!p.battingOrder };
          })
          // entered substitutes float to the top, same as relievers who've
          // entered sort above the rest of the bullpen in buildBullpenList
          .sort((a, b) => (b.entered ? 1 : 0) - (a.entered ? 1 : 0));
      }
      // buildBullpenList's own results don't touch playerStore either --
      // pitchers who only pitched (never batted) have no batting row in
      // renderTeamTable to populate it, same gap as the bench players above.
      awayBullpen.forEach(p => { playerStore[p.id] = { id: p.id, name: p.name, pos: 'P', team: awayName, season, gameDate: officialDate, todayStats: p.todayStats || {} }; });
      homeBullpen.forEach(p => { playerStore[p.id] = { id: p.id, name: p.name, pos: 'P', team: homeName, season, gameDate: officialDate, todayStats: p.todayStats || {} }; });
      rosterStore[awayName] = renderRosterContent(awayName, awayBullpen, awayRows, getBenchPlayers(liveData.boxscore.teams.away, awayName));
      rosterStore[homeName] = renderRosterContent(homeName, homeBullpen, homeRows, getBenchPlayers(liveData.boxscore.teams.home, homeName));

      // Text for the pre-game score strip (Live and Final get the board).
      const awayAbbr = (gameData.teams.away.abbreviation) || awayName;
      const homeAbbr = (gameData.teams.home.abbreviation) || homeName;
      let compactStateHtml = '';
      let monsterPanelHtml = '';
      let subLineHtml = '';
      // MLB flips abstractGameState to 'Live' during pre-game warmup, well
      // ahead of first pitch -- gameHasStarted (at least one real pitch
      // thrown anywhere in the game) is what actually distinguishes "in
      // progress" from "warming up," since linescore.currentInning/outs/etc.
      // are already populated with placeholder-ish values during warmup and
      // would otherwise render as a fabricated live count.
      if ((state === 'Live' && gameHasStarted) || state === 'Final') {
        // No compactStateHtml here (unlike the preview branch below) and no
        // run numbers in the strip either -- see showRunsInStrip -- since
        // the monster-panel below now covers the score, inning state, and
        // baserunners in more detail than the old compact strip did. This
        // now also covers Final -- the panel stays up instead of the whole
        // scoreboard being replaced by the plain strip once the game ends,
        // just with its live count/baserunner row collapsed (see
        // renderMonsterPanel/is-hidden).
        monsterPanelHtml = renderMonsterPanel(linescore, awayAbbr, homeAbbr, allPlays, state === 'Live');
      } else {
        const startTime = gameData.datetime && gameData.datetime.dateTime ? new Date(gameData.datetime.dateTime) : null;
        compactStateHtml = detailedState;
        subLineHtml = startTime
          ? 'First pitch: ' + startTime.toLocaleString(undefined, {hour:'numeric', minute:'2-digit', month:'short', day:'numeric'})
          : '';
      }

      // scoreStripHtml only ever renders now for the preview (game hasn't
      // started) branch above -- Live and Final both take the monster-panel
      // path instead (see monsterPanelHtml below), so there's no score
      // to show here and no team abbreviations either, just the detailed
      // status and first-pitch time.
      const scoreStripHtml = `
        <span class="score-strip-teams">${awayAbbr} @ ${homeAbbr}</span>
        ${compactStateHtml ? `<span class="score-strip-state">${compactStateHtml}</span>` : ''}
      `;

      // Lives in the fixed bottom bar (#scoreBottomBar) below the wide
      // breakpoint, not in .sheet -- see .score-bottom-bar for why -- and in
      // #sidebarMonsterPanel (the same markup, just also written into the
      // wide-screen sidebar's top slot) above it. Live and Final both show
      // just the monster-panel, centered -- no strip, no At Bat/Pitching
      // line, no Previous Batter, no Game Summary button (that's up in the
      // controls bar now). Only the preview state (game hasn't started)
      // still uses the original top-strip layout, since there's no panel
      // there to replace it.
      const scoreBarHtml = monsterPanelHtml ? monsterPanelHtml : `
        <div class="score-strip">${scoreStripHtml}</div>
        ${subLineHtml ? `<div class="score-strip-sub">${subLineHtml}</div>` : ''}
      `;
      // Between the phone and the sidebar's breakpoint the bar has room for
      // the at-bat too, as its own card (see updateAtBatTrackers).
      scoreBottomBar.innerHTML = monsterPanelHtml
        ? `<div class="bar-row">${monsterPanelHtml}<div class="bar-atbat" id="barAtBat"></div></div>`
        : scoreBarHtml;
      sidebarMonsterPanel.innerHTML = scoreBarHtml;

      // Every half-inning played so far, in order, through the one being
      // played now (which may not have a play of its own yet).
      const halves = [];
      allPlays.forEach(pl => {
        const h = { inning: pl.about.inning, top: pl.about.isTopInning };
        const prev = halves[halves.length - 1];
        if (!prev || prev.inning !== h.inning || prev.top !== h.top) halves.push(h);
      });
      if (liveHalf) {
        const at = halves.findIndex(h => h.inning === liveHalf.inning && h.top === liveHalf.top);
        if (at === -1) halves.push(liveHalf); else halves.length = at + 1;
      }
      if (!halves.length) halves.push({ inning: 1, top: true });

      const highlights = state === 'Final' && wpa && Object.keys(wpa).length
        ? buildGameHighlights(allPlays, wpa, gameData, liveData.boxscore) : null;
      const isLive = state === 'Live' && gameHasStarted;
      scorecardModel = {
        gamePk, state, halves, liveHalf, liveBatterInfo, highlights, numInnings, columnsPerInning, season, officialDate,
        away: { name: awayName, abbr: awayAbbr, nickname: teamNickname(gameData.teams.away), rows: awayRows, pitcherByInning: away.pitcherByInning, starterPitcherId: away.starterPitcherId,
          pitchingBox: renderPitchingBox(awayStaff, teamNickname(gameData.teams.away), isLive) },
        home: { name: homeName, abbr: homeAbbr, nickname: teamNickname(gameData.teams.home), rows: homeRows, pitcherByInning: home.pitcherByInning, starterPitcherId: home.starterPitcherId,
          pitchingBox: renderPitchingBox(homeStaff, teamNickname(gameData.teams.home), isLive) }
      };
      syncScorecardView();
      renderScorecardSheet();
      announceNewPlay(gamePk, allPlays);
      renderedFeedKey = feedKey;
      renderedFeedLive = state === 'Live';
      markFeedFresh();

      // The wide-screen sidebar's own live-at-bat tracker -- livePkey was
      // computed above from liveBatterInfo, and is only now safe to look up
      // in pitchStore since the renderTeamTable calls just above are what
      // populate it (see the isLiveCell branch in that cell-building loop).
      updateAtBatTrackers(livePkey);
      // A finished game's sidebar tells its story instead of an empty tracker.
      if (state === 'Final') sidebarAtBatEl.innerHTML = renderGameStory(highlights);

      if (state === 'Live') scheduleLivePoll(gamePk, startedAt);

      // if the pitch modal is currently open, refresh it in place with the
      // freshly-rebuilt pitchStore rather than leaving it showing stale data.
      // The same pkey naturally carries through from a live at-bat to its
      // completed cell once the plate appearance resolves, since both are
      // keyed by team/slot/inning/sub-column rather than by play instance.
      if (currentOpenPkey && pitchOverlay.classList.contains('open')) {
        if (pitchStore[currentOpenPkey]) showPitchPopup(currentOpenPkey);
        else hidePitchPopup();
      }
    } catch (e) {
      if (requestId !== fetchAndRenderRequestId) return;
      // A dropped poll mid-game keeps the scorecard (and the reader's place
      // in it) on screen, marked stale, and tries again on the usual beat;
      // only a game that never loaded gets the error plate.
      if (renderedFeedKey && renderedFeedKey.startsWith(`${gamePk}|`)) {
        setFeedStale(true);
        if (renderedFeedLive) scheduleLivePoll(gamePk, startedAt);
        return;
      }
      renderedFeedKey = null;
      body.innerHTML = apiErrorMsg('game data', 'game');
      scoreBottomBar.innerHTML = '';
      sidebarMonsterPanel.innerHTML = '';
      updateAtBatTrackers(null);
    }
  }

  function focusedControlSelector(root) {
    const el = document.activeElement;
    if (!el || el === root || !root.contains(el)) return null;
    const attrs = Array.from(el.attributes).filter(a => a.name.startsWith('data-'));
    if (!attrs.length) return null;
    return el.tagName.toLowerCase() + (el.classList[0] ? `.${CSS.escape(el.classList[0])}` : '')
      + attrs.map(a => `[${a.name}="${CSS.escape(a.value)}"]`).join('');
  }

  dateInput.addEventListener('change', () => {
    renderDateText(dateInputText, dateInput.value);
    loadSchedule(dateInput.value);
  });
  document.getElementById('datePrev').addEventListener('click', () => {
    setDateInputValue(dateInput, dateInputText, addDays(dateInput.value, -1));
    loadSchedule(dateInput.value);
  });
  document.getElementById('dateNext').addEventListener('click', () => {
    setDateInputValue(dateInput, dateInputText, addDays(dateInput.value, 1));
    loadSchedule(dateInput.value);
  });
  function selectGame(gamePk) {
    if (!gamePk || gamePk === String(currentGamePk)) return;
    currentGamePk = gamePk;
    renderGameStrip(dateInput.value, scheduleGames);
    // Swap the old game's scorecard for a loading plate naming the new one
    // right away, rather than leaving the previous grid looking current
    // until the new fetch resolves.
    const g = (scheduleGames || []).find(x => String(x.gamePk) === String(gamePk));
    body.innerHTML = `<div class="mlb-status-msg">Loading ${g ? `${teamAbbr(g.teams.away.team)} @ ${teamAbbr(g.teams.home.team)}` : 'the game'}&#8230;</div>`;
    renderedFeedKey = null;
    scoreBottomBar.innerHTML = '';
    sidebarMonsterPanel.innerHTML = '';
    updateAtBatTrackers(null);
    loadGame(gamePk);
  }
  // Below 699px (see .game-strip's CSS) the strip shows only the current
  // game -- clicking that one tile can't "select" it (it's already
  // current), so treat that specific tap as opening the all-games modal
  // instead, rather than keeping a separate "Games" button around just for
  // that. Desktop still shows every tile, where a click always picks one.
  function handleGameStripTileActivate(tile) {
    if (!tile) return;
    const gamePk = tile.dataset.gamePk;
    if (gamePk === String(currentGamePk) && window.matchMedia('(max-width: 699px)').matches) {
      showGameStripModal(dateInput.value, scheduleGames);
      return;
    }
    selectGame(gamePk);
  }
  gameStrip.addEventListener('scroll', updateGameStripFade, { passive: true });
  window.addEventListener('resize', updateGameStripFade);
  // A plain vertical mouse wheel over the strip pans it horizontally
  // instead of falling through to the page -- only once it actually has
  // overflow to pan (below the 699px breakpoint it shows just the current
  // tile with nothing to scroll, see .game-strip's CSS), and only for
  // wheel input dominated by its vertical component, so a trackpad's own
  // horizontal swipe (already deltaX) still scrolls it natively without
  // this doubling it up.
  gameStrip.addEventListener('wheel', (e) => {
    if (gameStrip.scrollWidth <= gameStrip.clientWidth) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    gameStrip.scrollLeft += e.deltaY;
  }, { passive: false });
  gameStrip.addEventListener('click', (e) => {
    handleGameStripTileActivate(e.target.closest('.daily-tile'));
  });
  gameStrip.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tile = e.target.closest('.daily-tile');
    if (tile) e.preventDefault();
    handleGameStripTileActivate(tile);
  });
  // The popup lists either the Scorecard's own date (switch games in
  // place) or a postseason series (open that game's scorecard from Standings).
  function openGameStripTile(tile) {
    hideGameStripModal();
    if (gameStripOverlayBody.dataset.mode === 'series') jumpToScorecardGame(tile.dataset.date, tile.dataset.gamePk);
    else selectGame(tile.dataset.gamePk);
  }
  gameStripOverlayBody.addEventListener('click', (e) => {
    const tile = e.target.closest('.daily-tile');
    if (!tile) return;
    openGameStripTile(tile);
  });
  gameStripOverlayBody.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tile = e.target.closest('.daily-tile');
    if (!tile) return;
    e.preventDefault();
    openGameStripTile(tile);
  });
  gameStripOverlayClose.addEventListener('click', hideGameStripModal);
  gameStripOverlay.addEventListener('click', (e) => {
    if (e.target === gameStripOverlay) hideGameStripModal();
  });

  standingsYearSelect.addEventListener('change', () => {
    setStandingsSeason(standingsYearSelect.value);
    loadStandings();
  });

  document.getElementById('standingsViewToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.view-toggle-btn');
    if (!btn || btn.dataset.view === standingsView) return;
    setStandingsView(btn.dataset.view);
    loadStandings();
  });
  function setStandingsView(view) {
    standingsView = view;
    document.querySelectorAll('#standingsViewToggle .view-toggle-btn')
      .forEach(b => b.classList.toggle('active', b.dataset.view === view));
  }
  standingsBody.addEventListener('click', (e) => {
    const series = e.target.closest('.pb-series[data-series-id]');
    if (series) showSeriesGamesModal(series.dataset.seriesId);
  });

  myTeamSelect.addEventListener('change', () => {
    myTeam = myTeamSelect.value;
    try { localStorage.setItem(MY_TEAM_KEY, myTeam); } catch (e) {}
    renderMyTeamMark();
    // Tabs already opened switch to the new team; the rest pick it up when they open.
    if (myTeam && teamTab.season) {
      teamTabSelect.value = myTeam;
      teamTab.teamId = myTeam;
      loadTeamTab();
    }
    if (standingsBody.querySelector('.sheet')) loadStandings();
  });

  const pitchOverlay = document.getElementById('pitchOverlay');
  let currentOpenPkey = null;
  // Highest pitch number already rendered for the currently open popup, so a
  // poll refresh can tell which pitch(es) just arrived. Reset whenever the
  // popup closes so reopening any at-bat later starts without stale state.
  let lastRenderedPitchNum = 0;
  const pitchModalBody = document.getElementById('pitchModalBody');
  const pitchClose = document.getElementById('pitchClose');

  // Which of the 7 result categories a pitch's raw description falls into.
  // Shared by the table text color and the location-plot marker so the two
  // can never drift out of sync with each other.
  function classifyResult(result) {
    if (/hit by pitch/i.test(result)) return 'hbp';
    if (/in play/i.test(result)) return /out\(s\)/i.test(result) ? 'inplay-out' : 'inplay-safe';
    if (/foul/i.test(result)) return 'foul';
    if (/called strike/i.test(result)) return 'strike-called';
    if (/strike/i.test(result)) return 'strike-swinging';
    if (/ball/i.test(result)) return 'ball';
    return 'other';
  }

  // A pitch's kind with its count in hand: a foul tip is always a strike
  // (with two, a strikeout), as is a two-strike foul bunt; any other foul
  // with two strikes changes nothing ('foul-2k'), and one with fewer is a
  // strike like any other ('foul').
  function classifyPitch(p) {
    const kind = classifyResult(p.result || '');
    if (kind !== 'foul') return kind;
    if (/foul tip/i.test(p.result)) return 'strike-swinging';
    if ((p.preStrikes || 0) >= 2) return /bunt/i.test(p.result) ? 'strike-swinging' : 'foul-2k';
    return 'foul';
  }

  const RESULT_CLASS = (pitch) => {
    switch (classifyPitch(pitch)) {
      case 'ball': return 'pitch-result-ball';
      case 'strike-called': case 'strike-swinging': return 'pitch-result-strike';
      case 'foul': case 'foul-2k': return 'pitch-result-foul';
      case 'inplay-safe': return 'pitch-result-hit';
      case 'inplay-out': return 'pitch-result-out';
      case 'hbp': return 'pitch-result-hbp';
      default: return '';
    }
  };

  // Hue + fill state for each category's location-plot marker. Hollow marks
  // the "lesser/passive" half of a pair -- a called strike vs. a swinging
  // one, a foul vs. a ball actually put in play safely -- everything else
  // (including the ring drawn on an at-bat's final pitch) uses this same hue.
  const RESULT_MARKER = {
    ball: { hue: PALETTE.ball, hollow: false },
    'strike-called': { hue: PALETTE.brick, hollow: true },
    'strike-swinging': { hue: PALETTE.brick, hollow: false },
    // Every foul is cream; one that left the count where it was (two
    // strikes) is the hollow, lesser mark, the rest filled like the strike
    // they were.
    foul: { hue: PALETTE.ink, hollow: false },
    'foul-2k': { hue: PALETTE.ink, hollow: true },
    'inplay-safe': { hue: PALETTE.gold, hollow: false },
    'inplay-out': { hue: PALETTE.gray, hollow: false },
    hbp: { hue: PALETTE.ball, hollow: true },
    other: { hue: PALETTE.ink, hollow: false }
  };

  // Batter's-box marker: an open bracket hugging the outer edge of a tab
  // beside the zone (open side facing the zone), with the batting side
  // spelled out and rotated to run the tab's height. Negative pX is the
  // third-base side, so a right-handed batter's box sits on the plot's left
  // in this catcher's-eye view.
  function battersBoxMarker(zoneLeft, zoneRight, zoneTop, zoneBot, batSide) {
    const gap = 5, tabW = 20;
    const batX = batSide === 'R' ? (zoneLeft - gap - tabW) : (zoneRight + gap);
    const midX = batX + tabW / 2, midY = (zoneTop + zoneBot) / 2;
    const label = batSide === 'R' ? 'RIGHTY' : 'LEFTY';
    const outerX = batSide === 'R' ? batX : batX + tabW;
    const tickDir = batSide === 'R' ? 1 : -1, tickLen = 7;
    let svg = `<line x1="${outerX}" y1="${zoneTop}" x2="${outerX}" y2="${zoneBot}" stroke="${PALETTE.ink}" stroke-width="1.3" opacity="0.7"/>`;
    svg += `<line x1="${outerX}" y1="${zoneTop}" x2="${outerX + tickDir * tickLen}" y2="${zoneTop}" stroke="${PALETTE.ink}" stroke-width="1.3" opacity="0.7"/>`;
    svg += `<line x1="${outerX}" y1="${zoneBot}" x2="${outerX + tickDir * tickLen}" y2="${zoneBot}" stroke="${PALETTE.ink}" stroke-width="1.3" opacity="0.7"/>`;
    svg += `<text x="${midX}" y="${midY}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" letter-spacing="0.06em" font-family="Overpass, sans-serif" fill="${PALETTE.ink}" opacity="0.85" transform="rotate(-90 ${midX} ${midY})">${label}</text>`;
    return svg;
  }

  // Pitcher release-point marker: a hollow circle flush to the side above
  // the zone the pitch actually comes from -- third-base side (left, in
  // this view) for a righty, first-base side (right) for a lefty, matching
  // real release-point data.
  function pitcherReleaseMarker(zoneLeft, zoneRight, zoneTop, pitchHand) {
    const cornerX = pitchHand === 'R' ? zoneLeft : zoneRight;
    // r grew from 9.5 to fit "LHP"/"RHP" (was just "L"/"R") without the
    // label crowding the circle's own edge -- font-size shrank to match.
    const r = 12, gapAboveZone = 8;
    const dotX = cornerX + (pitchHand === 'R' ? 1 : -1) * 14;
    const dotY = zoneTop - gapAboveZone - r;
    const label = pitchHand + 'HP';
    return `<circle cx="${dotX}" cy="${dotY}" r="${r}" fill="rgba(243,236,219,0.04)" stroke="${PALETTE.ink}" stroke-width="1.3" opacity="0.75"/>` +
      `<text x="${dotX}" y="${dotY + 3}" text-anchor="middle" font-size="7.5" font-weight="700" letter-spacing="-0.02em" font-family="Overpass, sans-serif" fill="${PALETTE.ink}" opacity="0.85">${label}</text>`;
  }

  // ringed: only the pitch that actually ended the at-bat gets the persistent
  // ring -- during a live at-bat the most recent pitch is not that, it's
  // just the newest one so far. justArrived: true for a split-second on
  // whichever pitch(es) newly showed up since this popup was last rendered,
  // regardless of whether the at-bat is done -- see showPitchPopup.
  function pitchLocationMarker(p, px, py, ringed, justArrived) {
    const spec = RESULT_MARKER[classifyPitch(p)] || RESULT_MARKER.other;
    let svg = `<g class="loc-dot" data-num="${p.num || ''}">`;
    if (ringed) {
      svg += `<circle cx="${px}" cy="${py}" r="10.5" fill="none" stroke="${spec.hue}" stroke-width="1.2" opacity="0.6"/>`;
    }
    if (p.hasReview) {
      svg += `<circle cx="${px}" cy="${py}" r="13" fill="none" stroke="${PALETTE.ink}" stroke-width="1.3" stroke-dasharray="2.5 2.5" opacity="0.75"/>`;
    }
    if (justArrived) {
      svg += `<circle class="loc-dot-glow" cx="${px}" cy="${py}" r="7.5" fill="none" stroke="${spec.hue}" stroke-width="2.5"/>`;
    }
    if (spec.hollow) {
      svg += `<circle cx="${px}" cy="${py}" r="7.5" fill="${PALETTE.paper}" stroke="${spec.hue}" stroke-width="1.8"/>`;
      svg += `<text x="${px}" y="${py + 3}" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Overpass, sans-serif" fill="${spec.hue}">${p.num || ''}</text>`;
    } else {
      svg += `<circle cx="${px}" cy="${py}" r="7.5" fill="${spec.hue}" stroke="${PALETTE.paper}" stroke-width="1.2"/>`;
      svg += `<text x="${px}" y="${py + 3}" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Overpass, sans-serif" fill="${PALETTE.paper}">${p.num || ''}</text>`;
    }
    svg += '</g>';
    return svg;
  }

  // Catcher's-eye strike-zone plot: pX/pZ are feet from the plate's center
  // and feet off the ground respectively (see extractPitches). Renders
  // nothing if not one single pitch in the at-bat has location data, rather
  // than showing an empty box -- UNLESS allowEmpty is set, which skips that
  // guard so the bare zone/plate can still render with no markers at all,
  // for the always-on trackers' own "no at-bat in progress" placeholder
  // (see atBatTrackerPlaceholderHtml) where there's no real pitch data to
  // ask for in the first place. newPitchNums is the set of pitch numbers that
  // just arrived since the last render of this same popup (see
  // showPitchPopup) -- empty on a fresh open, so nothing glows just from
  // clicking into an at-bat that already has a full pitch history.
  // compact: the wide-mobile bar's card -- no plate, cropped to the zone.
  function renderPitchLocation(pitches, batSide, pitchHand, isComplete, newPitchNums, allowEmpty, compact) {
    const located = pitches.filter(p => typeof p.px === 'number' && typeof p.pz === 'number');
    if (!located.length && !allowEmpty) return '';

    const withZone = located.find(p => typeof p.szTop === 'number' && typeof p.szBot === 'number');
    const szTop = withZone ? withZone.szTop : 3.5;
    const szBot = withZone ? withZone.szBot : 1.5;

    const scale = 48, cx = 100, groundY = 235, halfPlate = 0.708;
    const x = px => cx + px * scale;
    const y = pz => groundY - pz * scale;
    const zoneLeft = x(-halfPlate), zoneRight = x(halfPlate);
    const zoneTop = y(szTop), zoneBot = y(szBot);
    const lastPitch = pitches[pitches.length - 1];

    let svg = `<rect x="${zoneLeft}" y="${zoneTop}" width="${zoneRight - zoneLeft}" height="${zoneBot - zoneTop}" fill="rgba(243,236,219,0.05)" stroke="${PALETTE.ink}" stroke-width="1.4"/>`;
    for (let i = 1; i < 3; i++) {
      const gx = zoneLeft + i * (zoneRight - zoneLeft) / 3;
      const gy = zoneTop + i * (zoneBot - zoneTop) / 3;
      svg += `<line x1="${gx}" y1="${zoneTop}" x2="${gx}" y2="${zoneBot}" stroke="${PALETTE.ink}" stroke-width="0.6" opacity="0.35"/>`;
      svg += `<line x1="${zoneLeft}" y1="${gy}" x2="${zoneRight}" y2="${gy}" stroke="${PALETTE.ink}" stroke-width="0.6" opacity="0.35"/>`;
    }
    // Real, to-scale distance below the zone -- home plate sits at the
    // ground, and the zone bottom is defined at knee height, a genuine
    // ~1.5ft (at this scale) above it. halfPlate is the same 17in
    // half-width used for the zone above (the strike zone's width is
    // defined as the width of the plate), so the plate's own edges use
    // zoneLeft/zoneRight directly rather than a separately-tuned width --
    // they now always line up exactly regardless of scale.
    const plateY = groundY + 6, plateW = zoneRight - cx, plateDepth = plateW * 10 / 17, plateTip = plateW * 19 / 17;
    // Same fill/stroke-weight as the zone rect above -- one consistent
    // shading and line weight for both, rather than the plate's own
    // separately-tuned look.
    if (!compact) svg += `<path d="M ${zoneLeft},${plateY} L ${zoneRight},${plateY} L ${zoneRight},${plateY + plateDepth} L ${cx},${plateY + plateTip} L ${zoneLeft},${plateY + plateDepth} Z" fill="rgba(243,236,219,0.05)" stroke="${PALETTE.ink}" stroke-width="1.4"/>`;

    if (batSide === 'L' || batSide === 'R') {
      svg += battersBoxMarker(zoneLeft, zoneRight, zoneTop, zoneBot, batSide);
    }
    if (pitchHand === 'L' || pitchHand === 'R') {
      svg += pitcherReleaseMarker(zoneLeft, zoneRight, zoneTop, pitchHand);
    }

    located.forEach(p => {
      const ringed = isComplete && p === lastPitch;
      const justArrived = !!newPitchNums && newPitchNums.has(p.num);
      svg += pitchLocationMarker(p, x(p.px), y(p.pz), ringed, justArrived);
    });

    return `<div class="loc-section">
      <div class="loc-plot-wrap">${compact
        ? `<svg viewBox="22 24 166 196" class="loc-compact" style="overflow:visible">${svg}</svg>`
        : `<svg viewBox="0 0 200 290" width="225" height="326">${svg}</svg>`}</div>
    </div>`;
  }

  // Builds the at-bat detail markup shared by the dismissible popup
  // (#pitchModalBody) and the always-on trackers (#sidebarAtBat/#barAtBat)
  // -- see showPitchPopup and updateAtBatTrackers, the two callers, each of
  // which tracks its own "what's already been rendered" state so a poll
  // refresh only glows the pitch(es) new to *that* consumer.
  // Table shell (headers included) always renders, tbody empty when there
  // are no pitches yet -- same "structure stays, content changes" approach
  // as renderPitchLocation's allowEmpty, so the table doesn't wink in and
  // out (or get replaced by a text placeholder) around the exact moments
  // the zone above it would otherwise be doing the same thing.
  // The count is the one each pitch was thrown in, as a scorekeeper writes
  // it -- the feed's own count on a pitch is the count after it, which would
  // read 3-3 on a strikeout.
  function renderPitchTable(pitches) {
    let b = 0, st = 0;
    const rowsHtml = pitches.map(p => {
      const before = `${b}-${st}`;
      if (p.balls != null) b = p.balls;
      if (p.strikes != null) st = p.strikes;
      return `
      <tr data-num="${p.num || ''}"${p.hasReview ? ' class="challenged"' : ''}>
        <td class="pnum">${p.num || ''}</td>
        <td title="${p.type}">${p.typeCode || p.type}</td>
        <td class="pspeed">${p.speed || ''}</td>
        <td class="${RESULT_CLASS(p)}">${p.result || ''}${p.hasReview ? ' <span class="abs-tag" title="ABS challenge">ABS</span>' : ''}</td>
        <td class="pcount">${before}</td>
      </tr>`;
    }).join('');
    return `<table class="pitch-table">
      <thead><tr><th>#</th><th>Pitch</th><th>MPH</th><th>Result</th><th>Count</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  }

  function renderPitchDetailHtml(c, newPitchNums) {
    const pitches = c.pitches || [];
    const rows = renderPitchTable(pitches);

    const events = c.events || [];
    const eventsHtml = events.length
      ? `<div class="pitch-events">${events.map(e => `<div class="pitch-event-tag">${e}</div>`).join('')}</div>`
      : '';

    const reviewedPitches = pitches.filter(p => p.hasReview);
    const reviewsHtml = reviewedPitches.length
      ? `<div class="pitch-events">${reviewedPitches.map(p => {
          const rd = p.review;
          const who = (rd && rd.playerName) || (rd && absChallengeInfo && absChallengeInfo[rd.challengeTeamId]) || 'A team';
          const outcome = rd && rd.isOverturned ? 'call overturned' : 'call stands';
          return `<div class="pitch-event-tag challenge-tag"><span class="abs-tag">ABS</span>Pitch ${p.num || ''}: ${who} challenged &#8212; ${outcome}.</div>`;
        }).join('')}</div>`
      : '';

    // allowEmpty (true here unconditionally) is what keeps the zone itself
    // from vanishing for a fresh at-bat whose first pitch hasn't landed in
    // the feed yet (c exists, c.pitches is still []) -- the same bare-zone
    // rendering the "no at-bat in progress" placeholder below uses, just
    // reached from a real, in-progress at-bat instead of a null one.
    const locationHtml = renderPitchLocation(pitches, c.batSide, c.pitchHand, c.isComplete, newPitchNums, true);

    // Zone plot before the pitch table (not after, as MLB's own gameday
    // usually lays it out) -- in the always-on sidebar this table keeps
    // growing pitch by pitch over the course of a live at-bat, and with the
    // zone above it that growth pushes nothing but the events/description
    // below further down, rather than shoving the zone itself down the
    // page on every new pitch.
    return `
      <div class="pitch-header">${c.batterName || 'Batter'}</div>
      <div class="pitch-subheader">vs ${c.pitcherFullName || 'pitcher'}</div>
      ${c.videoUrl ? `<a class="pog-watch atbat-watch" ${clipWatchAttrs(c.videoUrl, `${c.batterName || ''}${c.pitcherFullName ? ` vs ${c.pitcherFullName}` : ''}`, { gameLink: false })}>Watch &#9654;</a>` : ''}
      ${locationHtml}
      ${rows}
      ${reviewsHtml}
      ${eventsHtml}
      ${c.playDesc ? `<div class="pitch-final-desc">${c.playDesc}</div>` : ''}
    `;
  }

  // A spray-chart hit from Savant carries only its game and at-bat; the
  // first tap fills in the rest from that game's play-by-play, then opens
  // the popup -- unless another dot has been tapped in the meantime.
  let sprayHydrateToken = 0;
  async function hydrateSprayBall(pkey) {
    const ball = pitchStore[pkey];
    const token = ++sprayHydrateToken;
    const plays = await getGamePlayByPlay(ball.gamePk, true);
    const play = plays && plays.find(p => p.about && p.about.atBatIndex === ball.atBatIndex);
    const full = play && battedBallFromPlay(play);
    if (!full) return;
    Object.assign(ball, full, { x: ball.x, y: ball.y, lazy: false });
    if (token === sprayHydrateToken) showPitchPopup(pkey);
  }

  function showPitchPopup(pkey) {
    const c = pitchStore[pkey];
    if (!c) return;
    if (c.lazy) { hydrateSprayBall(pkey); return; }
    // A poll refresh re-renders whatever popup is already open by calling
    // this again with the same pkey -- that's the only time a newly-arrived
    // pitch should glow. Opening a pkey fresh (or a different one) shows its
    // full pitch history at once, with nothing to call out as "just arrived".
    const isRefresh = pkey === currentOpenPkey;
    currentOpenPkey = pkey;
    const pitches = c.pitches || [];
    const newPitchNums = new Set();
    if (isRefresh) {
      pitches.forEach(p => { if ((p.num || 0) > lastRenderedPitchNum) newPitchNums.add(p.num); });
    }
    lastRenderedPitchNum = pitches.reduce((max, p) => Math.max(max, p.num || 0), 0);
    pitchModalBody.innerHTML = renderPitchDetailHtml(c, newPitchNums);
    openOverlay(pitchOverlay);
    wirePitchLocationSync(pitchModalBody);
  }

  // Hovering a table row highlights its dot in the location plot and vice
  // versa -- both sides carry the pitch number in data-num so no extra
  // state is needed to find the match. Shared by the popup and the sidebar
  // tracker, each wiring up its own container's rows/dots independently.
  function wirePitchLocationSync(container) {
    const rows = container.querySelectorAll('table.pitch-table tr[data-num], table.cpt tr[data-num]');
    const dots = container.querySelectorAll('.loc-dot[data-num]');
    if (!rows.length || !dots.length) return;
    const setActive = (num, on) => {
      if (!num) return;
      rows.forEach(r => { if (r.getAttribute('data-num') === num) r.classList.toggle('hl', on); });
      dots.forEach(d => { if (d.getAttribute('data-num') === num) d.classList.toggle('hl', on); });
    };
    rows.forEach(r => {
      const num = r.getAttribute('data-num');
      r.addEventListener('mouseenter', () => setActive(num, true));
      r.addEventListener('mouseleave', () => setActive(num, false));
    });
    dots.forEach(d => {
      const num = d.getAttribute('data-num');
      d.addEventListener('mouseenter', () => setActive(num, true));
      d.addEventListener('mouseleave', () => setActive(num, false));
    });
  }

  function hidePitchPopup({ fromHistory = false } = {}) {
    closeOverlay(pitchOverlay, { fromHistory });
    currentOpenPkey = null;
    lastRenderedPitchNum = 0;
  }

  // The always-on trackers' own copy of the popup's "what's already
  // showing" state (see currentOpenPkey/lastRenderedPitchNum above) --
  // kept separate so opening the popup for some other at-bat (e.g. a
  // completed one earlier in the game) never fights with what these are
  // tracking live, and vice versa. Shared between the wide sidebar and the
  // wide-mobile bar's card -- at most one of the two is ever visible, so
  // there's no benefit to tracking their "new pitch" glow separately.
  let atBatTrackerPkey = null;
  let atBatTrackerLastRenderedPitchNum = 0;

  // Bare zone/plate and an empty (but header-visible) pitch table, with no
  // batter box, pitcher release marker, or pitch rows -- keeps each
  // tracker's shape/proportions the same whether or not there's an at-bat
  // to show, rather than collapsing to a line of text, so the panel
  // doesn't visibly resize (and drag the fixed-position sidebar's height
  // around) every time play pauses between at-bats. allowEmpty is what
  // lets renderPitchLocation draw the zone despite zero pitches,
  // renderPitchTable([]) does the same for the table shell, and the
  // batter/pitcher lines fall back to placeholder dashes the same way
  // renderPitchDetailHtml does for a real at-bat with no name.
  function atBatTrackerPlaceholderHtml() {
    return `<div class="pitch-header">&#8212;</div><div class="pitch-subheader">vs &#8212;</div><div class="pitch-empty">No at-bat in progress.</div>${renderPitchLocation([], null, null, false, null, true)}${renderPitchTable([])}`;
  }

  // Renders the live/current at-bat (see the livePkey computed in
  // fetchAndRender) into both trackers -- the wide-screen #sidebarAtBat
  // column and the wide-mobile bar's #barAtBat card, at most one of which
  // is visible at a given width. pkey is null whenever there's
  // no at-bat actually in progress (game not started, between innings/
  // at-bats, or Final) -- see the isLiveCell/liveBatterInfo gating in
  // fetchAndRender for what counts as "in progress" -- in which case
  // atBatTrackerPlaceholderHtml() stands in with an empty zone so the
  // tracker itself never disappears, only its content changes.
  function updateAtBatTrackers(pkey) {
    const c = pkey ? pitchStore[pkey] : null;
    let html;
    let newPitchNums = null;
