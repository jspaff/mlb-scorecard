  // Highest pitch number already rendered for the currently open popup, so a
  // poll refresh can tell which pitch(es) just arrived. Reset whenever the
  // popup closes so reopening any at-bat later starts without stale state.
  let lastRenderedPitchNum = 0;
  const pitchModalBody = document.getElementById('pitchModalBody');
  const pitchClose = document.getElementById('pitchClose');

  // Which of the 7 result categories a pitch's raw description falls into.
  // Shared by the table text color and the location-plot marker so the two
  // can never drift out of sync with each other.
  function classifyResult(result) {
    if (/hit by pitch/i.test(result)) return 'hbp';
    if (/in play/i.test(result)) return /out\(s\)/i.test(result) ? 'inplay-out' : 'inplay-safe';
    if (/foul/i.test(result)) return 'foul';
    if (/called strike/i.test(result)) return 'strike-called';
    if (/strike/i.test(result)) return 'strike-swinging';
    if (/ball/i.test(result)) return 'ball';
    return 'other';
  }

  const RESULT_CLASS = (result) => {
    switch (classifyResult(result)) {
      case 'ball': return 'pitch-result-ball';
      case 'strike-called': case 'strike-swinging': return 'pitch-result-strike';
      case 'foul': case 'inplay-safe': return 'pitch-result-foulhit';
      case 'inplay-out': return 'pitch-result-out';
      case 'hbp': return 'pitch-result-hbp';
      default: return '';
    }
  };

  // Hue + fill state for each category's location-plot marker. Hollow marks
  // the "lesser/passive" half of a pair -- a called strike vs. a swinging
  // one, a foul vs. a ball actually put in play safely -- everything else
  // (including the ring drawn on an at-bat's final pitch) uses this same hue.
  const RESULT_MARKER = {
    ball: { hue: PALETTE.ball, hollow: false },
    'strike-called': { hue: PALETTE.brick, hollow: true },
    'strike-swinging': { hue: PALETTE.brick, hollow: false },
    foul: { hue: PALETTE.gold, hollow: true },
    'inplay-safe': { hue: PALETTE.gold, hollow: false },
    'inplay-out': { hue: PALETTE.gray, hollow: false },
    hbp: { hue: PALETTE.ball, hollow: true },
    other: { hue: PALETTE.ink, hollow: false }
  };

  // Batter's-box marker: an open bracket hugging the outer edge of a tab
  // beside the zone (open side facing the zone), with the batting side
  // spelled out and rotated to run the tab's height. Negative pX is the
  // third-base side, so a right-handed batter's box sits on the plot's left
  // in this catcher's-eye view.
  function battersBoxMarker(zoneLeft, zoneRight, zoneTop, zoneBot, batSide) {
    const gap = 5, tabW = 20;
    const batX = batSide === 'R' ? (zoneLeft - gap - tabW) : (zoneRight + gap);
    const midX = batX + tabW / 2, midY = (zoneTop + zoneBot) / 2;
    const label = batSide === 'R' ? 'RIGHTY' : 'LEFTY';
    const outerX = batSide === 'R' ? batX : batX + tabW;
    const tickDir = batSide === 'R' ? 1 : -1, tickLen = 7;
    let svg = `<line x1="${outerX}" y1="${zoneTop}" x2="${outerX}" y2="${zoneBot}" stroke="${PALETTE.ink}" stroke-width="1.3" opacity="0.7"/>`;
    svg += `<line x1="${outerX}" y1="${zoneTop}" x2="${outerX + tickDir * tickLen}" y2="${zoneTop}" stroke="${PALETTE.ink}" stroke-width="1.3" opacity="0.7"/>`;
    svg += `<line x1="${outerX}" y1="${zoneBot}" x2="${outerX + tickDir * tickLen}" y2="${zoneBot}" stroke="${PALETTE.ink}" stroke-width="1.3" opacity="0.7"/>`;
    svg += `<text x="${midX}" y="${midY}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" letter-spacing="0.06em" font-family="Overpass, sans-serif" fill="${PALETTE.ink}" opacity="0.85" transform="rotate(-90 ${midX} ${midY})">${label}</text>`;
    return svg;
  }

  // Pitcher release-point marker: a hollow circle flush to the side above
  // the zone the pitch actually comes from -- third-base side (left, in
  // this view) for a righty, first-base side (right) for a lefty, matching
  // real release-point data.
  function pitcherReleaseMarker(zoneLeft, zoneRight, zoneTop, pitchHand) {
    const cornerX = pitchHand === 'R' ? zoneLeft : zoneRight;
    // r grew from 9.5 to fit "LHP"/"RHP" (was just "L"/"R") without the
    // label crowding the circle's own edge -- font-size shrank to match.
    const r = 12, gapAboveZone = 8;
    const dotX = cornerX + (pitchHand === 'R' ? 1 : -1) * 14;
    const dotY = zoneTop - gapAboveZone - r;
    const label = pitchHand + 'HP';
    return `<circle cx="${dotX}" cy="${dotY}" r="${r}" fill="rgba(243,236,219,0.04)" stroke="${PALETTE.ink}" stroke-width="1.3" opacity="0.75"/>` +
      `<text x="${dotX}" y="${dotY + 3}" text-anchor="middle" font-size="7.5" font-weight="700" letter-spacing="-0.02em" font-family="Overpass, sans-serif" fill="${PALETTE.ink}" opacity="0.85">${label}</text>`;
  }

  // ringed: only the pitch that actually ended the at-bat gets the persistent
  // ring -- during a live at-bat the most recent pitch is not that, it's
  // just the newest one so far. justArrived: true for a split-second on
  // whichever pitch(es) newly showed up since this popup was last rendered,
  // regardless of whether the at-bat is done -- see showPitchPopup.
  function pitchLocationMarker(p, px, py, ringed, justArrived) {
    const spec = RESULT_MARKER[classifyResult(p.result)] || RESULT_MARKER.other;
    let svg = `<g class="loc-dot" data-num="${p.num || ''}">`;
    if (ringed) {
      svg += `<circle cx="${px}" cy="${py}" r="10.5" fill="none" stroke="${spec.hue}" stroke-width="1.2" opacity="0.6"/>`;
    }
    if (p.hasReview) {
      svg += `<circle cx="${px}" cy="${py}" r="13" fill="none" stroke="${PALETTE.ink}" stroke-width="1.3" stroke-dasharray="2.5 2.5" opacity="0.75"/>`;
    }
    if (justArrived) {
      svg += `<circle class="loc-dot-glow" cx="${px}" cy="${py}" r="7.5" fill="none" stroke="${spec.hue}" stroke-width="2.5"/>`;
    }
    if (spec.hollow) {
      svg += `<circle cx="${px}" cy="${py}" r="7.5" fill="${PALETTE.paper}" stroke="${spec.hue}" stroke-width="1.8"/>`;
      svg += `<text x="${px}" y="${py + 3}" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Overpass, sans-serif" fill="${spec.hue}">${p.num || ''}</text>`;
    } else {
      svg += `<circle cx="${px}" cy="${py}" r="7.5" fill="${spec.hue}" stroke="${PALETTE.paper}" stroke-width="1.2"/>`;
      svg += `<text x="${px}" y="${py + 3}" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Overpass, sans-serif" fill="${PALETTE.paper}">${p.num || ''}</text>`;
    }
    svg += '</g>';
    return svg;
  }

  // Catcher's-eye strike-zone plot: pX/pZ are feet from the plate's center
  // and feet off the ground respectively (see extractPitches). Renders
  // nothing if not one single pitch in the at-bat has location data, rather
  // than showing an empty box -- UNLESS allowEmpty is set, which skips that
  // guard so the bare zone/plate can still render with no markers at all,
  // for the always-on trackers' own "no at-bat in progress" placeholder
  // (see atBatTrackerPlaceholderHtml) where there's no real pitch data to
  // ask for in the first place. newPitchNums is the set of pitch numbers that
  // just arrived since the last render of this same popup (see
  // showPitchPopup) -- empty on a fresh open, so nothing glows just from
  // clicking into an at-bat that already has a full pitch history.
  function renderPitchLocation(pitches, batSide, pitchHand, isComplete, newPitchNums, allowEmpty) {
    const located = pitches.filter(p => typeof p.px === 'number' && typeof p.pz === 'number');
    if (!located.length && !allowEmpty) return '';

    const withZone = located.find(p => typeof p.szTop === 'number' && typeof p.szBot === 'number');
    const szTop = withZone ? withZone.szTop : 3.5;
    const szBot = withZone ? withZone.szBot : 1.5;

    const scale = 48, cx = 100, groundY = 235, halfPlate = 0.708;
    const x = px => cx + px * scale;
    const y = pz => groundY - pz * scale;
    const zoneLeft = x(-halfPlate), zoneRight = x(halfPlate);
    const zoneTop = y(szTop), zoneBot = y(szBot);
    const lastPitch = pitches[pitches.length - 1];

    let svg = `<rect x="${zoneLeft}" y="${zoneTop}" width="${zoneRight - zoneLeft}" height="${zoneBot - zoneTop}" fill="rgba(243,236,219,0.05)" stroke="${PALETTE.ink}" stroke-width="1.4"/>`;
    for (let i = 1; i < 3; i++) {
      const gx = zoneLeft + i * (zoneRight - zoneLeft) / 3;
      const gy = zoneTop + i * (zoneBot - zoneTop) / 3;
      svg += `<line x1="${gx}" y1="${zoneTop}" x2="${gx}" y2="${zoneBot}" stroke="${PALETTE.ink}" stroke-width="0.6" opacity="0.35"/>`;
      svg += `<line x1="${zoneLeft}" y1="${gy}" x2="${zoneRight}" y2="${gy}" stroke="${PALETTE.ink}" stroke-width="0.6" opacity="0.35"/>`;
    }
    // Real, to-scale distance below the zone -- home plate sits at the
    // ground, and the zone bottom is defined at knee height, a genuine
    // ~1.5ft (at this scale) above it. halfPlate is the same 17in
    // half-width used for the zone above (the strike zone's width is
    // defined as the width of the plate), so the plate's own edges use
    // zoneLeft/zoneRight directly rather than a separately-tuned width --
    // they now always line up exactly regardless of scale.
    const plateY = groundY + 6, plateW = zoneRight - cx, plateDepth = plateW * 10 / 17, plateTip = plateW * 19 / 17;
    // Same fill/stroke-weight as the zone rect above -- one consistent
    // shading and line weight for both, rather than the plate's own
    // separately-tuned look.
    svg += `<path d="M ${zoneLeft},${plateY} L ${zoneRight},${plateY} L ${zoneRight},${plateY + plateDepth} L ${cx},${plateY + plateTip} L ${zoneLeft},${plateY + plateDepth} Z" fill="rgba(243,236,219,0.05)" stroke="${PALETTE.ink}" stroke-width="1.4"/>`;

    if (batSide === 'L' || batSide === 'R') {
      svg += battersBoxMarker(zoneLeft, zoneRight, zoneTop, zoneBot, batSide);
    }
    if (pitchHand === 'L' || pitchHand === 'R') {
      svg += pitcherReleaseMarker(zoneLeft, zoneRight, zoneTop, pitchHand);
    }

    located.forEach(p => {
      const ringed = isComplete && p === lastPitch;
      const justArrived = !!newPitchNums && newPitchNums.has(p.num);
      svg += pitchLocationMarker(p, x(p.px), y(p.pz), ringed, justArrived);
    });

    return `<div class="loc-section">
      <div class="loc-plot-wrap"><svg viewBox="0 0 200 290" width="225" height="326">${svg}</svg></div>
    </div>`;
  }

  // Builds the at-bat detail markup shared by the dismissible popup
  // (#pitchModalBody) and the always-on trackers (#sidebarAtBat/#mobileAtBat)
  // -- see showPitchPopup and updateAtBatTrackers, the two callers, each of
  // which tracks its own "what's already been rendered" state so a poll
  // refresh only glows the pitch(es) new to *that* consumer.
  // Table shell (headers included) always renders, tbody empty when there
  // are no pitches yet -- same "structure stays, content changes" approach
  // as renderPitchLocation's allowEmpty, so the table doesn't wink in and
  // out (or get replaced by a text placeholder) around the exact moments
  // the zone above it would otherwise be doing the same thing.
  function renderPitchTable(pitches) {
    const rowsHtml = pitches.map(p => `
      <tr data-num="${p.num || ''}"${p.hasReview ? ' class="challenged"' : ''}>
        <td class="pnum">${p.num || ''}</td>
        <td>${p.type}</td>
        <td class="pspeed">${p.speed || ''}</td>
        <td class="${RESULT_CLASS(p.result)}">${p.result || ''}${p.hasReview ? ' <span class="abs-tag" title="ABS challenge">ABS</span>' : ''}</td>
        <td class="pcount">${p.balls != null ? p.balls : ''}-${p.strikes != null ? p.strikes : ''}</td>
      </tr>
    `).join('');
    return `<table class="pitch-table">
      <thead><tr><th>#</th><th>Pitch</th><th>MPH</th><th>Result</th><th>Count</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  }

  function renderPitchDetailHtml(c, newPitchNums) {
    const pitches = c.pitches || [];
    const rows = renderPitchTable(pitches);

    const events = c.events || [];
    const eventsHtml = events.length
      ? `<div class="pitch-events">${events.map(e => `<div class="pitch-event-tag">${e}</div>`).join('')}</div>`
      : '';

    const reviewedPitches = pitches.filter(p => p.hasReview);
    const reviewsHtml = reviewedPitches.length
      ? `<div class="pitch-events">${reviewedPitches.map(p => {
          const rd = p.review;
          const who = (rd && rd.playerName) || (rd && absChallengeInfo && absChallengeInfo[rd.challengeTeamId]) || 'A team';
          const outcome = rd && rd.isOverturned ? 'call overturned' : 'call stands';
          return `<div class="pitch-event-tag challenge-tag"><span class="abs-tag">ABS</span>Pitch ${p.num || ''}: ${who} challenged &#8212; ${outcome}.</div>`;
        }).join('')}</div>`
      : '';

    // allowEmpty (true here unconditionally) is what keeps the zone itself
    // from vanishing for a fresh at-bat whose first pitch hasn't landed in
    // the feed yet (c exists, c.pitches is still []) -- the same bare-zone
    // rendering the "no at-bat in progress" placeholder below uses, just
    // reached from a real, in-progress at-bat instead of a null one.
    const locationHtml = renderPitchLocation(pitches, c.batSide, c.pitchHand, c.isComplete, newPitchNums, true);

    // Zone plot before the pitch table (not after, as MLB's own gameday
    // usually lays it out) -- in the always-on sidebar this table keeps
    // growing pitch by pitch over the course of a live at-bat, and with the
    // zone above it that growth pushes nothing but the events/description
    // below further down, rather than shoving the zone itself down the
    // page on every new pitch.
    return `
      <div class="pitch-header">${c.batterName || 'Batter'}</div>
      <div class="pitch-subheader">vs ${c.pitcherFullName || 'pitcher'}</div>
      ${c.videoUrl ? `<a class="pog-watch atbat-watch" href="${c.videoUrl}" target="_blank" rel="noopener noreferrer">Watch &#9654;</a>` : ''}
      ${locationHtml}
      ${rows}
      ${reviewsHtml}
      ${eventsHtml}
      ${c.playDesc ? `<div class="pitch-final-desc">${c.playDesc}</div>` : ''}
    `;
  }

  function showPitchPopup(pkey) {
    const c = pitchStore[pkey];
    if (!c) return;
    // A poll refresh re-renders whatever popup is already open by calling
    // this again with the same pkey -- that's the only time a newly-arrived
    // pitch should glow. Opening a pkey fresh (or a different one) shows its
    // full pitch history at once, with nothing to call out as "just arrived".
    const isRefresh = pkey === currentOpenPkey;
    currentOpenPkey = pkey;
    const pitches = c.pitches || [];
    const newPitchNums = new Set();
    if (isRefresh) {
      pitches.forEach(p => { if ((p.num || 0) > lastRenderedPitchNum) newPitchNums.add(p.num); });
    }
    lastRenderedPitchNum = pitches.reduce((max, p) => Math.max(max, p.num || 0), 0);
    pitchModalBody.innerHTML = renderPitchDetailHtml(c, newPitchNums);
    pitchOverlay.classList.add('open');
    wirePitchLocationSync(pitchModalBody);
  }

  // Hovering a table row highlights its dot in the location plot and vice
  // versa -- both sides carry the pitch number in data-num so no extra
  // state is needed to find the match. Shared by the popup and the sidebar
  // tracker, each wiring up its own container's rows/dots independently.
  function wirePitchLocationSync(container) {
    const rows = container.querySelectorAll('table.pitch-table tr[data-num]');
    const dots = container.querySelectorAll('.loc-dot[data-num]');
    if (!rows.length || !dots.length) return;
    const setActive = (num, on) => {
      if (!num) return;
      rows.forEach(r => { if (r.getAttribute('data-num') === num) r.classList.toggle('hl', on); });
      dots.forEach(d => { if (d.getAttribute('data-num') === num) d.classList.toggle('hl', on); });
    };
    rows.forEach(r => {
      const num = r.getAttribute('data-num');
      r.addEventListener('mouseenter', () => setActive(num, true));
      r.addEventListener('mouseleave', () => setActive(num, false));
    });
    dots.forEach(d => {
      const num = d.getAttribute('data-num');
      d.addEventListener('mouseenter', () => setActive(num, true));
      d.addEventListener('mouseleave', () => setActive(num, false));
    });
  }

  function hidePitchPopup() {
    pitchOverlay.classList.remove('open');
    currentOpenPkey = null;
    lastRenderedPitchNum = 0;
  }

  // The always-on trackers' own copy of the popup's "what's already
  // showing" state (see currentOpenPkey/lastRenderedPitchNum above) --
  // kept separate so opening the popup for some other at-bat (e.g. a
  // completed one earlier in the game) never fights with what these are
  // tracking live, and vice versa. Shared between the wide sidebar and the
  // narrow-screen card (the latter is always hidden now -- see .mobile-atbat
  // -- so at most one of the two is ever visible, and there's no benefit to
  // tracking their "new pitch" glow separately).
  let atBatTrackerPkey = null;
  let atBatTrackerLastRenderedPitchNum = 0;

  // Bare zone/plate and an empty (but header-visible) pitch table, with no
  // batter box, pitcher release marker, or pitch rows -- keeps each
  // tracker's shape/proportions the same whether or not there's an at-bat
  // to show, rather than collapsing to a line of text, so the panel
  // doesn't visibly resize (and drag the fixed-position sidebar's height
  // around) every time play pauses between at-bats. allowEmpty is what
  // lets renderPitchLocation draw the zone despite zero pitches,
  // renderPitchTable([]) does the same for the table shell, and the
  // batter/pitcher lines fall back to placeholder dashes the same way
  // renderPitchDetailHtml does for a real at-bat with no name.
  function atBatTrackerPlaceholderHtml() {
    return `<div class="pitch-header">&#8212;</div><div class="pitch-subheader">vs &#8212;</div><div class="pitch-empty">No at-bat in progress.</div>${renderPitchLocation([], null, null, false, null, true)}${renderPitchTable([])}`;
  }

  // Renders the live/current at-bat (see the livePkey computed in
  // fetchAndRender) into both always-on trackers -- the wide-screen
  // #sidebarAtBat column and the narrow-screen #mobileAtBat card, exactly
  // one of which is visible at a given width. pkey is null whenever there's
  // no at-bat actually in progress (game not started, between innings/
  // at-bats, or Final) -- see the isLiveCell/liveBatterInfo gating in
  // fetchAndRender for what counts as "in progress" -- in which case
  // atBatTrackerPlaceholderHtml() stands in with an empty zone so the
  // tracker itself never disappears, only its content changes.
  function updateAtBatTrackers(pkey) {
    const c = pkey ? pitchStore[pkey] : null;
    let html;
    if (!c) {
      atBatTrackerPkey = null;
      atBatTrackerLastRenderedPitchNum = 0;
      html = atBatTrackerPlaceholderHtml();
    } else {
      const isRefresh = pkey === atBatTrackerPkey;
      atBatTrackerPkey = pkey;
      const pitches = c.pitches || [];
      const newPitchNums = new Set();
      if (isRefresh) {
        pitches.forEach(p => { if ((p.num || 0) > atBatTrackerLastRenderedPitchNum) newPitchNums.add(p.num); });
      }
      atBatTrackerLastRenderedPitchNum = pitches.reduce((max, p) => Math.max(max, p.num || 0), 0);
      html = renderPitchDetailHtml(c, newPitchNums);
    }
    [sidebarAtBatEl, mobileAtBatEl].forEach(el => {
      el.innerHTML = html;
      wirePitchLocationSync(el);
    });
  }

  const rosterOverlay = document.getElementById('rosterOverlay');
  const rosterModalBody = document.getElementById('rosterModalBody');
  const rosterClose = document.getElementById('rosterClose');

  function showRosterModal(team) {
    const html = rosterStore[team];
    if (!html) return;
    rosterModalBody.innerHTML = html;
    rosterOverlay.classList.add('open');
  }
  function hideRosterModal() {
    closeOverlay(rosterOverlay);
  }

  const sprayOverlay = document.getElementById('sprayOverlay');
  const sprayModalBody = document.getElementById('sprayModalBody');
  const sprayClose = document.getElementById('sprayClose');

  function showSprayModal(team) {
    const html = sprayStore[team] || '<div class="pitch-header">' + team + '</div><div class="pitch-empty">No batted balls recorded yet.</div>';
    sprayModalBody.innerHTML = html;
    sprayOverlay.classList.add('open');
  }
  function hideSprayModal() {
    closeOverlay(sprayOverlay);
  }

  const teamChartOverlay = document.getElementById('teamChartOverlay');
  const teamChartModalBody = document.getElementById('teamChartModalBody');
  const teamChartClose = document.getElementById('teamChartClose');

  async function showTeamChartModal(teamId, teamName, season, throughDate) {
    teamChartModalBody.innerHTML = `<div class="pitch-header">${teamName}</div><div class="pitch-subheader">${season} Season</div><div class="pitch-empty">Loading&#8230;</div>`;
    teamChartOverlay.classList.add('open');
    try {
      const series = await getTeamWinLossSeries(teamId, season);
      if (!teamChartOverlay.classList.contains('open')) return;
      teamChartModalBody.innerHTML = renderTeamChartContent(teamId, teamName, season, series, throughDate);
    } catch (e) {
      teamChartModalBody.innerHTML = `<div class="pitch-header">${teamName}</div><div class="pitch-empty">Chart not available.</div>`;
    }
  }
  function hideTeamChartModal() {
    closeOverlay(teamChartOverlay);
  }

  // Tab framework: register a tab with an optional lazy `init` (runs once,
  // on first visit) and `onShow` (runs every time the tab becomes active).
  // Adding a future tab is just a register() call plus a button + panel in
  // the HTML - no router dependency needed for a single-page app like this.
  const Tabs = (() => {
    const tabs = {};
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');
    const tabControls = document.querySelectorAll('[data-tab-controls]');
    let active = null;

    function register(id, { init, onShow } = {}) {
      tabs[id] = { init, onShow, initialized: false };
    }

    function switchTo(id) {
      if (!tabs[id] || id === active) return;
      tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      tabPanels.forEach(p => { p.hidden = p.dataset.tabPanel !== id; });
      tabControls.forEach(c => { c.hidden = c.dataset.tabControls !== id; });
      const tab = tabs[id];
      if (!tab.initialized) { if (tab.init) tab.init(); tab.initialized = true; }
      if (tab.onShow) tab.onShow();
      active = id;
      try { history.replaceState(null, '', '#' + id); } catch (e) {}
    }

    function init(defaultId) {
      tabBtns.forEach(btn => btn.addEventListener('click', () => switchTo(btn.dataset.tab)));
      const fromHash = location.hash.slice(1);
      switchTo(tabs[fromHash] ? fromHash : defaultId);
    }

    return { register, switchTo, init };
  })();

  const playerSearchInput = document.getElementById('playerSearchInput');
  const playerSearchResults = document.getElementById('playerSearchResults');
  const playersBody = document.getElementById('playersBody');
  let playerSearchDebounce = null;
  let playerSearchRequestId = 0;
  let playerProfileRequestId = 0;
  // Holds the last search response so selecting a result can reuse the
  // fields already returned (name, position, team) instead of a second
  // fetch to /people/{id} for the same data.
  let currentPlayerSearchResults = [];

  async function searchPlayers(query) {
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/people/search?names=${encodeURIComponent(query)}&hydrate=currentTeam`);
      const data = await res.json();
      return data.people || [];
    } catch (e) {
      return [];
    }
  }

  function playerMetaLine(person) {
    return [
      person.currentTeam && person.currentTeam.name,
      person.primaryPosition && person.primaryPosition.abbreviation
    ].filter(Boolean).join(' &#183; ');
  }
  function playerBioLine(person) {
    return [
      person.currentAge != null ? `${person.currentAge} yrs` : null,
      person.height,
      person.weight != null ? `${person.weight} lbs` : null
    ].filter(Boolean).join(' &#183; ');
  }
  function playerBatsThrowsLine(person) {
    const bats = person.batSide && person.batSide.code;
    const throwsHand = person.pitchHand && person.pitchHand.code;
    if (bats && throwsHand) return `Bats ${bats} / Throws ${throwsHand}`;
    if (bats) return `Bats ${bats}`;
    if (throwsHand) return `Throws ${throwsHand}`;
    return null;
  }

  function renderPlayerSearchResults(people) {
    if (!people.length) {
      playerSearchResults.innerHTML = '<div class="player-search-empty">No players found.</div>';
      return;
    }
    playerSearchResults.innerHTML = people.map(p => {
      const meta = playerMetaLine(p);
      return `<div class="player-search-result" data-player-id="${p.id}">
        <span>${p.fullName}</span>
        ${meta ? `<span class="psr-meta">${meta}</span>` : ''}
      </div>`;
    }).join('');
  }

  playerSearchInput.addEventListener('input', () => {
    const query = playerSearchInput.value.trim();
    clearTimeout(playerSearchDebounce);
    if (query.length < 2) {
      playerSearchResults.hidden = true;
      return;
    }
    playerSearchDebounce = setTimeout(async () => {
      const requestId = ++playerSearchRequestId;
      const people = await searchPlayers(query);
      if (requestId !== playerSearchRequestId) return;
      currentPlayerSearchResults = people;
      renderPlayerSearchResults(people);
      playerSearchResults.hidden = false;
    }, 300);
  });

  playerSearchResults.addEventListener('click', (e) => {
    const item = e.target.closest('.player-search-result');
    if (!item) return;
    const person = currentPlayerSearchResults.find(p => String(p.id) === item.getAttribute('data-player-id'));
    playerSearchResults.hidden = true;
    if (!person) return;
    playerSearchInput.value = person.fullName;
    showPlayerProfile(person);
  });

  // A traded player's season comes back as one split per team stint --
  // this sums the underlying counting stats per season and recomputes the
  // rate stats from them, rather than averaging the already-rounded
  // per-stint rates (which would drift from the real combined average).
  function collapseCareerByYear(splits) {
    const bySeason = new Map();
    splits.forEach(s => {
      const stat = s.stat || {};
      let agg = bySeason.get(s.season);
      if (!agg) {
        agg = { season: s.season, teams: [], gamesPlayed: 0, atBats: 0, hits: 0, doubles: 0, triples: 0, homeRuns: 0, baseOnBalls: 0, hitByPitch: 0, sacFlies: 0, totalBases: 0, stolenBases: 0, caughtStealing: 0 };
        bySeason.set(s.season, agg);
      }
      const teamName = s.team && teamNickname(s.team);
      if (teamName && !agg.teams.includes(teamName)) agg.teams.push(teamName);
      agg.gamesPlayed += stat.gamesPlayed || 0;
      agg.atBats += stat.atBats || 0;
      agg.hits += stat.hits || 0;
      agg.doubles += stat.doubles || 0;
      agg.triples += stat.triples || 0;
      agg.homeRuns += stat.homeRuns || 0;
      agg.baseOnBalls += stat.baseOnBalls || 0;
      agg.hitByPitch += stat.hitByPitch || 0;
      agg.sacFlies += stat.sacFlies || 0;
      agg.totalBases += stat.totalBases || 0;
      agg.stolenBases += stat.stolenBases || 0;
      agg.caughtStealing += stat.caughtStealing || 0;
    });
    return Array.from(bySeason.values()).sort((a, b) => Number(a.season) - Number(b.season));
  }

  // Matches the API's own rate-stat formatting (".287", no leading zero).
  function formatRate(numerator, denominator) {
    if (!denominator) return '&#8212;';
    const value = numerator / denominator;
    const fixed = value.toFixed(3);
    return value < 1 ? fixed.slice(1) : fixed;
  }

  // Stolen bases as "made/attempted" (e.g. "20/24") instead of separate
  // SB/CS columns -- reads the attempt rate at a glance the way a broadcast
  // graphic would. null/undefined sb means the stat wasn't in the payload at
  // all (as opposed to a real 0), so that's the only case that falls back to
  // the table's usual em dash.
  function formatStolenBases(sb, cs) {
    if (sb == null) return '&#8212;';
    return `${sb}/${sb + (cs || 0)}`;
  }

  function renderCareerTable(splits) {
    const stintsBySeason = new Map();
    splits.forEach(s => {
      if (!stintsBySeason.has(s.season)) stintsBySeason.set(s.season, []);
      stintsBySeason.get(s.season).push(s);
    });
    const rows = collapseCareerByYear(splits).map(y => {
      const team = y.teams.length > 1 ? 'Multiple' : (y.teams[0] || '&#8212;');
      const avg = formatRate(y.hits, y.atBats);
      const obp = formatRate(y.hits + y.baseOnBalls + y.hitByPitch, y.atBats + y.baseOnBalls + y.hitByPitch + y.sacFlies);
      const slg = formatRate(y.totalBases, y.atBats);
      const sb = formatStolenBases(y.stolenBases, y.caughtStealing);
      const yearRow = `<tr class="career-year-row"><td>${y.season}</td><td>${team}</td><td>${y.gamesPlayed}</td><td>${avg}</td><td>${obp}</td><td>${slg}</td><td>${y.doubles}</td><td>${y.triples}</td><td>${y.homeRuns}</td><td>${sb}</td></tr>`;
      const stints = stintsBySeason.get(y.season) || [];
      const subRows = stints.length > 1
        ? stints.map(s => {
            const stat = s.stat || {};
            const teamName = (s.team && teamNickname(s.team)) || '&#8212;';
            return `<tr class="career-team-subrow"><td></td><td>${teamName}</td><td>${stat.gamesPlayed ?? '&#8212;'}</td><td>${stat.avg ?? '&#8212;'}</td><td>${stat.obp ?? '&#8212;'}</td><td>${stat.slg ?? '&#8212;'}</td><td>${stat.doubles ?? '&#8212;'}</td><td>${stat.triples ?? '&#8212;'}</td><td>${stat.homeRuns ?? '&#8212;'}</td><td>${formatStolenBases(stat.stolenBases, stat.caughtStealing)}</td></tr>`;
          }).join('')
        : '';
      return yearRow + subRows;
    });
    return `<div class="table-scroll"><table class="pitch-table career-table">
        <thead><tr><th>Year</th><th>Team</th><th>G</th><th>AVG</th><th>OBP</th><th>SLG</th><th>2B</th><th>3B</th><th>HR</th><th>SB</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table></div>`;
  }

  function isPitcher(person) {
    const pos = person && person.primaryPosition;
    return !!(pos && (pos.type === 'Pitcher' || pos.abbreviation === 'P'));
  }

  // "13.2" (13 innings, 2 outs) <-> 41 outs -- the API's inningsPitched
  // string uses the two out-digits as a base-3 fraction, not decimal
  // tenths, so it has to be converted to a plain out count before summing
  // across stints or seasons.
  function ipToOuts(ip) {
    if (ip == null) return 0;
    const [whole, frac] = String(ip).split('.');
    return (parseInt(whole, 10) || 0) * 3 + (parseInt(frac, 10) || 0);
  }
  function formatIP(outs) {
    return `${Math.floor(outs / 3)}.${outs % 3}`;
  }
  function formatERA(earnedRuns, outs) {
    if (!outs) return '&#8212;';
    return (earnedRuns * 27 / outs).toFixed(2);
  }
  function formatWHIP(baseOnBalls, hits, outs) {
    if (!outs) return '&#8212;';
    return ((baseOnBalls + hits) * 3 / outs).toFixed(2);
  }
  function formatKBB(strikeOuts, baseOnBalls, battersFaced) {
    if (!battersFaced) return '&#8212;';
    return `${(((strikeOuts - baseOnBalls) / battersFaced) * 100).toFixed(1)}%`;
  }

  // Mirrors collapseCareerByYear, but for pitching: sums innings as outs
  // (see ipToOuts) and battersFaced so ERA/WHIP/K%-BB% can be recomputed
  // for the combined season rather than averaging already-rounded rates.
  function collapsePitchingCareerByYear(splits) {
    const bySeason = new Map();
    splits.forEach(s => {
      const stat = s.stat || {};
      let agg = bySeason.get(s.season);
      if (!agg) {
        agg = { season: s.season, teams: [], gamesPitched: 0, outs: 0, earnedRuns: 0, hits: 0, baseOnBalls: 0, strikeOuts: 0, battersFaced: 0 };
        bySeason.set(s.season, agg);
      }
      const teamName = s.team && teamNickname(s.team);
      if (teamName && !agg.teams.includes(teamName)) agg.teams.push(teamName);
      agg.gamesPitched += stat.gamesPitched ?? stat.gamesPlayed ?? 0;
      agg.outs += ipToOuts(stat.inningsPitched);
      agg.earnedRuns += stat.earnedRuns || 0;
      agg.hits += stat.hits || 0;
      agg.baseOnBalls += stat.baseOnBalls || 0;
      agg.strikeOuts += stat.strikeOuts || 0;
      agg.battersFaced += stat.battersFaced || 0;
    });
    return Array.from(bySeason.values()).sort((a, b) => Number(a.season) - Number(b.season));
  }

  function renderPitchingCareerTable(splits) {
    const stintsBySeason = new Map();
    splits.forEach(s => {
      if (!stintsBySeason.has(s.season)) stintsBySeason.set(s.season, []);
      stintsBySeason.get(s.season).push(s);
    });
    const rows = collapsePitchingCareerByYear(splits).map(y => {
      const team = y.teams.length > 1 ? 'Multiple' : (y.teams[0] || '&#8212;');
      const era = formatERA(y.earnedRuns, y.outs);
      const whip = formatWHIP(y.baseOnBalls, y.hits, y.outs);
      const kbb = formatKBB(y.strikeOuts, y.baseOnBalls, y.battersFaced);
      const yearRow = `<tr class="career-year-row"><td>${y.season}</td><td>${team}</td><td>${y.gamesPitched}</td><td>${formatIP(y.outs)}</td><td>${era}</td><td>${whip}</td><td>${kbb}</td><td>${y.strikeOuts}</td><td>${y.baseOnBalls}</td></tr>`;
      const stints = stintsBySeason.get(y.season) || [];
      const subRows = stints.length > 1
        ? stints.map(s => {
            const stat = s.stat || {};
            const teamName = (s.team && teamNickname(s.team)) || '&#8212;';
            const kbbSub = formatKBB(stat.strikeOuts, stat.baseOnBalls, stat.battersFaced);
            return `<tr class="career-team-subrow"><td></td><td>${teamName}</td><td>${stat.gamesPitched ?? stat.gamesPlayed ?? '&#8212;'}</td><td>${stat.inningsPitched ?? '&#8212;'}</td><td>${stat.era ?? '&#8212;'}</td><td>${stat.whip ?? '&#8212;'}</td><td>${kbbSub}</td><td>${stat.strikeOuts ?? '&#8212;'}</td><td>${stat.baseOnBalls ?? '&#8212;'}</td></tr>`;
          }).join('')
        : '';
      return yearRow + subRows;
    });
    return `<div class="table-scroll"><table class="pitch-table career-table">
        <thead><tr><th>Year</th><th>Team</th><th>G</th><th>IP</th><th>ERA</th><th>WHIP</th><th>K%-BB%</th><th>SO</th><th>BB</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table></div>`;
  }

  function renderPlayerProfile(person, careerSplits, awardTags) {
    const teamId = person.currentTeam && person.currentTeam.id;
    const watermarkHtml = teamId ? `<img class="player-profile-watermark" src="${capLogoUrl(teamId)}" alt="" aria-hidden="true">` : '';
    const meta = playerMetaLine(person);
    const bio = playerBioLine(person);
    const bt = playerBatsThrowsLine(person);
    const awardsHtml = renderAwardTags(awardTags);
    const pitcher = isPitcher(person);
    const yearSplits = careerSplits === null ? null : (pitcher ? careerSplits.pitching : careerSplits.hitting);
    const careerHtml = yearSplits === null
      ? '<div class="mlb-status-msg">Loading career stats&#8230;</div>'
      : yearSplits.length
        ? (pitcher ? renderPitchingCareerTable(yearSplits) : renderCareerTable(yearSplits))
        : '<div class="pitch-empty">Career stats not available.</div>';
    const sprayHtml = !pitcher && playerSprayState.personId === Number(person.id) ? renderPlayerSprayWidget(playerSprayState) : '';
    return `<div class="sheet player-profile-sheet">
      ${watermarkHtml}
      <div class="player-profile-head">
        <img class="player-profile-photo" src="${headshotUrl(person.id, 180)}" alt="" loading="lazy" onerror="this.style.display='none'">
        <div>
          <div class="player-profile-name">${person.fullName}</div>
          ${meta ? `<div class="player-profile-meta">${meta}</div>` : ''}
          ${bio ? `<div class="player-profile-bio">${bio}</div>` : ''}
          ${bt ? `<div class="player-profile-bt">${bt}</div>` : ''}
        </div>
      </div>
      ${awardsHtml}
      <div class="roster-section-title">Career</div>
      ${careerHtml}
      ${sprayHtml}
    </div>`;
  }

  // Re-renders the profile from the last-fetched person/career/awards data
  // without re-fetching them -- used when the spray widget's own fetch
  // resolves, since that doesn't touch person/career/awards.
  function rerenderPlayerProfile() {
    if (!lastProfilePerson) return;
    playersBody.innerHTML = renderPlayerProfile(lastProfilePerson, lastProfileCareerSplits, lastProfileAwardTags);
  }

  async function loadPlayerSpray(personId, season) {
    const token = ++playerSprayToken;
    const balls = await getPlayerSeasonBattedBalls(personId, season);
    // stale if superseded by a newer season/player switch, or if the user
    // has since navigated off this player's profile entirely
    if (token !== playerSprayToken || playerSprayState.personId !== personId) return;
    playerSprayState.season = season;
    playerSprayState.balls = balls;
    playerSprayState.loading = false;
    rerenderPlayerProfile();
  }

  async function showPlayerProfile(rawPerson) {
    // Normalized once, here, since callers don't agree on type: search
    // results carry a numeric id straight from the API, but a dataset
    // attribute (jumpToPlayerProfile, showPlayerModal) is always a string.
    // playerSprayState.personId is compared with `===` elsewhere, so a
    // mismatched type there silently made the spray widget disappear
    // whenever a profile was opened by jumping from a player-name button
    // instead of the search box.
    const person = { ...rawPerson, id: Number(rawPerson.id) };
    const requestId = ++playerProfileRequestId;
    playerSprayToken++; // abandon any spray fetch still in flight for whatever was open before
    const currentSeason = new Date().getFullYear();
    playerSprayState = { personId: person.id, season: currentSeason, balls: null, loading: true };
    // Position isn't always known yet here (jumpToPlayerProfile passes only
    // an id/name, filled in below by getPlayerDetails) -- when it is known
    // up front (e.g. a search result), skip the fetch entirely rather than
    // firing it and having renderPlayerProfile just discard the result.
    if (!isPitcher(person)) loadPlayerSpray(person.id, currentSeason);
    playersBody.innerHTML = renderPlayerProfile(person, null, []);
    const [fullPerson, careerSplits, awards] = await Promise.all([
      getPlayerDetails(person.id),
      getPlayerCareerStats(person.id),
      getPlayerAwards(person.id)
    ]);
    if (requestId !== playerProfileRequestId) return;
    lastProfilePerson = fullPerson || person;
    lastProfileCareerSplits = careerSplits;
    lastProfileAwardTags = summarizeAwardTags(awards);
    rerenderPlayerProfile();
  }

  // Mirrors jumpToScorecardGame: leave the modal, switch tabs, load the
  // full page there. playerStore only has the name/pos/team the scorecard
  // grid already had on hand -- showPlayerProfile re-fetches everything
  // else (team, bio, career stats) the same as a normal search selection.
  // Closes both the quick-look player modal and the game summary modal --
  // whichever (if either) is actually open -- since this is called both
  // from inside the player modal's own CTA and directly off a Players of
  // the Game name button nested inside the game summary modal; closeOverlay
  // is a no-op on an overlay that isn't open.
  function jumpToPlayerProfile(playerId) {
    const info = playerStore[playerId];
    hidePlayerModal();
    hideGameSummaryModal();
    Tabs.switchTo('players');
    showPlayerProfile({ id: playerId, fullName: (info && info.name) || '' });
  }

  // Feeds .scorecard-sidebar's fixed top/right offsets (--tab-header-h and
  // --sidebar-right, read in CSS) so the sidebar (position: fixed, so page
  // scroll never drags it -- see .scorecard-sidebar) clamps to just below
  // the sticky .tab-header instead of overlapping it, and lines its right
  // edge up with #mlb-root's own right edge instead of the viewport's --
  // neither is a fixed constant: the header's controls row differs per tab
  // and can wrap at some widths, and #mlb-root itself may not be
  // viewport-width (padded, possibly embedded in a narrower host page).
  const mlbRootEl = document.getElementById('mlb-root');
  const tabHeaderEl = document.querySelector('.tab-header');
  function syncSidebarOffsets() {
    if (!mlbRootEl || !tabHeaderEl) return;
    mlbRootEl.style.setProperty('--tab-header-h', tabHeaderEl.offsetHeight + 'px');
    const rootRect = mlbRootEl.getBoundingClientRect();
    const rootRightPadding = parseFloat(getComputedStyle(mlbRootEl).paddingRight) || 0;
    const rightOffset = Math.max(0, window.innerWidth - rootRect.right + rootRightPadding);
    mlbRootEl.style.setProperty('--sidebar-right', rightOffset + 'px');
  }
  window.addEventListener('resize', syncSidebarOffsets);

  Tabs.register('scorecard', { onShow: syncSidebarOffsets });
  Tabs.register('daily', {
    init: () => {
      findLastStartedDate().then(dateStr => {
        setDateInputValue(dailyDateInput, dailyDateInputText, dateStr);
        loadDailySummary(dateStr);
      });
    }
  });
  Tabs.register('standings', { init: () => loadStandings(standingsDateInput.value) });
  Tabs.register('schedule', { init: () => { populateTeamSelect(scheduleTeamSelect, SCHEDULE_TEAM_KEY); loadTeamSchedule(scheduleTeamSelect.value); } });
  Tabs.register('roster', { init: () => { populateTeamSelect(rosterTabTeamSelect, ROSTER_TAB_TEAM_KEY); loadRosterTab(rosterTabTeamSelect.value); } });
  Tabs.register('players');

  const playerOverlay = document.getElementById('playerOverlay');
  const playerModalBody = document.getElementById('playerModalBody');
  const playerClose = document.getElementById('playerClose');

  async function showPlayerModal(playerId) {
    const info = playerStore[playerId];
    if (!info) return;
    playerModalBody.innerHTML = renderPlayerModalContent(info, null) + '<div class="pitch-empty">Loading season stats&#8230;</div>';
    playerOverlay.classList.add('open');
    const [seasonStat, awards] = await Promise.all([
      getPlayerSeasonStats(playerId, info.season),
      getPlayerAwards(playerId)
    ]);
    if (!playerOverlay.classList.contains('open')) return;
    playerModalBody.innerHTML = renderPlayerModalContent(info, seasonStat, summarizeAwardTags(awards));
  }
  function hidePlayerModal() {
    closeOverlay(playerOverlay);
  }

  document.addEventListener('click', (e) => {
    const boxScoreLink = e.target.closest('.box-score-link');
    if (boxScoreLink) showCurrentGameSummary();
    const target = e.target.closest('[data-pkey]');
    if (target) showPitchPopup(target.getAttribute('data-pkey'));
    const rosterBtn = e.target.closest('.roster-btn');
    if (rosterBtn) showRosterModal(rosterBtn.getAttribute('data-team'));
    const sprayBtn = e.target.closest('.spray-btn');
    if (sprayBtn) showSprayModal(sprayBtn.getAttribute('data-team'));
    const playerBtn = e.target.closest('.player-name-btn');
    if (playerBtn) {
      // Players of the Game already lives inside the game summary modal --
      // stacking the quick-look player modal on top of that would be a
      // modal-over-modal, so it jumps straight to the Players tab instead
      // of going through showPlayerModal like every other name button does.
      if (playerBtn.classList.contains('potg-player-name')) jumpToPlayerProfile(playerBtn.getAttribute('data-player-id'));
      else showPlayerModal(playerBtn.getAttribute('data-player-id'));
    }
    const teamChartBtn = e.target.closest('.standings-team-btn');
    if (teamChartBtn) {
      const teamId = teamChartBtn.getAttribute('data-team-id');
      const teamName = teamChartBtn.getAttribute('data-team-name');
      const teamSeason = standingsDateInput.value.slice(0, 4);
      showTeamChartModal(teamId, teamName, teamSeason, standingsDateInput.value);
    }
    if (!e.target.closest('.player-search-wrap')) playerSearchResults.hidden = true;
  });
  document.addEventListener('change', (e) => {
    const filterSel = e.target.closest('select.spray-filter');
    if (filterSel) {
      const team = filterSel.getAttribute('data-team');
      const val = filterSel.value;
      sprayFilterState[team] = val;
      const card = filterSel.closest('.spray-card');
      if (card) {
        card.querySelectorAll('g[data-batter]').forEach(g => {
          const match = val === 'all' || g.getAttribute('data-batter') === val;
          g.style.display = match ? '' : 'none';
        });
      }
    }
  });
  pitchClose.addEventListener('click', hidePitchPopup);
  pitchOverlay.addEventListener('click', (e) => {
    if (e.target === pitchOverlay) hidePitchPopup();
  });
  rosterClose.addEventListener('click', hideRosterModal);
  rosterOverlay.addEventListener('click', (e) => {
    if (e.target === rosterOverlay) hideRosterModal();
  });
  sprayClose.addEventListener('click', hideSprayModal);
  sprayOverlay.addEventListener('click', (e) => {
    if (e.target === sprayOverlay) hideSprayModal();
  });
  playerClose.addEventListener('click', hidePlayerModal);
  playerOverlay.addEventListener('click', (e) => {
    if (e.target === playerOverlay) hidePlayerModal();
  });
  playerModalBody.addEventListener('click', (e) => {
    const btn = e.target.closest('.modal-cta');
    if (btn) jumpToPlayerProfile(btn.dataset.playerId);
  });
  teamChartClose.addEventListener('click', hideTeamChartModal);
  teamChartOverlay.addEventListener('click', (e) => {
    if (e.target === teamChartOverlay) hideTeamChartModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { hidePitchPopup(); hideRosterModal(); hideSprayModal(); hidePlayerModal(); hideGameSummaryModal(); hideTeamChartModal(); hideGameStripModal(); playerSearchResults.hidden = true; }
  });

  // Backgrounding the tab (or the installed PWA) gets setTimeout/setInterval
  // throttled or fully suspended by the browser, so a poll (7s for a live
  // game, 15s/60s for the Daily tab) can silently stop firing while it's not
  // visible -- returning to a live game or the Daily tab could otherwise sit
  // on a stale fetch from before backgrounding for an unpredictable stretch,
  // until whatever's left of the suspended timer eventually fires. Catch up
  // immediately instead, the same way a fresh navigation would: clear
  // whatever poll is pending and refetch now.
  //
  // visibilitychange alone isn't reliable enough for this on mobile: an
  // installed home-screen app can have its process suspended or discarded
  // by the OS while backgrounded (observed on Android; standalone-mode
  // WebKit on iOS has its own history of the same class of bug), and on
  // return the event doesn't reliably fire in time, if at all, so the
  // catch-up above never runs. pageshow and window focus both fire
  // reliably on resume regardless of why visibilitychange didn't, so all
  // three are wired to the same catch-up and a short cooldown collapses
  // the near-simultaneous firings a single resume tends to produce.
  let lastResumeCatchUp = 0;
  function catchUpAfterResume() {
    const now = Date.now();
    if (now - lastResumeCatchUp < 1000) return;
    lastResumeCatchUp = now;
    if (pollTimer && currentGamePk) {
      clearInterval(pollTimer);
      fetchAndRender(currentGamePk);
    }
    if (dailyPollTimer) {
      clearTimeout(dailyPollTimer);
      dailyPollTimer = null;
      loadDailySummary(dailyDateInput.value, true);
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') catchUpAfterResume();
  });
  window.addEventListener('pageshow', catchUpAfterResume);
  window.addEventListener('focus', catchUpAfterResume);

  Tabs.init('scorecard');
  loadSchedule(dateInput.value);

  // Registers the app-shell service worker for PWA installability. Guarded
  // by protocol since service workers require http(s), not file://.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
})();
</script>
</body>
</html>
