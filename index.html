        <div class="venue-name">${venueName}</div>
        ${cityState ? `<div class="venue-city">${cityState}</div>` : ''}
      </div>
      ${badgeHtml || ''}
    </div>`;
  }

  // weather is the feed/live gameData.weather record ({temp, condition, wind}) --
  // temp/condition only, per the Game Summary modal's date line (see
  // renderGameSummaryGame / loadGameSummaryExtrasInto).
  function renderWeatherLine(weather) {
    if (!weather || weather.temp == null) return '';
    const parts = [`${weather.temp}&#176;F`];
    if (weather.condition) parts.push(weather.condition);
    return ` <span class="gs-weather">&#183; ${parts.join(' &#183; ')}</span>`;
  }

  // Dot + label for the top-row status tag next to the venue name. Keeps
  // this to a handful of broad statuses rather than surfacing every
  // detailedState MLB reports -- a Live game reads as "Live" through
  // whatever's momentarily happening inside it (a pitching change, a
  // manager challenge, a review), the same way a paper scorecard wouldn't
  // annotate every pause. Only an actual delay is worth calling out as
  // something other than the game just being underway.
  function renderStateBadge(game) {
    if (game.state === 'Final') return `<span class="badge badge-final"><span class="badge-dot"></span>Final</span>`;
    if (game.state === 'Live') {
      const isDelay = game.detailedState && /delay/i.test(game.detailedState);
      const label = isDelay ? game.detailedState : 'Live';
      return `<span class="badge badge-live"><span class="badge-dot"></span>${label}</span>`;
    }
    const label = game.detailedState && game.detailedState !== 'Scheduled' ? game.detailedState : 'Upcoming';
    return `<span class="badge badge-preview"><span class="badge-dot"></span>${label}</span>`;
  }

  // Fenway-style linescore reused for both the Scorecard tab's fixed bottom
  // bar and the Game Summary modal (see renderMonsterPanel): just team
  // names and runs by inning, grouped 1-3/4-6/7-9 (any extra innings trail
  // in their own group) with a wider gap between groups than within one --
  // no P/R/H/E columns, that's renderMonsterRHE's job. A skipped bottom
  // half (walk-off, game called) shows 0 instead of a blank, via
  // isPastInning below.
  function renderMonsterBoxScore(linescore, awayAbbr, homeAbbr) {
    const innings = linescore.innings || [];
    const numInnings = Math.max(innings.length, 9);
    const groups = [];
    for (let i = 1; i <= numInnings; i += 3) groups.push([i, Math.min(i + 2, numInnings)]);

    // A half-inning's cell reads gold only while that half is still being
    // played -- linescore.inningHalf lags a tick behind the actual state
    // (see the halfOver comment elsewhere), so a half genuinely in progress
    // is 'Top'/'Bottom' with outs < 3; the moment it hits 3 outs (or the
    // game moves to the next inning), this cell falls back to plain ink on
    // the next render, same way the H hit light and monster-dot lit states
    // reset themselves each poll rather than needing an explicit "turn off."
    const halfOver = (linescore.outs ?? 0) >= 3;
    const liveHalf = halfOver ? null : linescore.inningHalf;

    function cell(n, isAway) {
      const inn = innings[n - 1];
      const side = inn && (isAway ? inn.away : inn.home);
      const hasRuns = side && side.runs != null;
      const isPastInning = n <= (linescore.currentInning || 0) - 1;
      const val = hasRuns ? side.runs : (isPastInning ? 0 : '');
      const isLiveHalfForSide = isAway ? liveHalf === 'Top' : liveHalf === 'Bottom';
      const isLive = val && n === linescore.currentInning && isLiveHalfForSide;
      return `<span class="monster-box-cell${isLive ? ' monster-live-run' : ''}">${val}</span>`;
    }

    function group([start, end], render) {
      let cells = '';
      for (let n = start; n <= end; n++) cells += render(n);
      return `<div class="monster-box-group">${cells}</div>`;
    }

    const headerHtml = groups.map(g => group(g, n => `<span class="monster-box-cell">${n}</span>`)).join('');
    const awayHtml = groups.map(g => group(g, n => cell(n, true))).join('');
    const homeHtml = groups.map(g => group(g, n => cell(n, false))).join('');

    return `<div class="monster-box">
      <div class="monster-box-row monster-box-header">
        <span class="monster-box-team"></span>
        <div class="monster-box-groups">${headerHtml}</div>
      </div>
      <div class="monster-box-row">
        <span class="monster-box-team">${awayAbbr}</span>
        <div class="monster-box-groups">${awayHtml}</div>
      </div>
      <div class="monster-box-row">
        <span class="monster-box-team">${homeAbbr}</span>
        <div class="monster-box-groups">${homeHtml}</div>
      </div>
    </div>`;
  }

  // Sits to the right of renderMonsterBoxScore's innings grid, reusing its
  // exact cell/group classes (not a separate size) so this reads as a 4th
  // group of 3 the same way any other 3-inning group would, just split off
  // by the panel's internal divider instead of the usual inter-group gap.
  function renderMonsterRHE(linescore) {
    const teams = linescore.teams || {};

    function row(tot, isHeader) {
      const cells = isHeader
        ? ['R', 'H', 'E']
        : [(tot && tot.runs) ?? 0, (tot && tot.hits) ?? 0, (tot && tot.errors) ?? 0];
      const cellsHtml = cells.map(v => `<span class="monster-box-cell">${v}</span>`).join('');
      return `<div class="monster-box-row${isHeader ? ' monster-box-header' : ''}">
        <div class="monster-box-groups"><div class="monster-box-group">${cellsHtml}</div></div>
      </div>`;
    }

    return `<div class="monster-box">
      ${row(null, true)}
      ${row(teams.away, false)}
      ${row(teams.home, false)}
    </div>`;
  }

  // Sits below renderMonsterRHE() in the panel's bottom-right, inside the
  // matching .monster-rhe-spacer divider. Scaled-up version of what used to
  // be an inline diamond next to the score strip. `hidden` is set once a
  // game is Final -- see the .monster-count is-hidden comment at the call
  // site for why this stays in the DOM instead of being left out.
  function renderMonsterBases(onFirst, onSecond, onThird, hidden) {
    return `<div class="monster-rhe-spacer${hidden ? ' is-hidden' : ''}">
      <div class="monster-bases">
        <span class="monster-bases-marker second ${onSecond ? 'on' : ''}"></span>
        <span class="monster-bases-marker third ${onThird ? 'on' : ''}"></span>
        <span class="monster-bases-marker first ${onFirst ? 'on' : ''}"></span>
      </div>
    </div>`;
  }

  // Whether at least one real pitch has been thrown anywhere in the game --
  // MLB flips abstractGameState to 'Live' during pre-game warmup, well ahead
  // of first pitch, so 'Live' alone doesn't mean genuinely in progress.
  // Shared by every caller of renderMonsterPanel so a Live-but-warming-up
  // game reads the same way (collapsed band, same as Final) wherever it's
  // shown.
  function hasGameStarted(allPlays) {
    return (allPlays || []).some(p => (p.playEvents || []).some(pe => pe.isPitch));
  }

  // Full Green-Monster-style panel: innings box + R/H/E always, plus the
  // live Balls/Strikes/Outs/H count band and baserunner diamond -- shown
  // while isLive is true, collapsed away (see .is-hidden) otherwise. Shared
  // by the Scorecard tab's fixed bottom bar and the Game Summary modal so
  // both stay consistent: the full board while a game's actually being
  // played, collapsed to just the box score once it's Final, regardless of
  // which one you're looking at it from.
  function renderMonsterPanel(linescore, awayAbbr, homeAbbr, allPlays, isLive) {
    const halfOver = (linescore.outs ?? 0) >= 3;
    const balls = (isLive && !halfOver) ? (linescore.balls ?? 0) : 0;
    const strikes = (isLive && !halfOver) ? (linescore.strikes ?? 0) : 0;
    const outs = (isLive && !halfOver) ? (linescore.outs ?? 0) : 0;
    const offense = (isLive && !halfOver) ? (linescore.offense || {}) : {};
    const onFirst = !!offense.first, onSecond = !!offense.second, onThird = !!offense.third;

    // Dot counts (3/2/2) are the max value ever live -- a 4th ball, 3rd
    // strike, or 3rd out ends the at-bat/half-inning before it'd show.
    const dots = (total, lit, redClass) => Array.from({ length: total },
      (_, i) => `<span class="monster-dot ${redClass ? 'monster-dot-red' : ''} ${i < lit ? 'is-lit' : ''}"></span>`
    ).join('');
    // allPlays' last entry is either the at-bat still in progress (no
    // result yet) or the one that just ended -- once a new batter's first
    // pitch posts a fresh entry, this naturally falls back dark.
    const lastPlay = allPlays[allPlays.length - 1];
    // Lights on the ball put in play, not on the official hit ruling --
    // scoring a play as a hit (vs. an error) can lag well behind the pitch
    // itself, so this reads the last pitch's own in-play result instead of
    // waiting on lastPlay.result.event. Matches classifyResult's own
    // in-play/out split, and accepts the tradeoff that a sac fly or a
    // scorer's-error-turned-no-hit will light it too.
    const lastPitchEvent = lastPlay && (lastPlay.playEvents || []).filter(pe => pe.isPitch).pop();
    const lastPitchDesc = lastPitchEvent && lastPitchEvent.details && lastPitchEvent.details.description;
    const hitLit = isLive && !!lastPitchDesc && classifyResult(lastPitchDesc) === 'inplay-safe';
    const countHtml = `
      <div class="monster-count${isLive ? '' : ' is-hidden'}">
        <div class="monster-count-group">
          <div class="monster-count-header"><span class="monster-count-label">Balls</span></div>
          <span class="monster-count-dots">${dots(3, balls, false)}</span>
        </div>
        <div class="monster-count-group">
          <div class="monster-count-header"><span class="monster-count-label">Strikes</span></div>
          <span class="monster-count-dots">${dots(2, strikes, true)}</span>
        </div>
        <div class="monster-count-group">
          <div class="monster-count-header"><span class="monster-count-label">Outs</span></div>
          <span class="monster-count-dots">${dots(2, outs, true)}</span>
        </div>
        <div class="monster-count-group">
          <div class="monster-count-header">${hitRingSVG()}</div>
          <span class="monster-count-dots">${dots(1, hitLit ? 1 : 0, false)}</span>
        </div>
      </div>`;

    return `<div class="monster-panel">
      <div class="monster-panel-left">${renderMonsterBoxScore(linescore, awayAbbr, homeAbbr)}${countHtml}</div>
      <div class="monster-panel-right">${renderMonsterRHE(linescore)}${renderMonsterBases(onFirst, onSecond, onThird, !isLive)}</div>
    </div>`;
  }

  // Before a lineup is posted (future games have no battingOrder data yet),
  // buildTeamRows has nothing to return -- fill in 9 empty slots so the grid
  // still renders at its normal height instead of collapsing to no rows.
  function placeholderLineupRows() {
    return Array.from({ length: 9 }, (_, i) => ({
      slot: i + 1,
      players: [{ id: '', name: '', lastName: '', number: '', pos: '', order: (i + 1) * 100, stats: {} }],
      cells: {}
    }));
  }

  const ADV_ARROW_SVG = '<svg class="adv-arrow" viewBox="0 0 7 6" aria-hidden="true"><path d="M0 3H5.5M3.5 0.8L5.8 3L3.5 5.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
  // A plate appearance's diamond and everything drawn on it: runner tags and
  // the entering pitcher's plate. Shared by the grid and the phone's
  // half-inning view, so a play looks the same in both.
  function renderCellInner(c) {
    let inner = diamondSVG(c.reached, c.scored, c.code, c.isOut, c.outEdge, c.specialEdges, c.ghostStart, c.calledLooking);
    if (c.otherAdvances && c.otherAdvances.length) {
      inner += '<div class="adv-wrap">' + c.otherAdvances.map(a =>
        `<div class="adv-tag ${a.scored ? 'scored' : a.out ? 'out' : ''}">${a.from}${ADV_ARROW_SVG}${a.to}</div>`
      ).join('') + '</div>';
    }
    if (c.pitcherChanged && c.pitcherName) inner += `<button type="button" class="pitch-tag player-name-btn" data-player-id="${c.pitcherId}" title="${c.pitcherFullName || c.pitcherName} enters to pitch">${c.pitcherName}</button>`;
    return inner;
  }
  function liveCellInner(liveBatterInfo) {
    // the diamond marks this batter as on deck the moment the prior at-bat
    // ends; the pulsing dot only joins it once a pitch has actually been
    // thrown, so "on deck" and "at bat now" read as distinct states
    const abStarted = liveBatterInfo.pitches && liveBatterInfo.pitches.length > 0;
    return diamondSVG(0, false, '', false, null, null, false)
      + (abStarted ? '<div class="live-dot" title="At bat now"></div>' : '');
  }
  // A diamond with pitch detail opens the at-bat popup, so it's a button to
  // a keyboard and a screen reader too, named by its batter and play.
  function cellButtonAttrs(src, isLive) {
    const name = src.batterName || 'Batter';
    const what = isLive ? 'at bat now' : String(src.playDesc || '').replace(/<[^>]*>/g, '').replace(/&#8230;/g, '...');
    return ` tabindex="0" role="button" aria-label="${`${name}: ${what}`.replace(/"/g, '&quot;')}"`;
  }
  function hasPitchDetail(src, isLive, liveBatterInfo) {
    return !!src && !!((src.pitches && src.pitches.length) || (src.events && src.events.length)
      || (isLive && liveBatterInfo && liveBatterInfo.currentInterruption));
  }
  const NOW_TRI_SVG = top => `<svg class="now-tri" viewBox="0 0 10 8" aria-hidden="true"><path d="${top ? 'M5 0L10 8H0Z' : 'M0 0H10L5 8Z'}" fill="currentColor"/></svg>`;

  function renderTeamTable(teamName, rows, numInnings, pitcherByInning, starterPitcherId, columnsPerInning, pitchingBoxHtml, teamKey, liveBatterInfo, season, gameDate, headerControlsHtml, hidden) {
    let head = `<tr><th class="ply">Player</th><th class="pos">Pos</th>`;
    for (let i = 1; i <= numInnings; i++) {
      const cols = (columnsPerInning && columnsPerInning[i]) || 1;
      const isNow = liveBatterInfo && liveBatterInfo.team === teamKey && liveBatterInfo.inning === i;
      for (let k = 0; k < cols; k++) {
        const cls = [k > 0 ? 'inning-cont' : '', isNow && k === 0 ? 'is-now' : ''].filter(Boolean).join(' ');
        head += `<th${cls ? ` class="${cls}"` : ''}>${isNow && k === 0 ? NOW_TRI_SVG(teamKey === 'away') : ''}${i}</th>`;
      }
    }
    head += `</tr>`;

    const bodyRows = rows.map(r => {
      // Both stacks use a flex column (see .ply-stack/.pos-stack) instead of
      // <br>-joined inline content -- a <button>'s line-height doesn't
      // reliably inherit from an ancestor the way plain text's does (browser
      // default stylesheets tend to pin form controls to line-height:
      // normal), so Player's and Pos's stacked entries would drift out of
      // sync no matter how carefully the <br> and text line-heights were
      // tuned to match. flex + gap sidesteps that entirely: the gap between
      // entries is explicit and independent of what's inside them.
      const nameHtml = `<div class="ply-stack">` + r.players.map((p, i) => {
        if (!p.id) return '';
        playerStore[p.id] = { id: p.id, name: p.name, pos: p.pos, team: teamName, season, gameDate, todayStats: p.stats };
        // A substitute's name button renders exactly like the starter's --
        // no wrapper, no arrow -- so it gets the same width/height behavior
        // in the Player column instead of shrinking to fit its text; Pos
        // (below) still marks it as a substitute with the muted .sub-note
        // style.
        return `<button type="button" class="player-name-btn" data-player-id="${p.id}" title="${p.name}">${p.lastName}</button>`;
      }).join('') + `</div>`;
      const starterId = r.players[0] && r.players[0].id;
      const entryOf = p => (r.entryInning || {})[p.id];
      const posHtml = `<div class="pos-stack">` + r.players.map((p, i) =>
        p.id === starterId ? `<span class="pos-main">${p.pos}</span>` : `<span class="sub-note">${p.pos}</span>`
      ).join('') + `</div>`;
      let cells = `<td class="ply">${nameHtml}</td><td class="pos">${posHtml}</td>`;
      for (let i = 1; i <= numInnings; i++) {
        const cols = (columnsPerInning && columnsPerInning[i]) || 1;
        const cellArr = r.cells[i] || [];
        for (let k = 0; k < cols; k++) {
          const c = cellArr[k];
          let inner = c ? renderCellInner(c) : '';
          // A substitute's entry: the cream rule down the left of the inning
          // he comes in, his position and name written up it (bottom to
          // top), side by side when two come in together. On the rule's
          // right, inside his own column -- the column to its left carries
          // the previous plate appearance's runner tags.
          const entering = k === 0 ? r.players.slice(1).filter(p => entryOf(p) === i) : [];
          const upTheLine = entering.map((p, j) => `<span class="sub-up" style="left:${2 + j * 10}px"><b>${p.pos}</b> ${p.lastName}</span>`).join('');
          const isLiveCell = !c && liveBatterInfo && liveBatterInfo.team === teamKey
            && liveBatterInfo.rowSlot === r.slot && liveBatterInfo.inning === i && liveBatterInfo.slotIndex === k;
          if (isLiveCell) inner += liveCellInner(liveBatterInfo);
          let pitchAttr = '';
          const pitchSource = c || (isLiveCell ? {
            pitches: liveBatterInfo.pitches, events: liveBatterInfo.events, batterName: liveBatterInfo.batterName,
            pitcherFullName: liveBatterInfo.pitcherFullName,
            batSide: liveBatterInfo.batSide, pitchHand: liveBatterInfo.pitchHand, isComplete: false,
            // "in progress" is only true once a pitch has actually been
            // thrown -- before that this is just the on-deck placeholder,
            // with no claim to make unless a pause is happening right now
            playDesc: liveBatterInfo.currentInterruption
              || (liveBatterInfo.pitches.length ? 'At bat in progress&#8230;' : '')
          } : null);
          if (pitchSource) {
            const pkey = `${teamName}-${r.slot}-${i}-${k}`;
            pitchStore[pkey] = pitchSource;
            pitchAttr = ` data-pkey="${pkey}"`;
          }
          const clickable = hasPitchDetail(pitchSource, isLiveCell, liveBatterInfo);
          const cellHtml = inner ? `<div class="cell-wrap${clickable ? ' clickable' : ''}"${pitchAttr}${clickable ? cellButtonAttrs(pitchSource, isLiveCell) : ''}>${inner}</div>` : '';
          const cls = 'cell'
            + (r.dividerInnings && r.dividerInnings.has(i) && k === 0 ? ' sub-divider' : '')
            + (c && c.pitcherChanged ? ' pitcher-change' : '')
            + (c && starterPitcherId && c.pitcherId === starterPitcherId ? ' starter-span' : '');
          cells += `<td class="${cls}">${upTheLine}${cellHtml}</td>`;
        }
      }
      return `<tr>${cells}</tr>`;
    }).join('');

    return `<div class="team-block" data-side="${teamKey}"${hidden ? ' hidden' : ''}>
      <div class="team-scorecard-wrap">
        <div class="team-header">
          <div class="team-name">${teamName}</div>
          <div class="team-header-btns">${headerControlsHtml || ''}</div>
        </div>
        <div class="table-scroll">
          <table class="scorecard-table"><thead>${head}</thead><tbody>${bodyRows}</tbody></table>
        </div>
        ${pitchingBoxHtml || ''}
      </div>
    </div>`;
  }

  const TEAM_NICKNAMES = {
    108: 'Angels', 109: 'Diamondbacks', 110: 'Orioles', 111: 'Red Sox', 112: 'Cubs',
    113: 'Reds', 114: 'Guardians', 115: 'Rockies', 116: 'Tigers', 117: 'Astros',
    118: 'Royals', 119: 'Dodgers', 120: 'Nationals', 121: 'Mets', 133: 'Athletics',
    134: 'Pirates', 135: 'Padres', 136: 'Mariners', 137: 'Giants', 138: 'Cardinals',
    139: 'Rays', 140: 'Rangers', 141: 'Blue Jays', 142: 'Twins', 143: 'Phillies',
    144: 'Braves', 145: 'White Sox', 146: 'Marlins', 147: 'Yankees', 158: 'Brewers'
  };
  function teamNickname(team) {
    return TEAM_NICKNAMES[team && team.id] || (team && (team.teamName || team.name)) || '';
  }

  const TEAM_ABBR = {
    108: 'LAA', 109: 'AZ', 110: 'BAL', 111: 'BOS', 112: 'CHC',
    113: 'CIN', 114: 'CLE', 115: 'COL', 116: 'DET', 117: 'HOU',
    118: 'KC', 119: 'LAD', 120: 'WSH', 121: 'NYM', 133: 'ATH',
    134: 'PIT', 135: 'SD', 136: 'SEA', 137: 'SF', 138: 'STL',
    139: 'TB', 140: 'TEX', 141: 'TOR', 142: 'MIN', 143: 'PHI',
    144: 'ATL', 145: 'CWS', 146: 'MIA', 147: 'NYY', 158: 'MIL'
  };
  function teamAbbr(team) {
    return TEAM_ABBR[team && team.id] || teamNickname(team);
  }

  const scheduleCache = {};
  const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function sortedTeams() {
    return Object.keys(TEAM_NICKNAMES)
      .map(id => ({ id, name: TEAM_NICKNAMES[id] }))
      .sort((a, b) => a.name.localeCompare(b.name));
  }

  // The user's team, picked from the cap at the end of the tab row. It's
  // where the Team tab opens and the Scorecard's first game, and it's
  // marked in Standings. A team picked on the Team tab is just browsing
  // and lasts the session. Before this existed each of those
  // tabs saved its own pick, so the first load adopts whichever was saved.
  const MY_TEAM_KEY = 'mlb-my-team';
  const LEGACY_TEAM_KEYS = ['mlb-schedule-team', 'mlb-roster-tab-team'];
  let myTeam = null;
  try {
    myTeam = localStorage.getItem(MY_TEAM_KEY);
    if (myTeam === null) {
      const legacy = LEGACY_TEAM_KEYS.map(k => localStorage.getItem(k)).find(v => v && TEAM_NICKNAMES[v]);
      myTeam = legacy || '';
      localStorage.setItem(MY_TEAM_KEY, myTeam);
    }
    LEGACY_TEAM_KEYS.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  if (!TEAM_NICKNAMES[myTeam]) myTeam = '';
  function myTeamId() { return myTeam ? Number(myTeam) : null; }

  const myTeamSelect = document.getElementById('myTeamPick');
  const myTeamMark = document.getElementById('myTeamMark');
  // No team yet: a plain stitched ball where the cap will go.
  const MY_TEAM_EMPTY_MARK = `<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="8.3"/><path d="M5.2 3.6c1.9 1.6 2.9 3.9 2.9 6.4s-1 4.8-2.9 6.4M14.8 3.6c-1.9 1.6-2.9 3.9-2.9 6.4s1 4.8 2.9 6.4" stroke-width="1.1"/></svg>`;
  function renderMyTeamMark() {
    myTeamMark.innerHTML = myTeam ? `<img src="${capLogoUrl(myTeam)}" alt="">` : MY_TEAM_EMPTY_MARK;
    myTeamSelect.closest('.my-team').title = myTeam ? `Your team: ${TEAM_NICKNAMES[myTeam]}` : 'Pick your team';
  }
  myTeamSelect.innerHTML = '<option value="">No team</option>'
    + sortedTeams().map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  myTeamSelect.value = myTeam;
  renderMyTeamMark();

  // The Team tab's team picker: the 30-team list, opening on the user's team.
  function populateTeamSelect(selectEl) {
    const teams = sortedTeams();
    selectEl.innerHTML = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    selectEl.value = myTeam || teams[0].id;
  }

  // A season still being played is refetched after five minutes, so the
  // Team tab's results and record don't sit on a morning's copy all day.
  const SCHEDULE_LIVE_TTL_MS = 5 * 60 * 1000;
  async function fetchTeamSchedule(teamId, season) {
    const key = `${teamId}-${season}`;
    const cached = scheduleCache[key];
    if (cached && (Number(season) < new Date().getFullYear() || Date.now() - cached.fetchedAt < SCHEDULE_LIVE_TTL_MS)) return cached;
    try {
      const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamId}&season=${season}&gameType=R`;
      const res = await fetch(url);
      const data = await res.json();
      const dates = data.dates || [];
      const gamesByDate = {};
      dates.forEach(d => {
        gamesByDate[d.date] = d.games.map(g => {
          const isHome = g.teams.home.team.id === Number(teamId);
          const opponent = isHome ? g.teams.away.team : g.teams.home.team;
          return {
            gamePk: g.gamePk,
            gameNumber: g.gameNumber || 1,
            isHome,
            opponent: teamAbbr(opponent),
            opponentFull: teamNickname(opponent),
            awayId: g.teams.away.team.id,
            homeId: g.teams.home.team.id,
            gameDate: g.gameDate,
            state: g.status.abstractGameState,
            detailedState: g.status.detailedState,
            homeScore: g.teams.home.score,
            awayScore: g.teams.away.score,
            venueId: g.venue && g.venue.id,
            venueName: g.venue && g.venue.name
          };
        });
      });
      const result = {
        gamesByDate,
        seasonStart: dates.length ? dates[0].date : null,
        seasonEnd: dates.length ? dates[dates.length - 1].date : null,
        fetchedAt: Date.now()
      };
      scheduleCache[key] = result;
      return result;
    } catch (e) {
      return { gamesByDate: {}, seasonStart: null, seasonEnd: null };
    }
  }

  // Keyed by the schedule it was built from, so a refetched schedule
  // (see SCHEDULE_LIVE_TTL_MS) rebuilds the series too.
  const teamChartCache = new WeakMap();

  async function getTeamWinLossSeries(teamId, season) {
    const schedule = await fetchTeamSchedule(teamId, season);
    if (teamChartCache.has(schedule)) return teamChartCache.get(schedule);
    const { gamesByDate } = schedule;
    const dates = Object.keys(gamesByDate).sort();
    const series = [];
    let net = 0;
    dates.forEach(date => {
      const games = gamesByDate[date].slice().sort((a, b) => a.gameNumber - b.gameNumber);
      games.forEach(g => {
        if (g.state !== 'Final') return;
        const teamScore = g.isHome ? g.homeScore : g.awayScore;
        const oppScore = g.isHome ? g.awayScore : g.homeScore;
        if (teamScore == null || oppScore == null || teamScore === oppScore) return;
        const won = teamScore > oppScore;
        net += won ? 1 : -1;
        series.push({ date, net, won });
      });
    });
    teamChartCache.set(schedule, series);
    return series;
  }

  function winLossExtremes(played) {
    const netValues = played.map(s => s.net);
    let peakIdx = 0, troughIdx = 0;
    netValues.forEach((v, i) => {
      if (v > netValues[peakIdx]) peakIdx = i;
      if (v < netValues[troughIdx]) troughIdx = i;
    });
    return { netValues, peakIdx, troughIdx };
  }

  // clipId must be unique in the document: the Team tab draws this chart
  // inline while the Standings popup can draw it too.
  function renderWinLossSvg(clipId, played, { width = 320, height = 160 } = {}) {
    const { netValues, peakIdx, troughIdx } = winLossExtremes(played);
    const finalNet = netValues[netValues.length - 1];
    const maxNet = Math.max(0, netValues[peakIdx]);
    const minNet = Math.min(0, netValues[troughIdx]);
    const range = Math.max(1, maxNet - minNet);

    // Room above for the high point's label, below for the low point's
    // (above the month labels), and on the right for the current mark.
    const padL = 14, padR = 22, padT = 18, padB = 28;
    const plotW = width - padL - padR;
    const plotH = height - padT - padB;
    const n = played.length;
    const yFor = v => padT + plotH - ((v - minNet) / range) * plotH;
    const xFor = i => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
    const zeroY = yFor(0);

    const linePts = played.map((s, i) => `${xFor(i).toFixed(1)},${yFor(s.net).toFixed(1)}`).join(' ');
    const areaPts = n > 1
      ? `${xFor(0).toFixed(1)},${zeroY.toFixed(1)} ${linePts} ${xFor(n - 1).toFixed(1)},${zeroY.toFixed(1)}`
      : '';

    const monthTicks = [];
    let lastMonth = null;
    played.forEach((s, i) => {
      const month = s.date.slice(5, 7);
      if (month !== lastMonth) {
        monthTicks.push({ x: xFor(i), label: MONTH_NAMES[Number(month) - 1].slice(0, 3) });
        lastMonth = month;
      }
    });
    // A season opening in late March keeps its gridline but gives up its
    // label, which would otherwise print over April's.
    monthTicks.forEach((t, i) => {
      const next = monthTicks[i + 1];
      if (next && next.x - t.x < 18) t.label = '';
    });

    const { ink, gold, brick } = PALETTE;

    let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block; margin-top:4px;">`;
    svg += `<defs>
      <clipPath id="${clipId}Above"><rect x="${padL}" y="${padT}" width="${plotW}" height="${Math.max(0, zeroY - padT).toFixed(1)}"/></clipPath>
      <clipPath id="${clipId}Below"><rect x="${padL}" y="${zeroY.toFixed(1)}" width="${plotW}" height="${Math.max(0, padT + plotH - zeroY).toFixed(1)}"/></clipPath>
    </defs>`;
    if (n > 1) {
      svg += `<polygon points="${areaPts}" fill="${gold}" opacity="0.28" clip-path="url(#${clipId}Above)"/>`;
      svg += `<polygon points="${areaPts}" fill="${brick}" opacity="0.28" clip-path="url(#${clipId}Below)"/>`;
    }
    svg += `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${width - padR}" y2="${zeroY.toFixed(1)}" stroke="${ink}" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>`;
    monthTicks.forEach(t => {
      svg += `<line x1="${t.x.toFixed(1)}" y1="${padT}" x2="${t.x.toFixed(1)}" y2="${height - padB}" stroke="${ink}" stroke-width="0.5" opacity="0.15"/>`;
      svg += `<text x="${t.x.toFixed(1)}" y="${height - 4}" font-family="Overpass, sans-serif" font-size="7" font-weight="700" letter-spacing="0.04em" fill="${ink}" opacity="0.6">${t.label}</text>`;
    });
    svg += `<text x="${padL - 4}" y="${(zeroY + 3).toFixed(1)}" font-family="Overpass, sans-serif" font-weight="700" font-size="8" fill="${ink}" opacity="0.6" text-anchor="end">0</text>`;
    if (n > 1) {
      svg += `<polyline points="${linePts}" fill="none" stroke="${ink}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    // The season's high (if it was ever over .500) and low (if ever under)
    // are marked on the line with their value and date, instead of a
    // caption; one the team stands at now is left to the current mark.
    const markLabel = (i, above) => {
      const x = xFor(i), y = yFor(netValues[i]);
      const anchor = x < padL + 40 ? 'start' : x > width - padR - 40 ? 'end' : 'middle';
      const ty = above ? y - 6 : y + 12;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="${PALETTE.paper}" stroke="${ink}" stroke-width="1.2"/>`
        + `<text x="${x.toFixed(1)}" y="${ty.toFixed(1)}" font-family="Overpass, sans-serif" font-weight="700" font-size="8" fill="${ink}" text-anchor="${anchor}" font-variant-numeric="tabular-nums">${fmtNet(netValues[i])}<tspan fill-opacity="0.6" dx="3">${fmtShortDate(played[i].date)}</tspan></text>`;
    };
    if (netValues[peakIdx] > 0 && netValues[peakIdx] !== finalNet) svg += markLabel(peakIdx, true);
    if (netValues[troughIdx] < 0 && netValues[troughIdx] !== finalNet) svg += markLabel(troughIdx, false);
    const lastX = xFor(n - 1), lastY = yFor(finalNet);
    svg += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="${finalNet >= 0 ? gold : brick}" stroke="${ink}" stroke-width="1"/>`;
    svg += `<text x="${(lastX + 5).toFixed(1)}" y="${(lastY + 3).toFixed(1)}" font-family="Overpass, sans-serif" font-weight="700" font-size="8.5" fill="${ink}" font-variant-numeric="tabular-nums">${fmtNet(finalNet)}</text>`;
    svg += '</svg>';
    return svg;
  }

  function fmtNet(v) { return v > 0 ? `+${v}` : String(v); }
  function fmtShortDate(d) {
    const [, m, dd] = d.split('-').map(Number);
    return `${MONTH_NAMES[m - 1].slice(0, 3)} ${dd}`;
  }

  function renderTeamChartContent(teamId, teamName, season, series, throughDate) {
    const played = throughDate ? series.filter(s => s.date <= throughDate) : series;
    if (!played.length) {
      return `<div class="pitch-header">${teamName}</div><div class="pitch-subheader">${season} Season</div><div class="pitch-empty">No completed games yet this season.</div>`;
    }
    const wins = played.filter(s => s.won).length;
    const losses = played.length - wins;
    return `<div class="pitch-header">${teamName}</div>
      <div class="pitch-subheader">${season} Season &#8226; ${wins}-${losses}</div>
      ${renderWinLossSvg(`teamChartClip${teamId}`, played)}`;
  }

  function formatGameTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function renderMonthGrid(startDate, endDate, gamesByDate, seasonStart, seasonEnd) {
    const leadBlanks = startDate.getUTCDay();
    const todayS = todayStr();

    let cells = '';
    for (let i = 0; i < leadBlanks; i++) cells += '<div class="calendar-day is-empty"></div>';

    let dayCount = 0;
    for (let cur = new Date(startDate); cur <= endDate; cur.setUTCDate(cur.getUTCDate() + 1)) {
      const dateStr = cur.toISOString().slice(0, 10);
      const day = cur.getUTCDate();
      const games = gamesByDate[dateStr];
      const today = dateStr === todayS ? ' is-today' : '';
      if (dateStr < seasonStart || dateStr > seasonEnd) {
        cells += `<div class="calendar-day is-outside"></div>`;
      } else if (games && games.length) {
        const homeAway = games[0].isHome ? 'is-home' : 'is-away';
        const isDH = games.length > 1 ? ' is-dh' : '';
        const lines = games.map(g => `<div class="cal-game-opp">${g.opponent}</div>`).join('');
        cells += `<div class="calendar-day is-game ${homeAway}${today}${isDH}" data-date="${dateStr}" tabindex="0" role="button">
          <div class="cal-daynum">${day}</div>
          ${lines}
        </div>`;
      } else {
        cells += `<div class="calendar-day${today}"><div class="cal-daynum">${day}</div></div>`;
      }
      dayCount++;
    }

    const trailBlanks = (7 - ((leadBlanks + dayCount) % 7)) % 7;
    for (let i = 0; i < trailBlanks; i++) cells += '<div class="calendar-day is-empty"></div>';

    return `<div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="calendar-grid">${cells}</div>`;
  }

  function renderScheduleAllMonths(gamesByDate, seasonStart, seasonEnd) {
    const startYear = Number(seasonStart.slice(0, 4));
    const startMonth = Number(seasonStart.slice(5, 7)) - 1;
    const endYear = Number(seasonEnd.slice(0, 4));
    const endMonth = Number(seasonEnd.slice(5, 7)) - 1;
    const todayS = todayStr();

    let blocks = '';
    let y = startYear, m = startMonth;
    let isFirst = true;
    while (y * 12 + m <= endYear * 12 + endMonth) {
      let blockStart, blockEnd, title;
      let blockEndM = m, blockEndY = y;

      if (isFirst && (y * 12 + m) < (endYear * 12 + endMonth)) {
        // Season opens partway through its first month (e.g. late March) —
        // combine that tail end with the following month to avoid a mostly-empty grid.
        blockEndM = m + 1;
        blockEndY = y;
        if (blockEndM > 11) { blockEndM = 0; blockEndY++; }
        blockStart = new Date(seasonStart + 'T00:00:00Z');
        blockEnd = new Date(Date.UTC(blockEndY, blockEndM + 1, 0));
        title = `${MONTH_NAMES[m]}/${MONTH_NAMES[blockEndM]} ${blockEndY}`;
      } else {
        blockStart = new Date(Date.UTC(y, m, 1));
        blockEnd = new Date(Date.UTC(y, m + 1, 0));
        title = `${MONTH_NAMES[m]} ${y}`;
      }

      const isCurrentMonth = (todayS.slice(0, 4) === String(y) && Number(todayS.slice(5, 7)) - 1 === m) ||
        (todayS.slice(0, 4) === String(blockEndY) && Number(todayS.slice(5, 7)) - 1 === blockEndM);

      blocks += `<div class="schedule-month-block"${isCurrentMonth ? ' data-current-month="1"' : ''}>
        <div class="schedule-month-title">${title}</div>
        ${renderMonthGrid(blockStart, blockEnd, gamesByDate, seasonStart, seasonEnd)}
      </div>`;

      isFirst = false;
      m = blockEndM + 1; y = blockEndY;
      if (m > 11) { m = 0; y++; }
    }

    return blocks;
  }

  // The schedule the Team tab last drew, which a calendar day's tap opens
  // in the game summary popup.
  let currentScheduleTeam = null;

  // Opening a game from elsewhere (a profile's Game Log, a game summary)
  // pushes an entry first, so Back returns to where it was opened from.
  function jumpToScorecardGame(dateStr, gamePk) {
    hideGameSummaryModal();
    whenModalHistorySettled(() => openScorecardGame(dateStr, gamePk));
  }
  function openScorecardGame(dateStr, gamePk) {
    navPush({ tab: 'scorecard', game: { date: dateStr, pk: Number(gamePk) } });
    Tabs.switchTo('scorecard', { history: false });
    setDateInputValue(dateInput, dateInputText, dateStr);
    loadSchedule(dateStr, gamePk);
  }

  function formatInningState(state) {
    if (state === 'Bottom') return 'Bot';
    if (state === 'Middle') return 'Mid';
    return state || '';
  }

  function capLogoUrl(teamId) {
    return `https://www.mlbstatic.com/team-logos/team-cap-on-dark/${teamId}.svg`;
  }

  function headshotUrl(personId, width) {
    return `https://img.mlbstatic.com/mlb-photos/image/upload/w_${width || 112},q_100,f_auto/v1/people/${personId}/headshot/67/current`;
  }

  // A square plate per award; a repeat award gets its count in a gold
  // cell of its own ("9x" beside "All-Star"), and the years it was won ride
  // along as the plate's title.
  function renderAwardTags(awardTags) {
    if (!awardTags || !awardTags.length) return '';
    return `<div class="player-award-tags">${awardTags.map(t => {
      const title = t.years.length ? `${t.label}: ${t.years.join(', ')}` : t.label;
      const count = t.count > 1 ? `<span class="player-award-n">${t.count}&times;</span>` : '';
      return `<span class="player-award" title="${title}">${count}<span class="player-award-label">${t.label}</span></span>`;
    }).join('')}</div>`;
  }

  function dailyTileRow(name, teamId, score, won) {
    const nameBlock = `<span class="daily-tile-team${won ? ' is-winner' : ''}">${name}</span>`;
    const logo = teamId ? `<img class="daily-tile-logo" src="${capLogoUrl(teamId)}" alt="">` : '';
    const scoreHtml = score == null ? '' : `<span class="daily-tile-score${won ? ' is-winner' : ''}">${score}</span>`;
    return `<div class="daily-tile-row"><span class="daily-tile-left">${logo}${nameBlock}</span>${scoreHtml}</div>`;
  }

  function renderDailyGameTile(dateStr, game, extraClass) {
    let rowsHtml, stateLabel, tileClass, watermarkHtml = '';
    // Once play has actually started (i.e. not still pre-game Warmup), MLB
    // flips detailedState away from 'In Progress' for all sorts of things
    // that aren't real stoppages -- manager/umpire challenges, replay
    // review, etc. The Daily tab should keep showing score + inning through
    // all of those and only fall back to the status label for an actual
    // delay/suspension.
    const isRealDelay = game.detailedState && /delay|suspend/i.test(game.detailedState);
    if (game.state === 'Live' && game.detailedState !== 'Warmup' && !isRealDelay) {
      rowsHtml = dailyTileRow(game.awayName, game.awayId, game.awayScore ?? 0, false)
        + dailyTileRow(game.homeName, game.homeId, game.homeScore ?? 0, false);
      stateLabel = `${formatInningState(game.inningState)} ${game.inningOrdinal || ''}`.trim();
      tileClass = 'is-live';
    } else if (game.state === 'Final') {
      const awayWon = game.awayScore > game.homeScore;
      rowsHtml = dailyTileRow(game.awayName, game.awayId, game.awayScore, awayWon)
        + dailyTileRow(game.homeName, game.homeId, game.homeScore, !awayWon);
      stateLabel = 'Final';
      tileClass = 'is-final';
      const winnerId = awayWon ? game.awayId : game.homeId;
      if (winnerId) watermarkHtml = `<img class="daily-tile-watermark" src="${capLogoUrl(winnerId)}" alt="">`;
    } else {
      // MLB flips abstractGameState to 'Live' during pre-game warmup, well
      // ahead of first pitch -- treat that like a not-yet-started game too
      // (inningState/inningOrdinal would otherwise show a fabricated "Top
      // 1st" before any pitch has actually been thrown).
      rowsHtml = dailyTileRow(game.awayName, game.awayId, null, false)
        + dailyTileRow(game.homeName, game.homeId, null, false);
      stateLabel = game.state === 'Live' ? (game.detailedState || 'Warmup') : formatGameTime(game.gameDate);
      tileClass = 'is-preview';
    }
    return `
      <div class="daily-tile ${tileClass}${extraClass ? ' ' + extraClass : ''}" data-date="${dateStr}" data-game-pk="${game.gamePk}" tabindex="0" role="button">
        ${watermarkHtml}
        ${rowsHtml}
        <div class="daily-tile-state">${stateLabel}</div>
        <span class="tile-more" aria-hidden="true"></span>
      </div>`;
  }

  function savantVideoUrl(playId) {
    return playId ? `https://baseballsavant.mlb.com/sporty-videos?playId=${playId}` : null;
  }
  // A Watch link's attributes: its Savant href (kept for open-in-new-tab)
  // plus what the clip popup needs to play it in the app instead -- see
  // the data-clip-play-id click handler. gameLink: false where the link
  // already sits on that game's scorecard.
  function clipWatchAttrs(videoUrl, label, { gameLink = true } = {}) {
    const playId = new URL(videoUrl).searchParams.get('playId');
    return `href="${videoUrl}" target="_blank" rel="noopener noreferrer" data-clip-play-id="${playId}" data-clip-label="${label}"${gameLink ? '' : ' data-clip-no-game'}`;
  }

  const gameStatsCache = {};
  const DAY_OUT_REACHED = { '2B': 1, '3B': 2, '4B': 3, 'HM': 3 };
  const DAY_OUT_EDGE = { '2B': 'first-second', '3B': 'second-third', '4B': 'third-home', 'HM': 'third-home' };

  // What a scoring play did to the game, from the score after it less the
  // runs that crossed on it.
  function playImpact(p) {
    const isTop = p.about && p.about.isTopInning;
    const inning = (p.about && p.about.inning) || 0;
    const scored = (p.runners || []).filter(r => r.movement && r.movement.end === 'score').length;
    const runs = scored || (p.result && p.result.rbi) || 0;
    if (!runs) return { kind: null, inning, runs };
    const after = isTop ? p.result.awayScore : p.result.homeScore;
    const opp = isTop ? p.result.homeScore : p.result.awayScore;
    const before = after - runs;
    let kind = null;
    if (!isTop && inning >= 9 && after > opp && before <= opp) kind = 'walkoff';
    else if (before <= opp && after > opp) kind = 'goahead';
    else if (before < opp && after === opp) kind = 'tying';
    return { kind, inning, runs };
  }
  // A highlight's id is its play's description as a slug ("justin-crawford-
  // triples-5-on-a-line-drive-..."), which is how a hitting clip finds its
  // play in the feed.
  const DAY_SLUG_LEN = 32;
  function slugify(text, len = DAY_SLUG_LEN) {
    return (text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, len);
  }

  // Each play's swing in win probability, by atBatIndex, for weighing the
  // day's clips. Trimmed by fields= to ~8 KB a game (the whole response is
  // over 1 MB). A game still going isn't cached, nor is a failure.
  const gameWpaCache = {};
  // atBatIndex -> the home team's win probability added, in points, signed.
  // ~8 KB a game with fields=, against ~1 MB without.
  async function getGameWpaSigned(gamePk, isFinal) {
    if (gameWpaCache[gamePk]) return gameWpaCache[gamePk];
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/game/${gamePk}/winProbability?fields=atBatIndex,homeTeamWinProbabilityAdded`);
      if (!res.ok) return {};
      const data = await res.json();
      const byIndex = {};
      (Array.isArray(data) ? data : []).forEach(e => {
        if (e.atBatIndex != null && e.homeTeamWinProbabilityAdded != null) byIndex[e.atBatIndex] = e.homeTeamWinProbabilityAdded;
      });
      if (isFinal) gameWpaCache[gamePk] = byIndex;
      return byIndex;
    } catch (e) {
      return {};
    }
  }
  // The Highlights tab ranks plays by the size of the swing, as a fraction.
  async function getGameWpa(gamePk, isFinal) {
    const signed = await getGameWpaSigned(gamePk, isFinal);
    const byIndex = {};
    Object.keys(signed).forEach(k => { byIndex[k] = Math.abs(signed[k]) / 100; });
    return byIndex;
  }

  async function fetchGameStats(gamePk, awayTeam, homeTeam, isFinal) {
    const awayAbbr = teamAbbr(awayTeam);
    const homeAbbr = teamAbbr(homeTeam);
    if (isFinal && gameStatsCache[gamePk] !== undefined) return gameStatsCache[gamePk];
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`);
      const data = await res.json();
      const allPlays = (data.liveData && data.liveData.plays && data.liveData.plays.allPlays) || [];
      const homeRuns = allPlays.filter(p => p.result && p.result.event === 'Home Run').map(p => {
        const isTop = p.about && p.about.isTopInning;
        const events = p.playEvents || [];
        let hitData = null;
        for (let i = events.length - 1; i >= 0; i--) {
          if (events[i].hitData) { hitData = events[i].hitData; break; }
        }
        const distance = hitData && hitData.totalDistance != null ? hitData.totalDistance : null;
        const coords = hitData && hitData.coordinates;
        const pitch = events.slice().reverse().find(e => e.isPitch);
        // Go-ahead and tying only count late -- a 2-1 lead in the 2nd
        // isn't a story.
        const { kind, inning, runs } = playImpact(p);
        const impact = kind === 'walkoff' || inning >= 7 ? kind : null;
        const lastEvent = events[events.length - 1];
        const playId = lastEvent && lastEvent.playId;
        // The description carries his count the way a broadcast does:
        // "Bo Bichette homers (17) on a fly ball ...".
        const countMatch = /\((\d+)\)/.exec(p.result.description || '');
        return {
          atBatIndex: p.about && p.about.atBatIndex,
          gamePk,
          batterId: p.matchup && p.matchup.batter && p.matchup.batter.id,
          battingTeamId: isTop ? awayTeam.id : homeTeam.id,
          seasonCount: countMatch ? Number(countMatch[1]) : null,
          batterName: (p.matchup && p.matchup.batter && p.matchup.batter.fullName) || '',
          pitcherName: (p.matchup && p.matchup.pitcher && p.matchup.pitcher.fullName) || '',
          battingAbbr: isTop ? awayAbbr : homeAbbr,
          pitchingAbbr: isTop ? homeAbbr : awayAbbr,
          isGrandSlam: p.result.rbi === 4,
          runs,
          impact,
          inning,
          isTop,
          exitVelo: hitData && hitData.launchSpeed != null ? hitData.launchSpeed : null,
          launchAngle: hitData && hitData.launchAngle != null ? hitData.launchAngle : null,
          x: coords && coords.coordX != null ? coords.coordX : null,
          y: coords && coords.coordY != null ? coords.coordY : null,
          pitchType: (pitch && pitch.details && pitch.details.type && pitch.details.type.code) || '',
          pitchSpeed: pitch && pitch.pitchData && pitch.pitchData.startSpeed ? Math.round(pitch.pitchData.startSpeed) : null,
          distance,
          videoUrl: savantVideoUrl(playId)
        };
      });
      // The day's starters, scored by Game Score (Tango's version):
      // 40 + 2 per out + K - 2 per BB and hit - 3 per run - 6 per HR.
      const box = data.liveData && data.liveData.boxscore;
      const starts = ['away', 'home'].map(side => {
        const t = box && box.teams && box.teams[side];
        const id = t && t.pitchers && t.pitchers[0];
        const pl = id && t.players && t.players[`ID${id}`];
        const st = pl && pl.stats && pl.stats.pitching;
        if (!st || st.outs == null) return null;
        const team = side === 'away' ? awayTeam : homeTeam;
        const opp = side === 'away' ? homeTeam : awayTeam;
        return {
          id, name: (pl.person && pl.person.fullName) || '', teamId: team.id, teamAbbr: teamAbbr(team), oppAbbr: teamAbbr(opp), isHome: side === 'home',
          ip: st.inningsPitched, h: st.hits, r: st.runs, er: st.earnedRuns, bb: st.baseOnBalls, k: st.strikeOuts,
          gameScore: 40 + 2 * st.outs + st.strikeOuts - 2 * st.baseOnBalls - 2 * st.hits - 3 * st.runs - 6 * st.homeRuns
        };
      }).filter(Boolean);
      // Every at-bat, for matching the day's clips to their plays.
      const keyPlays = allPlays.filter(p => p.result && p.result.type === 'atBat' && p.about)
        .map(p => {
          const batter = (p.matchup && p.matchup.batter) || {};
          const pitcher = (p.matchup && p.matchup.pitcher) || {};
          const events = p.playEvents || [];
          const last = [...events].reverse().find(e => e.playId);
          // How far the batter got on the play itself, for its diamond --
          // a single he was thrown out stretching is 1B with the out drawn
          // on the way to second, as the scorecard draws it.
          const run = (p.runners || []).filter(r => r.details && r.details.runner && r.details.runner.id === batter.id).pop();
          const end = run && run.movement && run.movement.end;
          const outBase = run && run.movement && run.movement.isOut && run.movement.outBase !== '1B' ? run.movement.outBase : null;
          const pitches = events.filter(e => e.isPitch);
          const lastPitch = pitches[pitches.length - 1];
          const before = pitches[pitches.length - 2];
          return {
            atBatIndex: p.about.atBatIndex, slug: slugify(p.result.description), event: p.result.event,
            description: p.result.description || '', code: getPlayCode(p), playId: last ? last.playId : null,
            rbi: p.result.rbi || 0, calledLooking: isCalledStrikeout(p),
            reached: end === 'score' ? 4 : end === '3B' ? 3 : end === '2B' ? 2 : end === '1B' ? 1 : DAY_OUT_REACHED[outBase] || 0,
            outEdge: DAY_OUT_EDGE[outBase] || null,
            // Everyone credited with a putout or assist: how a defense
            // clip finds its play.
            fielderIds: [...new Set((p.runners || []).flatMap(r => (r.credits || []).map(c => c.player && c.player.id)).filter(Boolean))],
            fielderPos: Object.fromEntries((p.runners || []).flatMap(r => (r.credits || []).filter(c => c.player && c.position).map(c => [c.player.id, c.position.abbreviation]))),
            count: before && before.count ? `${before.count.balls}-${before.count.strikes}` : '0-0',
            pitchSpeed: lastPitch && lastPitch.pitchData && lastPitch.pitchData.startSpeed ? Math.round(lastPitch.pitchData.startSpeed) : null,
            pitchType: (lastPitch && lastPitch.details && lastPitch.details.type && lastPitch.details.type.code) || '',
            isTop: p.about.isTopInning, isOut: !!p.result.isOut,
            batterId: batter.id, batterName: batter.fullName || '', batterSlug: slugify(batter.fullName, 99),
            pitcherId: pitcher.id, pitcherName: pitcher.fullName || '', pitcherSlug: slugify(pitcher.fullName, 99),
            battingTeamId: p.about.isTopInning ? awayTeam.id : homeTeam.id,
            fieldingTeamId: p.about.isTopInning ? homeTeam.id : awayTeam.id,
            ...playImpact(p)
          };
        });
      const result = { homeRuns, starts, keyPlays };
      if (isFinal) gameStatsCache[gamePk] = result;
      return result;
    } catch (e) {
      return { homeRuns: [], starts: [], keyPlays: [] };
    }
  }

  const HR_IMPACT_LABELS = { walkoff: 'Walk-off', goahead: 'Go-ahead', tying: 'Game-tying' };

  // ---- Highlights: the day in one page ----
  // Scores (with MLB's recap headline and video), then Big Moments, Home
  // Runs, On the Mound and Defense -- see "What to watch" below. Videos
  // play in the clip popup from dayClips, keyed per render.
  let dayClips = {};
  let dayData = null;
  const DAY_HR_SHOWN = 6;
  const DAY_STARTS_SHOWN = 5;

  function highlightMp4(item) {
    const pbs = item.playbacks || [];
    const pb = pbs.find(b => b.name === 'mp4Avc') || pbs.find(b => /\.mp4$/.test(b.url || ''));
    return pb ? pb.url : null;
  }

  // From the schedule's own highlights hydrate: the game's recap video
  // (its headline is the game's story) and its clips worth a look:
  // defense, MLB's "wow" tag, and hitting (home runs included).
  const DAY_PITCHING_WORDS = /\bstrikes? out\b|\bstrands\b|\bescapes\b|\bfans\b|K['’]s\b|\bwhiffs\b|\bsets down\b|\bretires\b|\bsecures\b|\bjam\b/i;
  function buildGameMedia(g) {
    const items = (g.content && g.content.highlights && g.content.highlights.highlights && g.content.highlights.highlights.items) || [];
    const tags = item => (item.keywordsAll || []).filter(k => k.type === 'taxonomy').map(k => k.value);
    const matchup = `${teamAbbr(g.teams.away.team)} @ ${teamAbbr(g.teams.home.team)}`;
    const clip = item => {
      const mp4 = highlightMp4(item);
      return mp4 ? { mp4, title: (item.headline || '').trim(), date: g.officialDate, gamePk: g.gamePk, matchup } : null;
    };
    const recapItem = items.find(item => tags(item).includes('game-recap'));
    // Matched to their plays in the feed later (buildClipIndex).
    const plays = items.map(item => {
      const t = tags(item);
      if (!t.includes('highlight')) return null;
      const c = clip(item);
      if (!c) return null;
      const playerIds = (item.keywordsAll || []).filter(k => k.type === 'player_id').map(k => Number(k.value));
      const base = { ...c, id: item.id || '', slug: (item.id || '').slice(0, DAY_SLUG_LEN), wow: t.includes('wow'), defense: t.includes('defense'), playerIds };
      // "Escapes bases-loaded jam with groundout" is the pitcher's moment
      // even when MLB tags it defense.
      if (DAY_PITCHING_WORDS.test(item.headline || '')) return { ...base, cat: 'pitching' };
      if (base.defense) return { ...base, cat: 'defense' };
      if (t.includes('pitching')) return { ...base, cat: 'pitching' };
      if (t.includes('hitting')) return { ...base, cat: 'hitting', hitting: true };
      return null;
    }).filter(Boolean);
    return { recap: recapItem ? clip(recapItem) : null, plays };
  }

  // A clip finds its play by its id: either the play's description as a
  // slug, or "pitcher-in-play-run-s-to-batter" (the likeliest of his
  // at-bats against that pitcher, if he had more than one); a hitting
  // clip can also find it through its batter's player id.
  // "In play" means a ball in play: never a strikeout, walk or HBP.
  const DAY_NOT_IN_PLAY = /^(Strikeout|Walk|Intent Walk|Hit By Pitch)/;
  function findClipPlay(c, keyPlays, wpa) {
    const bySlug = keyPlays.find(k => k.slug && k.slug === c.slug);
    if (bySlug) return { play: bySlug, exact: true };
    const inPlay = /-in-play-(run|out|no-out)/.exec(c.id || '');
    let candidates = [];
    if (inPlay) {
      candidates = keyPlays.filter(k => c.id.startsWith(`${k.pitcherSlug}-in-play-`) && c.id.includes(`-to-${k.batterSlug}`)
        && (inPlay[1] === 'run' ? k.runs > 0 : !k.runs) && !DAY_NOT_IN_PLAY.test(k.event || ''));
    }
    // A defense clip's fielder is credited on its play ("Masyn Winn's
    // running catch" is the at-bat that's a flyout to Winn, not the
    // batter's other two). Without an id naming the at-bat, it's the one
    // play he's credited on in the inning its headline names, or nothing.
    let mustBeOnly = false;
    if (c.defense) {
      const credited = k => c.playerIds.some(id => (k.fielderIds || []).includes(id));
      if (candidates.length) {
        const theirs = candidates.filter(credited);
        if (theirs.length) candidates = theirs;
      } else if (!c.hitting) {
        candidates = keyPlays.filter(credited);
        mustBeOnly = true;
      }
    }
    const exact = candidates.length > 0 && !mustBeOnly;
    // A clip's id doesn't always name the pitcher who gave up the hit.
    if (c.hitting) {
      keyPlays.forEach(k => {
        if (c.playerIds.includes(k.batterId) && (k.runs || k.event === 'Triple') && !candidates.includes(k)) candidates.push(k);
      });
    }
    // "Jake Cronenworth's RBI double" off a pitcher he also homered off:
    // the hit its headline names settles it.
    const headline = c.title.toLowerCase();
    const named = candidates.filter(k => k.event && headline.includes(k.event.toLowerCase()));
    if (named.length) candidates = named;
    // "Connor Norby's nice catch in the 2nd": the inning it names.
    const inning = /\bin the (\d+)(?:st|nd|rd|th)\b/.exec(headline);
    if (inning) candidates = candidates.filter(k => k.inning === Number(inning[1]));
    if (mustBeOnly && (!inning || candidates.length !== 1)) return { play: null, exact: false };
    const play = candidates.sort((a, b) => (wpa[b.atBatIndex] || 0) - (wpa[a.atBatIndex] || 0))[0];
    return play ? { play, exact } : { play: null, exact: false };
  }
  function dayGameState(g) {
    const t = scheduleGameToTileGame(g);
    const isRealDelay = t.detailedState && /delay|suspend/i.test(t.detailedState);
    if (/postponed|cancel/i.test(t.detailedState || '')) return { label: t.detailedState, started: false };
    if (t.state === 'Final') {
      const inn = g.linescore && g.linescore.currentInning;
      const sched = (g.linescore && g.linescore.scheduledInnings) || 9;
      return { label: inn && inn !== sched ? `F/${inn}` : 'Final', started: true, final: true };
    }
    if (t.state === 'Live' && t.detailedState !== 'Warmup' && !isRealDelay) {
      return { label: `${formatInningState(t.inningState)} ${t.inningOrdinal || ''}`.trim(), started: true, live: true };
    }
    if (t.state === 'Live') return { label: t.detailedState || 'Warmup', started: false };
    return { label: formatGameTime(t.gameDate), started: false };
  }

  // One game as a small box: the two teams stacked with their runs, the
  // state and a play mark for MLB's recap video beside them, and the
  // recap's headline under them.
  function renderDayGame(g, media) {
    const st = dayGameState(g);
    const a = g.teams.away, h = g.teams.home;
    const team = (t, other) => {
      const lost = st.final && t.score < other.score;
      return `<div class="dg-team${lost ? ' is-lost' : ''}"><span>${teamAbbr(t.team)}</span><b>${st.started ? (t.score ?? 0) : ''}</b></div>`;
    };
    const winner = st.final && a.score !== h.score ? (a.score > h.score ? a : h).team.id : null;
    const recap = media && media.recap;
    const mine = myTeamId() && (a.team.id === myTeamId() || h.team.id === myTeamId());
    return `
      <div class="dg${st.live ? ' is-live' : ''}${mine ? ' is-my-team' : ''}" data-date="${g.officialDate}" data-game-pk="${g.gamePk}" tabindex="0" role="button">
        ${winner ? `<img class="dg-wm" src="${capLogoUrl(winner)}" alt="" aria-hidden="true" onerror="this.remove()">` : ''}
        <div class="dg-box">
          <div class="dg-teams">${team(a, h)}${team(h, a)}</div>
          <div class="dg-aside">
            <span class="dg-state">${st.label}</span>
            ${recap ? `<button type="button" class="dg-recap" data-day-clip="${dayVideoKey({ clip: recap })}" aria-label="Recap video" title="Recap">&#9654;</button>` : ''}
          </div>
        </div>
        ${recap ? `<div class="dg-story">${recap.title}</div>` : ''}
      </div>`;
  }

  function renderDayHomeRun(hr, i, season) {
    storeTeamPlayer(hr.batterId, hr.batterName, '', hr.battingTeamId, season);
    const tag = hr.impact === 'walkoff' ? 'Walk-off' : hr.isGrandSlam ? 'Grand slam' : hr.impact ? HR_IMPACT_LABELS[hr.impact] : '';
    const gold = hr.impact === 'walkoff' || hr.isGrandSlam;
    const kind = hr.isGrandSlam ? '' : hr.runs === 1 ? 'Solo' : `${hr.runs}-run`;
    const inning = hr.inning ? `${hr.isTop ? 'T' : 'B'}${hr.inning}` : '';
    const ev = hr.exitVelo != null ? `${hr.exitVelo.toFixed(1)} mph` : '';
    const context = [`vs ${shortPlayerName(hr.pitcherName)}`, inning, kind, ev].filter(Boolean).join(' &#183; ');
    const watch = hr.videoUrl ? `<a class="dh-watch" ${clipWatchAttrs(hr.videoUrl, `Home Run &#183; ${hr.batterName}`)}>Watch &#9654;</a>` : '';
    return `
      <div class="dh${gold ? ' is-gold' : ''}${i >= DAY_HR_SHOWN ? ' is-extra' : ''}">
        <div class="dh-main">
          <div class="dh-who">
            <img class="dh-cap" src="${capLogoUrl(hr.battingTeamId)}" alt="">
            <button type="button" class="player-name-btn" data-player-id="${hr.batterId || ''}">${hr.batterName}</button>
            ${hr.seasonCount ? `<span class="dh-count">No. ${hr.seasonCount}</span>` : ''}
          </div>
          <div class="dh-context">${tag ? `<span class="dh-tag${gold ? ' is-gold' : ''}">${tag}</span> &#183; ` : ''}${context}</div>
        </div>
        <div class="dh-side">
          <div class="dh-dist">${hr.distance != null ? `${Math.round(hr.distance)}<small>ft</small>` : '&#8212;'}</div>
          ${watch}
        </div>
      </div>`;
  }

  // The day's homers, the ones that swung their games most (WPA) first.
  function renderDayHomeRuns(homeRuns, season, wpaByPk = {}) {
    if (!homeRuns.length) return '<div class="dy-empty">None yet.</div>';
    const swing = hr => (wpaByPk[hr.gamePk] || {})[hr.atBatIndex] || 0;
    const sorted = homeRuns.slice().sort((a, b) => swing(b) - swing(a) || (b.distance || 0) - (a.distance || 0));
    const more = sorted.length > DAY_HR_SHOWN ? `<button type="button" class="dy-more" data-more="All ${sorted.length}" data-less="Top ${DAY_HR_SHOWN}">All ${sorted.length}</button>` : '';
    return `<div class="dy-hr"><div class="dy-hr-list">${sorted.map((hr, i) => renderDayHomeRun(hr, i, season)).join('')}</div>${more}</div>`;
  }

  // A start with MLB's reel of the outing gets a Watch link.
  function renderDayStarts(starts, season, reels = {}) {
    if (!starts.length) return '';
    const top = starts.slice().sort((a, b) => b.gameScore - a.gameScore).slice(0, DAY_STARTS_SHOWN);
    const blank = v => (v ? v : '');
    // A zero earned runs or walks is the point of the line, so those two
    // keep their zeros.
    const rows = top.map(p => {
      storeTeamPlayer(p.id, p.name, 'P', p.teamId, season);
      return `
        <div class="ds-row">
          <span class="ds-name">
            <span class="ds-who"><img class="dh-cap" src="${capLogoUrl(p.teamId)}" alt=""><button type="button" class="player-name-btn" data-player-id="${p.id}" title="${p.name}"><span class="ds-full">${p.name}</span><span class="ds-short">${shortPlayerName(p.name)}</span></button></span>
            <span class="ds-sub">${p.isHome ? 'vs' : '@'} ${p.oppAbbr}${reels[p.id] ? `<button type="button" class="dh-watch ds-watch" data-day-clip="${dayVideoKey({ clip: reels[p.id] })}">Watch &#9654;</button>` : ''}</span>
          </span>
          <span>${p.ip}</span><span>${blank(p.h)}</span><span${p.er ? '' : ' class="is-zero"'}>${p.er}</span><span${p.bb ? '' : ' class="is-zero"'}>${p.bb}</span><span>${blank(p.k)}</span><span class="ds-gs">${p.gameScore}</span>
        </div>`;
    }).join('');
    return `
      <div class="ds-table">
        <div class="ds-row ds-head"><span class="ds-name">Best starts</span><span>IP</span><span>H</span><span>ER</span><span>BB</span><span>K</span><span>GSc</span></div>
        ${rows}
      </div>`;
  }

  // ---- What to watch ----
  // Clutch Plays (the plays that swung games most, by WPA) and Web Gems
  // (MLB's own defense clips, its "wow" ones first) are rows
  // of videos; Out of the Park (home runs) and On the Mound are tables
  // with a Watch link a row, side by side on a wide sheet.
  // A play plays MLB's clip of it when there is one (photo, headline);
  // otherwise Savant's clip of that pitch, on a scorebook card instead of
  // a photo -- MLB keeps only ten clips a game, and a big double can miss
  // the cut. No play shows twice on the page.
  const DAY_MOMENT_MIN_WPA = 0.1;
  const DAY_DEFENSE_BONUS = 0.06;
  const DAY_WOW_BONUS = 0.1;
  const DAY_ROW = 4;

  // The scorecard's own half-inning triangle (up for the top, down for
  // the bottom) before the inning, rather than T/B.
  function inningTag(k) {
    return k.inning ? `<span class="vc-inn" title="${k.isTop ? 'Top' : 'Bottom'} ${k.inning}">${NOW_TRI_SVG(k.isTop)}${k.inning}</span>` : '';
  }
  function matchupOf(g) {
    return g ? `${teamAbbr(g.teams.away.team)} @ ${teamAbbr(g.teams.home.team)}` : '';
  }
  // "Jonah Heim's 2-run double"; a strikeout names both men; any other
  // out keeps the feed's own words ("Juan Soto grounds into a double play").
  const DAY_HIT_WORDS = { 'Single': 'single', 'Double': 'double', 'Triple': 'triple', 'Home Run': 'home run' };
  function momentTitle(k) {
    const hit = DAY_HIT_WORDS[k.event];
    if (hit) {
      if (k.event === 'Home Run') return `${k.batterName}'s ${k.runs === 4 ? 'grand slam' : k.runs > 1 ? `${k.runs}-run homer` : 'solo homer'}`;
      return `${k.batterName}'s ${k.runs > 1 ? `${k.runs}-run ` : k.runs ? 'RBI ' : ''}${hit}`;
    }
    if (/^Strikeout/.test(k.event)) return `${k.pitcherName} strikes out ${k.batterName}`;
    return (k.description.split(/\.\s|, /)[0] || k.event).replace(/\s+on a .*$/, '').replace(/\s+\(\d+\)/, '').replace(/\.$/, '');
  }

  // Every clip of the day keyed to its play ("gamePk-atBatIndex"); the clip
  // named for the play beats a reel that merely includes it.
  function buildClipIndex(games, media, statsByPk, wpaByPk) {
    const byPlay = {};
    const loose = [];
    games.forEach(g => {
      const m = media[g.gamePk];
      if (!m) return;
      const keyPlays = (statsByPk[g.gamePk] || {}).keyPlays || [];
      const wpa = (wpaByPk && wpaByPk[g.gamePk]) || {};
      m.plays.forEach(c => {
        const { play, exact } = findClipPlay(c, keyPlays, wpa);
        const entry = { ...c, play, exact, wpa: play ? (wpa[play.atBatIndex] || 0) : 0 };
        if (!play) { loose.push(entry); return; }
        const key = `${g.gamePk}-${play.atBatIndex}`;
        const prev = byPlay[key];
        if (!prev || (exact && !prev.exact)) byPlay[key] = entry;
      });
    });
    return { byPlay, loose };
  }

  function buildDaySections({ games, media, stats, statsByPk, wpaByPk }) {
    const { byPlay, loose } = buildClipIndex(games, media, statsByPk, wpaByPk);
    const used = new Set();
    const fill = (candidates, n) => {
      const out = [];
      candidates.forEach(c => {
        if (!c || out.length >= n || used.has(c.key)) return;
        used.add(c.key);
        out.push(c);
      });
      return out;
    };
    const gameOf = pk => games.find(x => x.gamePk === pk);

    // Big Moments: every at-bat of the day by WPA, at most two of them
    // homers (they have a row of their own), and the biggest that isn't a
    // homer second, where a phone shows it before any swipe.
    const all = games.flatMap(g => {
      const wpa = (wpaByPk && wpaByPk[g.gamePk]) || {};
      return ((statsByPk[g.gamePk] || {}).keyPlays || []).map(k => ({ k, g, wpa: wpa[k.atBatIndex] || 0 }));
    }).filter(m => m.wpa >= DAY_MOMENT_MIN_WPA).sort((a, b) => b.wpa - a.wpa).map(({ k, g, wpa }) => {
      const key = `${g.gamePk}-${k.atBatIndex}`;
      // A reel that only touches the play ("first career four-hit game")
      // isn't the play: then it's Savant's clip of the pitch.
      const found = byPlay[key];
      const clip = found && (found.exact || found.title.toLowerCase().includes((k.event || '').toLowerCase())) ? found : null;
      return {
        key, g, k, wpa, clip, playId: k.playId,
        title: clip ? clip.title : momentTitle(k),
        label: k.kind ? HR_IMPACT_LABELS[k.kind] : k.event === 'Home Run' ? 'Home run' : k.isOut ? 'Big out' : 'Big hit',
        why: k.runs > 1 ? `${k.runs} runs` : k.runs ? '1 run' : '',
        teamId: k.isOut ? k.fieldingTeamId : k.battingTeamId, personId: k.isOut ? k.pitcherId : k.batterId
      };
    }).filter(m => m.clip || m.playId);
    let homers = 0;
    const capped = all.filter(m => m.k.event !== 'Home Run' || ++homers <= 2);
    const firstNonHr = capped.find(m => m.k.event !== 'Home Run');
    const moments = fill([capped[0], firstNonHr, ...capped], DAY_ROW);
    moments.sort((a, b) => (a === capped[0] ? -1 : b === capped[0] ? 1 : a === firstNonHr ? -1 : b === firstNonHr ? 1 : b.wpa - a.wpa));

    // On the Mound plays each start's reel, when MLB has one, from its
    // row in the table.
    const starts = stats.flatMap(s => s.starts);
    const reels = {};
    loose.filter(c => c.cat === 'pitching').forEach(c => {
      const sp = starts.find(p => c.playerIds.includes(p.id));
      if (sp && !reels[sp.id]) reels[sp.id] = c;
    });

    // Defense: MLB's defense clips, "wow" first, then by the play's WPA.
    const defense = fill([...Object.values(byPlay), ...loose].filter(c => c.cat === 'defense')
      .map(c => ({ c, weight: c.wpa + DAY_DEFENSE_BONUS + (c.wow ? DAY_WOW_BONUS : 0) }))
      .sort((a, b) => b.weight - a.weight)
      .map(({ c }) => ({
        key: c.play ? `${c.gamePk}-${c.play.atBatIndex}` : `d-${c.mp4}`, clip: c, k: c.play,
        title: c.title, label: c.play ? c.playerIds.map(id => c.play.fielderPos[id]).find(Boolean) || '' : '', why: '',
        // The fielder: the clip's player who isn't the play's batter or
        // pitcher.
        personId: c.playerIds.find(id => !c.play || (id !== c.play.batterId && id !== c.play.pitcherId)) || c.playerIds[0],
        teamId: c.play ? c.play.fieldingTeamId : null
      })), DAY_ROW);

    return { moments, defense, reels };
  }

  // Keys carry their page's prefix ('d' the Highlights tab, 't' the Team
  // tab), so each page clears only its own when it redraws.
  let dayClipSeq = 0;
  function clearDayClips(prefix) {
    Object.keys(dayClips).forEach(k => { if (k[0] === prefix) delete dayClips[k]; });
  }
  function dayVideoKey(item) {
    const key = `${item.clipPrefix || 'd'}${dayClipSeq++}`;
    dayClips[key] = item.clip ? item.clip : { playId: item.playId, matchup: item.meta || matchupOf(item.g), title: item.title };
    return key;
  }

  // The still: his photo pinned as a print on the left, and the
  // play's diamond as the scorecard draws it (an RBI dot a run), under a
  // quiet line of his team and the inning. A clip with no play gets an
  // empty diamond.
  function renderScorebookStill(item) {
    const k = item.k;
    const photo = item.personId
      ? `<img class="vc-photo" src="${headshotUrl(item.personId, 240)}" alt="" onerror="this.style.visibility='hidden'">`
      : '';
    const team = item.teamId ? `<img src="${capLogoUrl(item.teamId)}" alt="">${TEAM_ABBR[item.teamId] || ''}` : '';
    const where = [team, k ? inningTag(k) : ''].filter(Boolean).join('<b>&#183;</b>');
    const dots = k && k.rbi ? `<span class="pp-rc-rbi">${'<i></i>'.repeat(k.rbi)}</span>` : '';
    const diamond = k
      ? diamondSVG(k.reached, k.reached === 4, k.code, k.isOut, k.outEdge, null, false, k.calledLooking)
      : diamondSVG(0, false, '', false, null, null, false);
    return `
      <span class="vc-card">
        <span class="vc-who">${photo}</span>
        <span class="vc-play-side">
          <span class="vc-where">${where}</span>
          <span class="vc-dia">${dots}${diamond}</span>
        </span>
        <span class="dg-recap vc-play">&#9654;</span>
      </span>`;
  }

  // A video card: the scorebook still, then a kicker saying why it's here
  // (it keeps its line even when empty, so a row's titles line up), the
  // title and the game. Every card draws its own still -- MLB's photos
  // never show -- so a Savant-only play looks like any other.
  function renderVideoCard(item) {
    const matchup = item.meta || (item.clip ? item.clip.matchup : matchupOf(item.g));
    return `
      <button type="button" class="vc" data-day-clip="${dayVideoKey(item)}">
        <span class="vc-thumb">${((item.kind && HIGHLIGHT_STILLS[item.kind]) || renderScorebookStill)(item)}</span>
        <span class="vc-kicker">${item.label || '&nbsp;'}${item.why ? ` <em>${item.why}</em>` : ''}</span>
        <span class="vc-title">${item.title}</span>
        <span class="dp-meta">${matchup}</span>
      </button>`;
  }

  function renderVideoSection(title, items, { note = '', body = '' } = {}) {
    if (!items.length && !body) return '';
    return `
      <div class="dy-sec">
        <div class="pp-skg-head"><span>${title}</span>${note ? `<em>${note}</em>` : ''}</div>
        ${items.length ? `<div class="dp-row">${items.map(renderVideoCard).join('')}</div>` : ''}
        ${body}
      </div>`;
  }

  function renderDay() {
    if (!dayData) return '';
    const { dateStr, games, media, stats, season } = dayData;
    clearDayClips('d');
    const homeRuns = stats.flatMap(s => s.homeRuns);
    const starts = stats.flatMap(s => s.starts);
    const sec = buildDaySections(dayData);
    const finals = games.filter(g => g.status.abstractGameState === 'Final').length;
    const when = new Date(`${dateStr}T12:00:00`).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    const meta = [`${games.length} game${games.length === 1 ? '' : 's'}`, finals && finals < games.length ? `${finals} final` : '', homeRuns.length ? `${homeRuns.length} HR` : ''].filter(Boolean).join(' &#183; ');
    return `
      <div class="sheet dy">
        <div class="dy-head"><div class="dy-title">${when}</div><div class="dy-meta">${meta}</div></div>
        <div class="dy-sec">
          <div class="pp-skg-head"><span>Scores</span></div>
          <div class="dg-grid">${games.map(g => renderDayGame(g, media[g.gamePk])).join('')}</div>
        </div>
        ${renderVideoSection('Clutch Plays', sec.moments)}
        <div class="dy-pair">
          ${renderVideoSection('Out of the Park', [], { note: homeRuns.length || '', body: renderDayHomeRuns(homeRuns, season, dayData.wpaByPk) })}
          ${renderVideoSection('On the Mound', [], { body: renderDayStarts(starts, season, sec.reels) })}
        </div>
        ${renderVideoSection('Web Gems', sec.defense)}
      </div>`;
  }

  let dailyRequestId = 0;
  // The schedule's highlights make it ~2 MB a day, so a poll refetches
  // them only every few minutes and otherwise keeps the last ones.
  const DAY_MEDIA_TTL_MS = 3 * 60 * 1000;
  let dayMediaAt = 0;

  // isPoll distinguishes a silent background refresh from a real navigation
  // (tab open, date change, prev/next click): a poll redraws the page in
  // place rather than flashing back through the loading message.
  async function loadDailySummary(dateStr, isPoll) {
    const requestId = ++dailyRequestId;
    clearTimeout(dailyPollTimer);
    dailyPollTimer = null;
    if (!isPoll) dailyBody.innerHTML = '<div class="mlb-status-msg">Loading the day&#8217;s games&#8230;</div>';
    try {
      const withMedia = !isPoll || Date.now() - dayMediaAt > DAY_MEDIA_TTL_MS;
      const hydrate = `linescore${withMedia ? ',game(content(highlights(highlights)))' : ''}`;
      const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${dateStr}&hydrate=${hydrate}`);
      const data = await res.json();
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      // A newer date's load may have started while this one was waiting.
      if (requestId !== dailyRequestId) return;
      if (!games.length) {
        if (!isPoll) dailyBody.innerHTML = '<div class="mlb-status-msg">No MLB games scheduled on this date.</div>';
        return;
      }
      const startedGames = games.filter(g => g.status.abstractGameState === 'Live' || g.status.abstractGameState === 'Final');
      const [stats, wpas] = await Promise.all([
        Promise.all(startedGames.map(g =>
          fetchGameStats(g.gamePk, g.teams.away.team, g.teams.home.team, g.status.abstractGameState === 'Final'))),
        Promise.all(startedGames.map(g => getGameWpa(g.gamePk, g.status.abstractGameState === 'Final')))
      ]);
      if (requestId !== dailyRequestId) return;
      let media = {};
      if (withMedia) {
        games.forEach(g => { media[g.gamePk] = buildGameMedia(g); });
        dayMediaAt = Date.now();
      } else if (dayData && dayData.dateStr === dateStr) {
        media = dayData.media;
      }
      const statsByPk = {};
      const wpaByPk = {};
      startedGames.forEach((g, i) => { statsByPk[g.gamePk] = stats[i]; wpaByPk[g.gamePk] = wpas[i]; });
      dayData = { dateStr, games, media, stats, statsByPk, wpaByPk, season: Number(dateStr.slice(0, 4)) };
      const openLists = isPoll ? [...dailyBody.querySelectorAll('.dy-hr.is-open')].length > 0 : false;
      dailyBody.innerHTML = renderDay();
      if (openLists) {
        const sec = dailyBody.querySelector('.dy-hr');
        if (sec) sec.classList.add('is-open');
      }

      // Keep polling as long as anything on this date could still change --
      // not just while something is *currently* Live. A date can have some
      // games Final and others still Preview (an early game ends before a
      // late one starts), and checking only for Live means polling can stop
      // for good in that gap. Preview games only need an occasional
      // check-in to catch the Live transition (or a postponement).
      const stillLive = games.some(g => g.status.abstractGameState === 'Live');
      const stillUpcoming = games.some(g => g.status.abstractGameState === 'Preview');
      if (requestId === dailyRequestId && (stillLive || stillUpcoming)) {
        dailyPollTimer = setTimeout(() => loadDailySummary(dateStr, true), stillLive ? 15000 : 60000);
      }
    } catch (e) {
      if (requestId !== dailyRequestId) return;
      if (!isPoll) {
        dailyBody.innerHTML = apiErrorMsg("the day's games");
        return;
      }
      // A transient failure mid-poll (a network blip, e.g. right as the
      // phone wakes up) must not silently kill the poll chain -- this chain
      // only keeps going if something here re-arms dailyPollTimer. Retry
      // on the live cadence.
      if (requestId === dailyRequestId) {
        dailyPollTimer = setTimeout(() => loadDailySummary(dateStr, true), 15000);
      }
    }
  }

  dailyBody.addEventListener('click', (e) => {
    const clipBtn = e.target.closest('[data-day-clip]');
    if (clipBtn) {
      const clip = dayClips[clipBtn.dataset.dayClip];
      if (clip && clip.mp4) showClipModal(null, { head: `<div class="cv-head"><span class="cv-result">${clip.matchup}</span></div>`, clip });
      else if (clip && clip.playId) showClipModal(clip.playId, { head: `<div class="cv-head"><span class="cv-result">${clip.matchup}</span></div>` });
      return;
    }
    const more = e.target.closest('.dy-more');
    if (more) {
      const open = more.closest('.dy-hr').classList.toggle('is-open');
      more.textContent = open ? more.dataset.less : more.dataset.more;
      return;
    }
    if (e.target.closest('a, button')) return;
    const game = e.target.closest('.dg');
    if (game) jumpToScorecardGame(game.dataset.date, Number(game.dataset.gamePk));
  });
  dailyBody.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const game = e.target.closest('.dg');
    if (!game || e.target !== game) return;
    e.preventDefault();
    jumpToScorecardGame(game.dataset.date, Number(game.dataset.gamePk));
  });

  dailyDateInput.addEventListener('change', () => {
    dailyDateInputText.textContent = formatShortDate(dailyDateInput.value);
    loadDailySummary(dailyDateInput.value);
  });
  document.getElementById('dailyDatePrev').addEventListener('click', () => {
    setDateInputValue(dailyDateInput, dailyDateInputText, addDays(dailyDateInput.value, -1));
    loadDailySummary(dailyDateInput.value);
  });
  document.getElementById('dailyDateNext').addEventListener('click', () => {
    setDateInputValue(dailyDateInput, dailyDateInputText, addDays(dailyDateInput.value, 1));
    loadDailySummary(dailyDateInput.value);
  });


  // ---- Team tab ----
  // One team's season in four views: Overview (record, the games-over-.500
