    getSavantSkillData(season, pitcher, !type || type === 'Catcher', !type || ['Outfielder', 'Infielder', 'Catcher'].includes(type));
  }

  // Pushes the profile's history entry (see navPush) unless history:
  // false -- when Back is what's restoring it, or when a caller already
  // pushed one (jumpToPlayerProfile, before switching tabs). from/depth
  // record whether it was opened from the list and how many players deep,
  // for leaveProfileForList.
  async function showPlayerProfile(rawPerson, { history: pushHistory = true, tab = 'ov' } = {}) {
    // Normalized once, here, since callers don't agree on type: search
    // results carry a numeric id straight from the API, but a dataset
    // attribute (jumpToPlayerProfile, showPlayerModal) is always a string.
    // playerSprayState.personId is compared with `===` elsewhere, so a
    // mismatched type there silently made the spray widget disappear
    // whenever a profile was opened by jumping from a player-name button
    // instead of the search box.
    const person = { ...rawPerson, id: Number(rawPerson.id) };
    const requestId = ++playerProfileRequestId;
    playerSprayToken++; // abandon any spray fetch still in flight for whatever was open before
    if (pushHistory) {
      const here = history.state || {};
      const deeper = playersView === 'profile' && here.profile;
      navPush({ tab: 'players', profile: person.id, from: deeper ? here.from : 'list', depth: deeper ? (here.depth || 1) + 1 : 1 });
    }
    playersView = 'profile';
    syncPlayerToggle();
    profileTab = tab;
    lastProfilePerson = person;
    lastProfileCareerSplits = null;
    lastProfileAwardTags = [];
    lastProfileLeagueWoba = {};
    lastProfileDetail = undefined;
    lastProfileBoard = null;
    lastProfileRecent = undefined;
    lastProfileScores = {};
    profileRecentRequested = false;
    profileSprayRequested = false;
    lastProfileDefense = undefined;
    lastProfileCatches = undefined;
    profileDefenseRequested = false;
    profileDefensePool = null;
    profileCatchTier = null;
    lastProfilePlays = undefined;
    lastProfilePlaysProgress = null;
    profileOpenRow = null;
    profileHighlightsAll = false;
    lastProfileArsenal = undefined;
    profileArsenalRequested = false;
    profileArsenalSide = null;
    lastProfileSeason = playerListState.season || defaultListSeason;
    prefetchProfile(rawPerson, lastProfileSeason);
    playerSprayState = { personId: person.id, season: null, balls: null, loading: true };
    rerenderPlayerProfile();
    // Opened from deep in the list: start at the top of the profile, not
    // at whatever point the list had been scrolled to.
    const profileTop = playersBody.getBoundingClientRect().top + window.scrollY - (playersBody.closest('#mlb-root').querySelector('.tab-header') || {}).offsetHeight - 8;
    if (window.scrollY > profileTop) window.scrollTo(0, Math.max(0, profileTop));
    // The season load needs only the person record, so it starts as soon as
    // that's in; career stats and awards follow on their own. The awards
    // row sits above the board, so the board waits for it to land
    // (profileAwardsReady) rather than be pushed down once it does.
    const careerPromise = getPlayerCareerStats(person.id);
    profileAwardsReady = getPlayerAwards(person.id).then(awards => {
      if (requestId === playerProfileRequestId) lastProfileAwardTags = summarizeAwardTags(awards);
    });
    const [fullPerson, season] = await Promise.all([
      getPlayerDetails(person.id),
      lastProfileSeason ? Promise.resolve(lastProfileSeason) : getDefaultListSeason()
    ]);
    if (requestId !== playerProfileRequestId) return;
    lastProfilePerson = fullPerson || person;
    lastProfileSeason = season;
    // Position (so which stat group to load) is only certain once the full
    // person record is in -- jumpToPlayerProfile passes just an id/name.
    const pitcher = isPitcher(lastProfilePerson);
    if (!pitcher) playerSprayState.season = season;
    loadProfileSeason(person.id, season, pitcher, requestId);
    ensureProfileDefense();
    ensureProfileArsenal();
    await profileAwardsReady;
    if (requestId !== playerProfileRequestId) return;
    rerenderPlayerProfile();
    ensureProfileSpray();
    const careerSplits = await careerPromise;
    if (requestId !== playerProfileRequestId) return;
    lastProfileCareerSplits = careerSplits;
    rerenderPlayerProfile();
    if (careerSplits.hitting.length) loadCareerLeagueWoba(careerSplits.hitting, requestId);
  }

  // Mirrors jumpToScorecardGame: leave the modal, switch tabs, load the
  // full page there. playerStore only has the name/pos/team the scorecard
  // grid already had on hand -- showPlayerProfile re-fetches everything
  // else (team, bio, career stats) the same as a normal search selection.
  // Closes both the quick-look player modal and the game summary modal --
  // whichever (if either) is actually open -- since this is called both
  // from inside the player modal's own CTA and directly off a Players of
  // the Game name button nested inside the game summary modal; closeOverlay
  // is a no-op on an overlay that isn't open.
  // From another tab, the entry is pushed before switching tabs, so the
  // tab being left keeps its own entry (and Back returns to it); from the
  // Players tab itself, showPlayerProfile pushes it as for any profile.
  function jumpToPlayerProfile(playerId) {
    const info = playerStore[playerId];
    hidePlayerModal();
    hideGameSummaryModal();
    whenModalHistorySettled(() => openProfileFromAnywhere(playerId, info));
  }
  function openProfileFromAnywhere(playerId, info) {
    const person = { id: playerId, fullName: (info && info.name) || '', posHint: info && info.pos };
    if (Tabs.current() === 'players') {
      showPlayerProfile(person);
      return;
    }
    navPush({ tab: 'players', profile: Number(playerId), from: 'other', depth: 1 });
    Tabs.switchTo('players', { history: false });
    showPlayerProfile(person, { history: false });
  }

  // Feeds .scorecard-sidebar's fixed top/right offsets (--tab-header-h and
  // --sidebar-right, read in CSS) so the sidebar (position: fixed, so page
  // scroll never drags it -- see .scorecard-sidebar) clamps to just below
  // the sticky .tab-header instead of overlapping it, and lines its right
  // edge up with #mlb-root's own right edge instead of the viewport's --
  // neither is a fixed constant: the header's controls row differs per tab
  // and can wrap at some widths, and #mlb-root itself may not be
  // viewport-width (padded, possibly embedded in a narrower host page).
  const mlbRootEl = document.getElementById('mlb-root');
  const tabHeaderEl = document.querySelector('.tab-header');
  function syncSidebarOffsets() {
    if (!mlbRootEl || !tabHeaderEl) return;
    mlbRootEl.style.setProperty('--tab-header-h', tabHeaderEl.offsetHeight + 'px');
    const rootRect = mlbRootEl.getBoundingClientRect();
    const rootRightPadding = parseFloat(getComputedStyle(mlbRootEl).paddingRight) || 0;
    const rightOffset = Math.max(0, window.innerWidth - rootRect.right + rootRightPadding);
    mlbRootEl.style.setProperty('--sidebar-right', rightOffset + 'px');
  }
  window.addEventListener('resize', syncSidebarOffsets);
  const tabBarEl = document.querySelector('.tab-bar');
  function syncTabBarFade() {
    if (!tabBarEl) return;
    tabBarEl.classList.toggle('has-more-right', tabBarEl.scrollLeft + tabBarEl.clientWidth < tabBarEl.scrollWidth - 2);
  }
  if (tabBarEl) {
    tabBarEl.addEventListener('scroll', syncTabBarFade, { passive: true });
    window.addEventListener('resize', syncTabBarFade);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncTabBarFade);
    syncTabBarFade();
  }
  // The header's height also changes without a resize -- web fonts
  // landing, a tab's controls row wrapping -- and sticky things read it
  // (the Scorecard sidebar, the Game Log's header and recent-games column).
  if (tabHeaderEl && typeof ResizeObserver === 'function') new ResizeObserver(syncSidebarOffsets).observe(tabHeaderEl);
  // The fixed bottom bar's height varies (the board alone, or with the
  // at-bat card); the sheet reserves exactly that much room under itself
  // so its last rows can always scroll clear of it.
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => {
    if (scoreBottomBar.offsetHeight) mlbRootEl.style.setProperty('--bar-h', scoreBottomBar.offsetHeight + 'px');
  }).observe(scoreBottomBar);

  // onShow runs before Tabs records the tab as current, so the resume (which
  // checks that the Scorecard is on screen) waits a microtask.
  Tabs.register('scorecard', { onShow: () => { syncSidebarOffsets(); queueMicrotask(() => resumeScorecardPolls(false)); } });
  Tabs.register('daily', {
    init: () => {
      findLastStartedDate().then(dateStr => {
        setDateInputValue(dailyDateInput, dailyDateInputText, dateStr);
        loadDailySummary(dateStr);
      });
    }
  });
  // Once the regular season is over -- through October and the winter --
  // the tab opens on the bracket.
  Tabs.register('standings', { init: async () => {
    const latestStandingsSeason = await getDefaultListSeason();
    const years = [];
    for (let y = latestStandingsSeason; y >= PLAYER_LIST_FIRST_SEASON; y--) years.push(y);
    standingsYearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
    setStandingsSeason(latestStandingsSeason);
    const { final } = await standingsSeasonStatus(latestStandingsSeason);
    if (final && standingsView === 'division') setStandingsView('postseason');
    loadStandings();
  } });
  Tabs.register('team', { init: initTeamTab, onShow: resumeTeamNextPoll });
  // onShow keeps --tab-header-h current for this tab's own header height
  // (its controls row differs from the Scorecard's), which the Game Log's
  // sticky recent-games column reads.
  Tabs.register('players', { init: () => showPlayerList(), onShow: syncSidebarOffsets });

  const playerOverlay = document.getElementById('playerOverlay');
  const playerModalBody = document.getElementById('playerModalBody');
  const playerClose = document.getElementById('playerClose');

  async function showPlayerModal(playerId) {
    const info = playerStore[playerId];
    if (!info) return;
    playerModalBody.innerHTML = renderPlayerModalContent(info, null) + '<div class="pitch-empty">Loading season stats&#8230;</div>';
    openOverlay(playerOverlay);
    const pitcher = info.pos === 'P';
    const [seasonStat, awards, recentGames, details, leagueWoba] = await Promise.all([
      getPlayerSeasonStats(playerId, info.season, pitcher ? 'pitching' : 'hitting'),
      getPlayerAwards(playerId),
      getRecentGameStats(info),
      getPlayerDetails(playerId),
      pitcher ? Promise.resolve(null) : getLeagueWOBA(info.season)
    ]);
    if (!playerOverlay.classList.contains('open')) return;
    // info.pos is whatever position this playerStore entry happened to be
    // built from (a batting-order slot, a boxscore position, a bullpen
    // pitcher) -- fine for deciding pitcher-vs-batter stat sections above,
    // but the modal header itself should show the player's general
    // position rather than just the one they played in this one game.
    const generalPos = (details && details.primaryPosition && details.primaryPosition.abbreviation) || info.pos;
    playerModalBody.innerHTML = renderPlayerModalContent(info, seasonStat, summarizeAwardTags(awards), recentGames, generalPos, leagueWoba);
  }
  // Plays a Savant clip in the app rather than sending the user off to
  // Savant: opened from the Defense tab's catch board and from the
  // Scorecard's at-bat "Watch" links. The clip's game is only known once
  // its Savant page arrives, so the date (a link to that game's scorecard,
  // unless the clip was opened from that scorecard) fills in with the
  // video. Above every other popup -- the at-bat popup opens it.
  const clipOverlay = document.getElementById('clipOverlay');
  const clipModalBody = document.getElementById('clipModalBody');
  let clipRequestId = 0;
  // clip: an already-known { mp4, title, date, gamePk, matchup } (an MLB
  // highlight) to play instead of looking up the play's Savant clip.
  async function showClipModal(playId, { head, facts = '', gameLink = true, clip: knownClip = null }) {
    const requestId = ++clipRequestId;
    clipModalBody.innerHTML = `${head}<div class="cv-video cv-video-wait"><div class="mlb-status-msg">Loading clip&#8230;</div></div>${facts}`;
    openOverlay(clipOverlay);
    const clip = knownClip || await getSavantClip(playId);
    if (requestId !== clipRequestId || !clipOverlay.classList.contains('open')) return;
    if (!clip) {
      clipModalBody.innerHTML = `${head}<div class="cv-video cv-video-wait">${apiErrorMsg('clip')}</div>${facts}`;
      return;
    }
    const when = clip.date ? `${formatShortDate(clip.date)}${clip.matchup ? ` &#183; ${clip.matchup}` : ''}` : '';
    const game = when && gameLink && clip.gamePk
      ? `<button type="button" class="pp-game-link cv-game" data-date="${clip.date}" data-game-pk="${clip.gamePk}">${when}</button>`
      : when;
    clipModalBody.innerHTML = `${head}
      <video class="cv-video" src="${clip.mp4}" controls autoplay playsinline preload="auto"></video>
      ${clip.title ? `<div class="cv-desc">${clip.title}</div>` : ''}
      ${game ? `<div class="cv-meta">${game}</div>` : ''}
      ${facts}`;
  }
  function hideClipModal() {
    closeOverlay(clipOverlay);
  }
  document.getElementById('clipClose').addEventListener('click', hideClipModal);
  clipOverlay.addEventListener('click', (e) => {
    if (e.target === clipOverlay) { hideClipModal(); return; }
    const game = e.target.closest('.cv-game');
    if (game) {
      hideClipModal();
      jumpToScorecardGame(game.dataset.date, Number(game.dataset.gamePk));
    }
  });

  function renderCatchFacts(play) {
    const facts = [
      ['Catch %', `${Math.round(play.catchRate * 100)}%`],
      ['Hang', `${play.hang.toFixed(1)}s`],
      ['Distance', `${play.distance} ft`],
      ...(play.wall ? [['At', 'Wall']] : []),
      ...(play.back ? [['Going', 'Back']] : [])
    ];
    return `<dl class="pp-vitals cv-facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  }
  function showCatchModal(play) {
    showClipModal(play.playId, {
      head: `<div class="cv-head"><span class="cv-stars">${STAR_GLYPHS(play.stars)}</span><span class="cv-result">${play.made ? 'Caught' : 'Missed'}</span></div>`,
      facts: renderCatchFacts(play)
    });
  }

  // Every Watch link (the Scorecard's at-bats, the Highlights tab's home
  // runs, the game summary's Play of the Game) keeps its Savant href, so a
  // long-press or middle-click can still open it in a new tab; a plain
  // click plays the clip here instead. A link inside the game summary
  // popup also keeps that popup open beneath the clip.
  document.getElementById('mlb-root').addEventListener('click', (e) => {
    const watch = e.target.closest('a[data-clip-play-id]');
    if (!watch || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    showClipModal(watch.dataset.clipPlayId, {
      head: `<div class="cv-head"><span class="cv-result">${watch.dataset.clipLabel || ''}</span></div>`,
      gameLink: !('clipNoGame' in watch.dataset)
    });
  });

  function hidePlayerModal() {
    closeOverlay(playerOverlay);
  }

  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-pkey]');
    // The pitch-tag plate sits inside the same cell-wrap the pitch popup
    // is wired to (see data-pkey), so without this guard a click on the
    // plate would also open the popup for the diamond behind it.
    if (target && !e.target.closest('.player-name-btn')) showPitchPopup(target.getAttribute('data-pkey'));
    const rosterBtn = e.target.closest('.roster-btn');
    if (rosterBtn) showRosterModal(rosterBtn.getAttribute('data-team'));
    const playerBtn = e.target.closest('.player-name-btn');
    if (playerBtn) {
      // Players of the Game already lives inside the game summary modal --
      // stacking the quick-look player modal on top of that would be a
      // modal-over-modal, so it jumps straight to the Players tab instead
      // of going through showPlayerModal like every other name button does.
      if (playerBtn.classList.contains('potg-player-name')) jumpToPlayerProfile(playerBtn.getAttribute('data-player-id'));
      else showPlayerModal(playerBtn.getAttribute('data-player-id'));
    }
    const teamChartBtn = e.target.closest('.standings-team-btn');
    if (teamChartBtn) {
      const teamId = teamChartBtn.getAttribute('data-team-id');
      const teamName = teamChartBtn.getAttribute('data-team-name');
      const plateSeason = teamChartBtn.getAttribute('data-season');
      if (plateSeason) {
        const isCurrent = Number(plateSeason) === new Date().getFullYear();
        showTeamChartModal(teamId, teamName, plateSeason, isCurrent ? todayStr() : undefined);
      } else {
        showTeamChartModal(teamId, teamName, standingsSeason, standingsAsOf || undefined);
      }
    }
    if (!e.target.closest('.player-search-wrap')) playerSearchResults.hidden = true;
  });
  pitchClose.addEventListener('click', hidePitchPopup);
  pitchOverlay.addEventListener('click', (e) => {
    if (e.target === pitchOverlay) hidePitchPopup();
  });
  rosterClose.addEventListener('click', hideRosterModal);
  rosterOverlay.addEventListener('click', (e) => {
    if (e.target === rosterOverlay) hideRosterModal();
  });
  playerClose.addEventListener('click', hidePlayerModal);
  playerOverlay.addEventListener('click', (e) => {
    if (e.target === playerOverlay) hidePlayerModal();
  });
  playerModalBody.addEventListener('click', (e) => {
    const btn = e.target.closest('.modal-cta');
    if (btn) jumpToPlayerProfile(btn.dataset.playerId);
  });
  teamChartClose.addEventListener('click', hideTeamChartModal);
  teamChartOverlay.addEventListener('click', (e) => {
    if (e.target === teamChartOverlay) hideTeamChartModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Tab' && modalStack.length) {
      const top = document.getElementById(modalStack[modalStack.length - 1]);
      const modal = top && top.querySelector('.pitch-modal');
      if (modal) {
        const items = Array.from(modal.querySelectorAll('a[href], button:not([disabled]), select, input, video[controls], [tabindex="0"]')).filter(x => x.offsetParent !== null);
        if (items.length) {
          const first = items[0], last = items[items.length - 1];
          if (!modal.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); return; }
          if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); return; }
        }
      }
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.cell-wrap.clickable[data-pkey]')) {
      e.preventDefault();
      showPitchPopup(e.target.getAttribute('data-pkey'));
      return;
    }
    if (e.key === 'Escape') { hidePitchPopup(); hideRosterModal(); hidePlayerModal(); hideGameSummaryModal(); hideTeamChartModal(); hideGameStripModal(); hideClipModal(); playerSearchResults.hidden = true; }
  });

  // Backgrounding the tab (or the installed PWA) gets setTimeout/setInterval
  // throttled or fully suspended by the browser, so a poll (7s for a live
  // game, 15s/60s for the Daily tab) can silently stop firing while it's not
  // visible -- returning to a live game or the Daily tab could otherwise sit
  // on a stale fetch from before backgrounding for an unpredictable stretch,
  // until whatever's left of the suspended timer eventually fires. Catch up
  // immediately instead, the same way a fresh navigation would: clear
  // whatever poll is pending and refetch now.
  //
  // visibilitychange alone isn't reliable enough for this on mobile: an
  // installed home-screen app can have its process suspended or discarded
  // by the OS while backgrounded (observed on Android; standalone-mode
  // WebKit on iOS has its own history of the same class of bug), and on
  // return the event doesn't reliably fire in time, if at all, so the
  // catch-up above never runs. pageshow and window focus both fire
  // reliably on resume regardless of why visibilitychange didn't, so all
  // three are wired to the same catch-up and a short cooldown collapses
  // the near-simultaneous firings a single resume tends to produce.
  let lastResumeCatchUp = 0;
  function catchUpAfterResume() {
    const now = Date.now();
    if (now - lastResumeCatchUp < 1000) return;
    lastResumeCatchUp = now;
    resumeScorecardPolls(true);
    resumeTeamNextPoll();
    if (dailyPollTimer) {
      clearTimeout(dailyPollTimer);
      dailyPollTimer = null;
      loadDailySummary(dailyDateInput.value, true);
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') catchUpAfterResume();
  });
  window.addEventListener('pageshow', catchUpAfterResume);
  window.addEventListener('focus', catchUpAfterResume);

  Tabs.init('scorecard');
  loadSchedule(dateInput.value);

  // Registers the app-shell service worker for PWA installability. Guarded
  // by protocol since service workers require http(s), not file://.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
})();
</script>
</body>
</html>
