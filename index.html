    118: 'Royals', 119: 'Dodgers', 120: 'Nationals', 121: 'Mets', 133: 'Athletics',
    134: 'Pirates', 135: 'Padres', 136: 'Mariners', 137: 'Giants', 138: 'Cardinals',
    139: 'Rays', 140: 'Rangers', 141: 'Blue Jays', 142: 'Twins', 143: 'Phillies',
    144: 'Braves', 145: 'White Sox', 146: 'Marlins', 147: 'Yankees', 158: 'Brewers'
  };
  function teamNickname(team) {
    return TEAM_NICKNAMES[team && team.id] || (team && (team.teamName || team.name)) || '';
  }

  const TEAM_ABBR = {
    108: 'LAA', 109: 'AZ', 110: 'BAL', 111: 'BOS', 112: 'CHC',
    113: 'CIN', 114: 'CLE', 115: 'COL', 116: 'DET', 117: 'HOU',
    118: 'KC', 119: 'LAD', 120: 'WSH', 121: 'NYM', 133: 'ATH',
    134: 'PIT', 135: 'SD', 136: 'SEA', 137: 'SF', 138: 'STL',
    139: 'TB', 140: 'TEX', 141: 'TOR', 142: 'MIN', 143: 'PHI',
    144: 'ATL', 145: 'CWS', 146: 'MIA', 147: 'NYY', 158: 'MIL'
  };
  function teamAbbr(team) {
    return TEAM_ABBR[team && team.id] || teamNickname(team);
  }

  const scheduleTeamSelect = document.getElementById('scheduleTeamPick');
  const scheduleBody = document.getElementById('scheduleBody');
  const scheduleCache = {};
  const SCHEDULE_TEAM_KEY = 'mlb-schedule-team';
  const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // Shared by the Schedule and Roster tabs' team pickers -- both populate
  // the same 30-team list and fall back the same way to a saved localStorage
  // pick, differing only in which <select> and which storage key.
  function populateTeamSelect(selectEl, storageKey) {
    const teams = Object.keys(TEAM_NICKNAMES)
      .map(id => ({ id, name: TEAM_NICKNAMES[id] }))
      .sort((a, b) => a.name.localeCompare(b.name));
    selectEl.innerHTML = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    let saved = null;
    try { saved = localStorage.getItem(storageKey); } catch (e) {}
    selectEl.value = (saved && TEAM_NICKNAMES[saved]) ? saved : teams[0].id;
  }

  async function fetchTeamSchedule(teamId, season) {
    const key = `${teamId}-${season}`;
    if (scheduleCache[key]) return scheduleCache[key];
    try {
      const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamId}&season=${season}&gameType=R`;
      const res = await fetch(url);
      const data = await res.json();
      const dates = data.dates || [];
      const gamesByDate = {};
      dates.forEach(d => {
        gamesByDate[d.date] = d.games.map(g => {
          const isHome = g.teams.home.team.id === Number(teamId);
          const opponent = isHome ? g.teams.away.team : g.teams.home.team;
          return {
            gamePk: g.gamePk,
            gameNumber: g.gameNumber || 1,
            isHome,
            opponent: teamAbbr(opponent),
            opponentFull: teamNickname(opponent),
            gameDate: g.gameDate,
            state: g.status.abstractGameState,
            detailedState: g.status.detailedState,
            homeScore: g.teams.home.score,
            awayScore: g.teams.away.score,
            venueId: g.venue && g.venue.id,
            venueName: g.venue && g.venue.name
          };
        });
      });
      const result = {
        gamesByDate,
        seasonStart: dates.length ? dates[0].date : null,
        seasonEnd: dates.length ? dates[dates.length - 1].date : null
      };
      scheduleCache[key] = result;
      return result;
    } catch (e) {
      return { gamesByDate: {}, seasonStart: null, seasonEnd: null };
    }
  }

  const teamChartCache = {};

  async function getTeamWinLossSeries(teamId, season) {
    const key = `${teamId}-${season}`;
    if (teamChartCache[key]) return teamChartCache[key];
    const { gamesByDate } = await fetchTeamSchedule(teamId, season);
    const dates = Object.keys(gamesByDate).sort();
    const series = [];
    let net = 0;
    dates.forEach(date => {
      const games = gamesByDate[date].slice().sort((a, b) => a.gameNumber - b.gameNumber);
      games.forEach(g => {
        if (g.state !== 'Final') return;
        const teamScore = g.isHome ? g.homeScore : g.awayScore;
        const oppScore = g.isHome ? g.awayScore : g.homeScore;
        if (teamScore == null || oppScore == null || teamScore === oppScore) return;
        const won = teamScore > oppScore;
        net += won ? 1 : -1;
        series.push({ date, net, won });
      });
    });
    teamChartCache[key] = series;
    return series;
  }

  function renderTeamChartContent(teamId, teamName, season, series, throughDate) {
    const played = throughDate ? series.filter(s => s.date <= throughDate) : series;
    if (!played.length) {
      return `<div class="pitch-header">${teamName}</div><div class="pitch-subheader">${season} Season</div><div class="pitch-empty">No completed games yet this season.</div>`;
    }
    const wins = played.filter(s => s.won).length;
    const losses = played.length - wins;
    const netValues = played.map(s => s.net);
    const finalNet = netValues[netValues.length - 1];
    let peakIdx = 0, troughIdx = 0;
    netValues.forEach((v, i) => {
      if (v > netValues[peakIdx]) peakIdx = i;
      if (v < netValues[troughIdx]) troughIdx = i;
    });
    const maxNet = Math.max(0, netValues[peakIdx]);
    const minNet = Math.min(0, netValues[troughIdx]);
    const range = Math.max(1, maxNet - minNet);

    const width = 320, height = 160;
    const padL = 26, padR = 10, padT = 10, padB = 16;
    const plotW = width - padL - padR;
    const plotH = height - padT - padB;
    const n = played.length;
    const yFor = v => padT + plotH - ((v - minNet) / range) * plotH;
    const xFor = i => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
    const zeroY = yFor(0);

    const linePts = played.map((s, i) => `${xFor(i).toFixed(1)},${yFor(s.net).toFixed(1)}`).join(' ');
    const areaPts = n > 1
      ? `${xFor(0).toFixed(1)},${zeroY.toFixed(1)} ${linePts} ${xFor(n - 1).toFixed(1)},${zeroY.toFixed(1)}`
      : '';

    const monthTicks = [];
    let lastMonth = null;
    played.forEach((s, i) => {
      const month = s.date.slice(5, 7);
      if (month !== lastMonth) {
        monthTicks.push({ x: xFor(i), label: MONTH_NAMES[Number(month) - 1].slice(0, 3) });
        lastMonth = month;
      }
    });

    const clipId = `teamChartClip${teamId}`;
    const { ink, gold, brick } = PALETTE;

    let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block; margin-top:4px;">`;
    svg += `<defs>
      <clipPath id="${clipId}Above"><rect x="${padL}" y="${padT}" width="${plotW}" height="${Math.max(0, zeroY - padT).toFixed(1)}"/></clipPath>
      <clipPath id="${clipId}Below"><rect x="${padL}" y="${zeroY.toFixed(1)}" width="${plotW}" height="${Math.max(0, padT + plotH - zeroY).toFixed(1)}"/></clipPath>
    </defs>`;
    if (n > 1) {
      svg += `<polygon points="${areaPts}" fill="${gold}" opacity="0.28" clip-path="url(#${clipId}Above)"/>`;
      svg += `<polygon points="${areaPts}" fill="${brick}" opacity="0.28" clip-path="url(#${clipId}Below)"/>`;
    }
    svg += `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${width - padR}" y2="${zeroY.toFixed(1)}" stroke="${ink}" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>`;
    monthTicks.forEach(t => {
      svg += `<line x1="${t.x.toFixed(1)}" y1="${padT}" x2="${t.x.toFixed(1)}" y2="${height - padB}" stroke="${ink}" stroke-width="0.5" opacity="0.15"/>`;
      svg += `<text x="${t.x.toFixed(1)}" y="${height - 4}" font-family="Overpass, sans-serif" font-size="7" font-weight="700" letter-spacing="0.04em" fill="${ink}" opacity="0.6">${t.label}</text>`;
    });
    svg += `<text x="${padL - 4}" y="${(padT + 6).toFixed(1)}" font-family="Overpass, sans-serif" font-weight="700" font-size="8" fill="${ink}" opacity="0.6" text-anchor="end">${maxNet > 0 ? '+' + maxNet : maxNet}</text>`;
    svg += `<text x="${padL - 4}" y="${(zeroY - 3).toFixed(1)}" font-family="Overpass, sans-serif" font-weight="700" font-size="8" fill="${ink}" opacity="0.6" text-anchor="end">0</text>`;
    if (minNet < 0) {
      svg += `<text x="${padL - 4}" y="${height - padB}" font-family="Overpass, sans-serif" font-weight="700" font-size="8" fill="${ink}" opacity="0.6" text-anchor="end">${minNet}</text>`;
    }
    if (n > 1) {
      svg += `<polyline points="${linePts}" fill="none" stroke="${ink}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    const lastX = xFor(n - 1), lastY = yFor(finalNet);
    svg += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="${finalNet >= 0 ? gold : brick}" stroke="${ink}" stroke-width="1"/>`;
    svg += '</svg>';

    const fmtNet = v => v > 0 ? `+${v}` : String(v);
    const fmtDate = d => {
      const [y, m, dd] = d.split('-').map(Number);
      return `${MONTH_NAMES[m - 1].slice(0, 3)} ${dd}`;
    };

    return `<div class="pitch-header">${teamName}</div>
      <div class="pitch-subheader">${season} Season &#8226; ${wins}-${losses}</div>
      ${svg}
      <div class="pitch-final-desc">Current: ${fmtNet(finalNet)} &#8226; Best: ${fmtNet(netValues[peakIdx])} on ${fmtDate(played[peakIdx].date)} &#8226; Worst: ${fmtNet(netValues[troughIdx])} on ${fmtDate(played[troughIdx].date)}</div>`;
  }

  function formatGameTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function renderMonthGrid(startDate, endDate, gamesByDate, seasonStart, seasonEnd) {
    const leadBlanks = startDate.getUTCDay();
    const todayS = todayStr();

    let cells = '';
    for (let i = 0; i < leadBlanks; i++) cells += '<div class="calendar-day is-empty"></div>';

    let dayCount = 0;
    for (let cur = new Date(startDate); cur <= endDate; cur.setUTCDate(cur.getUTCDate() + 1)) {
      const dateStr = cur.toISOString().slice(0, 10);
      const day = cur.getUTCDate();
      const games = gamesByDate[dateStr];
      const today = dateStr === todayS ? ' is-today' : '';
      if (dateStr < seasonStart || dateStr > seasonEnd) {
        cells += `<div class="calendar-day is-outside"></div>`;
      } else if (games && games.length) {
        const homeAway = games[0].isHome ? 'is-home' : 'is-away';
        const isDH = games.length > 1 ? ' is-dh' : '';
        const lines = games.map(g => `<div class="cal-game-opp">${g.opponent}</div>`).join('');
        cells += `<div class="calendar-day is-game ${homeAway}${today}${isDH}" data-date="${dateStr}" tabindex="0" role="button">
          <div class="cal-daynum">${day}</div>
          ${lines}
        </div>`;
      } else {
        cells += `<div class="calendar-day${today}"><div class="cal-daynum">${day}</div></div>`;
      }
      dayCount++;
    }

    const trailBlanks = (7 - ((leadBlanks + dayCount) % 7)) % 7;
    for (let i = 0; i < trailBlanks; i++) cells += '<div class="calendar-day is-empty"></div>';

    return `<div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="calendar-grid">${cells}</div>`;
  }

  function renderScheduleAllMonths(gamesByDate, seasonStart, seasonEnd) {
    const startYear = Number(seasonStart.slice(0, 4));
    const startMonth = Number(seasonStart.slice(5, 7)) - 1;
    const endYear = Number(seasonEnd.slice(0, 4));
    const endMonth = Number(seasonEnd.slice(5, 7)) - 1;
    const todayS = todayStr();

    let blocks = '';
    let y = startYear, m = startMonth;
    let isFirst = true;
    while (y * 12 + m <= endYear * 12 + endMonth) {
      let blockStart, blockEnd, title;
      let blockEndM = m, blockEndY = y;

      if (isFirst && (y * 12 + m) < (endYear * 12 + endMonth)) {
        // Season opens partway through its first month (e.g. late March) —
        // combine that tail end with the following month to avoid a mostly-empty grid.
        blockEndM = m + 1;
        blockEndY = y;
        if (blockEndM > 11) { blockEndM = 0; blockEndY++; }
        blockStart = new Date(seasonStart + 'T00:00:00Z');
        blockEnd = new Date(Date.UTC(blockEndY, blockEndM + 1, 0));
        title = `${MONTH_NAMES[m]}/${MONTH_NAMES[blockEndM]} ${blockEndY}`;
      } else {
        blockStart = new Date(Date.UTC(y, m, 1));
        blockEnd = new Date(Date.UTC(y, m + 1, 0));
        title = `${MONTH_NAMES[m]} ${y}`;
      }

      const isCurrentMonth = (todayS.slice(0, 4) === String(y) && Number(todayS.slice(5, 7)) - 1 === m) ||
        (todayS.slice(0, 4) === String(blockEndY) && Number(todayS.slice(5, 7)) - 1 === blockEndM);

      blocks += `<div class="schedule-month-block"${isCurrentMonth ? ' data-current-month="1"' : ''}>
        <div class="schedule-month-title">${title}</div>
        ${renderMonthGrid(blockStart, blockEnd, gamesByDate, seasonStart, seasonEnd)}
      </div>`;

      isFirst = false;
      m = blockEndM + 1; y = blockEndY;
      if (m > 11) { m = 0; y++; }
    }

    scheduleBody.innerHTML = `<div class="sheet">${blocks}</div>`;
    const currentBlock = scheduleBody.querySelector('[data-current-month="1"]');
    if (currentBlock) currentBlock.scrollIntoView({ block: 'start' });
  }

  function renderDailyGameTile(dateStr, game, extraClass) {
    let rowsHtml, stateLabel, tileClass, watermarkHtml = '';
    // Once play has actually started (i.e. not still pre-game Warmup), MLB
    // flips detailedState away from 'In Progress' for all sorts of things
    // that aren't real stoppages -- manager/umpire challenges, replay
    // review, etc. The Daily tab should keep showing score + inning through
    // all of those and only fall back to the status label for an actual
    // delay/suspension.
    const isRealDelay = game.detailedState && /delay|suspend/i.test(game.detailedState);
    if (game.state === 'Live' && game.detailedState !== 'Warmup' && !isRealDelay) {
      rowsHtml = dailyTileRow(game.awayName, game.awayId, game.awayScore ?? 0, false)
        + dailyTileRow(game.homeName, game.homeId, game.homeScore ?? 0, false);
      stateLabel = `${formatInningState(game.inningState)} ${game.inningOrdinal || ''}`.trim();
      tileClass = 'is-live';
    } else if (game.state === 'Final') {
      const awayWon = game.awayScore > game.homeScore;
      rowsHtml = dailyTileRow(game.awayName, game.awayId, game.awayScore, awayWon)
        + dailyTileRow(game.homeName, game.homeId, game.homeScore, !awayWon);
      stateLabel = 'Final';
      tileClass = 'is-final';
      const winnerId = awayWon ? game.awayId : game.homeId;
      if (winnerId) watermarkHtml = `<img class="daily-tile-watermark" src="${capLogoUrl(winnerId)}" alt="">`;
    } else {
      // MLB flips abstractGameState to 'Live' during pre-game warmup, well
      // ahead of first pitch -- treat that like a not-yet-started game too
      // (inningState/inningOrdinal would otherwise show a fabricated "Top
      // 1st" before any pitch has actually been thrown).
      rowsHtml = dailyTileRow(game.awayName, game.awayId, null, false)
        + dailyTileRow(game.homeName, game.homeId, null, false);
      stateLabel = game.state === 'Live' ? (game.detailedState || 'Warmup') : formatGameTime(game.gameDate);
      tileClass = 'is-preview';
    }
    return `
      <div class="daily-tile ${tileClass}${extraClass ? ' ' + extraClass : ''}" data-date="${dateStr}" data-game-pk="${game.gamePk}" tabindex="0" role="button">
        ${watermarkHtml}
        ${rowsHtml}
        <div class="daily-tile-state">${stateLabel}</div>
      </div>`;
  }

  function savantVideoUrl(playId) {
    return playId ? `https://baseballsavant.mlb.com/sporty-videos?playId=${playId}` : null;
  }

  const gameStatsCache = {};

  async function fetchGameStats(gamePk, awayAbbr, homeAbbr, isFinal) {
    if (isFinal && gameStatsCache[gamePk] !== undefined) return gameStatsCache[gamePk];
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`);
      const data = await res.json();
      const allPlays = (data.liveData && data.liveData.plays && data.liveData.plays.allPlays) || [];
      const homeRuns = allPlays.filter(p => p.result && p.result.event === 'Home Run').map(p => {
        const isTop = p.about && p.about.isTopInning;
        let distance = null;
        const events = p.playEvents || [];
        for (let i = events.length - 1; i >= 0; i--) {
          const hd = events[i].hitData;
          if (hd && hd.totalDistance != null) { distance = hd.totalDistance; break; }
        }
        const lastEvent = events[events.length - 1];
        const playId = lastEvent && lastEvent.playId;
        return {
          batterId: p.matchup && p.matchup.batter && p.matchup.batter.id,
          batterName: (p.matchup && p.matchup.batter && p.matchup.batter.fullName) || '',
          pitcherName: (p.matchup && p.matchup.pitcher && p.matchup.pitcher.fullName) || '',
          battingAbbr: isTop ? awayAbbr : homeAbbr,
          pitchingAbbr: isTop ? homeAbbr : awayAbbr,
          isGrandSlam: p.result.rbi === 4,
          distance,
          videoUrl: savantVideoUrl(playId)
        };
      });
      const strikeoutTotals = {};
      allPlays.forEach(p => {
        if (!(p.result && p.result.event && p.result.event.startsWith('Strikeout'))) return;
        const pitcher = p.matchup && p.matchup.pitcher;
        if (!pitcher || pitcher.id == null) return;
        const isTop = p.about && p.about.isTopInning;
        const existing = strikeoutTotals[pitcher.id];
        if (existing) existing.count++;
        else strikeoutTotals[pitcher.id] = { id: pitcher.id, name: pitcher.fullName || '', teamAbbr: isTop ? homeAbbr : awayAbbr, count: 1 };
      });
      const result = { homeRuns, strikeouts: Object.values(strikeoutTotals) };
      if (isFinal) gameStatsCache[gamePk] = result;
      return result;
    } catch (e) {
      return { homeRuns: [], strikeouts: [] };
    }
  }

  function renderDailyView() {

  let dailyRequestId = 0;

  // isPoll distinguishes a silent background refresh from a real navigation
  // (tab open, date change, prev/next click): a poll reuses the page that's
  // already there and just swaps in fresh tile content, rather than flashing
  // back through the loading messages every 15 seconds.
  async function loadDailySummary(dateStr, isPoll) {
    const requestId = ++dailyRequestId;
    clearTimeout(dailyPollTimer);
    dailyPollTimer = null;
    if (!isPoll) dailyBody.innerHTML = '<div class="mlb-status-msg">Loading today&#8217;s highlights&#8230;</div>';
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${dateStr}&hydrate=linescore`);
      const data = await res.json();
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      if (!games.length) {
        if (!isPoll) dailyBody.innerHTML = '<div class="mlb-status-msg">No MLB games scheduled on this date.</div>';
        return;
      }
      if (!isPoll) {
        dailyBody.innerHTML = '<div class="sheet"><div id="dailyViewSection"><div class="mlb-status-msg">Loading game stats&#8230;</div></div></div>';
      }

      const startedGames = games.filter(g => g.status.abstractGameState === 'Live' || g.status.abstractGameState === 'Final');
      const gameStats = await Promise.all(startedGames.map(g =>
        fetchGameStats(g.gamePk, teamAbbr(g.teams.away.team), teamAbbr(g.teams.home.team), g.status.abstractGameState === 'Final')
      ));
      if (requestId !== dailyRequestId) return;
      const homeRuns = gameStats.map(s => s.homeRuns).flat();
      const strikeoutTotals = {};
      gameStats.forEach(s => s.strikeouts.forEach(k => {
        const existing = strikeoutTotals[k.id];
        if (existing) existing.count += k.count;
        else strikeoutTotals[k.id] = { ...k };
      }));
      const strikeoutLeaders = Object.values(strikeoutTotals).sort((a, b) => b.count - a.count).slice(0, 10);
      dailyStatsData = { homeRuns, strikeoutLeaders };
      renderDailyView();

      // Keep polling as long as anything on this date could still change --
      // not just while something is *currently* Live. A date can have some
      // games Final and others still Preview (an early game ends before a
      // late one starts), and checking only for Live means polling can stop
      // for good in that gap, silently freezing every not-yet-started game
      // until the date is changed or the page reloaded. A past date is all
      // Final and a future one is all Preview-with-nothing-to-catch-yet, so
      // this still naturally stops polling a date with nothing left to
      // change -- it just also covers today's gaps between games. Preview
      // games only need an occasional check-in to catch the Live transition
      // (or a postponement), so they get a much gentler interval than an
      // active game's 15s.
      const stillLive = games.some(g => g.status.abstractGameState === 'Live');
      const stillUpcoming = games.some(g => g.status.abstractGameState === 'Preview');
      if (requestId === dailyRequestId && (stillLive || stillUpcoming)) {
        dailyPollTimer = setTimeout(() => loadDailySummary(dateStr, true), stillLive ? 15000 : 60000);
      }
    } catch (e) {
      if (!isPoll) {
        dailyBody.innerHTML = apiErrorMsg("today's highlights");
        return;
      }
      // A transient failure mid-poll (a network blip, e.g. right as the
      // phone wakes up) must not silently kill the poll chain for the rest
      // of the session -- unlike fetchAndRender's setInterval, this chain
      // only keeps going if something here re-arms dailyPollTimer, and the
      // background-resume catch-up above only acts when dailyPollTimer is
      // set. Retry on the live cadence; once a fetch succeeds again, the
      // normal stillLive/stillUpcoming check above takes back over.
      if (requestId === dailyRequestId) {
        dailyPollTimer = setTimeout(() => loadDailySummary(dateStr, true), 15000);
      }
    }
  }

  const ROSTER_TAB_TEAM_KEY = 'mlb-roster-tab-team';

  const rosterTabViewToggle = document.getElementById('rosterTabViewToggle');
  let rosterTabView = 'active';
  const teamRosterCache = {};
  const teamInjuryCache = {};

  async function fetchTeamRoster(teamId, rosterType) {
    const key = `${teamId}-${rosterType}`;
    if (teamRosterCache[key]) return teamRosterCache[key];
    try {
      const url = `https://statsapi.mlb.com/api/v1/teams/${teamId}/roster?rosterType=${rosterType}`;
      const res = await fetch(url);
      const data = await res.json();
      const roster = (data.roster || []).map(r => ({
        id: r.person && r.person.id,
        name: r.person && r.person.fullName,
        jersey: r.jerseyNumber || '',
        posAbbr: (r.position && r.position.abbreviation) || '',
        posType: (r.position && r.position.type) || 'Other',
        statusDesc: (r.status && r.status.description) || ''
      }));
      teamRosterCache[key] = roster;
      return roster;
    } catch (e) {
      return [];
    }
  }

  async function fetchTeamInjuryDetails(teamId) {
    if (teamInjuryCache[teamId]) return teamInjuryCache[teamId];
    try {
      const end = todayStr();
      const start = addDays(end, -180);
      const url = `https://statsapi.mlb.com/api/v1/transactions?teamId=${teamId}&startDate=${start}&endDate=${end}`;
      const res = await fetch(url);
      const data = await res.json();
      const txns = data.transactions || [];
      const byPlayer = {};
      txns.forEach(t => {
        const pid = t.person && t.person.id;
        const desc = t.description || '';
        if (!pid || !/injured list/i.test(desc)) return;
        const prev = byPlayer[pid];
        if (!prev || t.date > prev.date) byPlayer[pid] = { date: t.date, description: desc };
      });
      teamInjuryCache[teamId] = byPlayer;
      return byPlayer;
    } catch (e) {
      teamInjuryCache[teamId] = {};
      return {};
    }
  }

  function extractInjuryDetail(description) {
    if (!description) return null;
    const sentences = description.split(/\.\s+/).map(s => s.trim()).filter(Boolean);
    return sentences.length > 1 ? sentences.slice(1).join('. ').replace(/\.$/, '') : null;
  }

  function rosterStatusRank(p) {
    const desc = p.statusDesc || '';
    if (!desc || /^active$/i.test(desc)) return 0;
    if (/injured/i.test(desc)) return 2;
    return 1;
  }

  function sortRosterList(list) {
    return list.slice().sort((a, b) => {
      const r = rosterStatusRank(a) - rosterStatusRank(b);
      return r !== 0 ? r : (a.name || '').localeCompare(b.name || '');
    });
  }

  function rosterStatusBadge(p) {
    const desc = p.statusDesc || '';
    if (!desc || /^active$/i.test(desc)) return '';
    if (/injured/i.test(desc)) return `<span class="roster-badge roster-badge-il">${desc}</span>`;
    return `<span class="roster-badge">${desc}</span>`;
  }

  function renderRosterRow(p, opts) {
    return `
      <div class="roster-row">
        <span class="roster-jersey">${p.jersey ? '#' + p.jersey : ''}</span>
        <button type="button" class="player-name-btn roster-name" data-player-id="${p.id}">${p.name}</button>
        ${opts.badges ? rosterStatusBadge(p) : ''}
        <span class="roster-pos">${p.posAbbr}</span>
      </div>`;
  }

  const POSITION_PLAYER_GROUP_ORDER = ['Catcher', 'Infielder', 'Outfielder', 'Hitter'];
  const POSITION_PLAYER_GROUP_LABEL = {
    Catcher: 'Catchers', Infielder: 'Infielders', Outfielder: 'Outfielders', Hitter: 'Designated Hitter'
  };

  function renderPositionPlayerColumn(list, opts) {
    if (!list.length) return '<div class="roster-empty">None</div>';
    const groups = {};
    list.forEach(p => { (groups[p.posType] = groups[p.posType] || []).push(p); });
    const keys = POSITION_PLAYER_GROUP_ORDER.filter(g => groups[g])
      .concat(Object.keys(groups).filter(g => !POSITION_PLAYER_GROUP_ORDER.includes(g)));
    return keys.map(g => {
      const rows = sortRosterList(groups[g]).map(p => renderRosterRow(p, opts)).join('');
      return `<div class="roster-subgroup-title">${POSITION_PLAYER_GROUP_LABEL[g] || g}</div>${rows}`;
    }).join('');
  }

  function renderRosterGroups(list, opts) {
    opts = opts || {};
    if (!list.length) return '<div class="roster-empty">No players found.</div>';
    const pitchers = sortRosterList(list.filter(p => p.posType === 'Pitcher'));
    const positionPlayers = list.filter(p => p.posType !== 'Pitcher');
    const pitcherRows = pitchers.length ? pitchers.map(p => renderRosterRow(p, opts)).join('') : '<div class="roster-empty">None</div>';
    const col = (title, inner) => `
      <div class="roster-column">
        <div class="roster-section-title">${title}</div>
        ${inner}
      </div>`;
    return `<div class="roster-columns">${col('Pitchers', pitcherRows)}${col('Position Players', renderPositionPlayerColumn(positionPlayers, opts))}</div>`;
  }

  function renderInjuredListRows(list, injuryMap) {
    return list.map(p => {
      const txn = injuryMap[p.id];
      return { p, detail: txn ? extractInjuryDetail(txn.description) : null, date: txn ? txn.date : null };
    }).sort((a, b) => {
      if (a.date && b.date) return b.date.localeCompare(a.date);
      if (a.date || b.date) return a.date ? -1 : 1;
      return (a.p.name || '').localeCompare(b.p.name || '');
    }).map(({ p, detail, date }) => {
      const dateLabel = date ? new Date(date + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '&#8212;';
      return `
        <tr>
          <td class="il-num">${p.jersey ? '#' + p.jersey : ''}</td>
          <td class="il-name"><button type="button" class="player-name-btn" data-player-id="${p.id}">${p.name}</button></td>
          <td class="il-pos">${p.posAbbr}</td>
          <td class="il-injury">${detail || 'Details unavailable'}</td>
          <td class="il-date">${dateLabel}</td>
        </tr>`;
    }).join('');
  }

  function renderInjuredList(fortyMan, injuryMap) {
    const ilPlayers = fortyMan.filter(p => /injured/i.test(p.statusDesc || ''));
    if (!ilPlayers.length) return '<div class="roster-empty">No players currently on the injured list.</div>';
    const groups = {};
    ilPlayers.forEach(p => { (groups[p.statusDesc] = groups[p.statusDesc] || []).push(p); });
    return Object.keys(groups).sort().map(status => `
      <div class="roster-section-title">${status}</div>
      <div class="table-scroll"><table class="il-table">
        <colgroup><col class="il-col-num"><col class="il-col-name"><col class="il-col-pos"><col><col class="il-col-date"></colgroup>
        <thead><tr><th></th><th>Player</th><th>Pos</th><th>Injury</th><th>Since</th></tr></thead>
        <tbody>${renderInjuredListRows(groups[status], injuryMap)}</tbody>
      </table></div>`).join('');
  }

  async function loadRosterTab(teamId) {
    rosterTabBody.innerHTML = '<div class="mlb-status-msg">Loading roster&#8230;</div>';

          fetchTeamInjuryDetails(teamId)

        rosterTabBody.innerHTML = `<div class="sheet">${renderInjuredList(fortyMan, injuryMap)}</div>`;

  const gameSummaryOverlay = document.getElementById('gameSummaryOverlay');
  const gameSummaryModalBody = document.getElementById('gameSummaryModalBody');

  function renderGameSummaryGame(dateStr, game, multi) {
    // Falls back to the full name wherever an abbreviation isn't known --
    // it always is for Daily/Schedule/Scorecard's own games, but stays
    // graceful if renderGameSummaryGame is ever fed something else.
    const awayAbbr = game.awayAbbr || game.awayName;
    const homeAbbr = game.homeAbbr || game.homeName;

    // game.weather is only ever supplied by the Scorecard tab's "Box Score"
    // link, which already has the live feed's gameData loaded -- Daily and
    // Schedule tabs only know the score, so their Live/Final games fetch it
    // lazily into this same placeholder (see loadGameSummaryExtrasInto),
    // same pattern as the box score above.
    const weatherHtml = game.weather
      ? renderWeatherLine(game.weather)
      : ((game.state === 'Final' || game.state === 'Live') ? `<span class="gs-weather" id="weather-${game.gamePk}"></span>` : '');
    const dateLineHtml = game.gameDate ? `<div class="gs-date-line">${formatGameTime(game.gameDate)}${weatherHtml}</div>` : '';

    // game.venueHtml is only ever supplied by the Scorecard tab's "Box
    // Score" link, which already has the venue name and detailed record
    // fetched -- Daily/Schedule only know the venue's name+id from the
    // schedule payload, so they render just the name here and let
    // loadVenueInto swap in the city once its own fetch resolves. The
    // status tag rides along in this same row (see renderVenueHeader).
    const topRowHtml = game.venueHtml || renderVenueHeader(game.venueName, null, game.gamePk, renderStateBadge(game));

    // game.linescore is only ever supplied by the Scorecard tab's "Box
    // Score" link, which already has the full live feed loaded -- Daily
    // and Schedule tabs only know the score, so every game (pre-game
    // included, so the box score is the one place team names/score show up
    // instead of a separate matchup line) fetches the inning-by-inning grid
    // lazily into this same slot (see loadGameSummaryExtrasInto), alongside
    // the WPA highlights below. game.allPlays rides along with it (see
    // currentGameSummary) so a Live game's panel here shows the same live
    // count/baserunner band it does on the Scorecard tab, not just the box
    // score.
    const boxScoreHtml = game.linescore
      ? `<div class="gs-box-score">${renderMonsterPanel(game.linescore, awayAbbr, homeAbbr, game.allPlays || [], game.state === 'Live' && hasGameStarted(game.allPlays))}</div>`
      : `<div id="boxScore-${game.gamePk}" class="box-score-slot gs-box-score"><div class="potg-loading">Loading box score&#8230;</div></div>`;

    // Top play/players highlights only make sense once a game is over --
    // a Live game's WPA swings are still in motion.
    const wpaHtml = game.state === 'Final'
      ? `<div class="pog-section" id="wpaLeaders-${game.gamePk}"><div class="potg-loading">Loading game highlights&#8230;</div></div>`
      : '';

    // The Scorecard tab's own "Game Summary" link always points at the game
    // already on screen there, so a "View Full Scorecard" CTA in that one
    // context would just reload the same game -- suppressed via this flag
    // rather than a gamePk comparison, since it should only ever apply to
    // that exact entry point, not any modal that happens to share a gamePk.
    const ctaHtml = game.hideScorecardCta
      ? ''
      : `<button type="button" class="modal-cta" data-date="${dateStr}" data-game-pk="${game.gamePk}">View Full Scorecard &#8594;</button>`;

    return `
      <div class="game-summary-game">
        ${multi ? `<div class="gs-game-label">Game ${game.gameNumber}</div>` : ''}
        ${topRowHtml}
        ${dateLineHtml}
        ${boxScoreHtml}
        ${wpaHtml}
        ${ctaHtml}
      </div>`;
  }

  function renderGameSummaryContent(dateStr, games, headerLabel) {
    const dateLabel = new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const multi = games.length > 1;

    return `
      ${multi ? `<div class="pitch-header">${headerLabel ? headerLabel + ' ' : ''}Doubleheader</div>` : ''}
      <div class="pitch-subheader">${dateLabel}</div>
      ${games.map(g => renderGameSummaryGame(dateStr, g, multi)).join('')}
    `;
  }

  let gameSummaryRequestId = 0;

  function openGameSummaryModal(dateStr, games, headerLabel) {
    if (!games || !games.length) return;
    const requestId = ++gameSummaryRequestId;
    gameSummaryModalBody.innerHTML = renderGameSummaryContent(dateStr, games, headerLabel);
    gameSummaryOverlay.classList.add('open');
    // Venue (name+city) applies to every game regardless of state. The box
    // score now shows for every game including pre-game (Preview never has
    // g.linescore, so it always needs the fetch); highlights still only
    // make sense once a game has actually started, gated inside
    // fetchGameHighlights itself via includeHighlights. A Live game whose
    // linescore and weather are already known (the Scorecard tab's own
    // "Game Summary" link, via currentGameSummary) has nothing left for
    // this to fetch -- renderGameSummaryGame won't have left a placeholder
    // for either -- so skip it instead of fetching the whole feed for
    // nothing.
    games.filter(g => !g.venueHtml && g.venueId).forEach(g => loadVenueInto(g, requestId));
    games.filter(g => g.state === 'Final' || !g.linescore || !g.weather)
      .forEach(g => loadGameSummaryExtrasInto(g, requestId));
  }

  function showGameSummaryModal(dateStr) {
    if (!currentScheduleTeam) return;
    const games = currentScheduleTeam.gamesByDate[dateStr];
    if (!games || !games.length) return;
    const teamName = TEAM_NICKNAMES[currentScheduleTeam.teamId] || '';
    const selectedAbbr = TEAM_ABBR[currentScheduleTeam.teamId] || teamName;
    const neutralGames = games.map(g => ({
      ...g,
      awayName: g.isHome ? g.opponentFull : teamName,
      homeName: g.isHome ? teamName : g.opponentFull,
      awayAbbr: g.isHome ? g.opponent : selectedAbbr,
      homeAbbr: g.isHome ? selectedAbbr : g.opponent
    }));
    openGameSummaryModal(dateStr, neutralGames, teamName);
  }
  // Scorecard tab's "Game Summary" link -- reuses the exact same modal as
  // the Daily/Schedule tabs, just fed the one game already loaded there
  // (with linescore attached, so the box score renders instantly instead
  // of needing the lazy fetch Final tiles from other tabs rely on).
  function showCurrentGameSummary() {
    if (!currentGameSummary) return;
    openGameSummaryModal(currentGameSummary.dateStr, [{ ...currentGameSummary, hideScorecardCta: true }]);
  }
  // Shared by every modal here whose hide function is just this one line
  // (hidePitchPopup is kept separate since it also resets extra state).
  function closeOverlay(overlay) {
    overlay.classList.remove('open');
  }
  function hideGameSummaryModal() {
    closeOverlay(gameSummaryOverlay);
  }

  function findBoxscorePlayer(boxscore, personId) {
    if (!boxscore || !boxscore.teams) return null;
    const away = (boxscore.teams.away && boxscore.teams.away.players) || {};
    const home = (boxscore.teams.home && boxscore.teams.home.players) || {};
    return away['ID' + personId] || home['ID' + personId] || null;
  }

  function buildPitcherStatLineParts(stats) {
    if (!stats) return [];
    const ip = stats.inningsPitched ?? '0.0';
    const r = stats.runs ?? 0;
    const k = stats.strikeOuts ?? 0;
    return [`${ip} IP`, `${r} R`, `${k} K`];
  }

  function buildBatterStatLineParts(stats) {
    if (!stats) return [];
    const parts = [];
    if (stats.atBats) parts.push(`${stats.hits ?? 0}-${stats.atBats}`);
    if (stats.doubles) parts.push(`${stats.doubles} 2B`);
    if (stats.triples) parts.push(`${stats.triples} 3B`);
    if (stats.homeRuns) parts.push(`${stats.homeRuns} HR`);
    if (stats.rbi) parts.push(`${stats.rbi} RBI`);
    return parts;
  }

  function renderStatLineParts(parts) {
    return parts.map(p => `<span class="potg-stat">${p}</span>`).join(', ');
  }

  function ordinalSuffix(n) {
    const j = n % 10, k = n % 100;
    if (j === 1 && k !== 11) return n + 'st';
    if (j === 2 && k !== 12) return n + 'nd';
    if (j === 3 && k !== 13) return n + 'rd';
    return n + 'th';
  }

  // includeHighlights skips the winProbability fetch and WPA leaderboard
  // math entirely for Live games -- their box score is still worth fetching
  // eagerly (see openGameSummaryModal), but WPA swings mid-game aren't a
  // "top play/players" verdict yet, so there's no point paying for that call.
  // Only cached when includeHighlights is true, i.e. the game is Final (see
  // loadGameSummaryExtrasInto) -- mirrors gameStatsCache/fetchGameStats: a
  // Final game's result never changes, so it's safe to skip refetching on a
  // repeat modal open, but a Live game's is deliberately fetched fresh every
  // time.
  const gameHighlightsCache = {};
  async function fetchGameHighlights(gamePk, includeHighlights) {
    if (includeHighlights && gameHighlightsCache[gamePk] !== undefined) return gameHighlightsCache[gamePk];
    try {
      const feedRes = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`);
      const feedData = await feedRes.json();
      const linescore = feedData.liveData && feedData.liveData.linescore;
      const weather = feedData.gameData && feedData.gameData.weather;
      // Fed to renderMonsterPanel by loadGameSummaryExtrasInto so a Live
      // game's box score there shows the same live count/baserunner band
      // the Scorecard tab's own bottom bar does, not just the box score.
      const allPlays = (feedData.liveData && feedData.liveData.plays && feedData.liveData.plays.allPlays) || [];
      if (!includeHighlights) return { leaders: [], playOfGame: null, linescore, weather, allPlays };

      const wpRes = await fetch(`https://statsapi.mlb.com/api/v1/game/${gamePk}/winProbability`);
      const wpData = await wpRes.json();
      const wp = Array.isArray(wpData) ? wpData : [];

      const personIndex = feedData.gameData && feedData.gameData.players;
      const totals = {};
      const credit = (person, role, amount) => {
        if (!person || person.id == null) return;
        const key = person.id + '-' + role;
        const t = totals[key] || (totals[key] = { id: person.id, name: person.fullName, lastName: lastNameOf(person, personIndex), role, wpa: 0 });
        t.wpa += amount;
      };
      let playOfGame = null;
      allPlays.forEach((play, i) => {
        const entry = wp[i];
        const homeAdded = entry && entry.homeTeamWinProbabilityAdded;
        if (homeAdded == null) return;
        const isTop = play.about && play.about.isTopInning;
        const battingWpa = isTop ? -homeAdded : homeAdded;
        credit(play.matchup && play.matchup.batter, 'batter', battingWpa);
        credit(play.matchup && play.matchup.pitcher, 'pitcher', -battingWpa);

        const description = (play.result && play.result.description) || '';
        const absWpa = Math.abs(homeAdded);
        if (description && (!playOfGame || absWpa > playOfGame.absWpa)) {
          const events = play.playEvents || [];
          const lastEvent = events[events.length - 1];
          const playId = lastEvent && lastEvent.playId;
          const inning = play.about && play.about.inning;
          playOfGame = {
            absWpa,
            description,
            inningLabel: inning ? `${isTop ? 'Top' : 'Bottom'} ${ordinalSuffix(inning)}` : '',
            videoUrl: savantVideoUrl(playId)
          };
        }
      });

      const boxscore = feedData.liveData && feedData.liveData.boxscore;
      const season = (feedData.gameData && feedData.gameData.datetime && feedData.gameData.datetime.officialDate || '').slice(0, 4);
      const leaders = Object.values(totals).sort((a, b) => b.wpa - a.wpa).slice(0, 3).map(p => {
        const boxPlayer = findBoxscorePlayer(boxscore, p.id);
        const stats = boxPlayer && boxPlayer.stats;
        const statParts = p.role === 'pitcher'
          ? buildPitcherStatLineParts(stats && stats.pitching)
          : buildBatterStatLineParts(stats && stats.batting);
        // Populate playerStore so the clickable name button works even if the
        // Scorecard tab (the usual source of these entries, see renderTeamTable)
        // was never opened for this game.
        const isAway = boxscore && boxscore.teams.away.players && boxscore.teams.away.players['ID' + p.id];
        const team = feedData.gameData && feedData.gameData.teams && feedData.gameData.teams[isAway ? 'away' : 'home'];
        playerStore[p.id] = {
          id: p.id,
          name: p.name,
          pos: (boxPlayer && boxPlayer.position && boxPlayer.position.abbreviation) || '',
          team: teamNickname(team),
          season,
          todayStats: (stats && (stats.batting || stats.pitching)) || {}
        };
        return { id: p.id, name: p.name, lastName: p.lastName, statLine: renderStatLineParts(statParts) };
      });
      const result = { leaders, playOfGame, linescore, weather, allPlays };
      if (includeHighlights) gameHighlightsCache[gamePk] = result;
      return result;
    } catch (e) {
      return { leaders: [], playOfGame: null, linescore: null, weather: null, allPlays: [] };
    }
  }

  function renderPlayOfGame(playOfGame) {
    if (!playOfGame) return '';
    const watchHtml = playOfGame.videoUrl
      ? `<a class="pog-watch" href="${playOfGame.videoUrl}" target="_blank" rel="noopener noreferrer">Watch &#9654;</a>`
      : '';
    return `
      <div class="pog-section">
        <div class="gs-game-label">Play of the Game</div>
        ${playOfGame.inningLabel ? `<div class="pog-inning">${playOfGame.inningLabel}</div>` : ''}
        <div class="pog-description">${playOfGame.description}</div>
        ${watchHtml}
      </div>`;
  }

  function renderPlayersOfTheGame(leaders) {
    if (!leaders.length) return '';
    const players = leaders.map(p => {
      return `
        <div class="potg-player">
          <img class="potg-headshot" src="${headshotUrl(p.id)}" alt="" loading="lazy" onerror="this.style.display='none'">
          <button type="button" class="player-name-btn potg-player-name" data-player-id="${p.id}" title="${p.name}">${p.lastName}</button>
          ${p.statLine ? `<div class="potg-stat-line">${p.statLine}</div>` : ''}
        </div>`;
    }).join('');
    return `
      <div class="potg-section">
        <div class="gs-game-label">Players of the Game</div>
        <div class="potg-players">${players}</div>
      </div>`;
  }

  function renderGameHighlights(playOfGame, leaders) {
    if (!playOfGame && !leaders.length) {
      return `<div class="pog-section"><div class="potg-loading">Highlights unavailable for this game.</div></div>`;
    }
    return renderPlayOfGame(playOfGame) + renderPlayersOfTheGame(leaders);
  }

  // getVenueInfo is cached by venue id, so this is cheap on repeat opens of
  // the same park -- swaps the name-only placeholder for the full name+city
  // once the detailed /v1/venues record resolves.
  async function loadVenueInto(game, requestId) {
    const venue = await getVenueInfo(game.venueId);
    if (requestId !== gameSummaryRequestId) return;
    const el = document.getElementById(`venue-${game.gamePk}`);
    if (el) el.outerHTML = renderVenueHeader(game.venueName, venue, game.gamePk, renderStateBadge(game));
  }

  async function loadGameSummaryExtrasInto(game, requestId) {
    const includeHighlights = game.state === 'Final';
    const { leaders, playOfGame, linescore, weather, allPlays } = await fetchGameHighlights(game.gamePk, includeHighlights);
    if (requestId !== gameSummaryRequestId) return;
    if (includeHighlights) {
      const wpaEl = document.getElementById(`wpaLeaders-${game.gamePk}`);
      if (wpaEl) wpaEl.outerHTML = renderGameHighlights(playOfGame, leaders);
    }
    if (!game.linescore) {
      const boxEl = document.getElementById(`boxScore-${game.gamePk}`);
      // innerHTML, not outerHTML -- boxEl itself carries the .gs-box-score
      // class that centers .monster-panel; replacing the whole element would
      // drop that wrapper along with the loading placeholder inside it.
      if (boxEl) {
        boxEl.innerHTML = linescore
          ? renderMonsterPanel(linescore, game.awayAbbr, game.homeAbbr, allPlays, game.state === 'Live' && hasGameStarted(allPlays))
          : '';
      }
    }
    if (!game.weather) {
      const weatherEl = document.getElementById(`weather-${game.gamePk}`);
      if (weatherEl) weatherEl.outerHTML = renderWeatherLine(weather);
    }
  }

  scheduleTeamSelect.addEventListener('change', () => {
    const teamId = scheduleTeamSelect.value;
    try { localStorage.setItem(SCHEDULE_TEAM_KEY, teamId); } catch (e) {}
    loadTeamSchedule(teamId);
  });
  scheduleBody.addEventListener('click', (e) => {
    const cell = e.target.closest('.calendar-day.is-game');
    if (cell) showGameSummaryModal(cell.dataset.date);
  });
  scheduleBody.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const cell = e.target.closest('.calendar-day.is-game');
    if (cell) { e.preventDefault(); showGameSummaryModal(cell.dataset.date); }
  });
  gameSummaryModalBody.addEventListener('click', (e) => {
    const btn = e.target.closest('.modal-cta');
    if (btn) jumpToScorecardGame(btn.dataset.date, btn.dataset.gamePk);
  });
  gameSummaryClose.addEventListener('click', hideGameSummaryModal);
  gameSummaryOverlay.addEventListener('click', (e) => {
    if (e.target === gameSummaryOverlay) hideGameSummaryModal();
  });

  // Shared by the strip and the all-games modal below -- both build the
  // same renderDailyGameTile input from a raw schedule-API game object.
  function scheduleGameToTileGame(g) {
    return {
      gamePk: g.gamePk,
      awayName: teamNickname(g.teams.away.team),
      homeName: teamNickname(g.teams.home.team),
      awayId: g.teams.away.team && g.teams.away.team.id,
      homeId: g.teams.home.team && g.teams.home.team.id,
      awayScore: g.teams.away.score,
      homeScore: g.teams.home.score,
      state: g.status.abstractGameState,
      detailedState: g.status.detailedState,
      gameDate: g.gameDate,
      inningState: (g.linescore || {}).inningState,
      inningOrdinal: (g.linescore || {}).currentInningOrdinal
    };
  }

  // Mirrors the Daily tab's tiles (same renderDailyGameTile) so a game's
  // state/score reads the same way in both places, just laid out as a
  // horizontal strip next to the date picker instead of a grid -- and, below
  // 699px (see .game-strip's CSS), showing only the .is-current tile since
  // there's no room for the full row.
  function renderGameStrip(dateStr, games) {
    gameStrip.innerHTML = games.map(g => renderDailyGameTile(dateStr, scheduleGameToTileGame(g),
      String(g.gamePk) === String(currentGamePk) ? 'is-current' : '')).join('');
    updateGameStripFade();
  }

  // Toggles the edge fade (see .game-strip::before/::after) on and off
  // depending on whether there's actually more strip to reveal in that
  // direction -- a fade implying scrollable content that isn't there (a
  // short list, or the mobile single-tile layout with no overflow at all)
  // would be more confusing than the hard edge it's meant to soften.
  function updateGameStripFade() {
    const maxScroll = gameStrip.scrollWidth - gameStrip.clientWidth;
    gameStripWrap.classList.toggle('has-scroll-left', gameStrip.scrollLeft > 1);
    gameStripWrap.classList.toggle('has-scroll-right', gameStrip.scrollLeft < maxScroll - 1);
  }

  function showGameStripModal(dateStr, games) {
    gameStripOverlayBody.innerHTML = `<div class="pitch-header">${formatShortDate(dateStr)} Games</div>
      <div class="daily-games-grid">${games.map(g => renderDailyGameTile(dateStr, scheduleGameToTileGame(g))).join('')}</div>`;
    gameStripOverlay.classList.add('open');
  }
  function hideGameStripModal() {
    closeOverlay(gameStripOverlay);
  }

  async function loadSchedule(dateStr, preferredGamePk) {
    gameStrip.innerHTML = '';
    body.innerHTML = '<div class="mlb-status-msg">Fetching schedule for ' + dateStr + '&#8230;</div>';
    scoreBottomBar.innerHTML = '';
    sidebarMonsterPanel.innerHTML = '';
    updateAtBatTrackers(null);
    clearInterval(pollTimer);
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${dateStr}&hydrate=linescore`);
      const data = await res.json();
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      if (!games.length) {
        body.innerHTML = '<div class="mlb-status-msg">No MLB games scheduled on this date.</div>';
        return;
      }
      scheduleGames = games;

      const preferred = preferredGamePk && games.find(g => String(g.gamePk) === String(preferredGamePk));
      const liveGame = games.find(g => g.status.abstractGameState === 'Live');
      const chosen = preferred ? preferred.gamePk : (liveGame ? liveGame.gamePk : games[0].gamePk);
      currentGamePk = chosen;
      renderGameStrip(dateStr, games);
      loadGame(chosen);
    } catch (e) {
      body.innerHTML = apiErrorMsg('schedule');
    }
  }

  async function loadGame(gamePk) {
    clearInterval(pollTimer);
    await fetchAndRender(gamePk);
  }

  async function loadStandings(dateStr) {
    standingsBody.innerHTML = '<div class="mlb-status-msg">Loading standings&#8230;</div>';
    try {
      const season = dateStr.slice(0, 4);
      if (standingsView === 'homeruns') {
        const leaders = await getHrLeaders(season, dateStr);
        standingsBody.innerHTML = `<div class="sheet">${renderHrLeaderboard(leaders, season)}</div>`;
        return;
      }
      const records = await getStandings(season, dateStr);
      const content = standingsView === 'wildcard'
        ? renderWildcardContent(records)
        : renderStandingsContent(records);
      standingsBody.innerHTML = `<div class="sheet">${content}</div>`;
    } catch (e) {
      standingsBody.innerHTML = apiErrorMsg('standings');
    }
  }

  // Bumped on every call so a stale call (an older poll tick, or a poll for
  // a game the user has since switched away from -- clearInterval only ever
  // stops *future* ticks, not one already in flight) can tell it's no longer
  // the latest before it commits anything. Checked once, right before the
  // point where results start getting written to shared state / the DOM --
  // see the guard below, mirroring the requestId pattern already used by
  // loadDailySummary / openGameSummaryModal / player search & profile.
  let fetchAndRenderRequestId = 0;
  async function fetchAndRender(gamePk) {
    const requestId = ++fetchAndRenderRequestId;
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`);
      const data = await res.json();
      const gameData = data.gameData;
      const liveData = data.liveData;
      const linescore = liveData.linescore;
      const awayName = gameData.teams.away.name;
      const homeName = gameData.teams.home.name;
      const state = gameData.status.abstractGameState;
      const detailedState = gameData.status.detailedState;
      const allPlays = (liveData.plays && liveData.plays.allPlays) || [];
      const personIndex = gameData.players || {};
      // Started here (not awaited yet) so it resolves in parallel with all
      // the synchronous work below and the bullpen fetches -- it's cached by
      // venue id and doesn't feed into anything else in this function, so
      // there's no reason to block on it this early.
      const venuePromise = getVenueInfo(gameData.venue && gameData.venue.id);

      const numInnings = Math.max((linescore.innings || []).length, 9);
      const away = buildTeamRows(liveData.boxscore.teams.away, 'top', allPlays, personIndex);
      const home = buildTeamRows(liveData.boxscore.teams.home, 'bottom', allPlays, personIndex);
      const awayRows = away.rows, homeRows = home.rows;

      // if the batting order turns over within an inning, some rows will
      // have two cells for that inning number -- give that inning an extra
      // column, applied to BOTH teams' tables so they stay aligned even
      // though only one side actually used the extra column
      const columnsPerInning = {};
      const allRows = [...awayRows, ...homeRows];
      for (let i = 1; i <= numInnings; i++) {
        let max = 1;
        allRows.forEach(r => {
          const len = (r.cells[i] || []).length;
          if (len > max) max = len;
        });
        columnsPerInning[i] = max;
      }

      // find whoever's up next so we can show a live placeholder diamond
      // even before this at-bat's result exists. Position (team/inning/
      // slot) is derived structurally from each team's own last completed
      // plate appearance rather than from linescore.offense.batter --
      // that field goes stale/empty right at a half-inning handoff (the
      // live-strip badge above works around the same gap by blanking
      // "offense" once outs >= 3), which is exactly the moment we most
      // want the next half's leadoff hitter to already show as on deck.
      // linescore.offense is still consulted, when it's actually in sync,
      // to know whether the at-bat has real pitch data yet (for the dot).
      // Before any pitch exists, this is just a structural guess at who's
      // on deck -- stays gated to columns already needed by completed
      // at-bats, so a transient state (e.g. during a mound visit) can't
      // briefly force a column open and then collapse it again. Once a real
      // pitch has actually been thrown, though, it's no longer a guess, and
      // columnsPerInning IS expanded for it below -- otherwise a lineup
      // turning over mid-inning would hide the live dot for anyone's second
      // at-bat until the inning's earlier at-bats happened to complete and
      // establish that column first.
      // MLB flips abstractGameState to 'Live' (and sets linescore.currentInning)
      // once pre-game warmup starts, well before first pitch -- state === 'Live'
      // alone isn't "the game has started." Require at least one real pitch
      // to exist anywhere in the game first, or the on-deck diamond shows up
      // for the leadoff batter during warmup with nothing behind it yet.
      const gameHasStarted = hasGameStarted(allPlays);
      let liveBatterInfo = null;
      if (gameHasStarted && state === 'Live' && linescore.currentInning) {
        // linescore.currentInning/inningHalf are a separately-updated summary
        // field that can lag behind allPlays right at a half-inning handoff
        // (the same staleness the comment below already calls out for
        // linescore.offense.batter) -- if it lags long enough, this whole
        // block computes for the half-inning that just ended and never
        // finds the batter who's actually live, so no placeholder (or pitch
        // dot) shows for that at-bat at all until it completes and the
        // normal completed-play path in buildTeamRows picks it up by reading
        // about.inning/about.halfInning straight off the play itself.
        // allPlays doesn't have that lag -- the new half's leadoff play
        // object appears there the instant it exists -- so prefer deriving
        // effInning/effHalf from allPlays' own last entry, and only fall
        // back to linescore's outs>=3 flip for the brief window between the
        // 3rd out and that new play object existing.
        const lastPlay = allPlays[allPlays.length - 1];
        let effInning = linescore.currentInning;
        let effHalf = (linescore.inningHalf || 'Top').toLowerCase();
        if (lastPlay && lastPlay.about && typeof lastPlay.about.inning === 'number') {
          effInning = lastPlay.about.inning;
          effHalf = lastPlay.about.isTopInning ? 'top' : 'bottom';
        }
        if (!lastPlay || (lastPlay.about && lastPlay.about.isComplete)) {
          if ((linescore.outs ?? 0) >= 3) {
            if (effHalf === 'top') effHalf = 'bottom';
            else { effHalf = 'top'; effInning += 1; }
          }
        }
        const battingTeam = effHalf === 'top' ? 'away' : 'home';
        const battingRows = battingTeam === 'away' ? awayRows : homeRows;

        let lastRow = null, lastOrder = -1;
        battingRows.forEach(row => {
          Object.values(row.cells).forEach(cellArr => (cellArr || []).forEach(c => {
            if (c.order > lastOrder) { lastOrder = c.order; lastRow = row; }
          }));
        });
        const nextSlot = lastRow ? (lastRow.slot % battingRows.length) + 1 : 1;
        const nextRow = battingRows.find(r => r.slot === nextSlot) || battingRows[0];

        if (nextRow) {
          const slotIndex = (nextRow.cells[effInning] || []).length;
          const nextRowPlayerIds = new Set(nextRow.players.map(p => p.id));
          // the batter's own in-progress plate appearance, found by
          // identity rather than by trusting it's the last item in
          // allPlays -- an interruption (mound visit, batter timeout,
          // defensive substitution, etc.) can land its own entry after
          // it, sharing the same matchup.batter and sometimes even
          // isComplete: false, and that must not make the live dot
          // disappear mid-at-bat. Picked out structurally -- the most
          // recent same-batter candidate that actually has pitch data --
          // rather than by recognizing the interruption's description
          // text (NON_RESULT_EVENT_RE/GENUINE_PAUSE_RE): a pause type MLB
          // logs with wording those lists don't happen to cover would
          // otherwise get treated as the live play itself and wipe out
          // the real at-bat's pitch history, which is the actual bug this
          // guards against.
          const liveCandidates = allPlays.filter(p =>
            p.about && p.about.isComplete === false &&
            p.matchup && p.matchup.batter && nextRowPlayerIds.has(p.matchup.batter.id)
          );
          let livePlay = null;
          for (let idx = liveCandidates.length - 1; idx >= 0; idx--) {
            if (extractPitches(liveCandidates[idx]).length) { livePlay = liveCandidates[idx]; break; }
          }
          // No candidate has thrown a pitch yet -- either truly on-deck,
          // or paused before its first pitch. Fall back to the most
          // recent candidate so a pause starting before ball one still
          // has something to report.
          if (!livePlay) livePlay = liveCandidates[liveCandidates.length - 1] || null;
          // Any same-batter candidate riding along after livePlay is a
          // pause logged as its own trailing entry -- name it if its text
          // matches a known pause term, otherwise fall back to a generic
          // label so the pause still shows rather than silently doing
          // nothing (the pitches staying put is what actually matters).
          const trailingPause = livePlay && liveCandidates[liveCandidates.length - 1] !== livePlay
            ? liveCandidates[liveCandidates.length - 1] : null;
          const trailingPauseText = trailingPause
            ? ((trailingPause.result && trailingPause.result.event && GENUINE_PAUSE_RE.test(trailingPause.result.event) && trailingPause.result.event)
              || 'Play paused')
            : null;
          const livePitches = livePlay ? extractPitches(livePlay) : [];
          if (livePitches.length && slotIndex >= (columnsPerInning[effInning] || 1)) {
            columnsPerInning[effInning] = slotIndex + 1;
          }
          if (slotIndex < (columnsPerInning[effInning] || 1)) {
            const feedBatter = linescore.offense && linescore.offense.batter;
            const isFeedMatch = feedBatter && nextRowPlayerIds.has(feedBatter.id);
            liveBatterInfo = {
              team: battingTeam, rowSlot: nextRow.slot, inning: effInning, slotIndex,
              pitches: livePitches,
              events: livePlay ? extractEvents(livePlay) : [],
              ...(livePlay ? extractHandedness(livePlay) : { batSide: null, pitchHand: null }),
              currentInterruption: livePlay
                ? (currentInterruption(livePlay) || trailingPauseText)
                : null,
              batterName: (isFeedMatch && feedBatter.fullName) || nextRow.players[nextRow.players.length - 1].name,
              pitcherFullName: (linescore.defense && linescore.defense.pitcher && linescore.defense.pitcher.fullName) || ''
            };
          }
        }
      }
      // Matches the pkey format renderTeamTable/buildTeamRows' cell loop
      // stamps onto pitchStore for this exact liveBatterInfo cell (see
      // isLiveCell there) -- computed independently here, from the same
      // liveBatterInfo fields, rather than threaded back out of that render
      // call, so the wide-screen sidebar (see updateAtBatTrackers below) can
      // look the live at-bat up in pitchStore right after body.innerHTML
      // populates it.
      const livePkey = liveBatterInfo
        ? `${liveBatterInfo.team === 'away' ? awayName : homeName}-${liveBatterInfo.rowSlot}-${liveBatterInfo.inning}-${liveBatterInfo.slotIndex}`
        : null;

      // away.starterPitcherId is the pitcher who faced the away batters --
      // i.e. the HOME team's starter -- and belongs under the away
      // scorecard; home.starterPitcherId is the AWAY team's starter and
      // belongs under the home scorecard
      function pitcherCardFor(pitcherId, oppositeSideBoxscore) {
        if (!pitcherId) return '';
        const p = oppositeSideBoxscore.players && oppositeSideBoxscore.players['ID' + pitcherId];
        if (!p) return '';
        return renderPitcherCard(p.person && p.person.fullName, p.stats && p.stats.pitching);
      }
      const homePitcherCard = pitcherCardFor(away.starterPitcherId, liveData.boxscore.teams.home);
      const awayPitcherCard = pitcherCardFor(home.starterPitcherId, liveData.boxscore.teams.away);

      // bullpen: every pitcher who isn't today's starter, with pitch counts
      // from the prior two days for fatigue context. The two sides don't
      // depend on each other, so fetch them together rather than back to
      // back -- this also shortens the window in which a newer poll/game
      // switch can race past this call (see the requestId guard below).
      const season = gameData.game.season;
      const officialDate = gameData.datetime.officialDate;
      // away/home.starterPitcherId come from the play-by-play (see
      // buildTeamRows) and stay null until that side's starter has actually
      // thrown a completed at-bat -- which for a preview game, or the very
      // first batter of a game in progress, hasn't happened yet. Falling
      // back to the scheduled probable pitcher keeps the bullpen list's "P"
      // marker (see bullpenRowsHtml) from silently disappearing during that
      // window instead of just being missing until the game gets going.
      const probable = gameData.probablePitchers || {};
      const homeStarterId = away.starterPitcherId || (probable.home && probable.home.id);
      const awayStarterId = home.starterPitcherId || (probable.away && probable.away.id);
      const [venue, homeBullpen, awayBullpen] = await Promise.all([
        venuePromise,
        buildBullpenList(liveData.boxscore.teams.home, homeStarterId, season, officialDate, allPlays, 'top'),
        buildBullpenList(liveData.boxscore.teams.away, awayStarterId, season, officialDate, allPlays, 'bottom')
      ]);

      // Everything above this point is local computation from this call's
      // own fetch; nothing has touched shared state or the DOM yet. Bail
      // here if a newer call (a later poll tick, or the user switching
      // games/dates) has since started -- otherwise a slow, now-stale
      // response could still overwrite what the newer call already
      // rendered. See fetchAndRenderRequestId.
      if (requestId !== fetchAndRenderRequestId) return;

      pitchStore = {};
      // Team names for the challenge-outcome text in the pitch popup, keyed
      // by team id (play.reviewDetails.challengeTeamId) -- see extractPitches.
      absChallengeInfo = {
        [gameData.teams.away.id]: gameData.teams.away.locationName || teamNickname(gameData.teams.away),
        [gameData.teams.home.id]: gameData.teams.home.locationName || teamNickname(gameData.teams.home)
      };

      // A starter's battingOrder is a clean multiple of 100 (100, 200, ...);
      // a substitute who enters for that slot gets that slot's number plus
      // 1, 2, etc. (101, 102, ...), so an entered bench player still reads
      // as "not a starter" while gaining a battingOrder -- kept in the
      // Bench section (rather than only showing up as a substitute line
      // under the original starter in the scorecard grid) and flagged with
      // `entered` so the roster modal can tag them instead of dropping them.
      function getBenchPlayers(sideBoxscore, teamName) {
        return Object.values(sideBoxscore.players || {})
          .filter(p => p.person && p.position && p.position.abbreviation !== 'P'
            && (!p.battingOrder || parseInt(p.battingOrder) % 100 !== 0))
          .map(p => {
            // Bench players who never entered the game have no batting row
            // in renderTeamTable to populate playerStore for them, so the
            // roster modal's name button would silently do nothing without
            // this -- see showPlayerModal's playerStore lookup.
            playerStore[p.person.id] = { id: p.person.id, name: p.person.fullName, pos: p.position.abbreviation, team: teamName, season, todayStats: (p.stats && p.stats.batting) || {} };
            return { id: p.person.id, name: p.person.fullName, pos: p.position.abbreviation, entered: !!p.battingOrder };
          })
          // entered substitutes float to the top, same as relievers who've
          // entered sort above the rest of the bullpen in buildBullpenList
          .sort((a, b) => (b.entered ? 1 : 0) - (a.entered ? 1 : 0));
      }
      // buildBullpenList's own results don't touch playerStore either --
      // pitchers who only pitched (never batted) have no batting row in
      // renderTeamTable to populate it, same gap as the bench players above.
      awayBullpen.forEach(p => { playerStore[p.id] = { id: p.id, name: p.name, pos: 'P', team: awayName, season, todayStats: {} }; });
      homeBullpen.forEach(p => { playerStore[p.id] = { id: p.id, name: p.name, pos: 'P', team: homeName, season, todayStats: {} }; });
      rosterStore[awayName] = renderRosterContent(awayName, awayBullpen, awayRows, getBenchPlayers(liveData.boxscore.teams.away, awayName));
      rosterStore[homeName] = renderRosterContent(homeName, homeBullpen, homeRows, getBenchPlayers(liveData.boxscore.teams.home, homeName));
      sprayStore[awayName] = renderSprayChart(away.battedBalls, awayName);
      sprayStore[homeName] = renderSprayChart(home.battedBalls, homeName);

      // Text for the always-visible compact score strip. The venue header,
      // inning-by-inning box score, and top-play highlights all live in the
      // game summary modal (opened via the "Game Summary" link) instead of
      // here, so the scorecard grid keeps the viewport.
      const awayAbbr = (gameData.teams.away.abbreviation) || awayName;
      const homeAbbr = (gameData.teams.home.abbreviation) || homeName;
      let compactStateHtml = '';
      let monsterPanelHtml = '';
      let subLineHtml = '';
      // MLB flips abstractGameState to 'Live' during pre-game warmup, well
      // ahead of first pitch -- gameHasStarted (at least one real pitch
      // thrown anywhere in the game) is what actually distinguishes "in
      // progress" from "warming up," since linescore.currentInning/outs/etc.
      // are already populated with placeholder-ish values during warmup and
      // would otherwise render as a fabricated live count.
      if ((state === 'Live' && gameHasStarted) || state === 'Final') {
        // No compactStateHtml here (unlike the preview branch below) and no
        // run numbers in the strip either -- see showRunsInStrip -- since
        // the monster-panel below now covers the score, inning state, and
        // baserunners in more detail than the old compact strip did. This
        // now also covers Final -- the panel stays up instead of the whole
        // scoreboard being replaced by the plain strip once the game ends,
        // just with its live count/baserunner row collapsed (see
        // renderMonsterPanel/is-hidden).
        monsterPanelHtml = renderMonsterPanel(linescore, awayAbbr, homeAbbr, allPlays, state === 'Live');
      } else {
        const startTime = gameData.datetime && gameData.datetime.dateTime ? new Date(gameData.datetime.dateTime) : null;
        compactStateHtml = detailedState;
        subLineHtml = startTime
          ? 'First pitch: ' + startTime.toLocaleString(undefined, {hour:'numeric', minute:'2-digit', month:'short', day:'numeric'})
          : '';
      }

      const showRuns = state === 'Live' || state === 'Final';
      const awayRuns = (linescore.teams && linescore.teams.away && linescore.teams.away.runs) ?? 0;
      const homeRuns = (linescore.teams && linescore.teams.home && linescore.teams.home.runs) ?? 0;
      // scoreStripHtml only ever renders now for the preview (game hasn't
      // started) branch above -- Live and Final both take the monster-panel
      // path instead (see monsterPanelHtml below), so there's no score
      // to show here and no team abbreviations either, just the detailed
      // status and first-pitch time. The Game Summary link itself lives in
      // the tab's controls bar now (#gameSummaryTopBtn, next to the game
      // picker) rather than down here, so it doesn't need to be rebuilt
      // per-state.
      const scoreStripHtml = `
        <span class="score-strip-teams">${awayAbbr} @ ${homeAbbr}</span>
        ${compactStateHtml ? `<span class="score-strip-state">${compactStateHtml}</span>` : ''}
      `;

      // Fed to showCurrentGameSummary() when the link above is clicked --
      // reuses the exact same modal the Daily/Schedule tabs open, just with
      // this game's linescore and allPlays already attached so its own
      // monster-panel (see renderGameSummaryGame) renders instantly instead
      // of needing the lazy fetch those tabs rely on.
      currentGameSummary = {
        gamePk,
        dateStr: officialDate,
        awayName, homeName,
        awayAbbr, homeAbbr,
        awayScore: showRuns ? awayRuns : null,
        homeScore: showRuns ? homeRuns : null,
        state, detailedState,
        gameDate: gameData.datetime && gameData.datetime.dateTime,
        linescore: showRuns ? linescore : null,
        allPlays: showRuns ? allPlays : null,
        weather: gameData.weather || null,
        venueHtml: renderVenueHeader(gameData.venue && gameData.venue.name, venue, undefined, renderStateBadge({ state, detailedState }))
      };

      // preserve horizontal scroll position of each team's innings grid --
      // the rebuild below replaces the whole subtree, which would otherwise
      // snap every table-scroll back to scrollLeft 0 on each poll
      const scrollLefts = Array.from(body.querySelectorAll('.table-scroll')).map(el => el.scrollLeft);

      // Lives in the fixed bottom bar (#scoreBottomBar) below the wide
      // breakpoint, not in .sheet -- see .score-bottom-bar for why -- and in
      // #sidebarMonsterPanel (the same markup, just also written into the
      // wide-screen sidebar's top slot) above it. Live and Final both show
      // just the monster-panel, centered -- no strip, no At Bat/Pitching
      // line, no Previous Batter, no Game Summary button (that's up in the
      // controls bar now). Only the preview state (game hasn't started)
      // still uses the original top-strip layout, since there's no panel
      // there to replace it.
      const scoreBarHtml = monsterPanelHtml ? monsterPanelHtml : `
        <div class="score-strip">${scoreStripHtml}</div>
        ${subLineHtml ? `<div class="score-strip-sub">${subLineHtml}</div>` : ''}
      `;
      scoreBottomBar.innerHTML = scoreBarHtml;
      sidebarMonsterPanel.innerHTML = scoreBarHtml;

      body.innerHTML = `
        <div class="sheet">
          ${renderTeamTable(awayName, awayRows.length ? awayRows : placeholderLineupRows(), numInnings, away.pitcherByInning, away.starterPitcherId, columnsPerInning, homePitcherCard, 'away', liveBatterInfo, season)}
          ${renderTeamTable(homeName, homeRows.length ? homeRows : placeholderLineupRows(), numInnings, home.pitcherByInning, home.starterPitcherId, columnsPerInning, awayPitcherCard, 'home', liveBatterInfo, season)}
        </div>
        <div class="footnote">Source: MLB Stats API &#183; updated ${new Date().toLocaleTimeString()}</div>
      `;

      body.querySelectorAll('.table-scroll').forEach((el, i) => {
        if (scrollLefts[i]) el.scrollLeft = scrollLefts[i];
      });

      // The wide-screen sidebar's own live-at-bat tracker -- livePkey was
      // computed above from liveBatterInfo, and is only now safe to look up
      // in pitchStore since the renderTeamTable calls just above are what
      // populate it (see the isLiveCell branch in that cell-building loop).
      updateAtBatTrackers(livePkey);

      clearInterval(pollTimer);
      if (state === 'Live') pollTimer = setInterval(() => fetchAndRender(gamePk), 7000);

      // if the pitch modal is currently open, refresh it in place with the
      // freshly-rebuilt pitchStore rather than leaving it showing stale data.
      // The same pkey naturally carries through from a live at-bat to its
      // completed cell once the plate appearance resolves, since both are
      // keyed by team/slot/inning/sub-column rather than by play instance.
      if (currentOpenPkey && pitchOverlay.classList.contains('open')) {
        if (pitchStore[currentOpenPkey]) showPitchPopup(currentOpenPkey);
        else hidePitchPopup();
      }
    } catch (e) {
      if (requestId !== fetchAndRenderRequestId) return;
      body.innerHTML = apiErrorMsg('game data');
      scoreBottomBar.innerHTML = '';
      sidebarMonsterPanel.innerHTML = '';
      updateAtBatTrackers(null);
    }
  }

  dateInput.addEventListener('change', () => {
    renderDateText(dateInputText, dateInput.value);
    loadSchedule(dateInput.value);
  });
  document.getElementById('datePrev').addEventListener('click', () => {
    setDateInputValue(dateInput, dateInputText, addDays(dateInput.value, -1));
    loadSchedule(dateInput.value);
  });
  document.getElementById('dateNext').addEventListener('click', () => {
    setDateInputValue(dateInput, dateInputText, addDays(dateInput.value, 1));
    loadSchedule(dateInput.value);
  });
  function selectGame(gamePk) {
    if (!gamePk || gamePk === String(currentGamePk)) return;
    currentGamePk = gamePk;
    renderGameStrip(dateInput.value, scheduleGames);
    // Blank the old game's scorecard immediately on click rather than
    // leaving it on screen until the new one's fetch resolves -- a fast
    // load just flashes blank for a moment, but a slow one makes it clear
    // right away that something new is loading instead of leaving the
    // previous game's grid sitting there looking current.
    body.innerHTML = '';
    scoreBottomBar.innerHTML = '';
    sidebarMonsterPanel.innerHTML = '';
    updateAtBatTrackers(null);
    loadGame(gamePk);
  }
  // Below 699px (see .game-strip's CSS) the strip shows only the current
  // game -- clicking that one tile can't "select" it (it's already
  // current), so treat that specific tap as opening the all-games modal
  // instead, rather than keeping a separate "Games" button around just for
  // that. Desktop still shows every tile, where a click always picks one.
  function handleGameStripTileActivate(tile) {
    if (!tile) return;
    const gamePk = tile.dataset.gamePk;
    if (gamePk === String(currentGamePk) && window.matchMedia('(max-width: 699px)').matches) {
      showGameStripModal(dateInput.value, scheduleGames);
      return;
    }
    selectGame(gamePk);
  }
  gameStrip.addEventListener('scroll', updateGameStripFade, { passive: true });
  window.addEventListener('resize', updateGameStripFade);
  gameStrip.addEventListener('click', (e) => {
    handleGameStripTileActivate(e.target.closest('.daily-tile'));
  });
  gameStrip.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tile = e.target.closest('.daily-tile');
    if (tile) e.preventDefault();
    handleGameStripTileActivate(tile);
  });
  gameStripOverlayBody.addEventListener('click', (e) => {
    const tile = e.target.closest('.daily-tile');
    if (!tile) return;
    selectGame(tile.dataset.gamePk);
    hideGameStripModal();
  });
  gameStripOverlayBody.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tile = e.target.closest('.daily-tile');
    if (!tile) return;
    e.preventDefault();
    selectGame(tile.dataset.gamePk);
    hideGameStripModal();
  });
  gameStripOverlayClose.addEventListener('click', hideGameStripModal);
  gameStripOverlay.addEventListener('click', (e) => {
    if (e.target === gameStripOverlay) hideGameStripModal();
  });

  standingsDateInput.addEventListener('change', () => {
    standingsDateInputText.textContent = formatShortDate(standingsDateInput.value);
    loadStandings(standingsDateInput.value);
  });
  document.getElementById('standingsDatePrev').addEventListener('click', () => {
    setDateInputValue(standingsDateInput, standingsDateInputText, addDays(standingsDateInput.value, -1));
    loadStandings(standingsDateInput.value);
  });
  document.getElementById('standingsDateNext').addEventListener('click', () => {
    setDateInputValue(standingsDateInput, standingsDateInputText, addDays(standingsDateInput.value, 1));
    loadStandings(standingsDateInput.value);
  });

  document.getElementById('standingsViewToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.view-toggle-btn');
    if (!btn || btn.dataset.view === standingsView) return;
    standingsView = btn.dataset.view;
    document.querySelectorAll('#standingsViewToggle .view-toggle-btn')
      .forEach(b => b.classList.toggle('active', b === btn));
    loadStandings(standingsDateInput.value);
  });

  const pitchOverlay = document.getElementById('pitchOverlay');
  let currentOpenPkey = null;
