  // chart, recent and upcoming games), Schedule (the month calendars),
  // Roster and Stats. The team and season pickers are browsing and
  // aren't saved; the tab opens on the user's team and the latest season.
  const teamTabSelect = document.getElementById('teamTabPick');
  const teamYearSelect = document.getElementById('teamYearPick');
  const teamViewToggle = document.getElementById('teamViewToggle');
  const teamBody = document.getElementById('teamBody');
  const teamTab = { teamId: null, season: null, latestSeason: null, view: 'overview', rosterView: 'depth', ranksScope: 'league' };
  let teamRequestId = 0;
  const teamRosterCache = {};
  const teamInjuryCache = {};

  // rosterType 'fullSeason' with a season is everyone who played for the
  // team that year; the other types only exist for the current roster.
  async function fetchTeamRoster(teamId, rosterType, season) {
    const key = `${teamId}-${rosterType}-${season || ''}`;
    if (teamRosterCache[key]) return teamRosterCache[key];
    try {
      const url = `https://statsapi.mlb.com/api/v1/teams/${teamId}/roster?rosterType=${rosterType}${season ? `&season=${season}` : ''}&hydrate=person`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const roster = (data.roster || []).map(r => ({
        id: r.person && r.person.id,
        name: r.person && r.person.fullName,
        jersey: r.jerseyNumber || '',
        posAbbr: (r.position && r.position.abbreviation) || '',
        posType: (r.position && r.position.type) || 'Other',
        statusDesc: (r.status && r.status.description) || '',
        bats: (r.person && r.person.batSide && r.person.batSide.code) || '',
        throws: (r.person && r.person.pitchHand && r.person.pitchHand.code) || '',
        birthDate: (r.person && r.person.birthDate) || ''
      }));
      teamRosterCache[key] = roster;
      return roster;
    } catch (e) {
      return null;
    }
  }

  async function fetchTeamInjuryDetails(teamId) {
    if (teamInjuryCache[teamId]) return teamInjuryCache[teamId];
    try {
      const end = todayStr();
      const start = addDays(end, -180);
      const url = `https://statsapi.mlb.com/api/v1/transactions?teamId=${teamId}&startDate=${start}&endDate=${end}`;
      const res = await fetch(url);
      const data = await res.json();
      const txns = data.transactions || [];
      const byPlayer = {};
      txns.forEach(t => {
        const pid = t.person && t.person.id;
        const desc = t.description || '';
        if (!pid || !/injured list/i.test(desc)) return;
        const prev = byPlayer[pid];
        if (!prev || t.date > prev.date) byPlayer[pid] = { date: t.date, description: desc };
      });
      teamInjuryCache[teamId] = byPlayer;
      return byPlayer;
    } catch (e) {
      teamInjuryCache[teamId] = {};
      return {};
    }
  }

  // Every player's line for this team alone (a traded player's other
  // club's numbers stay out). A season in progress is kept five minutes.
  const teamPlayerStatsCache = {};
  async function getTeamPlayerStats(teamId, season, group) {
    const key = `${teamId}-${season}-${group}`;
    const cached = teamPlayerStatsCache[key];
    if (cached && (Number(season) < new Date().getFullYear() || Date.now() - cached.at < SCHEDULE_LIVE_TTL_MS)) return cached.rows;
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/stats?stats=season&group=${group}&teamId=${teamId}&season=${season}&sportId=1&playerPool=ALL&limit=200`);
      if (!res.ok) return null;
      const data = await res.json();
      const rows = ((data.stats && data.stats[0] && data.stats[0].splits) || [])
        .filter(s => s.player && s.player.id != null)
        .map(s => ({ id: s.player.id, name: s.player.fullName || '', pos: (s.position && s.position.abbreviation) || '', stat: s.stat || {} }));
      teamPlayerStatsCache[key] = { rows, at: Date.now() };
      return rows;
    } catch (e) {
      return null;
    }
  }

  async function getTeamSeasonRecord(teamId, season) {
    const status = await standingsSeasonStatus(season);
    const records = await getStandings(season, status.asOf);
    for (const div of records) {
      const rec = (div.teamRecords || []).find(t => t.team && t.team.id === Number(teamId));
      if (rec) {
        const leagueId = div.league && div.league.id;
        const leagueTeamIds = records.filter(d => d.league && d.league.id === leagueId).flatMap(d => (d.teamRecords || []).map(t => t.team.id));
        return { rec, divisionId: div.division && div.division.id, division: div.teamRecords, leagueId, leagueTeamIds, final: status.final };
      }
    }
    return null;
  }

  // How the team's October went, as far as the head says it: a title, a
  // pennant, or the series it's playing now. An exit says nothing -- null,
  // as for a team that didn't make it (or a failed lookup).
  async function getTeamPostseasonResult(teamId, season) {
    const raw = await getPostseasonSeries(season);
    if (!raw) return null;
    const id = Number(teamId);
    const round = sr => 'FDLW'.indexOf(sr.id[0]);
    const mine = raw.map(buildPostseasonSeries)
      .filter(sr => sr && sr.teams.some(t => t && t.id === id))
      .sort((a, b) => round(b) - round(a));
    if (!mine.length) return null;
    const last = mine[0];
    const name = last.title.replace(/ Division Series$/, 'DS').replace(/ Championship Series$/, 'CS');
    if (last.id === 'W_1' && last.winnerId) return last.winnerId === id ? { champion: true } : { pennant: true };
    return last.winnerId ? null : { text: `In ${name}` };
  }

  // The quick-look popup reads a name's details from playerStore; an entry
  // a game already wrote (with that day's line) is left alone.
  function storeTeamPlayer(id, name, pos, teamId, season) {
    if (!id || playerStore[id]) return;
    playerStore[id] = { id, name, pos, team: TEAM_NICKNAMES[teamId] || '', season, todayStats: {} };
  }

  // ---- Overview ----

  // "C. Rafaela" -- short enough for the depth chart's narrow plates.
  function shortPlayerName(name) {
    const parts = (name || '').split(' ');
    return parts.length > 1 ? `${parts[0][0]}. ${parts.slice(1).join(' ')}` : name;
  }

  function teamScheduleGames(gamesByDate) {
    return Object.keys(gamesByDate).sort()
      .flatMap(date => gamesByDate[date].slice().sort((a, b) => a.gameNumber - b.gameNumber).map(g => ({ ...g, date })));
  }
  // A game called off never happened -- it's neither a result nor still to come.
  function isCalledOff(g) { return /postponed|cancel/i.test(g.detailedState || ''); }

  function divisionShortName(divisionId) {
    const info = DIVISION_INFO[divisionId];
    return info ? info.name.replace('American League', 'AL').replace('National League', 'NL') : '';
  }

  // A game as a tile, like a form guide: the date, the opponent's cap and
  // the result (or first pitch). The tile opens the scorecard; a finished
  // game with MLB's recap gets a play mark under it.
  function renderGameTile(g, recap) {
    const oppId = g.isHome ? g.awayId : g.homeId;
    let out;
    if (g.state === 'Final') {
      const { us, them, won } = teamGameResult(g);
      out = `<span class="gt-res${won ? '' : ' is-loss'}"><b>${won ? 'W' : 'L'}</b>${us}-${them}</span>`;
    } else if (g.state === 'Live') {
      out = '<span class="gt-res is-note">Live</span>';
    } else {
      out = `<span class="gt-res is-note">${formatGameTime(g.gameDate).replace(/\s?[AP]M$/i, '')}</span>`;
    }
    const play = recap
      ? `<button type="button" class="gt-play" data-day-clip="${dayVideoKey({ clip: teamGameClip(recap, g), clipPrefix: 'r' })}" aria-label="Recap video, ${fmtShortDate(g.date)}">&#9654;</button>`
      : '';
    return `<div class="gt">
        <button type="button" class="gt-main" data-date="${g.date}" data-game-pk="${g.gamePk}" aria-label="${fmtShortDate(g.date)} ${g.isHome ? 'vs' : 'at'} ${g.opponentFull}">
          <span class="gt-date">${fmtShortDate(g.date)}</span>
          <span class="gt-opp"><i>${g.isHome ? 'vs' : '@'}</i><img src="${capLogoUrl(oppId)}" alt=""></span>
          ${out}
        </button>${play}
      </div>`;
  }
  // Recaps come with the season's videos, after the first draw.
  let teamRecentShown = null;
  function renderRecentTiles(recent, media) {
    clearDayClips('r');
    return `<div class="gt-row">${recent.slice().reverse().map(g => renderGameTile(g, media && media[g.gamePk] && media[g.gamePk].recap)).join('')}</div>`;
  }

  // Games back as the Monster hangs them: a half as its own "1/2", the
  // leader's slot empty.
  function monsterGamesBack(gb) {
    const v = parseFloat(gb);
    if (!v) return '&nbsp;';
    const whole = Math.floor(v);
    return `${whole || ''}${v - whole ? '<i class="tdv-half">&#189;</i>' : ''}`;
  }
  // The division as a small scoreboard in the Monster's style, this team
  // washed in gold. A row opens that team's Overview.
  function renderDivisionTable(records, teamId) {
    const rows = (records || []).slice().sort((a, b) => (parseInt(a.divisionRank, 10) || 99) - (parseInt(b.divisionRank, 10) || 99));
    const tag = r => (r.divisionChamp || /[yz]/.test(r.clinchIndicator || '')) ? 'Div'
      : r.clinchIndicator === 'w' ? 'WC' : r.clinchIndicator === 'x' ? 'In' : '';
    return `<div class="tdv">
        <div class="tdv-row tdv-head"><span></span><span></span><span>W</span><span>L</span><span>GB</span><span></span></div>
        ${rows.map(r => {
          const t = tag(r);
          return `<button type="button" class="tdv-row${r.team.id === Number(teamId) ? ' is-this' : ''}" data-team-pick="${r.team.id}">
            <span class="tdv-rank">${r.divisionRank}</span>
            <span class="tdv-team">${r.team.id === 109 ? '<span class="tdv-full">Diamondbacks</span><span class="tdv-short">D-backs</span>' : TEAM_NICKNAMES[r.team.id] || r.team.name}</span>
            <span class="tdv-slot">${r.wins}</span><span class="tdv-slot">${r.losses}</span>
            <span class="tdv-slot is-soft">${monsterGamesBack(r.gamesBack)}</span>
            <span class="tdv-tagc">${t ? `<em class="tdv-tag">${t}</em>` : ''}</span>
          </button>`;
        }).join('')}
      </div>`;
  }

  function renderTeamOverview(teamId, season, record, schedule, october) {
    const name = TEAM_NICKNAMES[teamId] || '';
    const games = teamScheduleGames(schedule.gamesByDate).filter(g => !isCalledOff(g));
    const finals = games.filter(g => g.state === 'Final' && g.homeScore != null && g.awayScore != null);
    const recent = finals.slice(-5);
    const upcoming = games.filter(g => g.state !== 'Final').slice(0, 5);
    const final = !!(record && record.final);

    // The season in plates: a division title or a berth, how October went,
    // and while it's going, the streak. Gold only for a title.
    const plates = [];
    const plate = (text, gold) => `<span class="player-award${gold ? '' : ' tm-plate'}"><span class="player-award-label">${text}</span></span>`;
    let recBig = '';
    let division = '';
    if (record) {
      const { rec, divisionId } = record;
      const div = divisionShortName(divisionId);
      const ci = rec.clinchIndicator || '';
      if (rec.divisionChamp || /[yz]/.test(ci)) plates.push(plate(final ? `${div} Champions` : `Clinched ${div}`, true));
      else if (ci === 'w') plates.push(plate(final ? 'Wild Card' : 'Clinched Wild Card'));
      else if (ci === 'x') plates.push(plate('Clinched a Berth'));
      recBig = `<span class="tm-wl">${rec.wins}<b>-</b>${rec.losses}</span><span class="tm-pct">${rec.winningPercentage || ''}<i>&#8250;</i></span>`;
      if (record.division) division = `<section class="tm-sec tm-o-div"><div class="pp-skg-head"><span>${div}</span></div>${renderDivisionTable(record.division, teamId)}</section>`;
    }
    if (october && october.champion) plates.push(plate(`${season} World Series Champions`, true));
    else if (october && october.pennant) plates.push(plate(`${record && record.leagueId === 104 ? 'NL' : 'AL'} Pennant`));
    else if (october && october.text) plates.push(plate(october.text));
    if (!final && record && record.rec.streak && record.rec.streak.streakCode) plates.push(plate(`Streak ${record.rec.streak.streakCode}`));

    const played = getTeamWinLossFromGames(finals);
    const lastWins = recent.filter(g => teamGameResult(g).won).length;
    const form = recent.length || upcoming.length ? `<section class="tm-sec tm-o-form">
        ${recent.length ? `<div class="pp-skg-head"><span>Last ${recent.length}</span><em>${lastWins}-${recent.length - lastWins}</em></div>
        <div id="tmRecent">${renderRecentTiles(recent, null)}</div>` : ''}
        ${upcoming.length ? `<div class="pp-skg-head tm-up-head"><span>Up Next</span></div>
        <div class="gt-row">${upcoming.map(g => renderGameTile(g, null)).join('')}</div>` : ''}
      </section>` : '';
    teamRecentShown = recent;

    const head = `<div class="tm-head tm-o-head">
        <img class="tm-cap" src="${capLogoUrl(teamId)}" alt="">
        <div class="tm-id">
          <div class="tm-kicker">${season} ${final ? 'Final' : 'Season'}</div>
          <div class="tm-name">${name}</div>
        </div>
        ${plates.length ? `<div class="player-award-tags tm-plates">${plates.join('')}</div>` : ''}
        ${recBig ? `<div class="tm-rside">${played.length
          ? `<button type="button" class="tm-recbig" data-team-chart="${teamId}" data-season="${season}" aria-label="${record.rec.wins} and ${record.rec.losses}, the season game by game">${recBig}</button>`
          : `<div class="tm-recbig">${recBig}</div>`}</div>` : ''}
      </div>`;
    // Reading order on a phone: who they are, what's next, how they've been
    // playing, where they stand, who's leading, how they rank, the season's
    // clips. From 900px a main column (head, form, leaders) sits beside a
    // sidebar (next game, division, ranks), each stacking on its own, with
    // the clips running the full width under both.
    return `<div class="sheet tm"><div class="tm-o">
      <div class="tm-o-main">${head}${form}
        <section class="tm-sec tm-o-lead"><div class="pp-skg-head"><span>Leaders</span></div><div id="tmLeaders"></div></section>
      </div>
      <div class="tm-o-side"><div class="tm-next tm-o-next" id="tmNext"></div>${division}
        <section class="tm-sec tm-o-ranks" id="tmRanks"></section>
      </div>
      <section class="tm-sec tm-moments tm-o-hl" id="tmMoments"></section>
    </div></div>`;
  }

  // ---- Overview extras: the season's biggest plays, leaders, next game ----
  // Where the team ranks among all 30 in six stats, three at the plate and
  // three on the mound, from the league's team totals (two requests, ~35
  // KB each). A season over is kept for the session; one in progress for
  // five minutes, and a failure isn't kept.
  const TEAM_RANK_STATS = [
    { group: 'hitting', key: 'runs', label: 'Runs', high: true },
    { group: 'hitting', key: 'homeRuns', label: 'HR', high: true },
    { group: 'hitting', key: 'ops', label: 'OPS', high: true },
    { group: 'pitching', key: 'era', label: 'ERA', high: false },
    { group: 'pitching', key: 'strikeOuts', label: 'K', high: true },
    { group: 'pitching', key: 'whip', label: 'WHIP', high: false }
  ];
  const teamRanksCache = {};
  async function getLeagueTeamSplits(season) {
    const cached = teamRanksCache[season];
    if (cached && (Number(season) < new Date().getFullYear() || Date.now() - cached.at < SCHEDULE_LIVE_TTL_MS)) return cached.splits;
    try {
      const groups = await Promise.all(['hitting', 'pitching'].map(async group => {
        const res = await fetch(`https://statsapi.mlb.com/api/v1/teams/stats?stats=season&group=${group}&season=${season}&sportId=1`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        return (data.stats && data.stats[0] && data.stats[0].splits) || [];
      }));
      const splits = { hitting: groups[0], pitching: groups[1] };
      if (!splits.hitting.length) return null;
      teamRanksCache[season] = { splits, at: Date.now() };
      return splits;
    } catch (e) {
      return null;
    }
  }
  // Among the given teams (a league's, or all of them); ties share the
  // better rank.
  function buildTeamRanks(splits, teamId, among) {
    return TEAM_RANK_STATS.map(st => {
      const rows = (splits[st.group] || []).filter(x => x.team && (!among || among.includes(x.team.id)));
      const mine = rows.find(x => x.team.id === Number(teamId));
      if (!mine) return null;
      const v = Number(mine.stat[st.key]);
      const better = rows.filter(x => st.high ? Number(x.stat[st.key]) > v : Number(x.stat[st.key]) < v).length;
      return { ...st, value: mine.stat[st.key], rank: better + 1, of: rows.length };
    }).filter(Boolean);
  }
  // The section draws itself, toggle and all, so the toggle can redraw it
  // from what's in hand.
  let teamRanksShown = null;
  function renderTeamRanks() {
    const t = teamRanksShown;
    const head = label => `<div class="pp-skg-head"><span>${label}</span></div>`;
    if (!t || !t.splits) return `${head('League Ranks')}<div class="pitch-empty">Ranks not available.</div>`;
    const lg = t.leagueId === 103 ? 'AL' : t.leagueId === 104 ? 'NL' : '';
    const scope = lg && t.leagueTeamIds && t.leagueTeamIds.length ? teamTab.ranksScope : 'mlb';
    const ranks = buildTeamRanks(t.splits, t.teamId, scope === 'league' ? t.leagueTeamIds : null);
    const of = ranks.length ? ranks[0].of : 30;
    const toggle = lg ? `<div class="view-toggle trk-scope" role="group" aria-label="Rank among">${[['league', lg], ['mlb', 'MLB']].map(([id, label]) =>
      `<button type="button" class="view-toggle-btn${scope === id ? ' active' : ''}" data-rank-scope="${id}" aria-pressed="${scope === id}">${label}</button>`).join('')}</div>` : '';
    return `<div class="pp-skg-head trk-head"><span>League Ranks <em>of ${of}</em></span>${toggle}</div>
      <div class="trk">${ranks.map(x => `<div class="trk-cell">
        <span class="trk-k">${x.label}</span>
        <span class="trk-rank${x.rank <= 3 ? ' is-top' : ''}">${x.rank}<sup>${ordinalSuffix(x.rank).replace(/^\d+/, '')}</sup></span>
        <span class="trk-v">${x.value}</span>
      </div>`).join('')}</div>`;
  }


  // The season's biggest swings in his team's favor: every final's win
  // probability (under 1 KB a game) ranks them, then only the games that
  // hold the top few are read in full for their diamonds and clips. At
  // most two from one game, so one wild night can't fill the row.
  const TEAM_MOMENTS = 10;
  const teamMomentsCache = {};
  async function getTeamSeasonMoments(teamId, finals) {
    const key = `${teamId}-${finals.length ? finals[finals.length - 1].gamePk : 0}`;
    if (teamMomentsCache[key]) return teamMomentsCache[key];
    try {
      const swings = [];
      let next = 0;
      async function worker() {
        while (next < finals.length) {
          const g = finals[next++];
          const signed = await getGameWpaSigned(g.gamePk, true);
          Object.keys(signed).forEach(i => {
            const wpa = (g.isHome ? signed[i] : -signed[i]) / 100;
            if (wpa > 0) swings.push({ g, atBatIndex: Number(i), wpa });
          });
        }
      }
      await Promise.all(Array.from({ length: SPRAY_FETCH_CONCURRENCY }, worker));
      swings.sort((a, b) => b.wpa - a.wpa);
      const perGame = {};
      const top = swings.filter(m => (perGame[m.g.gamePk] = (perGame[m.g.gamePk] || 0) + 1) <= 2).slice(0, TEAM_MOMENTS);
      const games = [...new Map(top.map(m => [m.g.gamePk, m.g])).values()];
      const stats = Object.fromEntries(await Promise.all(games.map(async g =>
        [g.gamePk, await fetchGameStats(g.gamePk, { id: g.awayId }, { id: g.homeId }, true)])));
      const items = top.map(m => {
        const k = ((stats[m.g.gamePk] || {}).keyPlays || []).find(x => x.atBatIndex === m.atBatIndex);
        if (!k || !k.playId) return null;
        const g = m.g;
        return {
          key: `${g.gamePk}-${k.atBatIndex}`, g, k, wpa: m.wpa, playId: k.playId,
          title: momentTitle(k),
          label: k.kind ? HR_IMPACT_LABELS[k.kind] : k.event === 'Home Run' ? 'Home run' : k.isOut ? 'Big out' : 'Big hit',
          why: k.runs > 1 ? `${k.runs} runs` : k.runs ? '1 run' : '',
          teamId: Number(teamId), personId: k.isOut ? k.pitcherId : k.batterId, clipPrefix: 't',
          meta: `${fmtShortDate(g.date)} &#183; ${g.isHome ? 'vs' : '@'} ${TEAM_ABBR[g.isHome ? g.awayId : g.homeId] || g.opponentFull}`
        };
      }).filter(Boolean);
      teamMomentsCache[key] = items;
      return items;
    } catch (e) {
      return null;
    }
  }

  // ---- Season Highlights: MLB's game videos ----
  // The schedule's highlights hydrate, a month at a time (about 200 KB
  // over the wire each), gives every game's recap, condensed game and
  // MLB's reels: a starter's outing, a big night at the plate, a rally.
  // Only what's kept per clip survives the parse. A season over is cached
  // for the session; one in progress is keyed by its latest final, and a
  // month that fails isn't cached at all.
  const TEAM_REEL_PITCHING = ['highlight-reel-starting-pitching', 'highlight-reel-pitching'];
  const TEAM_REEL_NIGHT = ['highlight-reel-team', 'highlight-reel-rally', 'performance', 'highlight-reel-offense'];
  const teamMediaCache = {};
  async function getTeamSeasonMedia(teamId, season, finals) {
    const key = `${teamId}-${season}-${finals.length ? finals[finals.length - 1].gamePk : 0}`;
    if (teamMediaCache[key]) return teamMediaCache[key];
    const months = [...new Set(finals.map(g => g.date.slice(0, 7)))];
    let failed = false;
    const byPk = {};
    await Promise.all(months.map(async ym => {
      const [y, m] = ym.split('-').map(Number);
      const end = `${ym}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`;
      try {
        const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamId}&season=${season}&gameType=R&startDate=${ym}-01&endDate=${end}&hydrate=game(content(highlights(highlights)))&fields=dates,games,gamePk,content,highlights,items,headline,duration,keywordsAll,type,value,playbacks,name,url`);
        if (!res.ok) { failed = true; return; }
        const data = await res.json();
        (data.dates || []).forEach(d => d.games.forEach(g => { byPk[g.gamePk] = buildTeamGameMedia(g, teamId); }));
      } catch (e) {
        failed = true;
      }
    }));
    if (!failed) teamMediaCache[key] = byPk;
    return byPk;
  }
  function buildTeamGameMedia(g, teamId) {
    const items = (g.content && g.content.highlights && g.content.highlights.highlights && g.content.highlights.highlights.items) || [];
    const out = { recap: null, condensed: null, reels: [], walkoff: false };
    items.forEach(item => {
      const kw = item.keywordsAll || [];
      const tags = kw.filter(k => k.type === 'taxonomy').map(k => k.value);
      const teams = kw.filter(k => k.type === 'team_id').map(k => Number(k.value));
      const players = [...new Set(kw.filter(k => k.type === 'player_id').map(k => Number(k.value)))];
      const mp4 = highlightMp4(item);
      if (!mp4) return;
      const clip = { mp4, title: (item.headline || '').trim(), mins: clipMinutes(item.duration), tags, players };
      if (tags.includes('game-recap')) out.recap = out.recap || clip;
      else if (tags.includes('condensed-game')) out.condensed = out.condensed || clip;
      else if (teams.includes(Number(teamId))) {
        if (tags.includes('walk-off')) out.walkoff = true;
        if ([...TEAM_REEL_PITCHING, ...TEAM_REEL_NIGHT].some(t => tags.includes(t))) out.reels.push(clip);
      }
    });
    return out;
  }
  function clipMinutes(duration) {
    const [h, m, s] = String(duration || '').split(':').map(Number);
    const total = (h || 0) * 60 + (m || 0) + (s || 0) / 60;
    return total ? Math.max(1, Math.round(total)) : 0;
  }
  function teamGameClip(c, g) {
    return { mp4: c.mp4, title: c.title, date: g.date, gamePk: g.gamePk, matchup: `${TEAM_ABBR[g.awayId] || ''} @ ${TEAM_ABBR[g.homeId] || ''}` };
  }
  function teamGameMeta(g) {
    return `${fmtShortDate(g.date)} &#183; ${g.isHome ? 'vs' : '@'} ${TEAM_ABBR[g.isHome ? g.awayId : g.homeId] || g.opponentFull}`;
  }
  function teamGameResult(g) {
    const us = g.isHome ? g.homeScore : g.awayScore, them = g.isHome ? g.awayScore : g.homeScore;
    return { us, them, won: us > them };
  }

  // On the Mound: MLB's reel of each start, ranked by the start's Game
  // Score from the pitcher's own game log (only the pitchers with a reel
  // are fetched, a few small requests). A traded arm's starts elsewhere
  // don't count, and nobody takes more than two spots.
  const TEAM_STARTS = 10;
  async function getTeamSeasonStarts(teamId, season, finals, media) {
    const cands = [];
    finals.forEach(g => {
      const m = media[g.gamePk];
      if (!m) return;
      const reel = m.reels.find(c => c.tags.includes(TEAM_REEL_PITCHING[0])) || m.reels.find(c => c.tags.includes(TEAM_REEL_PITCHING[1]));
      if (reel && reel.players.length === 1) cands.push({ g, reel, personId: reel.players[0] });
    });
    const ids = [...new Set(cands.map(c => c.personId))];
    const logs = Object.fromEntries(await Promise.all(ids.map(async id => [id, await getPitcherGameLog(id, season)])));
    const perPitcher = {};
    return cands.map(c => {
      const split = (logs[c.personId] || []).find(s => s.game && s.game.gamePk === c.g.gamePk && s.team && s.team.id === Number(teamId));
      if (!split || !Number(split.stat.gamesStarted)) return null;
      const s = split.stat;
      return {
        key: `s-${c.g.gamePk}`, kind: 'start', g: c.g, personId: c.personId, teamId: Number(teamId),
        clip: teamGameClip(c.reel, c.g), clipPrefix: 't', title: c.reel.title,
        gsc: gameScoreOf(s), line: { ip: s.inningsPitched, h: s.hits, r: s.runs, k: s.strikeOuts },
        meta: teamGameMeta(c.g)
      };
    }).filter(Boolean)
      .sort((a, b) => b.gsc - a.gsc)
      .filter(x => (perPitcher[x.personId] = (perPitcher[x.personId] || 0) + 1) <= 2)
      .slice(0, TEAM_STARTS)
      .map(x => ({ ...x, label: 'Game Score', why: String(x.gsc) }));
  }

  // Big Nights: MLB's offense and team reels, at most one a game, ranked
  // by what the headline counts ("three-homer, seven-RBI game", "score six
  // in the 8th"), a team reel or rally ahead of one man's night, a win
  // ahead of a loss.
  const TEAM_NIGHTS = 10;
  const NIGHT_NUMS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, multi: 2 };
  const NIGHT_WEIGHTS = { homer: 4, 'home run': 4, hr: 4, rbi: 1, hit: 1.5, run: 1.2 };
  function nightWeight(clip, won) {
    const t = clip.title.toLowerCase();
    let w = won ? 3 : 0;
    const re = /\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|multi)[\s-]+(homer|home run|hr|rbi|hit|run)s?\b/g;
    let m;
    while ((m = re.exec(t))) w += (NIGHT_NUMS[m[1]] || Number(m[1]) || 0) * NIGHT_WEIGHTS[m[2]];
    const scored = /\bscores?\s+(\w+)\s+(?:runs?\s+)?in\b/.exec(t);
    if (scored) w += (NIGHT_NUMS[scored[1]] || Number(scored[1]) || 0) * NIGHT_WEIGHTS.run;
    if (clip.tags.includes('highlight-reel-team')) w += 5;
    if (clip.tags.includes('highlight-reel-rally')) w += 3;
    if (clip.tags.includes('performance')) w += 2;
    return w;
  }
  function buildTeamNights(teamId, finals, media) {
    const nights = [];
    finals.forEach(g => {
      const m = media[g.gamePk];
      if (!m) return;
      const { us, them, won } = teamGameResult(g);
      const best = m.reels.filter(c => TEAM_REEL_NIGHT.some(t => c.tags.includes(t)))
        .map(c => ({ c, w: nightWeight(c, won) })).sort((a, b) => b.w - a.w)[0];
      if (!best) return;
      const team = best.c.tags.includes('highlight-reel-team') || best.c.tags.includes('highlight-reel-rally') || best.c.players.length !== 1;
      nights.push({
        key: `n-${g.gamePk}`, kind: 'night', g, weight: best.w, clip: teamGameClip(best.c, g), clipPrefix: 't',
        title: best.c.title, personId: team ? null : best.c.players[0], teamId: Number(teamId),
        us, them, won, label: team ? 'Team' : 'Big night', why: '', meta: teamGameMeta(g)
      });
    });
    return nights.sort((a, b) => b.weight - a.weight).slice(0, TEAM_NIGHTS);
  }

  // Best Wins: every win's path from its win probability (already in hand
  // from the plays' sweep, so nothing is refetched), ranked by how far down
  // the team was, a walk-off counting for more. Each plays MLB's recap,
  // with the condensed game a tap away.
  const TEAM_WINS = 6;
  async function buildTeamWins(teamId, finals, media) {
    const wins = finals.filter(g => teamGameResult(g).won && media[g.gamePk] && media[g.gamePk].recap);
    const scored = await Promise.all(wins.map(async g => {
      const signed = await getGameWpaSigned(g.gamePk, true);
      const adds = Object.keys(signed).map(Number).sort((a, b) => a - b).map(i => (g.isHome ? signed[i] : -signed[i]));
      if (!adds.length) return null;
      // A win ends at 100, so the start is whatever the swings didn't add.
      let wp = 100 - adds.reduce((s, x) => s + x, 0);
      const path = [wp];
      adds.forEach(x => { wp += x; path.push(Math.max(0, Math.min(100, wp))); });
      const low = Math.min(...path);
      const walkoff = media[g.gamePk].walkoff;
      return { g, path, low, walkoff, drama: (100 - low) + (walkoff ? 20 : 0) };
    }));
    return scored.filter(Boolean).sort((a, b) => b.drama - a.drama).slice(0, TEAM_WINS).map(w => {
      const m = media[w.g.gamePk];
      const { us, them } = teamGameResult(w.g);
      const opp = TEAM_NICKNAMES[w.g.isHome ? w.g.awayId : w.g.homeId] || w.g.opponentFull;
      const low = Math.round(w.low);
      return {
        key: `w-${w.g.gamePk}`, kind: 'win', g: w.g, path: w.path, low, us, them,
        clip: teamGameClip(m.recap, w.g), clipPrefix: 't', mins: m.recap.mins,
        condensed: m.condensed ? { clip: teamGameClip(m.condensed, w.g), mins: m.condensed.mins } : null,
        // Recaps were titled "Yankees vs. Padres Highlights" until 2026;
        // since then the headline tells the story.
        title: /highlights\s*$/i.test(m.recap.title) ? `${TEAM_NICKNAMES[teamId] || ''} ${us}, ${opp} ${them}` : m.recap.title,
        label: w.walkoff ? 'Walk-off' : low <= 25 ? 'Comeback' : 'Big win',
        why: low < 50 ? `down to ${low}% to win` : '',
        teamId: Number(teamId), meta: teamGameMeta(w.g)
      };
    });
  }

  // Leaders among the regulars: hitters with half a batting title's PA
  // (3.1 a team game) or more, by OPS -- the title's own share where three
  // have it; pitchers by ERA among starters, a start every ten team games
  // and 0.4 innings a game, so a hot reliever doesn't lead the staff.
  // The top three hitters by OPS among regulars (the batting title's 3.1
  // PA a team game, else half that early on) and the top three starters
  // by ERA.
  function buildTeamLeaders(hitting, pitching, teamGames) {
    const n = v => Number(v) || 0;
    const titled = (hitting || []).filter(r => n(r.stat.plateAppearances) >= 3.1 * teamGames);
    const regulars = titled.length >= 3 ? titled : (hitting || []).filter(r => n(r.stat.plateAppearances) >= 1.55 * teamGames);
    const starters = (pitching || []).filter(r => n(r.stat.gamesStarted) >= teamGames / 10 && n(r.stat.inningsPitched) >= 0.4 * teamGames);
    return {
      hitters: regulars.slice().sort((a, b) => n(b.stat.ops) - n(a.stat.ops)).slice(0, 3),
      pitchers: starters.slice().sort((a, b) => n(a.stat.era) - n(b.stat.era)).slice(0, 3)
    };
  }




  // The next game: one under way first, else the next on the schedule --
  // after the last game of a season, next season's opener.
  async function getTeamNextGame(teamId, season, games) {
    const ahead = games.filter(g => g.state !== 'Final' && !isCalledOff(g) && !finishedNextGames.has(g.gamePk));
    const live = ahead.find(g => g.state === 'Live');
    if (live || ahead.length) return { g: live || ahead[0], opener: false };
    if (Number(season) !== Number(await getDefaultListSeason())) return null;
    const nextSeason = await fetchTeamSchedule(teamId, Number(season) + 1);
    const first = teamScheduleGames(nextSeason.gamesByDate || {}).find(g => !isCalledOff(g));
    return first ? { g: first, opener: true } : null;
  }
  function renderNextGame(next) {
    if (!next) return '';
    const g = next.g;
    const oppId = g.isHome ? g.awayId : g.homeId;
    const live = g.state === 'Live';
    const us = g.isHome ? g.homeScore : g.awayScore, them = g.isHome ? g.awayScore : g.homeScore;
    const when = new Date(g.gameDate);
    const day = when.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const kicker = live ? '<span class="tn-live"><i></i>Live</span>' : next.opener ? 'Opening Day' : 'Next Game';
    const right = live
      ? `<span class="tn-score">${us ?? 0}<b>-</b>${them ?? 0}</span><span class="tn-state">${g.inningLabel || g.detailedState || ''}</span>`
      : `<span class="tn-day">${day}</span><span class="tn-state">${formatGameTime(g.gameDate)}</span>`;
    return `<button type="button" class="tn${live ? ' is-live' : ''}" data-tn-date="${g.date}" data-tn-pk="${g.gamePk}">
        <span class="tn-kicker">${kicker}</span>
        <span class="tn-opp"><span class="tn-at">${g.isHome ? 'vs' : '@'}</span><img src="${capLogoUrl(oppId)}" alt="">${g.opponentFull}</span>
        <span class="tn-right">${right}</span>
        <span class="tn-go">${live ? 'Follow live' : 'Scorecard'} &#8594;</span>
      </button>`;
  }

  // Leaders, a ranked board per side: his print and plate, his line under
  // the plate, and the stat they're ranked by in a slot at the end.
  // The next-game card follows a game under way -- or due within half an
  // hour -- every 20s while the Overview is on screen. A tick that comes
  // due anywhere else pauses (the tab's onShow and catchUpAfterResume pick
  // it up again); once the game is final the Overview reloads, so it joins
  // Recent and the card moves on to the next one.
  const TEAM_NEXT_POLL_MS = 20000;
  const finishedNextGames = new Set();
  let teamNextPollTimer = null;
  let teamNextPolled = null;
  function armTeamNextPoll(requestId, next) {
    clearTimeout(teamNextPollTimer);
    teamNextPollTimer = null;
    teamNextPolled = null;
    if (!next || next.opener) return;
    const g = next.g;
    if (g.state !== 'Live' && new Date(g.gameDate).getTime() - Date.now() > 30 * 60 * 1000) return;
    teamNextPolled = { requestId, next };
    // A live game's inning isn't on the schedule, so the first tick is now.
    teamNextPollTimer = setTimeout(pollTeamNext, g.state === 'Live' ? 0 : TEAM_NEXT_POLL_MS);
  }
  async function pollTeamNext() {
    teamNextPollTimer = null;
    const polled = teamNextPolled;
    if (!polled || polled.requestId !== teamRequestId) return;
    if (document.hidden || Tabs.current() !== 'team' || teamTab.view !== 'overview') return;
    const live = await getNextGameLive(polled.next.g.gamePk);
    if (polled !== teamNextPolled || polled.requestId !== teamRequestId) return;
    if (live && live.state === 'Final') {
      // The schedule is cached for minutes and would still call the game
      // live, so it's dropped, and the game is remembered as over in case
      // a fresh copy lags too -- either way the card can't keep reloading.
      finishedNextGames.add(polled.next.g.gamePk);
      delete scheduleCache[`${teamTab.teamId}-${teamTab.season}`];
      loadTeamTab();
      return;
    }
    if (live) {
      polled.next = { ...polled.next, g: { ...polled.next.g, ...live } };
      const el = document.getElementById('tmNext');
      if (el) el.innerHTML = renderNextGame(polled.next);
    }
    teamNextPollTimer = setTimeout(pollTeamNext, TEAM_NEXT_POLL_MS);
  }
  // Deferred a tick: the tab's onShow runs before Tabs marks it current.
  function resumeTeamNextPoll() {
    if (teamNextPolled && !teamNextPollTimer) teamNextPollTimer = setTimeout(pollTeamNext, 0);
  }
  // One game's state, score and inning, fresh past the browser's cache (a
  // failure isn't cached: the next tick just tries again).
  async function getNextGameLive(gamePk) {
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&gamePk=${gamePk}&hydrate=linescore&fields=dates,games,status,abstractGameState,detailedState,teams,away,home,score,linescore,currentInning,inningState,isTopInning`, { cache: 'no-cache' });
      if (!res.ok) return null;
      const data = await res.json();
      const g = data.dates && data.dates[0] && data.dates[0].games && data.dates[0].games[0];
      if (!g) return null;
      const ls = g.linescore || {};
      const half = { Top: 'Top', Bottom: 'Bot', Middle: 'Mid', End: 'End' }[ls.inningState] || '';
      return {
        state: g.status.abstractGameState,
        detailedState: g.status.detailedState,
        homeScore: g.teams.home.score,
        awayScore: g.teams.away.score,
        inningLabel: ls.currentInning ? `${half} ${ordinalSuffix(ls.currentInning)}`.trim() : ''
      };
    } catch (e) {
      return null;
    }
  }

  // Leaders: Top Hitters and Top Pitchers, three tiles each in order --
  // the print, his rank and position, the one stat they're ranked by big,
  // and the surname. The whole tile opens his quick look.
  function renderLeaderRows(leaders, teamId, season) {
    const surname = name => name.split(' ').slice(1).filter(w => !/^(Jr\.?|Sr\.?|II|III|IV)$/.test(w)).join(' ') || name;
    const group = (title, stat, rows, pitcher) => rows.length ? `<div class="tlc-group"><div class="tl-sub">${title}<em>${stat}</em></div><div class="tlc-grid">${rows.map((r, i) => {
      storeTeamPlayer(r.id, r.name, r.pos, teamId, season);
      const value = pitcher ? r.stat.era : r.stat.ops;
      return `<button type="button" class="tlc" data-player-id="${r.id}" aria-label="${title} ${i + 1}: ${r.name}, ${value} ${stat}">
          <span class="tlc-print"><img src="${headshotUrl(r.id, 120)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></span>
          <span class="tlc-cat"><b>${i + 1}</b>${pitcher ? 'SP' : r.pos}</span>
          <span class="tlc-val">${value}</span>
          <span class="tlc-name">${surname(r.name)}</span>
        </button>`;
    }).join('')}</div></div>` : '';
    const html = group('Top Hitters', 'OPS', leaders.hitters, false) + group('Top Pitchers', 'ERA', leaders.pitchers, true);
    return html || '<div class="pitch-empty">No regulars yet this season.</div>';
  }
  // ---- Season Highlights: one stream, in date order ----
  // Each kind fills in as its data lands (undefined while loading, null or
  // [] when there's nothing); the stream is every kind merged by date, one
  // swipe row with a gold marker where each month starts, redrawn from
  // what's in hand.
  const HIGHLIGHT_KINDS = ['plays', 'starts', 'nights', 'wins'];
  const HIGHLIGHT_KIND_ORDER = { win: 0, start: 1, night: 2, play: 3 };
  let teamHighlights = { requestId: 0 };

  function drawTeamHighlights() {
    if (teamHighlights.requestId !== teamRequestId) return;
    const el = document.getElementById('tmMoments');
    if (!el) return;
    clearDayClips('t');
    el.innerHTML = renderTeamHighlights(teamHighlights);
  }
  // A game's own clips stay together: its recap first, then the start,
  // the night, and its plays in the order they happened.
  function buildHighlightStream(h) {
    // A walk-off is the end of its game's recap, so with the recap in the
    // stream the play would be the same moment twice.
    const recapped = new Set((h.wins || []).map(w => w.g.gamePk));
    return HIGHLIGHT_KINDS.flatMap(id => (h[id] || []).filter(x => !(x.k && x.k.kind === 'walkoff' && recapped.has(x.g.gamePk))).map(x => {
      const kind = x.kind || 'play';
      const { us, them, won } = teamGameResult(x.g);
      const item = { ...x, kind, result: `${won ? 'W' : 'L'} ${us}-${them}`, won };
      if (kind === 'start') return { ...item, label: 'On the mound', why: '' };
      if (kind === 'night') return { ...item, label: x.label === 'Team' ? 'Team night' : 'Big night' };
      if (kind === 'win') return { ...item, why: '' };
      return item;
    })).sort((a, b) => a.g.date.localeCompare(b.g.date) || a.g.gamePk - b.g.gamePk
      || HIGHLIGHT_KIND_ORDER[a.kind] - HIGHLIGHT_KIND_ORDER[b.kind] || (a.k ? a.k.atBatIndex : 0) - (b.k ? b.k.atBatIndex : 0));
  }
  // March's few games ride with April and October's with September, as
  // in MLB's own monthly splits, so no month is a single clip.
  function highlightMonths(stream) {
    const months = [];
    stream.forEach(x => {
      const m = Math.min(9, Math.max(4, Number(x.g.date.slice(5, 7))));
      const ym = `${x.g.date.slice(0, 4)}-${String(m).padStart(2, '0')}`;
      const name = m === 4 ? 'Mar&#8211;Apr' : m === 9 ? 'Sep&#8211;Oct' : MONTH_NAMES[m - 1];
      if (!months.length || months[months.length - 1].ym !== ym) months.push({ ym, name, short: m === 4 || m === 9 ? name : name.slice(0, 3), items: [] });
      months[months.length - 1].items.push(x);
    });
    return months;
  }
  function renderTeamHighlights(h) {
    const stream = buildHighlightStream(h);
    const pending = HIGHLIGHT_KINDS.some(id => h[id] === undefined);
    const head = `<div class="pp-skg-head"><span>Season Highlights</span></div>`;
    const wait = pending ? `<div class="mlb-status-msg tmh-wait">${stream.length ? 'Gathering more clips' : 'Gathering the season&#8217;s clips'}&#8230;</div>` : '';
    if (!stream.length) return `${head}${wait || '<div class="pitch-empty">No highlights yet this season.</div>'}`;
    const months = highlightMonths(stream);
    // A season over opens on its first month, one under way on its latest.
    const on = months.find(m => m.ym === h.month) || (h.final ? months[0] : months[months.length - 1]);
    const i = months.indexOf(on);
    const jump = months.length > 1
      ? `<div class="hs-jump" role="group" aria-label="Month">${months.map(m => `<button type="button" data-hl-month="${m.ym}" aria-pressed="${m === on}"${m === on ? ' class="is-on"' : ''}>${m.short}</button>`).join('')}</div>`
      : '';
    const cells = months.flatMap(m => [`<div class="hs-tick" id="hsm-${m.ym}"><span>${m.name}</span></div>`, ...m.items.map(renderTeamCard)]);
    const page = (m, dir) => m ? `<button type="button" class="hs-page" data-hl-page="${m.ym}">${dir < 0 ? `&#8592; ${m.name}` : `${m.name} &#8594;`}</button>` : '<span></span>';
    const list = `<div class="hs-list">
        <div class="hs-list-month">${on.name}</div>
        ${on.items.map(renderHighlightRow).join('')}
        ${months.length > 1 ? `<div class="hs-pager">${page(months[i - 1], -1)}${page(months[i + 1], 1)}</div>` : ''}
      </div>`;
    return `${head}${jump}<div class="hs-reel">${cells.join('')}</div>${list}${wait}`;
  }
  // Every clip says when (the date leads its kicker) and carries that
  // game's other video as a chip at the kicker's end: MLB's recap, or for
  // a best win (whose own clip is the recap) the condensed game. The
  // title is the clip's button, stretched over the whole card, so the
  // chip can sit inside the card without a button in a button.
  function highlightKicker(x) {
    const m = teamHighlights.media && teamHighlights.media[x.g.gamePk];
    const alt = x.kind === 'win' ? (x.condensed && { clip: x.condensed.clip, label: 'Full game' })
      : (m && m.recap && { clip: teamGameClip(m.recap, x.g), label: 'Recap' });
    return `<span class="vc-kicker hl-kick">
        <span class="hl-kick-l"><b>${fmtShortDate(x.g.date)}</b>${x.label}${x.why ? ` <em>${x.why}</em>` : ''}</span>
        ${alt ? `<button type="button" class="hl-alt" data-day-clip="${dayVideoKey({ clip: alt.clip, clipPrefix: 't' })}">${alt.label} &#9654;</button>` : ''}
      </span>`;
  }
  function highlightStill(x) { return ((x.kind && HIGHLIGHT_STILLS[x.kind]) || renderScorebookStill)(x); }
  // A phone's row: the still small beside the kicker and the title.
  function renderHighlightRow(x) {
    return `<div class="hs-row hl-card">
        <span class="hs-thumb">${highlightStill(x)}</span>
        <span class="hs-text">${highlightKicker(x)}<button type="button" class="hl-hit" data-day-clip="${dayVideoKey(x)}"><span class="hs-title">${x.title}</span></button></span>
      </div>`;
  }
  function renderTeamCard(x) {
    return `<div class="vc hl-card">
        <span class="vc-thumb">${highlightStill(x)}</span>
        ${highlightKicker(x)}
        <button type="button" class="hl-hit" data-day-clip="${dayVideoKey(x)}"><span class="vc-title">${x.title}</span></button>
      </div>`;
  }
  // Stills for MLB's reels, which have no one play to draw: a start is
  // the pitcher's print and his line; a big night the hitter's print (or
  // the cap, for the team's) and the final; a win the final over the
  // game's win probability, its low point in brick and the finish in gold.
  function vcOpp(g) {
    const oppId = g.isHome ? g.awayId : g.homeId;
    return `<span class="vc-where"><b>${g.isHome ? 'vs' : '@'}</b><img src="${capLogoUrl(oppId)}" alt="">${TEAM_ABBR[oppId] || ''}</span>`;
  }
  function vcPrint(item) {
    return item.personId
      ? `<span class="vc-who"><img class="vc-photo" src="${headshotUrl(item.personId, 240)}" alt="" onerror="this.style.visibility='hidden'"></span>`
      : `<span class="vc-who vc-who-cap"><img src="${capLogoUrl(item.teamId)}" alt=""></span>`;
  }
  function renderStartStill(item) {
    const cell = (v, k) => `<span><b>${v ?? 0}</b><i>${k}</i></span>`;
    const l = item.line;
    return `<span class="vc-card">${vcPrint(item)}
        <span class="vc-play-side">${vcOpp(item.g)}
          <span class="vc-line">${cell(l.ip, 'IP')}${cell(l.h, 'H')}${cell(l.r, 'R')}${cell(l.k, 'K')}</span>
        </span>
        <span class="dg-recap vc-play">&#9654;</span>
      </span>`;
  }
  function renderNightStill(item) {
    return `<span class="vc-card">${vcPrint(item)}
        <span class="vc-play-side">${vcOpp(item.g)}
          <span class="vc-final"><span class="vc-wl${item.won ? '' : ' is-loss'}">${item.won ? 'W' : 'L'}</span>${item.us}<b>-</b>${item.them}</span>
        </span>
        <span class="dg-recap vc-play">&#9654;</span>
      </span>`;
  }
  function renderWinStill(item) {
    const n = item.path.length - 1 || 1;
    const pt = (v, i) => `${(i / n * 100).toFixed(2)},${(100 - v).toFixed(2)}`;
    const lowAt = item.path.indexOf(Math.min(...item.path));
    // A zero-length line with a round cap stays a round dot however the
    // unscaled-aspect SVG is stretched.
    const dot = (i, cls) => {
      const [x, y] = pt(item.path[i], i).split(',');
      return `<line class="${cls}" x1="${x}" y1="${y}" x2="${x}" y2="${y}" vector-effect="non-scaling-stroke"/>`;
    };
    return `<span class="vc-card vc-card-win">
        <span class="vc-win-top">${vcOpp(item.g)}<span class="vc-final"><span class="vc-wl">W</span>${item.us}<b>-</b>${item.them}</span></span>
        <svg class="vc-wp" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line class="vc-wp-mid" x1="0" y1="50" x2="100" y2="50" vector-effect="non-scaling-stroke"/>
          <polyline points="${item.path.map(pt).join(' ')}" vector-effect="non-scaling-stroke"/>
          ${dot(lowAt, 'vc-wp-low')}${dot(n, 'vc-wp-end')}
        </svg>
        <span class="dg-recap vc-play">&#9654;</span>
      </span>`;
  }
  const HIGHLIGHT_STILLS = { start: renderStartStill, night: renderNightStill, win: renderWinStill };

  // Same running tally getTeamWinLossSeries keeps, from games already in hand.
  function getTeamWinLossFromGames(finals) {
    let net = 0;
    return finals.filter(g => g.homeScore !== g.awayScore).map(g => {
      const won = g.isHome ? g.homeScore > g.awayScore : g.awayScore > g.homeScore;
      net += won ? 1 : -1;
      return { date: g.date, net, won };
    });
  }

  async function loadTeamOverview(requestId, teamId, season) {
    const [record, schedule] = await Promise.all([
      getTeamSeasonRecord(teamId, season),
      fetchTeamSchedule(teamId, season)
    ]);
    if (requestId !== teamRequestId) return;
    if (!record && !schedule.seasonStart) {
      teamBody.innerHTML = apiErrorMsg('this team\'s season');
      return;
    }
    currentScheduleTeam = { teamId, gamesByDate: schedule.gamesByDate };
    const october = record && record.final ? await getTeamPostseasonResult(teamId, season) : null;
    if (requestId !== teamRequestId) return;
    teamBody.innerHTML = renderTeamOverview(teamId, season, record, schedule, october);
    const games = teamScheduleGames(schedule.gamesByDate).filter(g => !isCalledOff(g));
    const finals = games.filter(g => g.state === 'Final' && g.homeScore != null && g.awayScore != null);
    const fill = (id, html) => { if (requestId !== teamRequestId) return; const el = document.getElementById(id); if (el) el.innerHTML = html; };
    teamHighlights = { requestId, final: !!(record && record.final) };
    drawTeamHighlights();
    const land = (id, items) => { if (teamHighlights.requestId === requestId) { teamHighlights[id] = items; drawTeamHighlights(); } };
    // Best Wins reads each final's win probability, which the plays' sweep
    // has just cached, so it waits for that rather than fetching it twice.
    const playsP = getTeamSeasonMoments(teamId, finals).then(items => land('plays', items));
    getTeamSeasonMedia(teamId, season, finals).then(media => {
      if (teamHighlights.requestId !== requestId) return;
      teamHighlights.media = media;
      if (teamRecentShown && teamRecentShown.length) fill('tmRecent', renderRecentTiles(teamRecentShown, media));
      land('nights', buildTeamNights(teamId, finals, media));
      getTeamSeasonStarts(teamId, season, finals, media).then(items => land('starts', items)).catch(() => land('starts', null));
      playsP.then(() => buildTeamWins(teamId, finals, media)).then(items => land('wins', items)).catch(() => land('wins', null));
    });
    getLeagueTeamSplits(season).then(splits => {
      if (requestId !== teamRequestId) return;
      teamRanksShown = { splits, teamId, leagueId: record && record.leagueId, leagueTeamIds: record && record.leagueTeamIds };
      fill('tmRanks', renderTeamRanks());
    });
    getTeamNextGame(teamId, season, games).then(next => {
      if (requestId !== teamRequestId) return;
      fill('tmNext', renderNextGame(next));
      armTeamNextPoll(requestId, next);
    });
    Promise.all([getTeamPlayerStats(teamId, season, 'hitting'), getTeamPlayerStats(teamId, season, 'pitching')]).then(([h, pi]) => {
      const leaders = buildTeamLeaders(h, pi, finals.length || 1);
      fill('tmLeaders', renderLeaderRows(leaders, teamId, season));
    });
  }

  // ---- Schedule ----

  async function loadTeamScheduleView(requestId, teamId, season) {
    const { gamesByDate, seasonStart, seasonEnd } = await fetchTeamSchedule(teamId, season);
    if (requestId !== teamRequestId) return;
    if (!seasonStart) {
      teamBody.innerHTML = '<div class="mlb-status-msg">No regular season schedule available.</div>';
      return;
    }
    currentScheduleTeam = { teamId, gamesByDate };
    teamBody.innerHTML = `<div class="sheet">${renderScheduleAllMonths(gamesByDate, seasonStart, seasonEnd)}</div>`;
    const currentBlock = teamBody.querySelector('[data-current-month="1"]');
    if (currentBlock) currentBlock.scrollIntoView({ block: 'start' });
  }

  // ---- Roster ----

  function rosterStatusRank(p) {
    const desc = p.statusDesc || '';
    if (!desc || /^active$/i.test(desc)) return 0;
    if (/injured/i.test(desc)) return 2;
    return 1;
  }

  function sortRosterList(list) {
    return list.slice().sort((a, b) => {
      const r = rosterStatusRank(a) - rosterStatusRank(b);
      return r !== 0 ? r : (a.name || '').localeCompare(b.name || '');
    });
  }

  function rosterStatusBadge(p) {
    const desc = p.statusDesc || '';
    if (!desc || /^active$/i.test(desc)) return '';
    if (/injured/i.test(desc)) return `<span class="roster-badge roster-badge-il">${desc.replace(/^Injured\s+/i, 'IL ').replace(/-Day$/i, '')}</span>`;
    return `<span class="roster-badge">${desc}</span>`;
  }

  // Baseball age: how old he was on June 30 of that season.
  function seasonAge(birthDate, season) {
    if (!birthDate) return '';
    const [y, m, d] = birthDate.split('-').map(Number);
    return Number(season) - y - ((m > 6 || (m === 6 && d > 30)) ? 1 : 0);
  }

  function renderRosterHead() {
    return '<div class="rr rr-head"><span>#</span><span></span><span>B/T</span><span>Age</span><span>Pos</span></div>';
  }
  function renderRosterRow(p, opts) {
    const bt = p.bats || p.throws ? `${p.bats || '&#8211;'}/${p.throws || '&#8211;'}` : '';
    return `<div class="rr">
        <span class="rr-num">${p.jersey}</span>
        <span class="rr-name"><button type="button" class="player-name-btn" data-player-id="${p.id}">${p.name}</button>${opts.badges ? rosterStatusBadge(p) : ''}</span>
        <span class="rr-d">${bt}</span>
        <span class="rr-d">${seasonAge(p.birthDate, opts.season)}</span>
        <span class="rr-d">${p.role || p.posAbbr}</span>
      </div>`;
  }

  const POSITION_PLAYER_GROUP_ORDER = ['Catcher', 'Infielder', 'Outfielder', 'Hitter'];
  const POSITION_PLAYER_GROUP_LABEL = {
    Catcher: 'Catchers', Infielder: 'Infielders', Outfielder: 'Outfielders', Hitter: 'Designated Hitters'
  };

  function renderRosterSubgroups(groups, opts) {
    return groups.filter(g => g.list.length).map(g =>
      `${g.title ? `<div class="roster-subgroup-title">${g.title}</div>` : ''}${g.list.map(p => renderRosterRow(p, opts)).join('')}`).join('');
  }

  // With the depth chart in hand (the current roster only), pitchers split
  // into the rotation in its order and the bullpen with the closer first.
  function pitcherSubgroups(pitchers, depth) {
    if (!depth) return [{ title: '', list: sortRosterList(pitchers) }];
    const starters = depth.filter(d => d.posAbbr === 'SP').map(d => d.id);
    const closers = depth.filter(d => d.posAbbr === 'CP').map(d => d.id);
    const rotation = starters.map(id => pitchers.find(p => p.id === id)).filter(Boolean).map(p => ({ ...p, role: 'SP' }));
    const pen = sortRosterList(pitchers.filter(p => !starters.includes(p.id)))
      .map(p => ({ ...p, role: closers.includes(p.id) ? 'CL' : 'RP' }))
      .sort((a, b) => (b.role === 'CL') - (a.role === 'CL'));
    return [{ title: 'Rotation', list: rotation }, { title: 'Bullpen', list: pen }];
  }

  function renderRosterGroups(list, opts) {
    if (!list.length) return '<div class="roster-empty">No players found.</div>';
    const pitchers = list.filter(p => p.posType === 'Pitcher');
    const hitters = list.filter(p => p.posType !== 'Pitcher');
    const byType = {};
    hitters.forEach(p => { (byType[p.posType] = byType[p.posType] || []).push(p); });
    const hitterGroups = POSITION_PLAYER_GROUP_ORDER.filter(g => byType[g])
      .concat(Object.keys(byType).filter(g => !POSITION_PLAYER_GROUP_ORDER.includes(g)))
      .map(g => ({ title: POSITION_PLAYER_GROUP_LABEL[g] || g, list: sortRosterList(byType[g]) }));
    const col = (title, count, inner) => `
      <div class="roster-column">
        <div class="pp-skg-head"><span>${title}</span><em>${count}</em></div>
        ${renderRosterHead()}
        ${inner || '<div class="roster-empty">None</div>'}
      </div>`;
    return `<div class="roster-columns">${col('Pitchers', pitchers.length, renderRosterSubgroups(pitcherSubgroups(pitchers, opts.depth), opts))}${col('Position Players', hitters.length, renderRosterSubgroups(hitterGroups, opts))}</div>`;
  }

  // The depth chart: the starters on a drawn diamond with their photos,
  // each with any other spots he backs up beside his own; the bench as
  // players with the spots each covers; then the staff. Everyone on it
  // gets a photo.
  // [position, x%, y%] -- spots on the drawn field, the photo's center,
  // in the field SVG's 0-100 box.
  const DEPTH_SPOTS = [
    ['CF', 50, 9], ['LF', 17, 24], ['RF', 83, 24],
    ['SS', 35, 36], ['2B', 65, 36], ['3B', 19, 55], ['1B', 81, 55],
    ['C', 50, 84], ['DH', 11, 90]
  ];
  // Scoring order, which the spots a man covers are listed in.
  const DEPTH_POSITIONS = ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'];

  // Chalk on the board: the fence, the foul lines, the infield's cut and
  // the bases, home at (50, 80) and 90 feet = 19 units.
  const DEPTH_FIELD_SVG = `<svg class="dcf-svg" viewBox="0 0 100 100" aria-hidden="true">
      <path class="dcf-grass" d="M50 80 L2 32 Q50 -24 98 32 Z"/>
      <path class="dcf-fence" d="M2 32 Q50 -24 98 32"/>
      <path class="dcf-dirt" d="M50 80 L25 55 Q50 20 75 55 Z"/>
      <path class="dcf-line" d="M50 80 L2 32 M50 80 L98 32"/>
      <path class="dcf-line" d="M50 80 L69 61 L50 42 L31 61 Z"/>
      <circle class="dcf-mound" cx="50" cy="62" r="2.4"/>
      <rect class="dcf-base" x="67.4" y="59.4" width="3.2" height="3.2" transform="rotate(45 69 61)"/>
      <rect class="dcf-base" x="48.4" y="40.4" width="3.2" height="3.2" transform="rotate(45 50 42)"/>
      <rect class="dcf-base" x="29.4" y="59.4" width="3.2" height="3.2" transform="rotate(45 31 61)"/>
      <path class="dcf-base" d="M48.3 79 h3.4 v1.5 l-1.7 1.7 l-1.7 -1.7 Z"/>
    </svg>`;

  function depthAt(depth, pos) { return depth.filter(d => d.posAbbr === pos); }
  function depthStaff(depth) {
    const rotation = depthAt(depth, 'SP');
    const closers = depthAt(depth, 'CP');
    const pen = depthAt(depth, 'P').filter(p => !closers.some(c => c.id === p.id) && !rotation.some(s => s.id === p.id));
    return { rotation, closers, pen };
  }
  function depthPlate(p) {
    return `<button type="button" class="player-name-btn" data-player-id="${p.id}" title="${p.name}">${shortPlayerName(p.name)}</button>`;
  }
  function depthPrint(p) {
    return `<button type="button" class="dcf-photo" data-player-id="${p.id}" aria-label="${p.name}" title="${p.name}"><span class="dcf-print"><img src="${headshotUrl(p.id, 120)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></span></button>`;
  }
  // A photo card: print, a label (slot, role or the spots he covers), plate.
  function depthCard(p, label) {
    return `<div class="dcf-rot">${depthPrint(p)}<span class="dcf-pos">${label}</span>${depthPlate(p)}</div>`;
  }
  function depthCards(list) {
    return `<div class="dcf-rotation">${list.join('') || '<div class="roster-empty">None</div>'}</div>`;
  }

  // Everyone behind a starter somewhere, once each, with the spots he
  // covers in scoring order -- and whether he starts somewhere himself.
  function buildDepthCoverage(depth) {
    const starterIds = new Set(DEPTH_POSITIONS.map(pos => (depthAt(depth, pos)[0] || {}).id).filter(Boolean));
    const covers = new Map();
    DEPTH_POSITIONS.forEach(pos => depthAt(depth, pos).slice(1).forEach(p => {
      if (!covers.has(p.id)) covers.set(p.id, { p, spots: [] });
      covers.get(p.id).spots.push(pos);
    }));
    const all = [...covers.values()];
    return { bench: all.filter(c => !starterIds.has(c.p.id)), starters: all.filter(c => starterIds.has(c.p.id)) };
  }

  function renderDepthChart(depth) {
    if (!depth.length) return '<div class="roster-empty">No depth chart available.</div>';
    const { bench, starters: also } = buildDepthCoverage(depth);
    const alsoById = new Map(also.map(c => [c.p.id, c.spots]));
    const spots = DEPTH_SPOTS.map(([pos, x, y]) => {
      const starter = depthAt(depth, pos)[0];
      const covers = starter && alsoById.get(starter.id);
      return `<div class="dcf-spot" style="left:${x}%; top:${y}%">
          ${starter ? depthPrint(starter) : '<span class="dcf-print is-empty"></span>'}
          <span class="dcf-pos">${pos}${covers ? `<span class="dcf-pos-also">${covers.map(c => ` &#183; ${c}`).join('')}</span>` : ''}</span>
          ${starter ? depthPlate(starter) : ''}
        </div>`;
    }).join('');
    const { rotation, closers, pen } = depthStaff(depth);
    return `<div class="dcf-layout"><div class="dcf">${DEPTH_FIELD_SVG}${spots}</div><div class="dcf-side">
      <section class="tm-sec">
        <div class="pp-skg-head"><span>Bench</span></div>
        ${depthCards(bench.map(({ p, spots: s }) => depthCard(p, s.join(' &#183; '))))}
      </section>
      <section class="tm-sec">
        <div class="pp-skg-head"><span>Rotation</span></div>
        ${depthCards(rotation.map((p, i) => depthCard(p, i + 1)))}
      </section>
      <section class="tm-sec">
        <div class="pp-skg-head"><span>Bullpen</span></div>
        ${depthCards([...closers.map(p => depthCard(p, 'CL')), ...pen.map(p => depthCard(p, 'RP'))])}
      </section></div></div>`;
  }

  function renderInjuredListRows(list, injuryMap) {
    return list.map(p => {
      const txn = injuryMap[p.id];
      return { p, detail: txn ? extractInjuryDetail(txn.description) : null, date: txn ? txn.date : null };
    }).sort((a, b) => {
      if (a.date && b.date) return b.date.localeCompare(a.date);
      if (a.date || b.date) return a.date ? -1 : 1;
      return (a.p.name || '').localeCompare(b.p.name || '');
    }).map(({ p, detail, date }) => {
      const dateLabel = date ? new Date(date + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '&#8212;';
      return `
        <tr>
          <td class="il-num">${p.jersey}</td>
          <td class="il-name"><button type="button" class="player-name-btn" data-player-id="${p.id}">${p.name}</button></td>
          <td class="il-pos">${p.posAbbr}</td>
          <td class="il-injury">${detail || 'Details unavailable'}</td>
          <td class="il-date">${dateLabel}</td>
        </tr>`;
    }).join('');
  }

  function extractInjuryDetail(description) {
    if (!description) return null;
    const sentences = description.split(/\.\s+/).map(s => s.trim()).filter(Boolean);
    return sentences.length > 1 ? sentences.slice(1).join('. ').replace(/\.$/, '') : null;
  }

  function renderInjuredList(fortyMan, injuryMap) {
    const ilPlayers = fortyMan.filter(p => /injured/i.test(p.statusDesc || ''));
    if (!ilPlayers.length) return '<div class="roster-empty">No players currently on the injured list.</div>';
    const groups = {};
    ilPlayers.forEach(p => { (groups[p.statusDesc] = groups[p.statusDesc] || []).push(p); });
    return Object.keys(groups).sort().map(status => `
      <div class="pp-skg-head il-head"><span>${status}</span><em>${groups[status].length}</em></div>
      <div class="table-scroll"><table class="il-table">
        <colgroup><col class="il-col-num"><col class="il-col-name"><col class="il-col-pos"><col><col class="il-col-date"></colgroup>
        <thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Injury</th><th>Since</th></tr></thead>
        <tbody>${renderInjuredListRows(groups[status], injuryMap)}</tbody>
      </table></div>`).join('');
  }

  // The depth chart stands in for the 26-man: it's the active roster laid
  // out by where everyone plays.
  const ROSTER_VIEWS = [['depth', 'Depth Chart'], ['40man', '40-Man'], ['il', 'IL']];

  async function loadTeamRosterView(requestId, teamId, season) {
    const current = Number(season) === Number(teamTab.latestSeason);
    const view = current ? teamTab.rosterView : 'season';
    const opts = { season };
    let inner;
    if (view === 'season') {
      // A past season's status is where each player ended up (traded,
      // released), which says nothing about his year here -- list by name.
      const list = await fetchTeamRoster(teamId, 'fullSeason', season);
      if (requestId !== teamRequestId) return;
      if (list) list.forEach(p => { p.statusDesc = ''; });
      if (!list) { teamBody.innerHTML = apiErrorMsg('the roster'); return; }
      list.forEach(p => storeTeamPlayer(p.id, p.name, p.posType === 'Pitcher' ? 'P' : p.posAbbr, teamId, season));
      inner = renderRosterGroups(list, opts);
    } else {
      const [list, depth, injuryMap] = await Promise.all([
        fetchTeamRoster(teamId, view === 'depth' ? 'depthChart' : '40Man'),
        view === 'il' ? null : fetchTeamRoster(teamId, 'depthChart'),
        view === 'il' ? fetchTeamInjuryDetails(teamId) : null
      ]);
      if (requestId !== teamRequestId) return;
      if (!list) { teamBody.innerHTML = apiErrorMsg('the roster'); return; }
      list.forEach(p => storeTeamPlayer(p.id, p.name, p.posType === 'Pitcher' || /^(SP|CP)$/.test(p.posAbbr) ? 'P' : p.posAbbr, teamId, season));
      if (view === 'depth') inner = renderDepthChart(list);
      else if (view === 'il') inner = renderInjuredList(list, injuryMap);
      else inner = renderRosterGroups(list, { ...opts, depth, badges: view === '40man' });
    }
    const tabs = current
      ? `<div class="pp-tabs tm-roster-tabs" role="tablist">${ROSTER_VIEWS.map(([id, label]) => `<button type="button" class="pp-tab" role="tab" data-roster-view="${id}" aria-selected="${id === view}">${label}</button>`).join('')}</div>`
      : `<div class="pp-skg-head tm-roster-title"><span>${season} Roster</span><em>Everyone who played</em></div>`;
    teamBody.innerHTML = `<div class="sheet tm">${tabs}${inner}</div>`;
  }

  // ---- Stats ----
  // Every player's line for this team, hitters then pitchers, each table
  // sortable like the Players list, with the team's own line beneath.

  // The team's own season line -- its totals row.
  const teamTotalsCache = {};
  async function getTeamSeasonTotals(teamId, season, group) {
    const key = `${teamId}-${season}-${group}`;
    const cached = teamTotalsCache[key];
    if (cached && (Number(season) < new Date().getFullYear() || Date.now() - cached.at < SCHEDULE_LIVE_TTL_MS)) return cached.stat;
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/teams/${teamId}/stats?stats=season&group=${group}&season=${season}&sportId=1`);
      if (!res.ok) return null;
      const data = await res.json();
      const split = data.stats && data.stats[0] && data.stats[0].splits && data.stats[0].splits[0];
      const stat = split ? split.stat : null;
      teamTotalsCache[key] = { stat, at: Date.now() };
      return stat;
    } catch (e) {
      return null;
    }
  }

  // count: a zero is left blank, per the scorebook's blank-zero rule.
  const statCol = (key, label, field, opts = {}) => ({
    key, label, dir: opts.dir || 'desc', count: !!opts.count,
    get: r => r.stat[field] != null ? Number(r.stat[field]) : null,
    render: r => r.stat[field] ?? '&#8212;'
  });
  const TEAM_BATTING_COLUMNS = [
    statCol('g', 'G', 'gamesPlayed'),
    statCol('pa', 'PA', 'plateAppearances', { count: true }),
    statCol('avg', 'AVG', 'avg'),
    statCol('obp', 'OBP', 'obp'),
    statCol('slg', 'SLG', 'slg'),
    { key: 'wobaPlus', label: 'wOBA+', dir: 'desc',
      get: (r, ctx) => (ctx.leagueWoba ? wobaPlusValue(r.stat, ctx.leagueWoba) : null),
      render: (r, ctx) => computeWOBAPlus(r.stat, ctx.leagueWoba) },
    statCol('hr', 'HR', 'homeRuns', { count: true }),
    statCol('rbi', 'RBI', 'rbi', { count: true }),
    { key: 'sb', label: 'SB', dir: 'desc', count: true, get: r => r.stat.stolenBases ?? null,
      render: r => (r.stat.stolenBases || r.stat.caughtStealing) ? formatStolenBases(r.stat.stolenBases, r.stat.caughtStealing) : '' }
  ];
  const TEAM_PITCHING_COLUMNS = [
    { key: 'g', label: 'G', dir: 'desc', get: r => r.stat.gamesPitched ?? r.stat.gamesPlayed ?? null, render: r => r.stat.gamesPitched ?? r.stat.gamesPlayed ?? '&#8212;' },
    statCol('gs', 'GS', 'gamesStarted', { count: true }),
    { key: 'ip', label: 'IP', dir: 'desc', get: r => ipToOuts(r.stat.inningsPitched), render: r => r.stat.inningsPitched ?? '&#8212;' },
    statCol('era', 'ERA', 'era', { dir: 'asc' }),
    statCol('whip', 'WHIP', 'whip', { dir: 'asc' }),
    { key: 'kbb', label: 'K%-BB%', dir: 'desc',
      get: r => rawKBB(r.stat.strikeOuts, r.stat.baseOnBalls, r.stat.battersFaced),
      render: r => formatKBB(r.stat.strikeOuts, r.stat.baseOnBalls, r.stat.battersFaced) },
    statCol('so', 'SO', 'strikeOuts', { count: true }),
    statCol('bb', 'BB', 'baseOnBalls', { count: true, dir: 'asc' }),
    statCol('sv', 'SV', 'saves', { count: true })
  ];
  const TEAM_STATS_DEFAULT_SORT = { hitting: { key: 'pa', dir: 'desc' }, pitching: { key: 'ip', dir: 'desc' } };
  const teamStatsSort = { hitting: { ...TEAM_STATS_DEFAULT_SORT.hitting }, pitching: { ...TEAM_STATS_DEFAULT_SORT.pitching } };
  let lastTeamStats = null;

  function renderTeamStatsTable(group, rows, totals, ctx) {
    const columns = group === 'pitching' ? TEAM_PITCHING_COLUMNS : TEAM_BATTING_COLUMNS;
    const { key, dir } = teamStatsSort[group];
    const sortColumn = columns.find(c => c.key === key) || columns[0];
    const nameColumn = { key: 'name', get: r => r.name };
    const sorted = rows.slice().sort((a, b) => key === 'name'
      ? compareListRows(a, b, nameColumn, dir, ctx)
      : compareListRows(a, b, sortColumn, dir, ctx));
    const head = (k, label) => {
      const active = k === key;
      const arrow = active ? (dir === 'asc' ? ' &#9650;' : ' &#9660;') : '';
      return `<th data-sort-key="${k}"${active ? ' class="sorted"' : ''}>${label}${arrow}</th>`;
    };
    const cell = (c, r) => {
      if (c.count && c.get(r, ctx) === 0) return '<td></td>';
      return `<td>${c.render(r, ctx)}</td>`;
    };
    const body = sorted.map(r => `<tr><td>${renderPlayerNameplate(r)}</td>${columns.map(c => cell(c, r)).join('')}</tr>`).join('');
    const foot = totals
      ? `<tfoot><tr><td class="tm-stats-total">Team</td>${columns.map(c => cell(c, { stat: totals })).join('')}</tr></tfoot>`
      : '';
    return `<div class="table-scroll"><table class="pitch-table player-list-table tm-stats-table" style="--stat-cols: ${columns.length}; --team-col-w: 0px">
        <colgroup><col class="plc-player">${'<col>'.repeat(columns.length)}</colgroup>
        <thead><tr>${head('name', 'Player')}${columns.map(c => head(c.key, c.label)).join('')}</tr></thead>
        <tbody>${body}</tbody>${foot}
      </table></div>`;
  }

  function renderTeamStats(data) {
    const { teamId, season, hitting, pitching, hitTotals, pitchTotals, leagueWoba } = data;
    const section = (title, group, rows, totals) => `<section class="tm-sec tm-stats" data-group="${group}">
        <div class="pp-skg-head"><span>${title}</span><em>${rows.length}</em></div>
        ${rows.length ? renderTeamStatsTable(group, rows, totals, { leagueWoba }) : '<div class="roster-empty">None</div>'}
      </section>`;
    return `<div class="sheet tm">
      ${section('Hitting', 'hitting', hitting, hitTotals)}
      ${section('Pitching', 'pitching', pitching, pitchTotals)}
    </div>`;
  }

  async function loadTeamStatsView(requestId, teamId, season) {

      getTeamSeasonTotals(teamId, season, 'hitting'),

    const team = TEAM_NICKNAMES[teamId] || '';

      teamId, season, hitTotals, pitchTotals, leagueWoba,
      hitting: hitting.filter(r => (r.stat.plateAppearances || 0) > 0).map(withMeta),
      pitching: pitching.filter(r => ipToOuts(r.stat.inningsPitched) > 0 || (r.stat.gamesPitched || 0) > 0).map(withMeta)
    };
    teamBody.innerHTML = renderTeamStats(lastTeamStats);
  }

  function renderGameSummaryGame(dateStr, game, multi) {
    // Falls back to the full name wherever an abbreviation isn't known --
    // it always is for Daily/Schedule/Scorecard's own games, but stays
    // graceful if renderGameSummaryGame is ever fed something else.
    const awayAbbr = game.awayAbbr || game.awayName;
    const homeAbbr = game.homeAbbr || game.homeName;

    // game.weather is only ever supplied by the Scorecard tab's "Box Score"
    // link, which already has the live feed's gameData loaded -- Daily and
    // Schedule tabs only know the score, so their Live/Final games fetch it
    // lazily into this same placeholder (see loadGameSummaryExtrasInto),
    // same pattern as the box score above.
    const weatherHtml = game.weather
      ? renderWeatherLine(game.weather)
      : ((game.state === 'Final' || game.state === 'Live') ? `<span class="gs-weather" id="weather-${game.gamePk}"></span>` : '');
    const dateLineHtml = game.gameDate ? `<div class="gs-date-line">${formatGameTime(game.gameDate)}${weatherHtml}</div>` : '';

    // game.venueHtml is only ever supplied by the Scorecard tab's "Box
    // Score" link, which already has the venue name and detailed record
    // fetched -- Daily/Schedule only know the venue's name+id from the
    // schedule payload, so they render just the name here and let
    // loadVenueInto swap in the city once its own fetch resolves. The
    // status tag rides along in this same row (see renderVenueHeader).
    const topRowHtml = game.venueHtml || renderVenueHeader(game.venueName, null, game.gamePk, renderStateBadge(game));

    // A caller that already has the feed can pass game.linescore (and
    // game.allPlays, for a Live game's count/baserunner band); otherwise --
    // the Daily and Schedule tabs only know the score -- every game
    // (pre-game included, so the box score is the one place team
    // names/score show up instead of a separate matchup line) fetches the
    // inning-by-inning grid lazily into this same slot (see
    // loadGameSummaryExtrasInto), alongside the WPA highlights below.
    const boxScoreHtml = game.linescore
      ? `<div class="gs-box-score">${renderMonsterPanel(game.linescore, awayAbbr, homeAbbr, game.allPlays || [], game.state === 'Live' && hasGameStarted(game.allPlays))}</div>`
      : `<div id="boxScore-${game.gamePk}" class="box-score-slot gs-box-score"><div class="potg-loading">Loading box score&#8230;</div></div>`;

    // Top play/players highlights only make sense once a game is over --
    // a Live game's WPA swings are still in motion.
    const wpaHtml = game.state === 'Final'
      ? `<div class="gs-story" id="wpaLeaders-${game.gamePk}"><div class="sc-story"><div class="story-sec"><div class="potg-loading">Loading game highlights&#8230;</div></div></div></div>`
      : '';

    const ctaHtml = `<button type="button" class="modal-cta" data-date="${dateStr}" data-game-pk="${game.gamePk}">View Full Scorecard &#8594;</button>`;

    return `
      <div class="game-summary-game">
        ${multi ? `<div class="gs-game-label">Game ${game.gameNumber}</div>` : ''}
        ${topRowHtml}
        ${dateLineHtml}
        ${boxScoreHtml}
        ${wpaHtml}
        ${ctaHtml}
      </div>`;
  }

    // fetchGameHighlights itself via includeHighlights. A Live game whose

    games.filter(g => !g.venueHtml && g.venueId).forEach(g => loadVenueInto(g, requestId));

  function showGameSummaryModal(dateStr) {

  // Shared by every modal here whose hide function is just this one line
  // (hidePitchPopup is kept separate since it also resets extra state).
  // Popups take part in history too: opening one pushes an entry listing
  // the popups open over the current screen (state.modals), so the phone's
  // Back button closes the top one rather than leaving the screen behind
  // it. Closing one any other way (close button, backdrop, Escape, or
  // code) steps history back to match -- batched, so Escape closing a
  // stack at once is a single history.go(-n). modalStack mirrors the open
  // popups in order; openOverlay is a no-op on one already open (e.g. the
  // pitch popup refreshing in place during a live at-bat).
  let modalStack = [];
  let pendingModalPops = 0;
  let awaitingModalPop = false;
  const afterModalPop = [];
  // Each popup is a modal dialog: focus moves to its close button on open
  // (once the caller has filled it, so its heading can name it) and goes
  // back to whatever opened it on close -- or, if a redraw replaced that
  // control meanwhile, to its stand-in in the new markup.
  const overlayOpeners = {};
  document.querySelectorAll('.pitch-overlay > .pitch-modal').forEach(m => {
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
  });
  function focusIntoOverlay(overlay) {
    requestAnimationFrame(() => {
      if (!overlay.classList.contains('open')) return;
      const modal = overlay.querySelector('.pitch-modal');
      const heading = modal && modal.querySelector('.pitch-header, .gs-title, h2, h3');
      if (heading) modal.setAttribute('aria-label', heading.textContent.trim());
      const close = overlay.querySelector('.pitch-close');
      if (close) close.focus({ preventScroll: true });
    });
  }
  function restoreOverlayOpener(overlay) {
    const o = overlayOpeners[overlay.id];
    delete overlayOpeners[overlay.id];
    if (!o) return;
    let el = o.el && o.el.isConnected ? o.el : null;
    if (!el && o.sel) el = Array.from(document.querySelectorAll(o.sel)).find(x => x.offsetParent !== null) || null;
    const top = modalStack.length ? document.getElementById(modalStack[modalStack.length - 1]) : null;
    if (el && (!top || top.contains(el))) el.focus({ preventScroll: true });
  }
  function openOverlay(overlay) {
    if (overlay.classList.contains('open')) return;
    const active = document.activeElement;
    overlayOpeners[overlay.id] = { el: active && active !== document.body ? active : null, sel: active ? focusedControlSelector(document.body) : null };
    overlay.classList.add('open');
    modalStack.push(overlay.id);
    focusIntoOverlay(overlay);
    try {
      const here = history.state || { tab: Tabs.current() };
      history.replaceState({ ...here, scrollY: window.scrollY }, '', location.hash);
      history.pushState({ ...here, scrollY: window.scrollY, modals: modalStack.slice() }, '', location.hash);
    } catch (e) {}
  }
  function closeOverlay(overlay, { fromHistory = false } = {}) {
    const wasOpen = overlay.classList.contains('open');
    overlay.classList.remove('open');
    overlay.querySelectorAll('video').forEach(v => v.pause());
    const idx = modalStack.indexOf(overlay.id);
    if (wasOpen) queueMicrotask(() => restoreOverlayOpener(overlay));
    if (idx < 0 || fromHistory) return;
    // anything opened on top of it goes too
    const above = modalStack.splice(idx);
    above.slice(1).forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('open'); });
    pendingModalPops += above.length;
    if (pendingModalPops === above.length) {
      queueMicrotask(() => {
        const n = pendingModalPops;
        pendingModalPops = 0;
        awaitingModalPop = true;
        history.go(-n);
      });
    }
  }
  // For navigation out of a popup (View Full Profile, View Full
  // Scorecard...): its close above steps history back asynchronously, so a
  // new entry pushed right away would be the one popped. Run fn once that
  // pop has landed instead (immediately when nothing is pending).
  function whenModalHistorySettled(fn) {
    if (pendingModalPops || awaitingModalPop) afterModalPop.push(fn);
    else fn();
  }
  // Called first by the popstate handler: closes whatever popups the entry
  // landed on doesn't list (running each one's own hide cleanup), and
  // reports whether this pop was closeOverlay's own, which needs nothing
  // else restored.
  function syncModalsToHistory(state) {
    const keep = (state && state.modals) || [];
    modalStack.filter(id => !keep.includes(id)).forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      if (id === 'pitchOverlay') hidePitchPopup({ fromHistory: true });
      else closeOverlay(el, { fromHistory: true });
    });
    modalStack = keep.filter(id => { const el = document.getElementById(id); return el && el.classList.contains('open'); });
    if (!awaitingModalPop) return false;
    awaitingModalPop = false;
    afterModalPop.splice(0).forEach(fn => fn());
